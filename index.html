var C = {"Distinção entre Ética e Moral":["Embora no uso cotidiano as palavras ética e moral sejam frequentemente tratadas como sinônimas, na tradição filosófica elas ocupam dimensões conceituais distintas. A moral refere-se ao conjunto de normas, valores, costumes e prescrições estabelecidos por uma determinada comunidade histórica para regular a conduta de seus membros. A ética, por sua vez, constitui a reflexão filosófica e crítica sobre os fundamentos, a validade e a legitimidade desses preceitos morais. Enquanto a moral responde à pergunta 'o que devo fazer em dada situação?', a ética indaga 'por que tal ação é considerada justa ou correta?'. A ética opera, portanto, como uma metanarrativa que interroga a própria moralidade.",["Moral (mores): conjunto prático de hábitos, normas e valores de um grupo","Ética (ethos): reflexão teórica e sistemática sobre os fundamentos da moral","Caráter histórico da moral: normas variam conforme a época e a cultura","Universalidade ética: busca por princípios racionais compartilháveis"],"Atenção à pegadinha mais comum do ENEM: moral é prática e normativa de um grupo social; ética é a teoria e o exame crítico desses costumes. Jamais confunda 'seguir a tradição' com reflexão ética.","<p>Considere o seguinte diálogo em uma comissão escolar:</p>\n<p><i>— Mariana: 'Não podemos alterar o código de vestimenta porque ele sempre foi assim desde a fundação da escola; é a nossa tradição!'</i><br>\n<i>— Lucas: 'O fato de ser tradição não basta. Precisamos examinar se essa exigência tem justificativa racional e se não discrimina alunas de forma arbitrária.'</i></p>","No contexto da filosofia moral, a intervenção de Lucas exemplifica uma postura ética porque",["promove a reflexão racional e crítica sobre a legitimidade dos costumes estabelecidos pelo grupo.","propõe a substituição imediata de todas as regras institucionais por decisões individuais subjetivas.","reafirma a autoridade inquestionável dos costumes locais frente às mudanças do tempo.","defende que as regras sociais devem ser obedecidas independentemente de qualquer justificação racional.","confunde os preceitos jurídicos formais com os hábitos morais espontâneos da comunidade."],0,"Resolução comentada:<br>• Correta: A. A postura de Lucas é genuinamente ética porque exige uma fundamentação racional para as normas vigentes, submetendo os costumes herdados (moral) a um crivo crítico de legitimidade e justiça.<br>• Incorreta B: A reflexão ética não defende o caos ou anarquismo subjetivo sem regras, mas a busca por princípios válidos.<br>• Incorreta C: Reafirmar cegamente a tradição é a postura de Mariana (moralismo tradicional), não a de Lucas.<br>• Incorreta D: Essa assertiva descreve o dogmatismo acrítico, o oposto do questionamento ético.<br>• Incorreta E: Lucas não mistura leis formais com moral, ele problematiza o critério de justiça da regra."],"Moral e Costumes Sociais":["A moral de um povo é uma construção histórica e social, transmitida de geração em geração pelos processos de socialização familiar, religiosa e institucional. Por ser situada no tempo e no espaço, uma regra moral válida em determinada sociedade pode ser considerada inaceitável em outra época ou cultura. No entanto, a sociabilidade humana exige sistemas morais compartilhados para permitir a cooperação, a previsibilidade e a coesão coletiva. Quando indivíduos assimilam as normas sem questionamento, vivenciam o que a filosofia classifica como heteronomia moral. A maturidade filosófica consiste justamente em examinar se tais costumes promovem a dignidade ou perpetuam opressões veladas.",["Socialização primária e secundária: transmissão dos valores morais","Heteronomia moral: submissão passiva às regras externas por medo ou hábito","Coesão social: função integradora da moral segundo a sociologia e a filosofia","Historicidade: transformação das exigências morais ao longo dos séculos"],"Se o texto do ENEM retrata hábitos tradicionais (como casamento infantil, castas ou papéis de gênero antigos), a abordagem crítica da filosofia investiga a historicidade dos costumes e a dignidade humana, sem cair em relativismo ingênuo.","<p>'Em muitas pólis da Antiguidade clássica, a exposição de recém-nascidos com fragilidades físicas ou a escravidão por dívidas eram práticas amplamente aceitas e tidas como convenientes à ordem pública. Para o cidadão daquele tempo, agir em conformidade com tais costumes era cumprir o seu papel na cidade.' (Adaptado de estudos de História da Filosofia Antiga).</p>","A constatação de que práticas consideradas legítimas no passado são hoje repudiadas evidencia que a moralidade",["possui caráter estático e independe das transformações econômicas e socioculturais.","constitui uma produção histórica e cultural condicionada pelas necessidades de cada época.","se ancora em leis físicas imutáveis que determinam a conduta dos seres vivos.","invalida qualquer possibilidade de diálogo ou de condenação a atrocidades históricas.","equivale estritamente à legislação jurídica positiva de um Estado soberano."],1,"Resolução comentada:<br>• Correta: B. O exemplo histórico demonstra a historicidade da moral: as normas e valorações humanas emergem em contextos culturais específicos e transformam-se conforme mudam as consciências sociais e as lutas por direitos.<br>• Incorreta A: A moral não é estática; ela se transforma com o tempo.<br>• Incorreta C: Normas morais não são leis físicas naturais, são convenções normativas humanas.<br>• Incorreta D: O reconhecimento da historicidade não anula o julgamento ético fundado nos direitos humanos e na dignidade.<br>• Incorreta E: Moral e direito positivo são esferas distintas; nem todo preceito moral vira lei, e nem toda lei é moralmente justa."],"Deontologia e Imperativo Categórico":["A ética deontológica de Immanuel Kant sustenta que o valor moral de uma ação reside no dever por dever, e não nas consequências, interesses ou sentimentos envolvidos. Para Kant, a razão prática pura formula o Imperativo Categórico: 'Age apenas segundo uma máxima tal que possas ao mesmo tempo querer que ela se torne lei universal'. Se uma conduta não puder ser universalizada sem contradição lógica (como mentir ou quebrar promessas), ela é moralmente reprovável. A segunda formulação kantiana exige: 'Age de tal maneira que uses a humanidade, tanto na tua pessoa quanto na pessoa de qualquer outro, sempre como fim, nunca simplesmente como meio'. A dignidade humana é inalienável e não admite preço.",["Deontologia (deon = dever): ética do dever e dos princípios a priori","Imperativo Categórico: mandamento incondicional da razão ('Deves fazer X')","Imperativo Hipotético: condicionado a um fim prático ('Se queres Y, faz X')","Princípio da Humanidade: seres humanos são fins em si mesmos, dotados de dignidade","Autonomia da vontade: o sujeito moral legisla a si mesmo através da razão"],"Kant repudia o utilitarismo e o sentimentalismo moral. Se o enunciado disser 'para obter lucro' ou 'por pena', a ação é apenas conforme ao dever (legalidade), mas desprovida de genuíno valor moral (falta o móbil do dever puro).","<div class=\"bx\" style=\"text-align:center;background:var(--cd);margin:8px 0;padding:12px;border:1px solid var(--ln);border-radius:12px\">\n<svg viewBox=\"0 0 460 140\" style=\"max-width:100%;height:auto;font-family:sans-serif\">\n  <rect x=\"10\" y=\"45\" width=\"120\" height=\"50\" rx=\"8\" fill=\"var(--hi)\" stroke=\"var(--ac)\" stroke-width=\"2\"/>\n  <text x=\"70\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"var(--ht)\">Máxima Individual</text>\n  <text x=\"70\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--mu)\">Regra da ação</text>\n  <path d=\"M 130 70 L 170 70\" stroke=\"var(--ac)\" stroke-width=\"2\" marker-end=\"url(#arr)\" fill=\"none\"/>\n  <rect x=\"170\" y=\"30\" width=\"140\" height=\"80\" rx=\"8\" fill=\"var(--cd)\" stroke=\"var(--am)\" stroke-width=\"2\"/>\n  <text x=\"240\" y=\"55\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"var(--tx)\">Teste Universal</text>\n  <text x=\"240\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--mu)\">Pode se tornar</text>\n  <text x=\"240\" y=\"90\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--mu)\">lei para todos?</text>\n  <path d=\"M 310 50 L 350 35\" stroke=\"var(--ok)\" stroke-width=\"2\" fill=\"none\"/>\n  <rect x=\"350\" y=\"15\" width=\"100\" height=\"40\" rx=\"6\" fill=\"color-mix(in srgb,var(--ok) 18%,transparent)\" stroke=\"var(--ok)\" stroke-width=\"1.5\"/>\n  <text x=\"400\" y=\"38\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" fill=\"var(--ok)\">Dever Moral ✓</text>\n  <path d=\"M 310 90 L 350 105\" stroke=\"var(--er)\" stroke-width=\"2\" fill=\"none\"/>\n  <rect x=\"350\" y=\"85\" width=\"100\" height=\"40\" rx=\"6\" fill=\"color-mix(in srgb,var(--er) 18%,transparent)\" stroke=\"var(--er)\" stroke-width=\"1.5\"/>\n  <text x=\"400\" y=\"108\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" fill=\"var(--er)\">Contradição ✗</text>\n</svg>\n<small style=\"color:var(--mu);display:block;margin-top:4px\">Estrutura de decisão no Imperativo Categórico de Kant</small>\n</div>\n<p>'Duas coisas enchem o ânimo de admiração e respeito sempre novos e crescentes: o céu estrelado sobre mim e a lei moral em mim.' (KANT, I. <i>Crítica da Razão Prática</i>, 1788).</p>","De acordo com a filosofia ética kantiana, uma ação só possui genuíno valor moral quando realizada",["com o objetivo de alcançar a aprovação dos pares e a recompensa futura em outra vida.","em vista do cálculo das melhores consequências materiais para a maioria dos envolvidos.","exclusivamente pelo respeito à lei moral do dever imposta pela própria razão autônoma.","a partir de impulsos emotivos espontâneos que geram prazer empático no agente.","sob a coerção da legislação estatal e o receio de penalidades judiciais públicas."],2,"Resolução comentada:<br>• Correta: C. Na ética kantiana, o valor moral autêntico provém da pureza da intenção: agir unicamente por dever e por respeito à lei da razão prática (imperativo categórico), desvinculado de qualquer interesse pessoal, cálculo de utilidade ou medo de punição.<br>• Incorreta A: Recompensas ou aprovação social caracterizam imperativos hipotéticos heterônomos.<br>• Incorreta B: O cálculo de consequências é o princípio do utilitarismo de Bentham e Mill, veementemente rejeitado por Kant.<br>• Incorreta D: A empatia ou sentimentos são inclinações sensíveis empíricas; para Kant, o dever deve ser fundado na razão pura.<br>• Incorreta E: O cumprimento da lei por receio de punição é mera legalidade externa, desprovida de moralidade interna."],"Utilitarismo Ético":["O utilitarismo, formulado principalmente por Jeremy Bentham e refinado por John Stuart Mill nos séculos XVIII e XIX, é uma ética teleológica e consequencialista. O princípio fundamental é o Princípio da Maior Felicidade: uma ação é moralmente correta na medida em que tende a promover a maior felicidade (prazer e ausência de dor) para o maior número possível de seres sencientes. Enquanto Bentham propunha um cálculo quantitativo do prazer, Mill introduziu uma distinção qualitativa, defendendo que os prazeres intelectuais, estéticos e morais são superiores aos prazeres puramente corporais. O utilitarismo avalia o resultado prático da ação, e não a pureza abstrata da intenção.",["Consequencialismo: o critério moral reside nas consequências e resultados produzidos","Princípio da Utilidade: máxima felicidade para o maior número de pessoas afetadas","Jeremy Bentham: cálculo quantitativo hedônico (intensidade, duração, certeza)","John Stuart Mill: distinção qualitativa dos prazeres ('Mais vale ser Sócrates insatisfeito que um tolo satisfeito')","Imparcialidade: a felicidade do agente não pesa mais que a felicidade de qualquer outro indivíduo"],"No clássico 'dilema do bonde', a decisão de desviar o bonde para matar 1 pessoa e salvar 5 é a resposta tipicamente utilitarista (maximização do bem-estar geral). Já a recusa em puxar a alavanca para não violar o dever de não matar é de ordem deontológica kantiana.","<p>'A doutrina que aceita como fundamento da moral a utilidade, ou o Princípio da Maior Felicidade, sustenta que as ações são corretas na medida em que tendem a promover a felicidade, e erradas na medida em que tendem a produzir o contrário da felicidade. Por felicidade entende-se o prazer e a ausência de dor; por infelicidade, a dor e a privação do prazer.' (MILL, J. S. <i>O Utilitarismo</i>, 1861 [adaptado]).</p>","Sob a perspectiva utilitarista de John Stuart Mill, a moralidade de uma intervenção em saúde pública que distribui recursos escassos deve ser avaliada",["pela conformidade estrita aos costumes arcaicos preservados pelos anciãos da comunidade.","pela intenção religiosa de santificação pessoal dos profissionais envolvidos na aplicação.","pela renúncia deliberada ao uso de qualquer critério empírico ou científico mensurável.","pelo impacto concreto na redução do sofrimento e maximização do bem-estar da população atendida.","pela subordinação irrevogável do bem coletivo aos privilégios de determinados grupos hereditários."],3,"Resolução comentada:<br>• Correta: D. O utilitarismo avalia as ações pelas consequências práticas: no caso da saúde pública, uma política é moralmente justa se maximiza o bem-estar e minimiza o sofrimento agregado do maior número possível de cidadãos.<br>• Incorreta A: O utilitarismo é progressista e reformador; não se apoia na autoridade de costumes tradicionais.<br>• Incorreta B: Intenções místicas ou santificação são irrelevantes para o critério consequencialista de utilidade terrena.<br>• Incorreta C: O utilitarismo fundamenta-se precisamente na observação empírica dos efeitos e resultados mensuráveis de dor e prazer.<br>• Incorreta E: O princípio utilitarista é rigorosamente imparcial: cada pessoa conta como um e ninguém como mais de um."],"Ética das Virtudes Aristotélica":["Na obra <i>Ética a Nicômaco</i>, Aristóteles desenvolve uma ética teleológica voltada para o fim último de toda ação humana: a eudaimonia (felicidade, realização plena ou vida boa). A felicidade não consiste na busca desenfreada de prazeres corporais passageiros, na acumulação de riquezas ou no anseio por honrarias e fama, mas no cultivo e exercício contínuo das virtudes intelectuais e do caráter. A virtude moral (areté) é definida como uma disposição habitual de escolher a justa medida (ou meio-termo) entre dois vícios opostos: um por excesso e outro por escassez. Assim, a coragem é o meio-termo entre a covardia (falta) e a temeridade irresponsável (excesso).",["Eudaimonia: finalidade suprema da vida humana (vida plena e realizada)","Doutrina do Meio-Termo (mesótês): virtude como equilíbrio dinâmico entre extremos","Hábito (hexis): a virtude moral não é inata; aprende-se e aprimora-se pela prática constante","Prudência (phrónesis): sabedoria prática que guia a tomada de decisão correta em cada situação concreta","Zoon politikon: o homem realiza sua virtude plenamente na vida em comunidade (pólis)"],"Aristóteles não propõe um meio-termo matemático ou medíocre, mas sim o equilíbrio adequado para cada indivíduo e situação através da sabedoria prática (phrónesis). Lembre-se: nem toda ação tem meio-termo (injustiça, roubo e assassinato são vícios em si mesmos).","<p>'A virtude é, portanto, uma disposição de caráter relacionada com a escolha consciente e consistente num meio-termo determinado pela razão, ou seja, pelo modo como o determinaria o homem dotado de sabedoria prática. É um meio-termo entre dois vícios, um por excesso e outro por escassez.' (ARISTÓTELES. <i>Ética a Nicômaco</i>, Livro II [adaptado]).</p>","Com base na teoria aristotélica da justa medida, o comportamento verdadeiramente corajoso de uma pessoa diante do perigo caracteriza-se por",["ignorar completamente qualquer risco real, expondo a si e a terceiros a danos desnecessários.","fugir precipitadamente de qualquer adversidade para resguardar a própria integridade física.","aguardar passivamente que as circunstâncias se resolvam sem qualquer manifestação de vontade própria.","obedecer cegamente a ordens externas, sem avaliar a finalidade ou a justiça da causa.","agir com ponderação e firmeza racional, enfrentando os riscos com prudência sem descambar na imprudência."],4,"Resolução comentada:<br>• Correta: E. A coragem aristotélica é a virtude do meio-termo entre a covardia (escassez de arrojo e excesso de medo) e a temeridade/temeridade cega (excesso de audácia irrefletida e desdém pelos riscos reais). O homem virtuoso age orientado pela prudência.<br>• Incorreta A: Ignorar riscos desnecessariamente é temeridade (vício por excesso).<br>• Incorreta B: Fugir covardemente diante de qualquer desafio é o vício da covardia (escassez).<br>• Incorreta D: Agir sem reflexão pessoal e sem discernimento prudencial contradiz a escolha deliberada.<br>• Incorreta C: A passividade absoluta não é virtude, mas apatia e inércia moral."],"Relativismo Moral e Universalismo":["O debate entre relativismo moral e universalismo ético é central para a convivência democrática e os direitos humanos. O relativismo moral argumenta que nenhum valor ou norma moral possui validade absoluta ou universal, pois todos os juízos de valor seriam estritamente dependentes de tradições culturais, épocas ou convenções locais particulares. Em contrapartida, o universalismo ético defende que existem exigências éticas fundamentais — como o respeito à integridade física, a repulsa à tortura e o direito à liberdade de pensamento — que devem ser garantidas a todo e qualquer ser humano, independentemente de sua filiação cultural. A Declaração Universal dos Direitos Humanos de 1948 materializa o ideal universalista.",["Relativismo cultural e moral: validade das regras limitada ao contexto de cada cultura","Universalismo ético: direitos e princípios válidos para toda a humanidade por sua dignidade inerente","Risco do etnocentrismo: impor a cultura dominante sob o pretexto de ser a única universal","Risco do relativismo extremado: paralisia ética diante de violações graves da dignidade humana","Declaração Universal dos Direitos Humanos (1948): marco do consenso ético global contemporâneo"],"Cuidado para não confundir tolerância à diversidade cultural com legitimação de crimes contra a humanidade. O ENEM adora contrapor a defesa da dignidade universal ao relativismo acrítico que tolera mutilações e violências.","<p>'Se toda moralidade fosse inteiramente relativa aos costumes de cada grupo, não haveria parâmetro racional para condenar práticas como o genocídio promovido em certos regimes, tampouco base para reivindicar avanços humanitários no cenário global.' (Adaptado de debates contemporâneos sobre Ética e Direitos Humanos).</p>","O argumento apresentado confronta o relativismo moral estrito ao salientar que a defesa global dos direitos humanos pressupõe",["a existência de princípios éticos fundamentais que transcendem particularismos culturais locais.","a assimilação forçada de todas as religiões tradicionais por uma crença teológica única.","a extinção das autonomias nacionais e a instauração imediata de uma tirania bélica mundial.","o abandono de qualquer legislação jurídica em favor do livre-arbítrio dos indivíduos isolados.","a superioridade biológica e moral de algumas nações sobre as populações periféricas."],0,"Resolução comentada:<br>• Correta: A. O universalismo ético sustenta que a proteção à vida e à integridade humana não depende da aprovação momentânea de governos ou tradições locais; há valores universais que salvaguardam qualquer ser humano contra o arbítrio e a barbárie.<br>• Incorreta B: Direitos humanos não impõem religião alguma; pelo contrário, consagram a liberdade religiosa e de consciência.<br>• Incorreta C: O universalismo ético não propõe tirania militar, mas tratados internacionais de proteção humanitária e justiça cosmopolita.<br>• Incorreta D: A vigência dos direitos humanos requer sistemas jurídicos robustos, e não a eliminação das leis.<br>• Incorreta E: Afirmar superioridade biológica é racismo/etnocentrismo repugnante, a antítese dos direitos humanos."],"Autonomia, Liberdade e Responsabilidade":["A relação indissociável entre liberdade e responsabilidade é um pilar da reflexão ética moderna e contemporânea. Jean-Paul Sartre sintetizou essa conexão na máxima existencialista: 'O homem está condenado a ser livre'. Como não há determinismos biológicos, teológicos ou sociais que anulem a capacidade de escolha humana, cada decisão tomada engaja não apenas o próprio indivíduo, mas toda a humanidade. Fingir que não se teve escolha ou atribuir a culpa exclusivamente a fatores externos constitui, para Sartre, uma atitude de má-fé. A verdadeira autonomia moral significa assumir plenamente os riscos, as escolhas e as consequências de nossas ações no mundo.",["Autonomia (auto = si mesmo; nomos = lei): capacidade de dar a si a própria lei e assumir as escolhas","Heteronomia: submissão a determinações e coerções externas","Liberdade ontológica (Sartre): ausência de essência prévia; o humano se faz pelo ato","Responsabilidade total: escolher a si mesmo é comprometer toda a humanidade","Má-fé (mauvaise foi): mentir para si mesmo fingindo não ter liberdade de decisão"],"No ENEM, liberdade nunca é sinônimo de libertinagem ou ausência de consequências. Liberdade em filosofia é sempre acompanhada da responsabilização pelo que foi feito e pelas marcas deixadas na vida alheia.","<p>'Dizer que o homem está condenado a ser livre significa que ele não se criou a si mesmo e, no entanto, é livre, porque, uma vez lançado no mundo, é responsável por tudo o que faz. Não temos atrás de nós desculpas nem justificações prontas.' (SARTRE, J.-P. <i>O Existencialismo é um Humanismo</i>, 1946 [adaptado]).</p>","A tese existencialista sartreana de que a liberdade é um fardo inalienável implica que a dimensão ética reside em",["reconhecer que a genética e o destino predeterminam inalteravelmente o caráter humano.","assumir a responsabilidade direta e intransferível pelos rumos e efeitos de cada escolha realizada.","isentar o sujeito de culpa quando ele alega ter seguido cegamente a ordem de uma autoridade.","buscar refúgio no isolamento solitário para escapar de qualquer julgamento moral ou coletivo.","adotar uma postura indiferente aos sofrimentos coletivos sob o pretexto de preservar a pureza individual."],1,"Resolução comentada:<br>• Correta: B. Para Sartre, como o ser humano é radicalmente livre e não possui uma essência predeterminada, ele não pode esquivar-se da responsabilidade pelas suas escolhas. Tentar escapar dessa responsabilidade alegando ordens ou destino é agir com má-fé.<br>• Incorreta A: Sartre rejeita terminantemente determinismos genéticos ou destinos cósmicos; a existência precede a essência.<br>• Incorreta C: Cumprir ordens sem questionar não isenta o sujeito ético; a responsabilidade continua sendo dele por ter decidido obedecer.<br>• Incorreta D: O isolamento não elimina a responsabilidade; a omissão diante dos outros também é uma escolha.<br>• Incorreta E: A liberdade sartreana é engajada; ao escolher, o homem escolhe o modelo de humanidade que deseja promover."],"Bioética do Início e Fim da Vida":["Os dilemas éticos em torno do início e do fim da vida humana (como o aborto terapêutico, reprodução assistida, eutanásia, distanásia e ortotanásia) mobilizam princípios morais fundamentais. Na eutanásia ativa, busca-se abreviar a vida de um paciente em sofrimento incurável a seu pedido; na distanásia, prolonga-se artificialmente a agonia através de obstinação terapêutica inútil; na ortotanásia e nos cuidados paliativos, permite-se o processo natural do morrer com alívio integral da dor física e psíquica. O debate contemporâneo confronta o princípio da Sacralidade Absoluta da Vida (que veda qualquer interrupção) com o princípio da Qualidade e Dignidade da Vida e da Autonomia do sujeito (que valoriza a vontade expressa pelo indivíduo em testamentos vitais).",["Eutanásia: abreviação voluntária e médica da vida de paciente em sofrimento intolerável e terminal","Distanásia: obstinação terapêutica fútil que prolonga o sofrimento sem chance de cura","Ortotanásia: processo natural do morrer acompanhado de cuidados paliativos e controle da dor","Testamento Vital (Diretivas Antecipadas de Vontade): documento no qual o indivíduo registra os tratamentos que aceita ou recusa","Princípio da Dignidade: o morrer como parte integrante da trajetória de autonomia do ser humano"],"No ENEM: cuidados paliativos e ortotanásia não são sinônimos de eutanásia ativa! Cuidados paliativos visam garantir dignidade e alívio da dor, sem adiantar nem prolongar sofrimentos desnecessários.","<p>'A obstinação terapêutica que submete o paciente terminal a procedimentos invasivos dolorosos, sabidamente incapazes de reverter o quadro clínico, atenta contra a dignidade da pessoa. A medicina contemporânea reconhece que o dever de curar encontra seu limite no dever de cuidar e consolar, assegurando que o final da vida transcorra com serenidade e alívio do sofrimento.' (Adaptado de Diretrizes do Conselho Federal de Medicina sobre Cuidados Paliativos).</p>","Sob a ótica da bioética contemporânea, a prática dos cuidados paliativos e da ortotanásia fundamenta-se",["na imposição de intervenções cirúrgicas agressivas diárias com finalidade puramente experimental.","no descarte hospitalar sumário de pacientes idosos para reduzir as despesas contábeis das operadoras de planos de saúde.","na garantia do respeito à dignidade humana no processo natural da morte, priorizando o alívio do sofrimento e a autonomia do paciente.","na proibição legal de que médicos apliquem analgésicos e sedativos em pessoas com diagnósticos incuráveis.","na obrigatoriedade de manter o corpo conectado a ventiladores mecânicos mesmo após a constatação de morte encefálica."],2,"Resolução comentada:<br>• Correta: C. A ortotanásia e os cuidados paliativos orientam-se pela preservação da dignidade da pessoa: rejeitam a distanásia (prolongamento artificial doloroso da agonia) e recusam o abandono do enfermo, oferecendo suporte físico, psicológico e espiritual para que o paciente viva sua finitude com o mínimo de dor e com respeito às suas decisões autônomas.<br>• Incorreta A: A obstinação terapêutica invasiva e inútil é categoricamente repudiada pela bioética.<br>• Incorreta B: Cuidados paliativos visam à humanização e ao carinho médico, e não ao corte de custos contábeis cínico.<br>• Incorreta D: O controle eficaz da dor através de analgésicos e sedação paliativa é um imperativo ético central.<br>• Incorreta E: A morte encefálica é o critério médico legal do óbito humano; manter aparelhos após isso sem doação de órgãos é ilógico."],"Ética do Discurso de Jürgen Habermas":["O filósofo alemão Jürgen Habermas formulou a Ética do Discurso para responder à crise de legitimação das normas em sociedades plurais contemporâneas. Superando o modelo monológico de Kant (no qual o sujeito isolado testava a universalização da máxima na sua própria mente), Habermas propõe um modelo Dialógico e Interativo. Uma norma moral só é legítima se puder obter a aprovação de todos os indivíduos afetados na condição de participantes de um Discurso Prático racional. Esse debate pressupõe uma 'Situação Ideal de Fala': ausência de coerções físicas ou psicológicas, igualdade de oportunidades de fala e sinceridade, onde deve prevalecer exclusivamente a força sem força do melhor argumento.",["Ação Comunicativa: uso da linguagem voltado ao entendimento mútuo entre sujeitos livres","Ação Estratégica: uso instrumental da linguagem voltado ao cálculo de poder, manipulação e vitória pessoal","Princípio 'D' (do Discurso): só são válidas as normas com as quais todos os concernidos possam concordar como debatedores","Situação Ideal de Fala: condições contrafactuais de simetria, liberdade e sinceridade no diálogo público","Força do melhor argumento: a autoridade racional que se impõe sem o recurso à intimidação ou à violência"],"No ENEM: a ética habermasiana é a base das teorias democráticas e deliberativas. Para saber se uma lei ou regra é justa, deve-se reunir os afetados em debate público e ver se ela resiste ao melhor argumento sem coação.","<p>'De acordo com a ética do discurso, uma norma só pode pretender validade se todos os que possam ser concernidos por ela chegarem (ou puderem chegar), enquanto participantes de um discurso prático, a um acordo sobre a sua vigência. O critério da universalidade não é mais o que um indivíduo isolado pode querer sem contradição, mas o que todos podem querer em conjunto como regra comum.' (HABERMAS, J. <i>Consciência Moral e Agir Comunicativo</i>, 1983 [adaptado]).</p>","A inovação da ética do discurso habermasiana em relação ao imperativo categórico kantiano clássico consiste em",["subordinar os direitos individuais ao arbítrio discricionário dos chefes de tribunais militares.","reafirmar a autoridade infalível das hierarquias eclesiásticas na promulgação de códigos civis laicos.","proibir a livre manifestação da palavra de minorias étnicas em assembleias legislativas democráticas.","deslocar o teste de validade da reflexão moral solitária do indivíduo para o consenso deliberativo alcançado no diálogo entre os afetados.","estabelecer que a vitória no debate deve pertencer àquele que falar mais alto e usar ameaças de punição física."],3,"Resolução comentada:<br>• Correta: D. Habermas promove uma guinada intersubjetiva e comunicativa na ética: enquanto Kant propunha que a razão de um sujeito individual legislasse a lei universal no silêncio de sua consciência (monologismo), Habermas defende que a legitimidade de uma norma só pode ser conquistada no debate real público entre todos os seres humanos atingidos por ela, através do consenso racional forjado pelo melhor argumento.<br>• Incorreta A: A ética do discurso rejeita qualquer tirania ou coerção militar.<br>• Incorreta C: A teoria exige simetria e voz ativa irrestrita para todas as minorias e vulneráveis.<br>• Incorreta B: Trata-se de uma ética pós-metafísica e laica, independente de dogmas religiosos.<br>• Incorreta E: A intimidação ou coerção caracteriza a ação estratégica manipuladora, oposta ao agir comunicativo."],"Justiça, Vingança e Perdão na Tradição Moral":["A distinção entre Vingança, Retribuição jurídica e Perdão é um tema clássico da filosofia moral e do direito. A vingança é uma reação passional, privada, subjetiva e frequentemente desmedida, que perpetua ciclos intermináveis de violência entre famílias ou clãs (como nas tragédias gregas da <i>Orestéia</i> de Ésquilo). A passagem para a civilização jurídica operou-se quando a aplicação da punição foi transferida do indivíduo ofendido para a figura neutra e desapaixonada do Estado (o tribunal imparcial), substituindo o ódio vingativo pela Justiça Retributiva regida por leis públicas proporcionais. Por sua vez, filósofos contemporâneos como Jacques Derrida e Paul Ricoeur investigam o Perdão como um ato ético supremo que transcende o cálculo jurídico: o perdão não apaga o fato histórico do crime, mas liberta a vítima do ressentimento e abre a possibilidade de reconciliação comunitária.",["Vingança privada: impulso emotivo desproporcional que reproduz a barbárie do ciclo de retaliações sangrentas","Justiça pública estatal: intervenção de um terceiro neutro (juiz) que aplica sanções proporcionais e impessoais","A Orestéia de Ésquilo: mito fundador da passagem da vingança das Erínias para o tribunal da razão do Areópago","Justiça restaurativa: processo de reparação que busca reconstruir os laços rompidos pelo delito através do diálogo","O paradoxo do perdão (Derrida): perdoar o imperdoável como dom ético gratuito que não se reduz a anistia burocrática"],"No ENEM: a instituição da Justiça com juízes imparciais nasceu historicamente para quebrar o ciclo infinito da vingança 'olho por olho'. Vingança é ódio privado; justiça é lei pública proporcional.","<p>'A vingança é um ato de justiça selvagem, e quanto mais os homens a praticam, mais a lei civil deve se apressar em coibi-la. Pois a vingança reabre feridas que a lei deveria cicatrizar, perpetuando o ódio entre as partes; enquanto o tribunal imparcial age em nome de toda a comunidade para restaurar a ordem pública sem paixões desregradas.' (BACON, F. <i>Ensaios</i> [adaptado]).</p>","A transição histórica da vingança privada para a aplicação institucional da justiça estatal representou",["a consagração da impunidade total para aqueles que cometem delitos contra a vida e o patrimônio coletivo.","a concessão de poderes ilimitados aos cidadãos mais ricos para prenderem seus desafetos pessoais.","a proibição de que os réus tenham acesso a advogados e defensores públicos nos processos civis.","o retorno aos duelos armados como única modalidade de resolução de desavenças entre vizinhos.","a substituição do arbítrio passional e das retaliações sem limites por julgamentos públicos impessoais pautados na proporcionalidade das leis."],4,"Resolução comentada:<br>• Correta: E. A criação do sistema judiciário civiliza as sociedades ao retirar o monopólio da punição das mãos das vítimas apaixonadas e entregá-lo a um árbitro imparcial (o juiz): estabelece o contraditório, o devido processo legal e sanções dosadas pela lei, interrompendo a espiral destrutiva de massacres e vinganças privadas que destruía clãs inteiros.<br>• Incorreta A: A justiça visa justamente combater a impunidade por meios institucionais legais.<br>• Incorreta C: O devido processo legal consagra o direito inalienável à ampla defesa e ao contraditório.<br>• Incorreta D: Os duelos armados foram banidos pelo Estado moderno por reproduzirem a violência privada arcaica.<br>• Incorreta B: O Estado de direito proíbe que qualquer cidadão exerça prisões arbitrárias por motivos pessoais de classe."],"Hedonismo e Epicurismo na Ética":["O epicurismo defende que o objetivo supremo da existência é a conquista da felicidade terrena, compreendida não como busca desenfreada por prazeres sensoriais, mas como alcance da ataraxia (imperturbabilidade da alma) e da aponia (ausência de dor física). Epicuro propõe uma rígida classificação dos desejos em naturais e necessários, naturais e não necessários, e não naturais e vãos, orientando o sábio a cultivar apenas os primeiros. A prudência (phrónesis) atua como cálculo racional que rejeita prazeres passageiros que resultem em dores futuras. Para erradicar os medos que paralisam o ser humano, Epicuro formula o tetrapharmakos (remédio quádruplo): não temer os deuses, não temer a morte, saber que o bem é fácil de alcançar e que o sofrimento é suportável.",["Ataraxia: imperturbabilidade e tranquilidade da mente livre de ansiedades","Aponia: ausência de sofrimento e dor corporal","Classificação dos desejos: prioridade aos prazeres naturais e necessários (alimento simples, amizade)","Tetrapharmakos: remédio quádruplo contra os medos existenciais e a superstição"],"O ENEM adora contrastar o hedonismo vulgar (busca desmedida por consumo e prazer sensorial) com o verdadeiro epicurismo helenístico (que preza pela moderação, simplicidade e serenidade). Não confunda Epicuro com libertinagem!","\"Quando dizemos, portanto, que o prazer é o fim último, não nos referimos aos prazeres dos intemperantes ou aos que consistem no gozo dos sentidos, como acreditam certas pessoas ignorantes dos nossos ensinamentos ou que não concordam conosco ou que os interpretam mal; mas ao não sofrer no corpo nem se perturbar na alma. Pois não são as bebedeiras e as festas contínuas, nem o gozo de meninos e mulheres, nem os peixes e outros pratos de uma mesa lauta que tornam doce a vida, mas um juízo sóbrio, que investiga as causas de cada ato de escolha e de recusa e que dissipa as falsas opiniões das quais decorre a maior perturbação que toma conta das almas.\" (EPICURO. Carta sobre a felicidade / Carta a Meneceu).","No fragmento da Carta sobre a Felicidade, Epicuro rebate leituras distorcidas de sua doutrina moral. De acordo com o texto e os princípios da filosofia helenística de Epicuro, a realização da vida feliz fundamenta-se na",["conquista da serenidade interior mediada pelo discernimento racional das reais necessidades humanas.","satisfação imediata e ilimitada dos desejos corporais estimulados pelo ambiente externo.","renúncia aos laços sociais em prol de um ascetismo monástico rigoroso e isolado.","obediência cega aos desígnios providentiais estabelecidos pelas divindades do panteão grego.","acumulação de honrarias políticas e riquezas materiais que confiram prestígio diante da pólis."],0,"Resolução detalhada:\n• Correta: A. O epicurismo não propõe o gozo desmedido nem a fuga mística ascética; sua meta é a ataraxia e a aponia por meio do juízo sóbrio e do cálculo prudente das necessidades vitais simples.\n• Incorreta C: Epicuro valorizava intensamente a convivência e o refúgio na amizade (o Jardim), não pregando ascetismo monástico.\n• Incorreta B: Essa é a visão do hedonismo vulgar ou dos cirenaicos, veementemente refutada por Epicuro na carta.\n• Incorreta D: Epicuro afirmava que os deuses habitam os intermundos e não interferem na vida humana nem demandam culto servil.\n• Incorreta E: O lema epicurista 'vive oculto' (láthe biósas) recusa a busca por cargos políticos e honras efêmeras."],"Estoicismo e a Serenidade da Alma":["O estoicismo, corrente helenística fundada por Zenão de Cítio e celebrizada em Roma por Sêneca, Epicteto e o imperador Marco Aurélio, fundamenta a conduta ética na conformidade com o Logos universal (natureza racional do cosmos). O pilar central do estoicismo reside na 'dicotomia do controle': o reconhecimento lúcido de que certas coisas estão sob nosso poder (nossos juízos, desejos, aversões e impulsos morais) e outras não estão (a riqueza, a reputação, a saúde física, as ações de outrem e o destino biológico). O sofrimento humano surge da ilusão de tentar controlar o que é exterior ou de atribuir valor moral intrínseco aos 'indiferentes'. A apatheia estóica não denota frieza emocional, mas libertação das paixões destrutivas e acolhimento sereno da ordem cósmica (amor fati).",["Dicotomia do controle (Epicteto): distinguir o que depende de nós do que não depende","Conformidade à natureza: viver em harmonia com a razão universal que governa o cosmos","Apatheia: estado de desapaixonamento sereno e imunidade a perturbações externas","Amor fati: aceitação voluntária e digna do destino e dos acontecimentos da vida"],"O conceito de 'indiferentes' (adiáphora) e a dicotomia do controle são questões recorrentes no ENEM. O exame frequentemente traz textos de Epicteto ou das Meditações de Marco Aurélio para discutir resiliência e saúde mental contemporânea.","\"Das coisas existentes, algumas são dependentes de nós, outras não são dependentes de nós. Dependentes de nós são o juízo, o impulso, o desejo, a aversão e, em uma palavra, tudo o que for de nossa própria autoria; e não dependentes de nós são o corpo, a posse, a reputação, o comando e, em uma palavra, tudo o que não for de nossa própria autoria. As coisas dependentes de nós são por natureza livres, sem impedimentos, sem entraves; as não dependentes de nós são fracas, servis, sujeitas a impedimentos, alheias. Lembra-te, pois, de que, se reputares livres as que por natureza são servis e próprias as alheias, serás obstado, lamentarás, serás perturbado, queixar-te-ás dos deuses e dos homens.\" (EPICTETO. Manual de Epicteto).","A passagem de Epicteto formula o axioma fundamental da ética estoica. Segundo o pensador, a causa primordial da angústia e da servidão psicológica do ser humano reside em",["desconhecer as leis causais empíricas que regem os fenômenos biológicos da matéria física.","confundir as esferas de ação interior com as contingências exteriores fora do domínio volitivo.","recusar a participação ativa nas magistraturas políticas e nos comícios eleitorais republicanos.","abandonar as práticas de devoção sacrificial prescritas pela religião cívica tradicional.","priorizar o cultivo das faculdades racionais em detrimento dos instintos orgânicos imediatos."],1,"Resolução detalhada:\n• Correta: B. O núcleo do diagnóstico de Epicteto é que o homem se torna infeliz e perturbado quando toma como suas coisas que não estão sob seu controle soberano (riqueza, opinião alheia, morte).\n• Incorreta A: A ciência empírica da matéria não é a prescrição ética estóica, que foca no governo interno dos juízos.\n• Incorreta C: Muitos estóicos (como Marco Aurélio e Sêneca) participavam da política, mas a fonte da paz moral não reside no cargo exterior.\n• Incorreta D: O estoicismo preconiza o culto ao Logos racional, não a sacrifícios rituais antropomórficos.\n• Incorreta E: O texto prescreve exatamente o fortalecimento da razão soberana e o controle do juízo, e não o oposto."],"Ética do Discurso em Jürgen Habermas":["Desenvolvida pelo filósofo alemão Jürgen Habermas no âmbito da teoria crítica contemporânea, a ética do discurso busca fundamentar normas morais universais não mais na subjetividade isolada (como no imperativo kantiano monológico), mas na intersubjetividade da comunicação. Habermas propõe que uma norma moral só é legítima se puder obter a aprovação de todos os indivíduos afetados, atuando como participantes em um discurso prático regido por argumentos racionais. Para que ocorra o agir comunicativo, os interlocutores devem pressupor as pretensões universais de validade: verdade proposicional, correção normativa, veracidade das intenções e inteligibilidade do discurso. O processo exige a superação da coação externa, prevalecendo unicamente a 'força sem coação do melhor argumento'.",["Agir comunicativo: orientação para o entendimento mútuo em contraposição à ação estratégica","Comunidade ideal de fala: ausência de coerção física, ideológica ou econômica no debate","Princípio discursivo (D) e de universalização (U): normas válidas exigem consenso dos afetados","Força do melhor argumento: prevalência da razão dialógica sobre privilégios de poder"],"Habermas cai no ENEM sempre articulando Ética e Cidadania Democrática. Atenção à oposição entre agir estratégico (manipular o outro como meio para atingir fins) e agir comunicativo (buscar o consenso desinteressado entre sujeitos livres).","\"De acordo com a ética do discurso, uma norma só pode reivindicar validade se todos os que possam ser afetados por ela chegarem (ou puderem chegar), na qualidade de participantes de um discurso prático, a um acordo sobre o fato de que tal norma é válida. O princípio do discurso requer que as questões práticas sejam decididas através de uma cooperação argumentativa aberta, onde a única força admissível é a força sem coação do melhor argumento.\" (HABERMAS, Jürgen. Consciência moral e agir comunicativo).","A fundamentação moral proposta por Jürgen Habermas diferencia-se das éticas deontológicas monológicas de matriz cartesiana e kantiana porque institui como critério de legitimidade normativa a",["obediência inquestionável aos mandamentos consuetudinários herdados da ancestralidade comum.","imposição coercitiva da vontade da maioria soberana sobre grupos minoritários dissidentes.","deliberação intersubjetiva aberta entre cidadãos visando ao entendimento livre de coerções.","determinação utilitária do maior prazer quantitativo calculada por algoritmos administrativos.","intuição solipsista do sujeito isolado ao inspecionar o conteúdo íntimo de sua consciência."],2,"Resolução detalhada:\n• Correta: C. A ética habermasiana é dialógica e intersubjetiva; a validade moral emerge do diálogo livre e público entre sujeitos capazes de linguagem e ação.\n• Incorreta A: Tradições e costumes não possuem validade moral automática; devem ser submetidos à crítica argumentativa.\n• Incorreta B: Habermas recusa a tirania da maioria ou a imposição coercitiva; o consenso deve decorrer do melhor argumento.\n• Incorreta D: O cálculo utilitarista é um modelo teleológico e estratégico, enquanto Habermas defende uma deontologia procedimental discursiva.\n• Incorreta E: Essa era a perspectiva do sujeito individual de Kant e Descartes, que Habermas substitui pela intersubjetividade comunicativa."],"Dilema do Trem e Ética Aplicada":["Formulado inicialmente pela filósofa britânica Philippa Foot em 1967 e expandido por Judith Jarvis Thomson, o 'Dilema do Bonde' (Trolley Problem) tornou-se o experimento mental mais célebre da ética aplicada contemporânea. No cenário clássico, um bonde desgovernado avança em direção a cinco operários amarrados nos trilhos; um operador pode acionar uma alavanca para desviar o trem para uma linha lateral, onde matará apenas uma pessoa. O dilema contrapõe de forma direta a perspectiva utilitarista (maximizar o bem-estar e salvar o maior número líquido de vidas, aceitando puxar a alavanca) e a perspectiva deontológica ou principialista (não violar o dever categórico de não matar, recusando transformar um ser humano inocente em instrumento ou dano colateral direto). O debate ganha urgência máxima hoje na programação ética de veículos autônomos e algoritmos de triagem médica.",["Conflito entre Utilitarismo (consequencialismo dos fins) e Deontologia (dever categórico dos meios)","Doutrina do Duplo Efeito: diferença entre prever uma morte e pretender intencionalmente uma morte","Ética aplicada contemporânea: transposição de conceitos abstratos para dilemas reais da tecnologia e bioética","Algoritmos morais: programação de decisões emergenciais em inteligência artificial e carros autônomos"],"O ENEM usa dilemas morais contemporâneos para avaliar se o candidato reconhece a tensão clássica entre Bentham/Mill (consequências do ato) e Kant (dever incondicional e proibição de usar pessoas como meio).","\"Imagine um bonde desgovernado descendo os trilhos. Mais à frente, cinco pessoas estão amarradas aos trilhos e morrerão se o bonde continuar. Você está ao lado de uma alavanca que pode desviar o trem para uma linha secundária, onde há apenas uma pessoa amarrada. O que se deve fazer? Se você puxa a alavanca, assume a autoria da morte de um indivíduo para salvar cinco; se nada fizer, cinco perecem. Em versões subsequentes, como o 'caso do homem gordo na passarela', a maioria das pessoas que puxaria a alavanca recusa empurrar fisicamente uma pessoa corpulenta na frente do bonde, mesmo que o saldo numérico de sobreviventes seja idêntico.\" (FOOT, P.; THOMSON, J. J. Studies in Moral Philosophy).","A discrepância observada entre a disposição dos indivíduos em acionar a alavanca e a sua recusa categórica em empurrar um transeunte inocente da ponte evidencia que a deliberação moral humana",["subordina os direitos fundamentais da pessoa ao mero cálculo contábil de custo-benefício econômico.","opera guiada estritamente por regras instintivas de preservação biológica da espécie em perigo.","considera a morte violenta um evento moralmente neutro desde que executada por maquinários fabris.","rejeita a instrumentalização corporal direta do indivíduo mesmo diante de ganhos consequenciais coletivos.","inviabiliza qualquer tentativa de construção de padrões éticos partilhados no ambiente civil contemporâneo."],3,"Resolução detalhada:\n• Correta: D. O experimento mental demonstra que, mesmo quando o resultado numérico é idêntico (1 morto vs. 5 salvos), as pessoas sentem uma barreira deontológica intransponível em usar ativamente o corpo de alguém como instrumento de bloqueio físico.\n• Incorreta A: A recusa em empurrar a pessoa demonstra exatamente o oposto: os direitos intrínsecos barram o cálculo custo-benefício.\n• Incorreta B: Não se trata de instinto biológico animal, mas de julgamento moral normativo sobre agência e dano intencional.\n• Incorreta C: O evento é carregado de peso moral e angústia reflexiva, jamais considerado neutro.\n• Incorreta E: O objetivo dos estudos de ética aplicada é justamente elucidar os padrões morais humanos para balizar leis e algoritmos éticos."],"Maquiavel e o Realismo Político":["Nicolau Maquiavel funda a ciência política moderna em <i>O Príncipe</i> (1513) ao romper com o idealismo greco-medieval que subordinava a política à moral religiosa ou à busca utópica da cidade perfeita. Maquiavel adota o realismo político: analisa a política como ela é na prática efetiva (a 'verità effettuale delle cose'), e não como deveria ser em teses imaginárias. O governante virtuoso articula a virtù (habilidade estratégica, astúcia, firmeza de caráter e capacidade de agir no momento oportuno) para domesticar os caprichos da fortuna (a sorte, o acaso e as circunstâncias históricas imprevistas). A conservação do poder e a estabilidade do Estado obedecem a uma racionalidade própria, distinta da moralidade cristã privada.",["Verità effettuale: realismo político contra as repúblicas e principados imaginários","Virtù: capacidade estratégica, firmeza e flexibilidade de conduta do governante","Fortuna: circunstâncias externas, acaso e oportunidades temporais","Autonomia da política: separação entre a ética estatal e a moral religiosa privada","Aparência do poder: o governante deve saber simular e dissimular quando a estabilidade exigir"],"Cuidado com a frase apócrifa: Maquiavel NUNCA escreveu 'os fins justificam os meios'. O que ele argumenta é que na política os atos do governante são julgados pelo resultado na manutenção do Estado e da paz civil.","<p>'Muitos imaginaram repúblicas e principados que nunca se viram nem existiram de fato; porque há tanta distância entre o modo como se vive e o modo como se deveria viver, que aquele que despreza o que se faz em favor do que se deveria fazer antes aprende a arruinar-se do que a preservar-se. É necessário a um príncipe que queira manter-se aprender a poder não ser bom, e a usar ou não da bondade segundo a necessidade.' (MAQUIAVEL, N. <i>O Príncipe</i>, cap. XV [adaptado]).</p>","A inovação metodológica introduzida por Maquiavel no pensamento político renascentista consiste em",["fundamentar a autoridade política no direito divino transmitido pela linhagem dos monarcas.","recuperar o ideal da república platônica regida por sábios filósofos imunes a disputas mundanas.","subordinar as decisões governamentais à vigilância estrita das autoridades eclesiásticas tradicionais.","propor a eliminação do Estado centralizado em favor de comunidades cooperativas sem leis formais.","estabelecer a primazia do realismo pragmático na análise dos mecanismos concretos de conquista e manutenção do poder."],4,"Resolução comentada:<br>• Correta: E. Maquiavel inova ao fundar a autonomia da política: rompe com as utopias morais ou religiosas e estuda o funcionamento real do poder, destacando a habilidade (virtù) necessária para gerir as contingências (fortuna).<br>• Incorreta A: A teoria do direito divino dos reis (Bodin, Bossuet) é o oposto da análise laica e empírica de Maquiavel.<br>• Incorreta B: Maquiavel rejeita expressamente as repúblicas imaginárias como a de Platão, que considera ingênuas perante a realidade.<br>• Incorreta D: Maquiavel defende a consolidação de um Estado forte e estável, não o anarquismo.<br>• Incorreta C: O florentino dessacralizou o poder, retirando o controle político das mãos da Igreja."],"Thomas Hobbes e o Estado Leviatã":["Thomas Hobbes apresenta em <i>Leviatã</i> (1651) a primeira grande formulação do contratualismo moderno. No estado de natureza — condição pré-política sem um poder comum coercitivo —, os seres humanos vivem em constante desconfiança e disputa por recursos e glória, gerando 'uma guerra de todos contra todos' (<i>bellum omnium contra omnes</i>), na qual 'o homem é o lobo do homem' (<i>homo homini lupus</i>). Para escapar dessa condição miserável de medo permanente de morte violenta, os indivíduos celebram um pacto de submissão: renunciam à sua liberdade natural e transferem todo o poder e o monopólio da força para um soberano absoluto (o Leviatã). A função prioritária do Estado hobbesiano é garantir a segurança e a preservação da vida.",["Estado de natureza: anarquia, escassez, insegurança e guerra generalizada","Medo da morte violenta: paixão humana fundamental que impulsiona o pacto","Pacto de alienação: transferência total de direitos ao soberano","Leviatã: Estado absolutista dotado de autoridade incontestável e indivisível","Direito inalienável: o súdito só pode resistir se o soberano ameaçar diretamente sua própria vida"],"Hobbes não acha que os homens são maus por natureza no sentido biológico, mas que a ausência de leis e de árbitro comum torna o conflito inevitável. O contrato em Hobbes é entre os cidadãos, entregando o poder a um terceiro (o governante).","<div class=\"bx\" style=\"text-align:center;background:var(--cd);margin:8px 0;padding:12px;border:1px solid var(--ln);border-radius:12px\">\n<svg viewBox=\"0 0 460 140\" style=\"max-width:100%;height:auto;font-family:sans-serif\">\n  <rect x=\"10\" y=\"30\" width=\"130\" height=\"80\" rx=\"8\" fill=\"color-mix(in srgb,var(--er) 12%,transparent)\" stroke=\"var(--er)\" stroke-width=\"2\"/>\n  <text x=\"75\" y=\"55\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"var(--er)\">Estado de Natureza</text>\n  <text x=\"75\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--tx)\">Guerra de todos</text>\n  <text x=\"75\" y=\"90\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--mu)\">Medo da morte</text>\n  <path d=\"M 140 70 L 190 70\" stroke=\"var(--ac)\" stroke-width=\"2\" fill=\"none\"/>\n  <text x=\"165\" y=\"62\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--ac)\" font-weight=\"bold\">Pacto</text>\n  <rect x=\"190\" y=\"30\" width=\"120\" height=\"80\" rx=\"8\" fill=\"var(--hi)\" stroke=\"var(--ac)\" stroke-width=\"2\"/>\n  <text x=\"250\" y=\"55\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"var(--ht)\">Pacto Social</text>\n  <text x=\"250\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--mu)\">Renúncia mútua</text>\n  <text x=\"250\" y=\"90\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--mu)\">da força própria</text>\n  <path d=\"M 310 70 L 350 70\" stroke=\"var(--ac)\" stroke-width=\"2\" fill=\"none\"/>\n  <rect x=\"350\" y=\"25\" width=\"100\" height=\"90\" rx=\"8\" fill=\"color-mix(in srgb,var(--ok) 14%,transparent)\" stroke=\"var(--ok)\" stroke-width=\"2\"/>\n  <text x=\"400\" y=\"55\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"var(--ok)\">O Leviatã</text>\n  <text x=\"400\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--tx)\">Soberano absoluto</text>\n  <text x=\"400\" y=\"90\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--mu)\">Paz e segurança</text>\n</svg>\n<small style=\"color:var(--mu);display:block;margin-top:4px\">O circuito contratualista em Thomas Hobbes</small>\n</div>\n<p>'Sem um poder visível que os mantenha a todos em respeito, e os obrigue pelo medo da punição ao cumprimento dos seus pactos, as leis da natureza são contrárias às nossas paixões naturais.' (HOBBES, T. <i>Leviatã</i>, 1651 [adaptado]).</p>","De acordo com a reflexão política de Hobbes, a legitimação do Estado civil e da autoridade soberana decorre",["da necessidade de instaurar uma autoridade com monopólio da força capaz de assegurar a paz coletiva e preservar a vida.","do mandato divino concedido diretamente pelas escrituras sagradas ao imperador.","do interesse exclusivo das elites econômicas em manter privilégios hereditários de propriedade agrária.","da consagração da soberania popular direta com plebiscitos periódicos incondicionais.","da tendência natural e inata de todos os indivíduos à solidariedade e harmonia pacífica irrestrita."],0,"Resolução comentada:<br>• Correta: A. Na teoria hobbesiana, o Estado (Leviatã) se justifica pela utilidade vital de garantir a paz e a segurança física dos indivíduos, retirando-os do perigo mortal do estado de natureza por meio do monopólio da força legítima.<br>• Incorreta D: Hobbes defende o absolutismo soberano indivisível, rejeitando plebiscitos populares contínuos que fragilizariam o poder.<br>• Incorreta B: Hobbes é um pensador secular/contratualista; o poder decorre do pacto entre os homens, não do direito divino.<br>• Incorreta C: O pacto não é uma conspiração de castas ricas, mas uma necessidade universal de todos os seres vulneráveis à morte violenta.<br>• Incorreta E: O estado de natureza hobbesiano é de conflito e medo mútuo, e não de cooperação pacífica espontânea."],"John Locke e o Liberalismo Contratualista":["Em seu <i>Segundo Tratado sobre o Governo Civil</i> (1689), John Locke apresenta a matriz teórica do liberalismo político clássico. Diferente de Hobbes, Locke concebe o estado de natureza como um estado de relativa paz e cooperação, no qual os seres humanos já são detentores de direitos naturais inalienáveis outorgados pela razão divina: o direito à vida, à liberdade e à propriedade privada (fruto do trabalho individual sobre a natureza comum). Contudo, na ausência de juízes imparciais e leis escritas, cada um torna-se juiz de sua própria causa, o que gera incerteza jurídica. O pacto civil surge para proteger esses direitos preexistentes. O governo é limitado pelo consentimento dos cidadãos e, caso se torne tirânico, o povo possui o legítimo Direito de Resistência.",["Direitos naturais: vida, liberdade e propriedade pré-políticos e inalienáveis","Origem da propriedade: fundada na apropriação e transformação do mundo pelo trabalho humano","Pacto de consentimento: governo é um fideicomisso (relação de confiança mútua)","Estado mínimo e limitado: poder não é absoluto, subordinado à lei e aos direitos individuais","Direito de Resistência: legitimidade do povo para destituir governantes tiranos que violem os direitos naturais"],"Diferença crucial para o ENEM: Hobbes vê o Estado como criador dos direitos e proprietário da vida dos súditos; Locke vê o Estado como mero guardião de direitos que o indivíduo JÁ POSSUÍA antes do contrato.","<p>'O fim principal que leva os homens a se unirem em comunidades políticas e a se submeterem a um governo é a preservação da sua propriedade; para cujo objetivo faltam no estado de natureza muitos fatores necessários: uma lei estabelecida, um juiz conhecido e imparcial, e um poder para apoiar e executar a sentença.' (LOCKE, J. <i>Segundo Tratado sobre o Governo Civil</i>, 1689 [adaptado]).</p>","Na teoria política de John Locke, a finalidade precípua da instituição do governo civil reside em",["eliminar a propriedade privada para promover a repartição igualitária compulsória de todos os bens.","instituir leis comuns e juízes neutros capazes de salvaguardar os direitos naturais fundamentais preexistentes.","transferir a tutela da educação e das crenças íntimas para o arbítrio discricionário dos magistrados.","reproduzir a ordem estamental medieval baseada em privilégios de nobreza outorgados pelo clero.","concentrar autoridade ilimitada nas mãos do soberano contra a qual nenhum cidadão possa apelar."],1,"Resolução comentada:<br>• Correta: B. Para Locke, os indivíduos já detêm direitos naturais (vida, liberdade, propriedade) no estado de natureza; eles instituem o Estado justamente para suprir as lacunas da condição pré-política: leis claras, juízes imparciais e força coercitiva justa para proteger tais direitos.<br>• Incorreta A: Locke defende intransigentemente o direito individual à propriedade privada adquirida pelo trabalho.<br>• Incorreta E: Essa é a perspectiva absolutista de Hobbes, combatida abertamente por Locke.<br>• Incorreta D: Locke fundamenta o liberalismo moderno e opõe-se à sociedade feudal de privilégios hereditários.<br>• Incorreta C: Locke defende a tolerância religiosa (Carta sobre a Tolerância) e a limitação do Estado nos assuntos de consciência privada."],"Jean-Jacques Rousseau e a Vontade Geral":["Jean-Jacques Rousseau formulou uma das mais influentes críticas ao liberalismo e às bases da sociedade burguesa. No <i>Discurso sobre a Origem da Desigualdade</i> (1755), sustenta que no estado de natureza o homem era o 'bom selvagem': livre, solitário e guiado pelo amor de si e pela piedade natural diante do sofrimento alheio. A degradação moral e as guerras surgem com o cercamento das terras e o advento da propriedade privada ('o primeiro que cercou um terreno e disse isto é meu foi o verdadeiro fundador da sociedade civil'). Para superar a opressão, Rousseau propõe em <i>Do Contrato Social</i> (1762) uma república democrática: cada cidadão doa todos os seus direitos à comunidade inteira e, ao obedecer à Vontade Geral, obedece apenas a si mesmo, mantendo-se tão livre quanto antes.",["Bom selvagem: ser humano originalmente pacífico, corrompido pelas instituições e pela propriedade","Gênese da desigualdade: propriedade privada gera a divisão social e as rivalidades","Contrato Social democrático: associação de iguais na qual a soberania pertence ao povo","Vontade Geral (volonté générale): busca do bem comum coletivo, irredutível à soma dos interesses egoístas privados","Soberania popular: inalienável, indivisível e irrepresentável (crítica à democracia puramente representativa)"],"Não confunda 'Vontade Geral' com 'Vontade de Todos': a vontade de todos é a mera soma de interesses particulares e corporativos; a vontade geral visa o interesse comum e o bem coletivo de toda a república.","<p>'O primeiro que, tendo cercado um terreno, lembrou-se de dizer: 'Isto é meu', e encontrou pessoas simples o bastante para acreditar nele, foi o verdadeiro fundador da sociedade civil. Quantos crimes, guerras, assassinatos e misérias não teria poupado ao gênero humano aquele que, arrancando as estacas, tivesse gritado: 'Guardai-vos de escutar esse impostor; estais perdidos se esquecerdes que os frutos são de todos e a terra não é de ninguém'.' (ROUSSEAU, J.-J. <i>Discurso sobre a Origem e os Fundamentos da Desigualdade entre os Homens</i>, 1755 [adaptado]).</p>","No trecho citado, a gênese dos conflitos históricos e da degeneração social é atribuída por Rousseau",["ao desenvolvimento da tolerância religiosa universal que enfraqueceu as tradições morais nativas.","à indolência moral congênita dos povos que habitavam as florestas primitivas.","à instauração da propriedade privada, que originou a cobiça, a desigualdade e a rivalidade artificial.","à ausência de monarcas absolutistas dotados de autoridade divina para manter a paz das nações.","à submissão voluntária dos indivíduos a códigos éticos derivados da razão desinteressada."],2,"Resolução comentada:<br>• Correta: C. Rousseau denuncia a introdução da propriedade privada como o momento de ruptura com o estado de natureza pacífico: a posse exclusiva da terra gerou a divisão entre proprietários e despossuídos, deflagrando a desigualdade, a exploração e os conflitos que culminaram na corrupção social.<br>• Incorreta B: Rousseau elogia a pureza e a ingenuidade do homem primitivo (bom selvagem), não o condena por indolência.<br>• Incorreta A: A tolerância é um ideal valorizado pelo Iluminismo, não a causa da degeneração apontada por Rousseau.<br>• Incorreta D: Rousseau é antiabsolutista e defende a soberania popular democrática inalienável.<br>• Incorreta E: A sociedade civil corrompida baseia-se no egoísmo e na hipocrisia, não na razão desinteressada."],"Montesquieu e a Separação dos Poderes":["Charles de Montesquieu formula em <i>O Espírito das Leis</i> (1748) a teoria clássica da separação e equilíbrio dos poderes, base de todas as democracias constitucionais contemporâneas. Observando a história política, Montesquieu constata uma inclinação humana perigosa: 'todo homem que detém poder é levado a abusar dele; ele vai até onde encontra limites'. Para salvaguardar a liberdade política dos cidadãos contra o despotismo, é imperativo que 'o poder freie o poder' (sistema de freios e contrapesos). As funções estatais devem ser distribuídas entre três instâncias autônomas e harmônicas: o Poder Legislativo (cria as leis), o Poder Executivo (administra e executa as leis) e o Poder Judiciário (julga os conflitos e aplica as punições com base nas leis).",["Tripartição dos Poderes: Executivo, Legislativo e Judiciário","Freios e contrapesos (checks and balances): cada poder equilibra e limita a ambição do outro","Liberdade política: direito de fazer tudo o que as leis permitem sem temer arbítrios de déspotas","Antiabsolutismo: a concentração de funções em uma só pessoa ou órgão anula irremediavelmente a liberdade civil","Espírito das leis: adequação das legislações ao clima, costumes, economia e história de cada povo"],"Montesquieu não prega que os três poderes sejam isolados ou inimigos, mas sim 'autônomos e harmônicos entre si'. O objetivo supremo da tripartição é proteger a liberdade do cidadão contra tiranias.","<p>'Tudo estaria perdido se o mesmo homem, ou o mesmo corpo de nobres, ou do povo, exercesse estes três poderes: o de fazer as leis, o de executar as resoluções públicas e o de julgar os crimes ou as divergências dos particulares. Não há liberdade se o poder de julgar não estiver separado do poder legislativo e do executivo.' (MONTESQUIEU. <i>O Espírito das Leis</i>, Livro XI, 1748 [adaptado]).</p>","A divisão tripartite dos poderes proposta por Montesquieu tem por objetivo precípuo",["fortalecer o centralismo monárquico absolutista para acelerar a cobrança de tributos estatais.","promover a dissolução das instituições formais em prol da tomada direta de decisões pela multidão armada.","garantir que as decisões judiciais fiquem subordinadas ao arbítrio discricionário dos generais militares.","impedir a tirania e o despotismo mediante a contenção e vigilância recíproca entre órgãos governamentais autônomos.","assegurar que o clero e os tribunais inquisitoriais controlem a formulação dos preceitos legislativos civis."],3,"Resolução comentada:<br>• Correta: D. Montesquieu preconiza que 'é preciso que o poder freie o poder'. A distribuição das atribuições entre órgãos independentes (Executivo, Legislativo e Judiciário) cria mecanismos institucionais de controle mútuo (freios e contrapesos) que impedem o surgimento de tiranias e salvaguardam a liberdade política.<br>• Incorreta A: A proposta opõe-se frontalmente à concentração absolutista monárquica.<br>• Incorreta C: Montesquieu exige expressamente que o Judiciário seja autônomo, e não vassalo de governantes ou militares.<br>• Incorreta B: Montesquieu é um pensador constitucionalista e institucional, alheio a insurreições anárquicas.<br>• Incorreta E: O autor ilumina o Estado de direito secular, rejeitando a ingerência inquisitorial da Igreja nas leis civis."],"Teoria da Justiça de John Rawls":["Em <i>Uma Teoria da Justiça</i> (1971), John Rawls renova a tradição contratualista contemporânea com o liberalismo igualitário. Para definir o que é uma sociedade justa, Rawls propõe um experimento mental chamado 'Posição Original': representantes escolhem os princípios fundamentais da sociedade sob um 'Véu da Ignorância' — ninguém sabe qual será sua classe social, gênero, raça, talentos naturais, riqueza ou credo religioso. Nessas condições de imparcialidade máxima, os indivíduos racionais adotariam dois princípios basilares de justiça: 1) Princípio da Igual Liberdade (o mais amplo sistema de liberdades básicas para todos); 2) Princípio da Diferença e Igualdade Equitativa de Oportunidades (as desigualdades socioeconômicas só são legítimas se beneficiarem ao máximo os membros menos favorecidos da sociedade).",["Posição Original: situação hipotética de deliberação sobre princípios de justiça","Véu da Ignorância (veil of ignorance): cegueira voluntária sobre a própria posição social para garantir imparcialidade","Justiça como equidade (justice as fairness): princípios aceitáveis por todos em condição de igualdade inicial","Princípio da Igual Liberdade: direitos civis e liberdades fundamentais invioláveis","Princípio da Diferença: assimetrias de renda só são justas se melhorarem a situação dos mais vulneráveis"],"Rawls concilia a liberdade liberal individual com a justiça social redistributiva. Ele critica tanto o utilitarismo (que sacrificaria os direitos de minorias pela felicidade da maioria) quanto o liberalismo radical meritocrático (que ignora a loteria social e genética do nascimento).","<p>'Uma vez que todos estão em uma situação semelhante e ninguém é capaz de designar princípios para favorecer sua condição particular, os princípios da justiça são o resultado de um acordo ou barganha justa. Por isso, a justiça como equidade começa com a ideia de que a posição original de igualdade corresponde ao estado de natureza na teoria tradicional do contrato social.' (RAWLS, J. <i>Uma Teoria da Justiça</i>, 1971 [adaptado]).</p>","No experimento hipotético rawlsiano do 'véu da ignorância', a imparcialidade das regras distributivas é assegurada porque os participantes",["conhecem minuciosamente seus privilégios de berço e negociam para resguardá-los legalmente.","abrem mão de qualquer apego às liberdades de expressão em troca de subsistência biológica básica garantida.","buscam maximizar a riqueza geral da nação, mesmo que isso implique a escravidão de minorias desfavorecidas.","submetem sua vontade a um ditador esclarecido com poderes absolutos para gerir a economia pública.","desconhecem a própria posição futura na estrutura social, optando por normas que protejam os mais vulneráveis."],4,"Resolução comentada:<br>• Correta: E. Sob o véu da ignorância, como ninguém sabe se nascerá rico ou pobre, doente ou saudável, branco ou negro, homem ou mulher, a prudência racional dita a escolha de uma sociedade que ofereça a melhor rede de proteção possível aos menos favorecidos (critério maximin).<br>• Incorreta A: O véu impede justamente que os indivíduos conheçam seus privilégios, evitando que legislem em causa própria.<br>• Incorreta B: O primeiro princípio de Rawls é o da igual liberdade, que é inviolável e nunca pode ser negociado por vantagens materiais.<br>• Incorreta D: Rawls é um filósofo democrata constitucional; o acordo é fruto da deliberação coletiva, não de ditadura.<br>• Incorreta C: Sacrificar minorias pelo PIB agregado é a lógica utilitarista frontalmente refutada por Rawls."],"Democracia, Cidadania e Desobediência Civil":["A democracia contemporânea não se esgota no voto periódico: pressupõe a vigência dos direitos civis, políticos e sociais, bem como a existência de uma esfera pública vibrante onde os cidadãos debatam as questões de interesse comum. Jürgen Habermas concebe a democracia deliberativa ancorada na ação comunicativa e na ética do discurso: normas legítimas nascem do diálogo aberto, livre de coerções e acessível a todos os atingidos. Paralelamente, quando instituições democráticas sancionam injustiças graves e inconstitucionais (como leis segregacionistas), autores como Henry David Thoreau e líderes como Martin Luther King defendem a Desobediência Civil: um ato público, não violento e consciente de quebra da lei injusta, que apela ao senso de justiça da comunidade e aceita as sanções legais como testemunho de sua fidelidade ao princípio da dignidade.",["Democracia deliberativa (Habermas): legitimidade construída pelo melhor argumento na esfera pública","Cidadania plena: articulação entre direitos civis (liberdade), políticos (participação) e sociais (dignidade)","Desobediência civil: quebra pacífica e pública de leis injustas em defesa de direitos humanos superiores","Henry David Thoreau: resistência pacífica contra impostos que financiavam a escravidão e a guerra","Martin Luther King Jr.: cartas da prisão de Birmingham e a luta não violenta contra a segregação racial"],"No ENEM, atente para as características da desobediência civil: ela é PÚBLICA, NÃO VIOLENTA e fundamentada em princípios éticos universais, diferindo do crime comum (que é clandestino e egoísta) e da revolução armada (que busca derrubar o Estado à força).","<p>'Um indivíduo que infringe uma lei que a sua consciência lhe diz ser injusta, e que aceita voluntariamente a pena de prisão para suscitar a consciência da comunidade quanto a essa injustiça, está na realidade a expressar o mais alto respeito pela lei.' (KING JR., M. L. <i>Carta da Prisão de Birmingham</i>, 1963 [adaptado]).</p>","De acordo com a concepção clássica de desobediência civil evocada por Martin Luther King, a legitimidade dessa forma de protesto apoia-se",["na denúncia pública, pacífica e consciente de leis injustas, apelando aos princípios universais de dignidade humana.","na defesa de privilégios corporativos de grupos dominantes lesados por reformas econômicas igualitárias.","na tentativa de instituir um governo autoritário que suprima todas as garantias da oposição política.","na prática de atentados armados clandestinos contra prédios de serviços essenciais à população civil.","na recusa individualista de prestar qualquer tipo de solidariedade aos demais membros da comunidade."],0,"Resolução comentada:<br>• Correta: A. A desobediência civil consiste na violação consciente, pública e pacífica de normas jurídicas flagrantemente discriminatórias ou contrárias à dignidade moral (como o apartheid e a segregação racial). Seu propósito é expor a injustiça da lei perante a sociedade civil e forçar o aperfeiçoamento das instituições democráticas.<br>• Incorreta D: A desobediência civil recusa categoricamente a violência física ou sabotagens terroristas.<br>• Incorreta B: Ela luta por direitos humanos universais, não por privilégios corporativos egoístas.<br>• Incorreta C: Seu horizonte é a consolidação de uma democracia mais justa e inclusiva, não o autoritarismo.<br>• Incorreta E: A atitude é orientada pelo engajamento cívico coletivo, opondo-se ao individualismo alienado."],"Estado Democrático de Direito e Constitucionalismo":["O conceito contemporâneo de Estado Democrático de Direito representa a culminação histórica do Constitucionalismo moderno: a exigência de que todos os poderes estatais, magistrados e cidadãos estejam subordinados à soberania da Constituição. O Estado de Direito nasceu como barreira contra o arbítrio dos reis monárquicos ('o governo das leis, e não o governo dos homens'). O adjetivo 'Democrático' agrega a exigência de que as leis sejam emanadas da soberania popular através do voto livre, do pluralismo partidário e da participação cívica ativa. Por fim, o Constitucionalismo contemporâneo consagra a proteção inegociável aos Direitos Fundamentais (cláusulas pétreas), assegurando que nem mesmo a maioria parlamentar ocasional possa violar a dignidade e a integridade de minorias.",["Império da Lei (Rule of Law): ninguém está acima da Constituição, nem o presidente, nem os juízes","Constitucionalismo: limitação institucional do poder governamental através de cartas magnas escritas","Direitos Fundamentais: garantias civis, políticas e sociais inderrogáveis que protegem todo cidadão contra tiranias","Pluralismo político: coexistência legal e respeitosa de diferentes projetos ideológicos na disputa democrática","Controle de Constitucionalidade: mecanismo pelo qual o Judiciário anula atos governamentais que firam a Constituição"],"No ENEM: democracia NÃO é a ditadura da maioria! Num Estado Democrático de Direito, a maioria governa, mas a Constituição impõe limites rígidos para proteger os direitos sagrados das minorias.","<p>'O Estado Democrático de Direito não se limita à mera legalidade formal ou à obediência burocrática a códigos vigentes; ele exige que o próprio ordenamento jurídico esteja impregnado de valores de justiça social, igualdade substantiva e respeito irrenunciável aos direitos fundamentais de todos os seres humanos, sem discriminação de qualquer natureza.' (Adaptado de comentários sobre o Artigo 1º da Constituição Federal de 1988).</p>","No modelo do Estado Democrático de Direito, o princípio do império da lei cumpre a função primordial de",["conceder imunidade penal perpétua a governantes eleitos para que aprovem decretos secretos sem controle.","limitar o poder das autoridades públicas e proteger a dignidade e as liberdades dos cidadãos contra arbitrariedades estatais.","suprimir a existência de partidos de oposição e estatizar todas as emissoras de rádio comunitárias.","restringir o direito de voto aos proprietários de terras e comandantes de batalhões militares.","autorizar a tortura de prisioneiros em casos de desacato a funcionários públicos concursados."],1,"Resolução comentada:<br>• Correta: B. O Estado Democrático de Direito opera como um escudo protetor da cidadania: submete os detentores do poder às regras universais e públicas da Constituição, impedindo que governantes ajam com tirania ou perseguição pessoal, e garante que as liberdades individuais e direitos sociais sejam respeitados e promovidos para toda a coletividade.<br>• Incorreta A: O Estado de direito combate privilégios e submete os próprios governantes à responsabilização jurídica.<br>• Incorreta C: O pluralismo partidário e a livre imprensa são cláusulas pétreas essenciais da democracia.<br>• Incorreta D: O sufrágio no Estado Democrático de Direito é universal, secreto e igualitário para todos.<br>• Incorreta E: A tortura e tratamentos desumanos são crimes inafiançáveis e vedados categoricamente pelas constituições democráticas."],"A Tirania da Maioria e a Democracia na América (Tocqueville)":["Em sua obra clássica <i>A Democracia na América</i> (1835–1840), o pensador francês Alexis de Tocqueville analisou as grandezas e os riscos do modelo democrático moderno. Tocqueville celebrou a paixão pela igualdade de condições que rompeu com a nobreza feudal, mas identificou um perigo sutil e assustador: a Tirania da Maioria. Quando a sociedade acredita que a vontade da maioria numérica é automaticamente justa e infalível, cria-se uma imensa pressão social psicológica contra quem pensa de modo divergente. O dissidente não é queimado na fogueira, mas é ostracizado, silenciado e marginalizado pelo conformismo coletivo. Para conjurar esse perigo, Tocqueville destacou a importância vital da imprensa livre, do associativismo comunitário e da descentralização do poder administrativo.",["Igualdade de condições: traço civilizatório irresistível da modernidade democrática analisada por Tocqueville","Tirania da Maioria: imposição avassaladora da opinião da maioria que sufoca a liberdade de expressão de vozes dissidentes","Despotismo brando: risco de um Estado paternalista e protetor que atende aos confortos materiais dos cidadãos enquanto anestesia sua iniciativa cívica","Associativismo civil: clubes, associações voluntárias e grêmios como escolas práticas de cidadania e resistência ao poder centralizado","Liberdade de imprensa: instrumento indispensável para expor os abusos governamentais e dar voz aos injustiçados"],"No ENEM: Tocqueville demonstra que o maior risco da democracia moderna não é um rei tirano do passado com coroa, mas a pressão do conformismo social invisível que obriga todo mundo a pensar e consumir da mesma forma.","<p>'Nas repúblicas democráticas, a tirania da maioria não procede através de suplícios corporais ou correntes de ferro; ela deixa o corpo e vai direto à alma. O soberano já não diz: 'Pensai como eu ou morrereis'; diz: 'Sois livres para não pensar como eu; vossa vida e vossos bens vos serão deixados, mas a partir deste dia sereis um estrangeiro entre nós'.' (TOCQUEVILLE, A. <i>A Democracia na América</i>, 1835 [adaptado]).</p>","O conceito de 'tirania da maioria' elaborado por Alexis de Tocqueville alerta para o risco democrático",["da tomada do poder executivo por bandos de saqueadores piratas sem moradia fixa nas costas litorâneas.","do fechamento obrigatório de todas as bibliotecas e escolas para impedir a alfabetização da infância.","da opressão invisível do conformismo social que marginaliza e silencia aqueles que sustentam ideias divergentes da maioria dominante.","da proibição da posse de jornais impressos e da correspondência epistolar entre cidadãos de províncias vizinhas.","da restauração imediata do regime de vassalagem e servidão camponesa da Idade Média europeia."],2,"Resoluçã
