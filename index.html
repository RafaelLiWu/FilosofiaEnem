sideramos a operação das causas, nunca somos capazes, a partir de um único caso, de descobrir qualquer poder ou conexão necessária, qualquer qualidade que ligue o efeito à causa e torne o primeiro a consequência infalível da segunda. Encontramos apenas que um evento realmente se segue ao outro. O impulso da primeira bola de bilhar é seguido pelo movimento da segunda: eis tudo o que aparece aos sentidos externos. A primeira vez que um homem viu a comunicação do movimento pelo choque de duas bolas, não pôde declarar que um evento estava necessariamente conectado ao outro, mas apenas que estavam conjugados. É somente após a repetição frequente que o hábito produz na imaginação a expectativa de que um se seguirá ao outro.' (HUME, David. <i>Investigação sobre o Entendimento Humano</i>, Seção VII [adaptado]).</p>","Ao fundamentar o princípio da causalidade no hábito psicológico adquirido pela experiência repetida, David Hume instaura um marco na epistemologia moderna ao",["reafirmar a infalibilidade matemática da razão pura para prever os fatos empíricos antes de qualquer observação sensorial.","exigir a proibição dos jogos de bilhar e das pesquisas astronômicas nas faculdades da Europa continental.","negar qualquer valor utilitário às observações científicas e recomendar o retorno a oráculos mitológicos arcaicos.","subordinar a física experimental newtoniana aos dogmas da revelação teológica escolástica medieval.","demonstrar que as inferências sobre causas e efeitos baseiam-se em inclinações práticas consuetudinárias e não em deduções lógicas necessárias."],4,"Resolução comentada:<br>• Correta: E. Hume desmistifica a pretensão racionalista dogmática de provar a causalidade por lógica pura: a crença na causalidade é um produto do hábito e da experiência acumulada que nos permite orientar a vida no mundo empírico, sem constituir verdade lógica a priori necessária.<br>• Incorreta A: Hume nega frontalmente que a razão pura possa prever fenômenos causais do mundo físico sem o concurso prévio da experiência.<br>• Incorreta C: O pensador valoriza imensamente a ciência prática e a investigação experimental moderada, combatendo superstições.<br>• Incorreta D: Ele foi um crítico ferrenho da teologia dogmática e dos relatos de milagres religiosos.<br>• Incorreta B: O exemplo das bolas de bilhar é apenas uma metáfora didática clássica de mecânica física."],"Montesquieu: O Espírito das Leis e a Liberdade Política":["Charles-Louis de Secondat, o Barão de Montesquieu (1689–1755), foi um dos mais brilhantes pensadores do Iluminismo político europeu. Em seu clássico <i>O Espírito das Leis</i> (1748), Montesquieu inaugurou a sociologia política comparada ao investigar a gênese empírica e relacional das leis: as normas jurídicas não são mandamentos divinos abstratos, mas derivam da natureza dos regimes políticos (República fundada na virtude; Monarquia na honra; Despotismo no medo) e relacionam-se com o clima, a geografia e os costumes locais. Diante da constatação realista de que 'todo homem que detém poder é levado a abusar dele até onde encontra limites', Montesquieu arquiteta a célebre separação dos poderes (Legislativo, Executivo e Judiciário), estabelecendo que 'é preciso que o poder freie o poder' para que os cidadãos possam desfrutar de verdadeira liberdade política protegidos do arbítrio tirânico.",["O Espírito das Leis: as leis como relações necessárias que derivam da própria natureza das coisas e dos regimes","Tipologia dos regimes: República (democrática ou aristocrática / virtude), Monarquia (leis fixas / honra) e Despotismo (medo)","Tripartição orgânica dos poderes: Legislativo, Executivo e Judiciário com autonomias mútuas equilibradas","Freios e Contrapesos (checks and balances): mecanismo institucional indispensável para coibir a autocracia","Liberdade política sob o império da lei: o direito de fazer tudo o que as leis justas permitem sem temor de tiranos"],"O legado de Montesquieu é a espinha dorsal do constitucionalismo republicano democrático. No ENEM, as questões costumam contrapor a tripartição dos poderes ao absolutismo e ao perigo contemporâneo de hipertrofia do Executivo.","<p>'A liberdade política não consiste em fazer o que se quer. Em uma sociedade onde há leis, a liberdade não pode consistir senão em poder fazer o que se deve querer e em não ser constrangido a fazer o que não se deve querer. [...] A democracia e a aristocracia não são Estados livres por sua própria natureza. A liberdade política não se encontra senão nos governos moderados. Mas ela nem sempre está presente nesses governos; só está presente quando não se abusa do poder. Contudo, é uma experiência eterna que todo homem investido de poder é levado a abusar dele, indo até onde encontra limites. Para que não se possa abusar do poder, é preciso que, pela disposição das coisas, o poder freie o poder.' (MONTESQUIEU. <i>O Espírito das Leis</i>, Livro XI [adaptado]).</p>","Ao arquitetar o sistema institucional de separação funcional dos poderes, Montesquieu estabelece como condição indeclinável da governança republicana e da liberdade civil a",["existência de magistraturas independentes e harmônicas dotadas de mecanismos recíprocos de fiscalização e contenção mútua.","concentração discricionária das funções jurídicas e militares sob o comando vitalício de dinastias hereditárias.","supressão do direito de defesa processual aos réus condenados por crimes de desacato a autoridades civis.","subordinação irrestrita da formulação das leis às preferências eleitorais efêmeras de chefes militares provisórios.","abolição do parlamento representativo com a entrega da administração tributária a empresas financeiras privadas."],0,"Resolução comentada:<br>• Correta: A. A genialidade da teoria de Montesquieu reside na engenharia constitucional de freios e contrapesos: para evitar a tirania e assegurar a liberdade dos cidadãos, o poder estatal não pode residir em um único polo, mas em órgãos autônomos que se equilibram e se limitam reciprocamente pelo império da lei.<br>• Incorreta B: A concentração em dinastias hereditárias é a essência do absolutismo contra o qual o autor legislou teoricamente.<br>• Incorreta C: O devido processo legal e o respeito às garantias judiciais são pilares do governo moderado montesqueano.<br>• Incorreta D: O Poder Legislativo legítimo fundamenta-se na representação cívica e no debate estável, não em caprichos de generais.<br>• Incorreta E: O parlamento (Legislativo) é indispensável para expressar a soberania e a prudência das leis."],"Denis Diderot: A Filosofia das Luzes e a Razão Emancipatória":["Denis Diderot (1713–1784), um dos mais audazes e combativos pensadores do Iluminismo francês, consagrou sua vida a coordenar, ao lado de d'Alembert, a colossal <i>Encyclopédie</i>. Filósofo materialista, romancista e crítico de arte, Diderot foi um dos mais ferrenhos opositores do fanatismo religioso e do absolutismo monárquico de sua época, tendo sido inclusive encarcerado em Vincennes por seus escritos contestatórios. Diderot defendia que a razão humana e a investigação científica empírica devem ser exercidas sem nenhuma censura teológica ou governamental. Em ensaios como a <i>Carta sobre os Cegos</i> e no romance <i>Jacques, o Fatalista</i>, Diderot sustenta que a matéria é dotada de movimento e sensibilidade próprios, desmistificando o criacionismo providencial e afirmando a soberania do consentimento popular como única fonte legítima do poder político.",["Enciclopedismo combativo: organização sistemática dos conhecimentos humanos contra a censura do Antigo Regime","Materialismo vitalista: a natureza entendida como matéria dinâmica em perpétua transformação imanente","Crítica radical do despotismo: a autoridade política legítima não provém da graça divina, mas do consentimento dos governados","Laicidade e secularização: combate ao monopólio clerical das escolas, da moral e dos tribunais judiciais","Humanismo cosmopolita: celebração do progresso das artes mecânicas e da dignidade do trabalho produtivo humano"],"Diderot no ENEM personifica a combatividade e a coragem intelectual do Iluminismo radical: a razão não é apenas abstração acadêmica; é uma arma de libertação concreta contra a servidão e o preconceito social.","<p>'Nenhum homem recebeu da natureza o direito de comandar os outros. A liberdade é um presente do céu, e cada indivíduo da mesma espécie tem o direito de gozar dela logo que goza da razão. Se a natureza estabeleceu alguma autoridade, foi o poder paterno; mas o poder paterno tem seus limites e, no estado de natureza, cessa logo que os filhos são capazes de conduzir-se a si mesmos. Qualquer outra autoridade decorre de uma de duas fontes: ou da força e da violência daquele que a usurpou, ou do consentimento daqueles que a ela se submeteram mediante um contrato. A autoridade que se adquire pela violência não é senão uma usurpação, e não dura senão enquanto a força de quem comanda prevalecer sobre a daqueles que obedecem.' (DIDEROT, Denis. Artigo 'Autoridade Política', na <i>Enciclopédia</i> [adaptado]).</p>","No artigo redigido para a Enciclopédia, Denis Diderot contesta a ordem sociopolítica do Antigo Regime ao sustentar que a única autoridade estatal moralmente legítima funda-se no(a)",["direito sagrado transmitido por via hereditária pelos fundadores de dinastias absolutistas europeias.","pacto voluntário assentado no consentimento livre e consciente dos membros da comunidade civil.","poder militar predatório que subjuga populações pela força desmedida e pelo terror bélico cotidiano.","subordinação jurídica compulsória dos cidadãos a encíclicas papais emitidas por concílios clericais.","sorteio indiscriminado de títulos de fidalguia distribuídos conforme o poder econômico de financistas."],1,"Resolução comentada:<br>• Correta: B. Diderot é taxativo: nenhum homem tem direito natural de mandar em outro; o poder legítimo só pode emanar do consentimento livre dos governados através de um pacto social civil, sendo a força armada pura usurpação tirânica desprovida de legitimidade ética.<br>• Incorreta A: A hereditariedade e o direito divino foram alvos primordiais da crítica demolidora enciclopedista.<br>• Incorreta C: O poder fundado unicamente na violência é condenado pelo filósofo como usurpação insustentável.<br>• Incorreta D: O projeto iluminista visa à emancipação laica da política frente à tutela teológica clerical.<br>• Incorreta E: Títulos nobiliárquicos e fidalguia eram resquícios feudais repudiados pelo ideário das Luzes."],"John Stuart Mill: O Utilitarismo e a Liberdade Individual":["O filósofo e economista político britânico John Stuart Mill (1806–1873) refinou a ética utilitarista de Jeremy Bentham e elaborou uma das mais clássicas defesas da liberdade civil em sua obra-prima <i>Sobre a Liberdade</i> (1859). Mill reformulou o utilitarismo introduzindo uma distinção qualitativa nos prazeres: não basta calcular a quantidade numérica de sensação física; os prazeres superiores do intelecto, da imaginação estética, da amizade e da consciência moral possuem valor incomensuravelmente mais elevado ('é melhor ser um Sócrates insatisfeito do que um porco satisfeito'). Em <i>Sobre a Liberdade</i>, formulou o Princípio do Dano (Harm Principle): a única justificativa legítima pela qual a sociedade ou o Estado pode interferir na liberdade de ação de um indivíduo adulto contra a sua vontade é impedir o dano a terceiros. Além disso, Mill foi pioneiro histórico na luta pelos direitos das mulheres (<i>A Sujeição das Mulheres</i>).",["Utilitarismo qualitativo: diferenciação ética entre prazeres corporais inferiores e prazeres intelectuais superiores","Harm Principle (Princípio do Dano): a soberania do indivíduo sobre seu corpo e mente é absoluta, salvo se ferir outrem","Defesa radical da liberdade de expressão: a supressão de uma opinião divergente rouba a humanidade da chance de retificar erros","Crítica da 'tirania da maioria': a pressão conformista da opinião pública não pode aniquilar a excentricidade e a singularidade","Feminismo filosófico pioneiro: defesa veemente do sufrágio feminino e da igualdade plena de oportunidades civis"],"John Stuart Mill é muito cobrado no ENEM por sua articulação pioneira entre ética consequencialista, garantia das liberdades individuais civis e defesa dos direitos humanos das mulheres.","<p>'O princípio que este ensaio visa sustentar é o de que a única finalidade pela qual a humanidade está autorizada, individual ou coletivamente, a intervir na liberdade de ação de qualquer um de seus membros é a sua própria proteção. O único propósito para o qual o poder pode ser legitimamente exercido sobre qualquer membro de uma comunidade civilizada, contra a sua vontade, é o de prevenir o dano a terceiros. O seu próprio bem, seja ele físico ou moral, não constitui uma justificação suficiente. Sobre si mesmo, sobre o seu próprio corpo e sobre a sua própria mente, o indivíduo é soberano.' (MILL, John Stuart. <i>Sobre a Liberdade</i>, Capítulo I [adaptado]).</p>","O Princípio do Dano formulado por John Stuart Mill estabelece um postulado basilar para o pensamento liberal democrático contemporâneo ao prescrever que",["o Estado possui autoridade tutelar irrestrita para impor escolhas morais e religiosas aos cidadãos em suas residências.","a opinião compartilhada pela maioria dos eleitores autoriza o banimento coercitivo de qualquer minoria dissidente.","as liberdades individuais e de pensamento devem ser invioláveis desde que as ações do sujeito não prejudiquem outrem.","as decisões sobre estilo de vida dos adultos devem ser subordinadas a conselhos de tutela médica corporativa compulsória.","a expressão pública de críticas contra leis tributárias vigentes configura crime hediondo de lesa-majestade."],2,"Resolução detalhada:<br>• Correta: C. Mill institui a soberania inalienável do indivíduo sobre sua consciência, corpo e projetos de vida: nem a comunidade nem o Estado podem usar a coerção para forçar alguém a viver de certa maneira com base no paternalismo ('para o seu próprio bem'), sendo a interferência legítima apenas quando a ação causa dano concreto a outras pessoas.<br>• Incorreta A: O paternalismo moral estatal coercitivo é expressamente rechaçado por Mill no texto.<br>• Incorreta B: A 'tirania da maioria' sobre o indivíduo excêntrico ou dissidente é um dos maiores perigos combatidos na obra.<br>• Incorreta D: Cada pessoa adulta lúcida é juíza soberana do que constitui sua felicidade pessoal.<br>• Incorreta E: O autor defende a liberdade irrestrita de expressão de todas as ideias e críticas políticas públicas."],"Søren Kierkegaard: Os Três Estádios e o Salto da Fé":["O pensador dinamarquês Søren Kierkegaard (1813–1855) é amplamente reconhecido como o precursor do existencialismo moderno. Inimigo jurado do sistema idealista hegeliano (que pretendia absorver a singularidade humana no movimento cósmico da Razão Universal abstrata), Kierkegaard recolocou no centro da filosofia a existência singular, a subjetividade e a angústia inalienável da escolha. Em obras como <i>Ou... Ou</i> (Enten-Eller) e <i>Temor e Tremor</i>, ele descreveu os três 'estádios' da existência: 1) O Estádio Estético, dominado pela busca imediata do prazer, pela novidade sensorial e pela sedução (cujo fim inevitável é o desespero e o tédio existencial); 2) O Estádio Ético, pautado pelo dever moral, pelo casamento, pela responsabilidade civil e pelo respeito às leis universais da comunidade; e 3) O Estádio Religioso, alcançado pelo 'salto na fé', no qual o indivíduo suspende a própria moralidade racional convencional para colocar-se em relação pessoal e dramática com o Absoluto divino, personificado na provação de Abraão.",["Crítica ao hegelianismo: a existência humana viva não pode ser aprisionada em sistemas lógicos abstratos","Estádio Estético: busca hedonista por prazer efêmero personificada na figura do sedutor Don Juan; culmina no desespero","Estádio Ético: adesão ao dever civil, fidelidade conjugal e valores morais partilhados na convivência cívica","Estádio Religioso e o Salto da Fé: relação paradoxal e íntima com Deus além da razão racionalista estrita","Suspensão teleológica do ético: o sacrifício de Isaque por Abraão como enigma da fé que transcende a ética puramente humana"],"Kierkegaard no ENEM personifica a defesa da angústia e da singularidade do indivíduo perante o conformismo das massas e o excesso de racionalismo frio.","<p>'A angústia pode ser comparada à vertigem. Aquele cujos olhos olham para as profundezas de um abismo sente uma vertigem terrível. Mas qual é a causa dessa vertigem? Está tanto no abismo quanto nos seus próprios olhos; pois se ele não olhasse para baixo, não sentiria nada. Assim é a angústia: ela é a vertigem da liberdade, que surge quando a liberdade contempla as suas próprias possibilidades e percebe a imensidão assustadora de que é capaz. Nesse instante vertiginoso, a liberdade desmaia e cai, percebendo que a cada escolha que faz para si mesma, aniquila todas as outras possibilidades.' (KIERKEGAARD, Søren. <i>O Conceito de Angústia</i> [adaptado]).</p>","Ao caracterizar a angústia existencial como a 'vertigem da liberdade', Søren Kierkegaard diagnostica a condição subjetiva humana ao evidenciar que o sofrimento íntimo decorre da",["ausência irremediável de livre-arbítrio em um cosmos totalmente determinado por leis físicas mecanicistas imutáveis.","falta de oportunidades econômicas no setor comercial marítimo da Escandinávia durante o inverno setentrional.","imposição burocrática de exames acadêmicos de nivelamento intelectual conduzidos por reitores universitários.","consciência dramática da responsabilidade inalienável do indivíduo diante da infinidade aberta de suas escolhas de vida.","certeza dogmática e confortável de que todas as condutas humanas conduzem automaticamente à beatitude celestial."],3,"Resolução comentada:<br>• Correta: D. Para Kierkegaard, a angústia não é doença física nem vício; é a consciência vertiginosa da própria liberdade: ao ter diante de si o abismo das possibilidades de existência, o ser humano é obrigado a escolher e assumir a responsabilidade intransferível pelo seu próprio destino.<br>• Incorreta A: O determinismo mecanicista eliminaria a angústia; é precisamente porque o homem é livre que ele sente a vertigem existencial.<br>• Incorreta C: A angústia kierkegaardiana é existencial e ontológica, e não mero nervosismo perante testes escolares.<br>• Incorreta B: O foco do autor é a alma individual e o sentido da fé, não a conjuntura portuária escandinava.<br>• Incorreta E: A ilusão de certeza confortável anestesia a alma; a fé genuína vive no paradoxo, no temor e no tremor."],"Martin Heidegger: A Pergunta pelo Ser e a Crítica da Técnica":["Martin Heidegger (1889–1976) provocou um abalo sísmico na filosofia contemporânea ao declarar que a história da metafísica ocidental se consumou no 'esquecimento do Ser' (Seinsvergessenheit). A tradição confundiu o Ser (o horizonte ontológico fundamental que permite a revelação de todas as coisas) com os entes (as coisas materiais presentes e manipuláveis). Em conferências magistrais do pós-guerra, como <i>A Questão da Técnica</i> (1953), Heidegger investigou a essência da técnica moderna. Ela não é um mero conjunto neutro de ferramentas e instrumentos que o homem maneja à vontade; sua essência é a <i>Armação</i> ou <i>Com-posição</i> (<i>Gestell</i>) — um modo hegemônico de desocultamento da realidade que desafia a natureza a se entregar como 'reserva utilizável' (<i>Bestand</i>) pronta para exploração produtiva econômica. O rio Reno deixa de ser uma paisagem sagrada e vira mero fornecedor de megawatts para a usina hidrelétrica.",["Esquecimento do Ser: a redução reducionista do cosmos a um catálogo de entes técnicos disponíveis para posse","Gestell (Armação/Com-posição): a essência ontológica da técnica que compele a natureza e os homens a se tornarem recursos úteis","Reserva utilizável (Bestand): a transformação da Terra, das águas e dos próprios seres humanos em estoque instrumental de trabalho","Perigo e Salvação: onde cresce o perigo do desencantamento técnico totalitário, cresce também o que salva (Hölderlin)","Pensamento meditativo versus calculador: resgate da serenidade reflexiva (Gelassenheit) contra a frenesi produtivista cega"],"A crítica da técnica em Heidegger é uma das pontes interdisciplinares mais ricas do ENEM: conecta Filosofia, impactos socioambientais da engenharia, inteligência artificial e crise ecológica planetária.","<p>'A técnica moderna não é um mero meio humano, mas um desocultamento de tipo desafiador. Esse desocultamento desafia a natureza a liberar energia que possa, como tal, ser extraída e acumulada. A central hidrelétrica é instalada na correnteza do rio Reno; ela o intima a fornecer sua pressão hidráulica, que por sua vez faz girar as turbinas. Mesmo o Reno é com-posto para fornecer sua energia. Ele aparece como algo encomendado para a inspeção turística organizada por uma agência de viagens que montou ali uma estância de férias. O homem moderno, no entanto, não é senhor soberano dessa armação técnica; ele próprio corre o risco de ser transformado na mais importante reserva utilizável de mão de obra para a maquinaria planetária.' (HEIDEGGER, Martin. <i>A Questão da Técnica</i> [adaptado]).</p>","Ao denunciar que a essência da tecnologia moderna opera sob a lógica da armação (Gestell), Heidegger adverte a civilização contemporânea para o risco de",["abandonar as usinas hidrelétricas para retornar à caça e coleta praticadas pelos homens das cavernas no Paleolítico.","erradicar os maquinários industriais que viabilizam o abastecimento emergencial de remédios em hospitais.","promover a alfabetização científica universal das populações rurais de países em desenvolvimento.","subordinar a engenharia de precisão aos oráculos astrológicos e à alquimia dos metais pesados.","reduzir a totalidade dos seres naturais e a própria existência humana à condição de mero recurso e estoque funcional explorável."],4,"Resolução detalhada:<br>• Correta: E. Heidegger desvela o perigo supremo da técnica moderna: ela nos aprisiona em uma visão de mundo calculista e utilitária onde tudo — rios, florestas, animais e os próprios indivíduos — é rebaixado a 'reserva de uso' (recursos humanos, matérias-primas energéticas), destruindo a dignidade e o mistério ontológico do Ser.<br>• Incorreta A: Heidegger não propõe ludismo cego nem volta ingênua às cavernas; ele propõe uma postura reflexiva livre perante a técnica.<br>• Incorreta C: A alfabetização e a ciência em si não são perigos, desde que acompanhadas de sabedoria ontológica ética.<br>• Incorreta D: O autor analisa a essência do mundo moderno industrializado, sem apelo a sortilégios de astrologia.<br>• Incorreta B: A técnica tem utilidades práticas vitais inegáveis; o alerta recai sobre a tecnificação totalitária da existência humana."],"Albert Camus: O Homem Revoltado e a Lucidez Solar":["Em seu vigoroso ensaio filosófico <i>O Homem Revoltado</i> (1951), Albert Camus desdobra as consequências éticas e políticas de sua Filosofia do Absurdo. O homem que se revolta diante da injustiça e do sofrimento não está agindo em nome de um dogma religioso transcendente, mas em nome de um limite sagrado que ele descobre em si mesmo e que partilha com todos os outros seres humanos: 'Eu me revolto, logo nós somos'. Camus traça a genealogia das revoltas metafísicas e históricas, denunciando com coragem como as revoluções do século XX traíram seu ímpeto libertador originário ao se converterem em tiranias burocráticas e campos de concentração sob o pretexto de construir um amanhã ideal. Camus defende a 'medida mediterrânea' (o limite e a moderação solar) contra o descomedimento niilista que justifica o assassinato em massa em nome de deuses ou ideologias políticas.",["Eu me revolto, logo nós somos: a revolta como nascimento da solidariedade humana e de uma ética compartilhada","O Homem Revoltado: o sujeito que diz 'não' à opressão, mas afirma 'sim' à dignidade fundamental do semelhante","Crítica do terrorismo de Estado: denúncia dos totalitarismos de direita e esquerda que sacrificam vidas reais no altar de utopias","A Medida Mediterrânea: o princípio da moderação lúcida que recusa os delírios absolutistas e o assassinato sistemático","Ruptura com Sartre: o célebre debate público sobre a condenação moral dos gulags e da violência autoritária soviética"],"Camus no ENEM é cobrado em sua dimensão ética e cidadã: a revolta não é destruição caótica de tudo; é a defesa intransigente de um limite de humanidade que nenhum governante ou tribunal tem o direito de ultrapassar.","<p>'O que é um homem revoltado? Um homem que diz não. Mas, se ele recusa, não renuncia: é também um homem que diz sim, desde o seu primeiro movimento. Um escravo que recebeu ordens a vida inteira julga subitamente inaceitável um novo comando. Qual é o conteúdo desse 'não'? Significa, por exemplo: 'as coisas já duraram tempo demais', 'você está indo longe demais'. [...] A revolta não é um ato egoísta. O homem revoltado, ao se insurgir contra a humilhação imposta pelo senhor, não luta apenas por sua pele; ele identifica em si um valor comum que ultrapassa sua individualidade e que ele compartilha com todos os oprimidos: eu me revolto, logo nós somos.' (CAMUS, Albert. <i>O Homem Revoltado</i> [adaptado]).</p>","A passagem de Albert Camus estabelece o significado ético e político da revolta humana ao demonstrar que o ato de insubordinação contra a tirania",["funda a consciência da dignidade humana e instaura uma comunidade solidária de valores compartilhados perante a opressão.","decorre do capricho egoísta e violento de indivíduos desprovidos de consideração moral pelo destino dos semelhantes.","justifica a aniquilação física de qualquer cidadão inocente em prol da aceleração de metas fabris em planos quinquenais.","exige a submissão silenciosa e dócil aos mandamentos consuetudinários de cortes monárquicas absolutistas.","estimula a apatia cívica e a retirada de todas as lideranças trabalhistas da arena de debates públicos."],0,"Resolução detalhada:<br>• Correta: A. Camus demonstra que a revolta é o nascimento da ética solidária: ao dizer 'não' à humilhação, o sujeito descobre um valor universal partilhado com os outros homens ('nós somos'). A revolta camusiana é criadora de limites éticos que recusam o assassinato e a tirania.<br>• Incorreta B: A revolta autêntica supera o individualismo mesquinho para fundar a comunhão humana com os oprimidos.<br>• Incorreta C: Camus redigiu a obra exatamente para condenar a matança e o sacrifício de vidas inocentes em nome de utopias históricas.<br>• Incorreta D: Dizer 'não' à opressão é a própria ruptura com a submissão cega e a servidão voluntária.<br>• Incorreta E: A revolta é ação viva e corajosa na história coletiva, antítese da apatia acomodada."],"Theodor Adorno: A Dialética do Esclarecimento e a Razão Instrumental":["Ao lado de Max Horkheimer, Theodor W. Adorno (1903–1969) escreveu no exílio norte-americano durante a Segunda Guerra Mundial uma das obras mais contundentes do pensamento ocidental: a <i>Dialética do Esclarecimento</i> (1947). Os autores formulam a estarrecedora indagação: por que a humanidade, em vez de ingressar em um estado verdadeiramente humano e livre prometido pelas Luzes, afundou no horror de uma nova barbárie (Auschwitz, Hiroshima e o totalitarismo)? O enigma é desvendado na mutação sofrida pela Razão: a Razão Crítica e Emancipatória do Iluminismo original degenerou em pura <i>Razão Instrumental</i> — uma racionalidade técnica focada unicamente na eficácia quantitativa dos meios, no controle mecanicista da natureza e na manipulação burocrática dos homens. A indústria cultural e a sociedade administrada alienam os indivíduos, transformando o esclarecimento em um novo mito conformista.",["Dialética do Esclarecimento: a tese de que o Iluminismo traz em seu bojo o risco de recair no próprio mito e na barbárie","Razão Instrumental: racionalidade reducionista voltada ao cálculo utilitário de meios e dominação sem questionar fins éticos","Indústria Cultural (Kulturindustrie): produção em série de bens culturais padronizados que anestesiam o pensamento crítico","Crítica de Auschwitz: o dever moral supremo da civilização pós-holocausto é 'educar para que Auschwitz nunca mais se repita'","Mínima Moralia: aforismos sobre a vida danificada e a busca de refúgio na arte autônoma e na negatividade dialética"],"Adorno e Horkheimer no ENEM: atenção redobrada ao conceito de Razão Instrumental! Ela é a razão que sabe como construir uma bomba atômica ou uma câmara de gás com extrema eficiência técnica, mas é incapaz de julgar moralmente a monstruosidade desses atos.","<p>'No sentido mais amplo de um pensar que avança, o esclarecimento sempre perseguiu o objetivo de livrar os homens do medo e de investi-los como senhores. Mas a terra totalmente esclarecida resplandece sob o signo de uma calamidade triunfal. O programa do esclarecimento era o desencantamento do mundo. Ele pretendia dissolver os mitos e entronizar o saber. Contudo, no caminho para a moderna ciência quantitativa, a razão mutilou-se a si mesma: tornou-se pura razão instrumental. Para a razão instrumental, as coisas e os homens só valem pelo que rendem, transformados em peças de uma engrenagem fria. O esclarecimento recai assim na mitologia da qual acreditava ter escapado.' (ADORNO, Theodor W.; HORKHEIMER, Max. <i>Dialética do Esclarecimento</i> [adaptado]).</p>","A crítica formulada por Adorno e Horkheimer na Dialética do Esclarecimento diagnostica a tragédia civilizatória do século XX ao denunciar que o progresso técnico-científico",["assegurou de maneira imediata e perpétua a felicidade universal e o fim de todas as guerras do planeta.","degenerou em uma racionalidade puramente instrumental que transformou a dominação e o controle técnico em fins supremos.","eliminou qualquer tipo de aparelho fabril para restabelecer o nomadismo e a vida agreste medieval.","suprimiu a influência da propaganda publicitária e das redes de comunicação sobre a consciência das massas.","restaurou a supremacia da nobreza feudal e o direito divino hereditário dos reis absolutistas."],1,"Resolução detalhada:<br>• Correta: B. Os pensadores frankfurtianos expõem o paradoxo amargo da modernidade: a razão iluminista, que prometera libertar a humanidade da ignorância e da superstição, converteu-se em instrumento frio de cálculo e controle técnico (razão instrumental), culminando na barbárie dos campos de extermínio e na manipulação alienante da indústria cultural.<br>• Incorreta A: A obra foi escrita justamente para explicar por que o progresso técnico resultou em guerras e barbárie catastrófica.<br>• Incorreta C: A modernidade industrial aprofundou e expandiu o maquinismo fabril ao máximo.<br>• Incorreta D: A propaganda de massas e a indústria cultural alcançaram poder hegemônico sem precedentes.<br>• Incorreta E: O fascismo e o capitalismo de massas são fenômenos moderníssimos, não restauração feudal arcaica."],"Jürgen Habermas: A Esfera Pública e a Democracia Discursiva":["Jürgen Habermas (1929–), o mais influente herdeiro da tradição crítica de Frankfurt, reorientou a teoria social ao resgatar a promessa emancipatória da modernidade contra o pessimismo de seus mestres Adorno e Horkheimer. Em obras seminais como <i>Mudança Estrutural da Esfera Pública</i> (1962) e <i>Teoria do Agir Comunicativo</i> (1981), Habermas sustenta que a razão humana não é apenas 'razão instrumental' (dominação de objetos); existe a <i>Razão Comunicativa</i>, ancorada na linguagem intersubjetiva e orientada para o entendimento mútuo. Em seu modelo de 'Democracia Discursiva' e 'Direito e Democracia' (1992), a soberania popular desdobra-se em procedimentos deliberativos públicos e abertos: as leis estatais só adquirem legitimidade democrática genuína quando emanam de debates plurais na esfera pública, onde todos os cidadãos afetados podem expressar suas razões e prevalece a 'força sem coação do melhor argumento'.",["Esfera Pública (Öffentlichkeit): a rede de instituições, cafés, imprensa e praças onde cidadãos deliberam sobre o bem comum","Razão Instrumental versus Razão Comunicativa: dominação técnica de coisas versus busca de entendimento racional entre sujeitos","Pretensões universais de validade: verdade das proposições, correção moral das normas e autenticidade dos falantes","Democracia Deliberativa: a legitimidade do poder político ancorada na qualidade do processo argumentativo prévio ao voto","Patriotismo Constitucional: sentimento cívico baseado não no sangue ou na etnia fechada, mas nos princípios da Constituição democrática"],"Habermas no ENEM: é o campeão absoluto dos temas de cidadania, ética e esfera pública! Fique atento à oposição entre agir estratégico (manipulação instrumental do outro) e agir comunicativo (acordo voluntário e diálogo livre).","<p>'A esfera pública pode ser entendida, antes de tudo, como uma rede para a comunicação de conteúdos e tomadas de posição, ou seja, de opiniões; nela os fluxos de comunicação são filtrados e sintetizados a ponto de se condensarem em opiniões públicas tematizadas. [...] Em uma democracia deliberativa, a legitimidade das decisões estatais apoia-se em um procedimento de deliberação coletiva institucionalizada, no qual todos os cidadãos têm igual direito de participação e onde a única coação admitida é a força sem coação do melhor argumento racional.' (HABERMAS, Jürgen. <i>Direito e Democracia: entre faticidade e validade</i> [adaptado]).</p>","Ao formular os alicerces teóricos da democracia deliberativa contemporânea, Jürgen Habermas situa o fundamento da legitimidade política na",["capacidade armamentista das forças de segurança de silenciar qualquer protesto de rua nas capitais.","imposição dogmática de princípios religiosos emanados de uma casta sacerdotal vitalícia consagrada.","participação discursiva inclusiva dos cidadãos em uma esfera pública livre onde prevalecem argumentos racionais mútuos.","compra discricionária de mandatos políticos por conglomerados empresariais transnacionais em leilões fechados.","abolição do debate parlamentar e sua substituição por algoritmos fechados de inteligência artificial militarizada."],2,"Resolução detalhada:<br>• Correta: C. Habermas define que uma lei só é legítima se puder contar com a anuência de todos os possíveis afetados após uma deliberação democrática aberta, inclusiva e racionalmente fundamentada na esfera pública compartilhada.<br>• Incorreta A: A violência militar destrói o agir comunicativo e deslegitima o poder civil democrático.<br>• Incorreta B: A democracia deliberativa é pluralista e laica, recusando imposições dogmáticas de fé.<br>• Incorreta D: A invasão do dinheiro e do poder econômico na esfera pública é classificada por Habermas como 'colonização do mundo da vida'.<br>• Incorreta E: O coração da soberania popular é a troca discursiva entre seres humanos dotados de razão e ação ética, não a tecnocracia algorítmica."],"John Rawls: A Justiça como Equidade e o Liberalismo Político":["John Rawls (1921–2002) é considerado o mais importante filósofo político de língua inglesa do século XX. Sua obra <i>Uma Teoria da Justiça</i> (1971) revitalizou o contrato social para oferecer uma alternativa moral consistente ao Utilitarismo clássico (que admitia o sacrifício de direitos fundamentais de minorias vulneráveis em nome do saldo numérico de bem-estar da maioria). Rawls concebeu o experimento mental da 'posição original': indivíduos livres e racionais reúnem-se para escolher as regras básicas da cooperação social resguardados pelo 'véu da ignorância' (desconhecendo sua própria classe econômica, cor da pele, religião, dotes naturais e sorte biológica). Nessas condições ideais de imparcialidade, duas regras invioláveis emergem: 1) o princípio da maior liberdade igual para todos; e 2) as desigualdades sociais e econômicas só são justas se estiverem vinculadas a oportunidades abertas a todos e se maximizarem as vantagens dos mais desfavorecidos (o Princípio da Diferença).",["Posição Original e Véu da Ignorância: método deontológico que assegura a equidade ao expurgar vantagens arbitrárias prévias","Princípio da Maior Liberdade Igual: prioridade lexical das liberdades civis e políticas básicas sobre ganhos materiais","Princípio da Igualdade Equitativa de Oportunidades: acesso universal à educação e à saúde contra barreiras sociais de classe","Princípio da Diferença: distribuição socioeconômica desenhada para beneficiar prioritariamente os membros mais vulneráveis","Consenso Sobreposto (Overlapping Consensus): convivência pacífica em democracias plurais em torno de uma concepção política de justiça"],"John Rawls no ENEM: entenda a lógica do 'Princípio da Diferença'! Ele não propõe o comunismo raso absoluto; ele autoriza incentivos e desigualdades econômicas pontuais, contanto que essa desigualdade melhore concretamente a vida dos mais pobres (ex.: médicos ganhando mais se isso atrair profissionais para postos de saúde de periferias).","<p>'A justiça é a primeira virtude das instituições sociais, como a verdade o é dos sistemas de pensamento. Cada pessoa possui uma inviolabilidade fundada na justiça que nem mesmo o bem-estar da sociedade como um todo pode ignorar. Por essa razão, a justiça nega que a perda da liberdade para alguns se justifique por um bem maior compartilhado por outros. Não permite que os sacrifícios impostos a uns poucos tenham menos valor que o total maior de vantagens desfrutadas por muitos. Numa sociedade justa, as liberdades da cidadania igual são consideradas definitivas; os direitos assegurados pela justiça não estão sujeitos à negociação política nem ao cálculo de interesses sociais.' (RAWLS, John. <i>Uma Teoria da Justiça</i>, Capítulo I [adaptado]).</p>","A teoria da justiça como equidade elaborada por John Rawls rompe com a tradição utilitarista ao postular que a estruturação ética de uma sociedade justa deve",["admitir o sacrifício sumário dos direitos de minorias desfavorecidas sempre que a maioria obtiver lucros financeiros elevados.","proibir qualquer forma de assistência pública hospitalar a cidadãos que não pertençam aos estratos sociais mais abastados.","concentrar a propriedade de todos os bens manufaturados nas mãos de uma aristocracia hereditária militarizada.","assegurar a prioridade inviolável dos direitos e liberdades individuais fundamentais sobre cálculos agregados de conveniência coletiva.","suprimir o poder do voto feminino para resgatar a ordenação patriarcal do direito consuetudinário arcaico."],3,"Resolução detalhada:<br>• Correta: D. Rawls declara que a dignidade e os direitos de cada indivíduo são invioláveis e têm prioridade absoluta sobre o cálculo de utilidade geral da sociedade: a liberdade não pode ser negociada ou suprimida em troca de maior crescimento econômico agregado.<br>• Incorreta A: Esse sacrifício utilitário é o alvo fulcral do combate e da crítica da obra de Rawls.<br>• Incorreta C: Rawls defende uma 'democracia de cidadãos-proprietários' e uma justa distribuição de oportunidades, contra oligarquias hereditárias.<br>• Incorreta B: O Princípio da Diferença exige políticas públicas compensatórias de saúde e educação para amparar os mais vulneráveis.<br>• Incorreta E: A igualdade de gênero e o sufrágio universal são direitos civis elementares inalienáveis no modelo rawlsiano."],"Zygmunt Bauman: O Diagnóstico da Modernidade Líquida":["O pensador polonês Zygmunt Bauman (1925–2017) ofereceu a mais célebre metáfora diagnóstica da passagem do século XX para o século XXI com o conceito de 'Modernidade Líquida'. Se a modernidade inicial ('sólida') era caracterizada por instituições rígidas, empregos vitalícios, ideologias de longo prazo e laços sociais indissolúveis (a fábrica fordista, a família nuclear duradoura, os sindicatos fortes), a fase líquida dissolveu todas as certezas. Os fluidos, ao contrário dos sólidos, não mantêm sua forma e não fixam o espaço; eles fluem, escorrem e evaporam. Na modernidade líquida, as relações humanas tornam-se frágeis e descartáveis (<i>Amor Líquido</i>); a cidadania converte-se em mero consumismo de sensações passageiras; o trabalho sofre precarização flexível; e os indivíduos arcam solitariamente com incertezas e angústias geradas por crises sistêmicas globais.",["Modernidade Líquida versus Sólida: passagem de estruturas duradouras para a fluidez, volatilidade e incerteza perpétua","Fragilização dos laços comunitários (Amor Líquido): relações afetivas pautadas na facilidade de conexão e desconexão digital","Sociedade de consumidores: a identidade individual definida pela capacidade ininterrupta de consumir novidades mercantis","Individualização dos riscos: o Estado de bem-estar recua e os cidadãos são culpabilizados solitariamente por problemas estruturais","Refugiados e vidas desperdiçadas: a produção de populações supérfluas e marginais pelo capitalismo global desenfreado"],"Bauman no ENEM: é presença frequente em Humanas e citado em centenas de redações nota 1000! Relacione sempre a fluidez baumaniana com o imediatismo das redes sociais, a obsolescência das mercadorias e a solidão do indivíduo hiperconectado.","<p>'A passagem da fase sólida da modernidade para a sua fase líquida — ou seja, para uma condição em que todas as formas sociais se desfazem e se dissolvem mais rápido do que o tempo necessário para que possam se consolidar — provocou uma profunda crise de segurança existencial. Os sólidos mantêm sua forma no tempo: um emprego para a vida toda, um casamento 'até que a morte os separe', uma fé política compartilhada por gerações. Os líquidos, ao contrário, não se atêm a nenhuma forma com facilidade; estão em constante mudança e transbordamento. Hoje, nenhum vínculo dura o bastante para se sedimentar; tudo foi mercantilizado e tornado descartável, gerando medo contínuo de ser deixado para trás.' (BAUMAN, Zygmunt. <i>Modernidade Líquida</i> [adaptado]).</p>","Ao caracterizar a contemporaneidade por meio da metáfora da liquidez, a análise sociológica de Zygmunt Bauman evidencia que a experiência existencial do indivíduo atual é marcada pela",["permanência inabalável de tradições comunitárias que garantem segurança profissional vitalícia a todos.","concessão de estabilidade salarial irrestrita e moradia gratuita financiada por bancos privados transnacionais.","eliminação completa de produtos industrializados em prol do escambo exclusivo de manufaturas caseiras.","restauração do isolamento rural que afasta as populações do contato com redes telemáticas e aparelhos celulares.","fragilização dos vínculos interpessoais e pela instabilidade perpétua decorrente da mercantilização e volatilidade das relações."],4,"Resolução detalhada:<br>• Correta: E. Bauman diagnostica a essência do mundo líquido-moderno: os laços afetivos, comunitários e profissionais perderam sua estabilidade e durabilidade histórica; submetidos à lógica do consumo rápido e do descarte imediato, os indivíduos vivem em um estado crônico de insegurança, ansiedade e solidão conectada.<br>• Incorreta A: A destruição da estabilidade tradicional duradoura é precisamente a marca definidora da liquidez moderna.<br>• Incorreta C: O consumismo industrial de massa nunca foi tão frenético quanto no capitalismo contemporâneo.<br>• Incorreta D: As metrópoles e a hiperconectividade digital móvel são os ecossistemas centrais da modernidade líquida.<br>• Incorreta B: A marca do mercado de trabalho contemporâneo analisada por Bauman é a flexibilidade precarizada e a ausência de garantias sólidas."],"Frantz Fanon: A Descolonização e a Crítica da Violência Colonial":["Frantz Fanon (1925–1961), médico psiquiatra martinicano que se alistou na Frente de Libertação Nacional (FLN) da Argélia, legou ao pensamento mundial as mais profundas análises sobre as entranhas do colonialismo em <i>Pele Negra, Máscaras Brancas</i> (1952) e <i>Os Condenados da Terra</i> (1961) — este último prefaciado por Jean-Paul Sartre. Fanon desvenda que o colonialismo não foi um mero intercâmbio comercial, mas uma violência ontológica e física radical: 'O mundo colonial é um mundo compartimentado', cindido em uma cidade europeia opulenta e bem alimentada e uma cidade indígena esfomeada, amontoada e submetida à repressão policial contínua. Para Fanon, a violência colonial originária é tão visceral que a descolonização não pode ser um processo pacífico negociado entre cavalheiros metropolitanos; ela é uma práxis desalienadora pela qual o homem colonizado expurga o veneno da inferioridade e se recria como sujeito livre e soberano.",["Compartimentação maniqueísta do mundo colonial: a cisão espacial e racial entre a cidade do colono e a casbá do colonizado","Descolonização como recriação humana: a libertação histórica cria novos homens desatrelados da cópia servil da Europa","A violência colonial e a contra-violência libertadora: o enfrentamento prático das estruturas armadas de dominação imperial","Crítica da burguesia nacionalista pós-colonial: denúncia das elites locais que substituem o colonizador para manter a espoliação","Pacto ético e psíquico: a libertação dos povos do Sul global exige curar as feridas psíquicas causadas pelo racismo estrutural"],"Frantz Fanon no ENEM é indispensável para as questões de Geopolítica, Filosofia Decolonial e Direitos Humanos: compreenda a denúncia do humanismo hipócrita europeu que discursava sobre liberdade enquanto bombardeava populações africanas e asiáticas.","<p>'A descolonização, que se propõe mudar a ordem do mundo, é, como se vê, um programa de desordem absoluta. Mas ela não pode ser o resultado de uma operação mágica, de um abalo natural ou de um acordo amigável. A descolonização é o encontro de duas forças congenitamente antagônicas que tiram sua originalidade precisamente dessa espécie de substantivação que segrega e alimenta a situação colonial. [...] O colono não é apenas aquele que possui a riqueza; ele é o homem que trouxe a violência para a casa e para o cérebro do colonizado. Para o povo colonizado, essa violência reinvertida na luta de libertação nacional possui um caráter desintoxicante. Ela livra o oprimido de seu complexo de inferioridade e de seu desespero; ela o reabilita diante de seus próprios olhos.' (FANON, Frantz. <i>Os Condenados da Terra</i>, Capítulo I [adaptado]).</p>","Ao dissecar os mecanismos estruturantes do imperialismo europeu, a análise de Frantz Fanon estabelece que a verdadeira emancipação dos povos subalternizados requer",["a transformação radical e desalienadora das estruturas coloniais de poder e a superação psíquica do complexo de inferioridade.","a assimilação dócil dos hábitos morais e da língua do colonizador como única via de aceitação civilizatória.","o pagamento de tributos perpétuos em ouro e café para compensar os prejuízos alfandegários das antigas metrópoles.","o retorno compulsório ao isolamento geográfico absoluto com proibição de qualquer comunicação com o restante da África.","a subordinação da justiça das novas nações independentes ao julgamento de cortes marciais de marinhas estrangeiras."],0,"Resolução detalhada:<br>• Correta: A. Fanon afirma que a descolonização é um processo histórico profundo de refundação do ser humano: o colonizado não pode contentar-se com meras reformas de fachada mantendo as velhas estruturas; ele precisa desmantelar a máquina colonial e curar a ferida psicológica do racismo, assumindo sua dignidade e soberania plenas.<br>• Incorreta B: A tentativa de imitar o branco ('máscaras brancas') é a própria alienação psicológica que Fanon combate.<br>• Incorreta C: Foram as metrópoles que saquearam os recursos do Sul global, sendo descabido qualquer tributo indenizatório.<br>• Incorreta D: Fanon propõe o pan-africanismo e a solidariedade internacional anti-imperialista entre os povos livres.<br>• Incorreta E: A independência autêntica exige soberania jurídica e o banimento de tribunais de opressão colonial estrangeira."],"Ailton Krenak: O Pensamento Ameríndio e a Dança do Cosmos":["Ailton Krenak (1953–), escritor, filósofo indígena do povo Krenak e líder histórico na conquista do artigo 231 da Constituição Brasileira de 1988, é uma das vozes mais luminosas da filosofia contemporânea latino-americana. Em obras aclamadas internacionalmente como <i>Ideias para Adiar o Fim do Mundo</i> (2019), <i>O Amanhã Não Está à Venda</i> (2020) e <i>A Vida Não é Útil</i> (2020), Krenak desafia a arrogância da cosmologia ocidental moderna. Krenak desconstrói a ideia antropocêntrica de que a humanidade é dona do planeta Terra e de que rios, montanhas e florestas são mercadorias inanimadas a serviço do lucro predatório. Na cosmovisão ameríndia, a natureza é um organismo vivo pulsante e sagrado com o qual os seres humanos estabelecem laços de parentesco e reciprocidade. Viver não é uma corrida utilitária para trabalhar e consumir até o esgotamento, mas a celebração poética de 'dançar e cantar para suspender o céu'.",["Parentesco cósmico ameríndio: montanhas, florestas e rios (como o Rio Doce / Watu) concebidos como pessoas e ancestrais vivos","Crítica do antropocentrismo capitalista: a civilização ocidental inventou a separação artificial entre Homem e Terra para explorar o planeta","A vida não é útil: rejeição contundente de subordinar a existência à lógica utilitária do mercado e do produtivismo sem fim","Adiar o fim do mundo: resistir por meio de cantos, narrativas, cosmologias plurais e preservação das memórias ancestrais","Constitucionalismo e direitos originários: protagonismo histórico na inscrição dos direitos dos povos indígenas na Constituição de 1988"],"Ailton Krenak no ENEM representa o encontro da Filosofia Não-Eurocêntrica com a questão socioambiental do Brasil: rios e montanhas não são 'recursos minerais a serem leiloados'; são parentes e patrimônio sagrado da biosfera viva.","<p>'Fomos, durante muito tempo, embalados com essa história de que somos a humanidade. E nos alienamos desse organismo de que somos parte, a Terra, e passamos a pensar que ela é uma coisa e nós, outra: a Terra e a humanidade. Eu não percebo onde tem alguma coisa que não seja natureza. Tudo é natureza. O cosmos é natureza. O que fomos convencidos a chamar de 'recurso natural' para o mercado nada mais é do que os nossos parentes: o rio Doce, que nós chamamos de Watu, é o nosso avô; as montanhas que as mineradoras estão comendo e engolindo em vagões de trem são as nossas matrizes de memória. Se arrancarem as montanhas e secarem os rios, que humanidade sobrará para habitar a Terra? Precisamos cantar e dançar para adiar o fim do mundo.' (KRENAK, Ailton. <i>Ideias para Adiar o Fim do Mundo</i> [adaptado]).</p>","Ao expressar os fundamentos ontológicos do pensamento ameríndio, a reflexão de Ailton Krenak desafia o paradigma desenvolvimentista ocidental ao preconizar uma relação com o território assentada no(a)",["aproveitamento acelerado das nascentes fluviais para instalação de aterros industriais de resíduos químicos perigosos.","reconhecimento do parentesco ontológico e do valor sagrado que une os humanos aos seres vivos e elementos da Terra.","eliminação dos rituais comunitários tradicionais para acelerar o treinamento técnico de jovens para o agronegócio.","transferência compulsória de todas as aldeias indígenas para periferias verticalizadas das metrópoles urbanas.","confisco das florestas nativas e sua transformação em monocultivos transgênicos voltados exclusivamente à exportação de commodities."],1,"Resolução detalhada:<br>• Correta: B. Krenak apresenta uma cosmopolítica e uma ontologia da reciprocidade: os rios, matas e montanhas não são estoques inertes de matéria-prima para o capital, mas sujeitos vivos e parentes ancestrais (Watu é avô); proteger o planeta exige superar a soberba antropocêntrica e aprender com a sabedoria indígena a conviver em harmonia poética com a Terra.<br>• Incorreta A: A contaminação de bacias hidrográficas por rejeitos de mineração (como o desastre de Mariana) é uma catástrofe combatida por Krenak.<br>• Incorreta C: Cantar, dançar e preservar os rituais ancestrais é a própria fórmula viva de resistência proposta pelo autor.<br>• Incorreta D: O direito à permanência na terra tradicional demarcada é uma bandeira civilizatória inegociável do movimento indígena.<br>• Incorreta E: O desmatamento para monocultura predatória personifica a máquina insaciável que precipita o fim do mundo denunciado no livro."],"Davi Kopenawa: A Sabedoria Xamânica e a Queda do Céu":["Xamã e líder porta-voz do povo Yanomami, Davi Kopenawa é coautor, ao lado do antropólogo francês Bruce Albert, da monumental obra filosófica e etnográfica <i>A Queda do Céu: Palavras de um Xamã Yanomami</i> (2010). Considerado um dos livros mais importantes do século XXI, <i>A Queda do Céu</i> oferece um testemunho comovente sobre a cosmologia da floresta (<i>urihi a</i>) e uma profecia estarrecedora sobre o futuro do planeta. Kopenawa relata como os xamãs trabalham incansavelmente com os espíritos da floresta (os <i>xapiri</i>) para sustentar a ordem do cosmos. O autor denuncia a cobiça desmedida do 'povo da mercadoria' (os brancos ocidentais), cuja fúria garimpeira e mineradora fura o chão para arrancar o ouro e o petróleo, liberando a fumaça das epidemias (<i>xawara</i>) e o calor da destruição. Se os xamãs e a floresta forem aniquilados, os espíritos vingadores farão o céu desabar sobre a cabeça de brancos e indígenas indistintamente.",["Urihi a (A Terra-Floresta): não um espaço geográfico inerte, mas um ser vivo animado que respira e tem alma","Os Xapiri: espíritos auxiliares luminosos que dançam e através dos quais os xamãs curam o mundo e sustentam o cosmos","Povo da Mercadoria: a crítica yanomami à neurose consumista dos brancos que destroem o mundo para acumular objetos fúteis","Xawara: a fumaça epidêmica e tóxica liberada pela queima de fósseis e pela mineração predatória que adoece a biosfera","A Queda do Céu: a advertência cósmica de que o colapso ambiental e climático global atingirá a humanidade inteira sem distinção"],"Davi Kopenawa no ENEM: é a principal referência de Filosofia Ecológica Indígena e Antropologia da Amazônia. Fique atento à crítica ao 'povo da mercadoria': acumular ouro e queimar a floresta é um delírio que intoxica a própria vida.","<p>'Os brancos não temem, como nós, ser esmagados pela queda do céu. Mas um dia talvez eles tenham tanto medo disso quanto nós! Eles se dizem inteligentes, mas seus pensamentos estão cheios de esquecimento. Eles passam a vida toda cavando a terra para tirar minérios e arrancar ouro para fazer mercadorias. Não sabem que a floresta está viva e que o sopro dos xapiri mantém as árvores em pé e as chuvas caindo na hora certa. Ao arrancarem o ouro da terra, eles libertam a fumaça de epidemia, a xawara, que viaja no vento e espalha a morte e o calor pelo mundo todo. Quando nós xamãs estivermos mortos e os xapiri se calarem para sempre, os brancos não conseguirão segurar o céu sozinhos: ele cairá sobre todos nós.' (KOPENAWA, Davi; ALBERT, Bruce. <i>A Queda do Céu: Palavras de um Xamã Yanomami</i> [adaptado]).</p>","A narrativa cosmopolítica de Davi Kopenawa confronta o modelo econômico e ambiental hegemônico contemporâneo ao interpretar a devastação ecológica da Amazônia como",["um índice inquestionável de avanço científico e tecnológico que trará harmonia e riqueza universal imediata a todos os povos.","uma necessidade natural decorrente do ciclo geológico imutável de glaciação do continente sul-americano.","uma manifestação da cegueira consumista do 'povo da mercadoria' que rompe os equilíbrios cósmicos e ameaça a vida planetária.","um processo indispensável para substituir os xamãs e povos originários por garimpos ilegais armados permanentes.","um mal-entendido passageiro que será corrigido espontaneamente pela elevação da cotação internacional do preço do ouro."],2,"Resolução detalhada:<br>• Correta: C. Kopenawa formula uma crítica filosófica profunda ao capitalismo global extrativista: a obsessão do 'povo da mercadoria' em explorar e furar a floresta viva em busca de minérios desata as forças destrutivas das doenças e do aquecimento global (xawara); sem a floresta viva e o trabalho cosmopolítico dos povos originários, o ecossistema entrará em colapso catastrófico e o céu desabará sobre a civilização inteira.<br>• Incorreta A: Kopenawa nega enfaticamente que a destruição florestal represente verdadeira inteligência ou progresso.<br>• Incorreta B: A crise ambiental é provocada pela ação predatória humana (antropogênica) do capital extrativista, não por ciclos cósmicos naturais glaciais neutros.<br>• Incorreta D: O garimpo ilegal leva morte, contaminação por mercúrio e violência hedionda às terras indígenas, sendo denunciado na obra.<br>• Incorreta E: O aumento do valor do ouro acelera a cobiça e intensifica a invasão predatória das terras amazônicas."]};
