el com a justiça","Vida examinada: a reflexão crítica contínua sobre as próprias ações como sentido supremo da existência","Ironia socrática: técnica dialógica de desestabilização de certezas dogmáticas e da falsa sabedoria","Maiêutica: parto conceitual pelo qual a alma atinge definições universais sobre valores morais","Cuidado da alma (epimeleia heautou): primazia do aprimoramento espiritual e moral sobre riquezas materiais e honras"],"No ENEM, atente para a postura socrática perante a morte: ele aceita beber a cicuta para respeitar as leis da cidade que o acolheu, recusando-se a fugir ou a renunciar ao dever de filosofar.","<p>'Enquanto eu respirar e tiver forças, não deixarei de filosofar, de vos exortar e de alertar a cada um de vós: 'Homem de Atenas, tu não te envergonhas de cuidar tanto das riquezas, da fama e das honrarias, enquanto da sabedoria, da verdade e da perfeição da tua alma não te importas nem cogitas?' É isso que proclamo a jovens e velhos.' (PLATÃO. <i>Apologia de Sócrates</i>, 29d-30a [adaptado]).</p>","A postura de Sócrates diante de sua condenação pelo tribunal ateniense expressa a convicção filosófica de que",["a sobrevivência física individual deve ser preservada a qualquer custo, mesmo mediante a renúncia da dignidade moral.","a obediência religiosa cega aos deuses pagãos tradicionais dispensa qualquer indagação ética racional.","os tribunais democráticos devem ser sumariamente aniquilados por exércitos de mercenários estrangeiros.","a prática contínua do autoexame e o compromisso incondicional com a virtude sobrepõem-se aos bens materiais e à própria morte.","os filósofos devem enriquecer cobrando elevadas taxas para instruir os governantes sobre oratória militar."],3,"Resolução comentada:<br>• Correta: D. Sócrates personifica o compromisso incondicional com a verdade e o autoexame moral: prefere morrer fiel à sua missão filosófica de despertar a consciência dos concidadãos a salvar sua vida pela bajulação ou pelo silêncio. A perfeição da alma e a virtude são superiores aos bens mundanos efêmeros.<br>• Incorreta A: Sócrates recusou a fuga oferecida por Críton, afirmando que uma vida sem virtude não é digna de ser vivida.<br>• Incorreta C: Sócrates respeitava a instituição das leis da pólis, mesmo quando foi injustamente condenado por homens corruptos.<br>• Incorreta B: Seu julgamento decorreu exatamente de ter colocado a razão moral crítica acima dos dogmas religiosos tradicionais.<br>• Incorreta E: Quem cobrava honorários por aulas de retórica eram os sofistas; Sócrates nunca cobrou para ensinar."],"Platão: O Filósofo-Rei e o Mito de Er":["Na obra monumental <i>A República</i>, Platão projeta uma cidade justa (Calípolis) dividida em três classes funcionais que espelham as três partes da alma humana: a classe econômica dos produtores (alma apetitiva/concupiscível, guiada pela temperança); a classe militar dos guerreiros guardiões (alma irascível/colérica, guiada pela coragem); e a classe governante dos magistrados (alma racional, guiada pela sabedoria). A justiça na pólis e no indivíduo consiste na harmonia harmônica entre essas três partes, onde cada qual cumpre sua função sem usurpar o papel alheio. Disso decorre a célebre tese do Rei-Filósofo: as misérias do mundo só cessarão quando os filósofos se tornarem reis ou os reis começarem a filosofar verdadeiramente. No encerramento da obra, o Mito de Er narra a imortalidade da alma e a responsabilidade de cada indivíduo na escolha de seu próprio destino moral.",["Calípolis (Cidade Justa): sociedade harmoniosa dividida segundo a aptidão natural da alma de cada cidadão","Tripartição da Alma: alma racional (cabeça/razão), irascível (peito/coragem) e concupiscível (ventre/apetites)","O Rei-Filósofo: a legitimação do poder político fundamentada no conhecimento autêntico da Ideia do Bem","Justiça platônica: dar a cada um o que lhe é devido, atuando na função que melhor corresponde à excelência da sua alma","Mito de Er: a responsabilidade moral individual e a imortalidade da alma na cosmologia platônica"],"Guarde para o ENEM: para Platão, a política NÃO é espaço para debate amador de opiniões passageiras (doxa). A governança é uma ciência suprema que exige a contemplação das Ideias perfeitas e a primazia da razão sobre as paixões.","<p>'A não ser que os filósofos governem como reis nas cidades, ou que aqueles que agora são chamados reis e soberanos se tornem filósofos genuínos e profundos, de modo que o poder político e a filosofia coincidam num mesmo sujeito, não haverá descanso para as desgraças das cidades, meu caro Glauco, nem para as do gênero humano.' (PLATÃO. <i>A República</i>, Livro V, 473d [adaptado]).</p>","A teoria platônica da realeza dos filósofos fundamenta a autoridade de governo",["no acúmulo de propriedades de terra e na descendência biológica de famílias aristocráticas guerreiras.","no sorteio aleatório de cidadãos comuns para o exercício das mais altas magistraturas da administração estatal.","na habilidade de bajular a multidão na ágora através de promessas demagógicas e espetáculos circenses.","na capacidade bélica de invadir cidades vizinhas e escravizar povos para financiar obras públicas.","na posse do saber filosófico e racional sobre a justiça e o Bem, capaz de ordenar harmoniosamente a vida pública."],4,"Resolução comentada:<br>• Correta: E. Platão defende uma sofocracia (governo dos sábios): quem governa a pólis deve ser quem contemplou a verdade inteligível da Ideia do Bem e compreende a essência da justiça. Somente o filósofo, desprovido de ambição gananciosa por riquezas materiais, é capaz de subordinar as paixões e garantir a harmonia justa entre as classes sociais.<br>• Incorreta A: A riqueza material é vedada aos governantes e guerreiros na República platônica para evitar a corrupção.<br>• Incorreta C: A bajulação retórica da multidão é a prática da demagogia sofística condenada por Platão.<br>• Incorreta D: Calípolis visa à harmonia interna e à paz justa, e não ao expansionismo militar predatório.<br>• Incorreta B: O sorteio aleatório de magistraturas era característico da democracia ateniense, duramente criticada por Platão por entregar o Estado a amadores inaptos."],"Aristóteles: O Animal Político e a Lógica":["Aristóteles (384–322 a.C.), autor de obras seminais como a <i>Política</i> e a <i>Metafísica</i>, definiu o ser humano como um <i>Zoon Politikon</i> (um animal político ou social por natureza). Diferente dos outros animais gregários, o homem é dotado do <i>logos</i> (palavra e razão), faculdade que lhe permite discernir o justo do injusto, o conveniente do prejudicial. Quem é incapaz de viver em comunidade, ou não necessita dela por ser autossuficiente, 'ou é uma besta fera ou é um deus', mas não um homem. Na sua concepção de Estado, a pólis possui prioridade ontológica sobre a família e o indivíduo, pois somente na comunidade política o cidadão pode exercer a virtude, deliberar sobre o bem comum e alcançar a plena realização de seu telos (a eudaimonia).",["Zoon Politikon: o homem é naturalmente feito para viver na pólis e realizar-se na convivência cívica","O Logos como distintivo humano: a fala articulada como instrumento de discernimento moral e justiça","Prioridade da Pólis: o todo (a comunidade política) precede logicamente a parte (o indivíduo isolado)","Formas de governo justas (visam o bem comum): Monarquia, Aristocracia e Politeia","Formas corrompidas (visam interesses próprios): Tirania, Oligarquia e Democracia demagógica desregrada"],"No ENEM: a política em Aristóteles é a coroação da ética. A ética estuda a vida boa individual; a política organiza as condições institucionais para que TODOS os cidadãos possam viver bem e com virtude na pólis.","<p>'A pólis é uma criação da natureza e o homem é, por natureza, um animal político. Aquele que, por sua natureza e não por obra do acaso, não faz parte de nenhuma pólis é um ser desprezível ou superior ao homem. A palavra é dada ao homem para exprimir o que é justo e o que é injusto; e a associação desses sentimentos é o que constitui a família e a cidade.' (ARISTÓTELES. <i>Política</i>, Livro I [adaptado]).</p>","Ao conceber o ser humano como um 'animal político por natureza', Aristóteles sustenta que a cidadania e a vida social",["constituem a condição indispensável para o desenvolvimento pleno da racionalidade, da linguagem e da virtude ética humana.","decorrem de uma convenção artificial e forçada que contraria a verdadeira essência solitária do homem.","restringem-se exclusivamente a comerciantes estrangeiros que dominam as transações bancárias e marítimas.","visam à preparação da alma para uma vida incorpórea e mística após a destruição da matéria física.","devem ser substituídas pelo isolamento eremita nas montanhas para evitar o contágio dos vícios urbanos."],0,"Resolução comentada:<br>• Correta: A. Para Aristóteles, a sociabilidade política não é um contrato acidental inventado pelo medo, mas a realização natural da própria essência humana: o homem só desenvolve a linguagem moral, a prudência e a virtude na pólis, interagindo com seus iguais e deliberando sobre a justiça coletiva. O isolamento mutila a condição humana.<br>• Incorreta B: Aristóteles combate a tese dos sofistas de que a pólis seria puramente artificial e contrária à natureza.<br>• Incorreta C: Os comerciantes estrangeiros (metecos) não eram cidadãos plenos na Grécia Antiga.<br>• Incorreta D: A política aristotélica volta-se para a realização eudaimônica da vida terrena concreta dos cidadãos.<br>• Incorreta E: O eremitismo é repudiado por Aristóteles, que afirma que quem vive isolado fora da pólis 'ou é besta ou é deus'."],"Santo Agostinho: A Cidade de Deus e as Duas Vontades":["Na imensa obra <i>A Cidade de Deus</i> (413–426 d.C.), escrita após o saque de Roma pelos visigodos de Alarico, Santo Agostinho constrói a primeira grande filosofia da história ocidental. Agostinho rebate a acusação dos pagãos de que o abandono dos velhos deuses em favor do cristianismo teria causado a ruína do Império. Ele demonstra que a história humana é atravessada pelo conflito invisível entre duas cidades místicas: a Cidade Terrena (<i>civitas terrena</i>), fundada no amor de si até o desprezo de Deus, dominada pela cobiça, ganância e violência imperial (a <i>libido dominandi</i>); e a Cidade de Deus (<i>civitas Dei</i>), fundada no amor a Deus até o esquecimento de si, animada pela caridade, humildade e busca da paz eterna. Ambas as cidades coexistem misturadas no tempo histórico, e somente no Juízo Final serão plenamente separadas.",["A Cidade de Deus (Civitas Dei): peregrina no mundo, orientada pelo amor a Deus, caridade e paz eterna","A Cidade Terrena (Civitas Terrena): marcada pela cobiça de poder (libido dominandi) e orgulho egoísta","Provocação histórica: reflexão sobre a decadência dos impérios temporais e a perenidade do reino espiritual","Conceito de Tempo: o tempo como criação de Deus vivenciado na distensão da alma humana (memória, atenção e expectativa)","O livre-arbítrio e a graça: a vontade humana ferida pelo pecado só realiza o bem autêntico quando amparada pela graça divina"],"No ENEM: a Cidade de Deus agostiniana NÃO é a Igreja visível de tijolos na Terra, nem a Cidade Terrena é apenas o governo civil. Elas são duas atitudes espirituais e morais interiores que convivem na história de todas as sociedades.","<p>'Dois amores fundaram, pois, duas cidades: a terrena, o amor de si até o desprezo de Deus; a celeste, o amor de Deus até o desprezo de si. Aquela gloria-se em si mesma, esta no Senhor. Aquela busca a glória dos homens; esta tem por máxima glória a Deus, testemunha de sua consciência. Uma, em seus príncipes e nas nações conquistadas, é dominada pela paixão de mandar; na outra, servem-se mutuamente na caridade.' (SANTO AGOSTINHO. <i>A Cidade de Deus</i>, Livro XIV [adaptado]).</p>","Na interpretação agostiniana da história humana, o declínio dos impérios políticos mundanos e de suas glórias militares é compreendido como decorrência",["do triunfo irremediável de deuses guerreiros pagãos sobre as populações desarmadas da Europa.","da fragilidade intrínseca da cidade terrena, governada pelo orgulho egoísta e pela paixão do poder temporário.","da ausência total de leis criminais e judiciais nos territórios sob domínio dos imperadores romanos.","do desenvolvimento científico da medicina laica que eliminou as epidemias nos centros urbanos.","da adesão generalizada dos governantes ao voto de pobreza franciscano durante a Antiguidade."],1,"Resolução comentada:<br>• Correta: B. Agostinho explica a queda de Roma e a vulnerabilidade dos grandes impérios como uma lição sobre a natureza perecível da Cidade Terrena: fundada na ambição desmedida, no egoísmo e na sede predatória de poder militar (libido dominandi), ela carrega as sementes de sua própria corrupção. Apenas a Cidade de Deus, ancorada na caridade e na justiça divina transcendente, é incorruptível e eterna.<br>• Incorreta A: Agostinho refuta exatamente o paganismo, mostrando a impotência dos deuses mitológicos diante da história.<br>• Incorreta C: Roma tinha um dos mais desenvolvidos corpos jurídicos da história (Direito Romano), mas isso não impediu sua crise moral.<br>• Incorreta D: A medicina científica moderna sequer existia nessa época.<br>• Incorreta E: São Francisco de Assis viveu no século XIII (séculos após a queda de Roma e após a morte de Agostinho)."],"São Tomás de Aquino: Fé, Razão e as Leis":["Na <i>Suma Teológica</i>, São Tomás de Aquino elaborou uma influente teoria jurídica e política articulando o direito natural com a moral cristã. Tomás estabelece uma hierarquia de quatro leis que regem a ordem da realidade: 1) Lei Eterna (a própria razão e sabedoria soberana de Deus governando todo o cosmos); 2) Lei Natural (a participação da criatura racional na Lei Eterna, acessível a todos os seres humanos pela razão natural, expressa no princípio primordial: 'fazer o bem e evitar o mal'); 3) Lei Divina (as verdades da revelação sobrenatural escritas nas Escrituras para guiar a salvação eterna); e 4) Lei Humana (o direito positivo promulgado pelos governantes para manter a paz e a ordem na sociedade civil). Para Tomás, uma lei positiva que contrarie a lei natural não é uma verdadeira lei, mas uma violência injusta e tirânica.",["Lei Eterna: plano racional e cósmico da sabedoria divina de Deus","Lei Natural: princípios morais universais apreendidos pela razão humana (preservação da vida, busca da verdade, vida em sociedade)","Lei Humana (Positiva): ordenação da razão para o bem comum promulgada pela autoridade legítima da comunidade","Justiça como virtude: 'vontade constante e perpétua de dar a cada um o que é seu por direito'","Direito de Resistência ao Tirano: governantes que violam a lei natural e o bem comum perdem a legitimidade do poder"],"Tomás de Aquino é o pai do Jusnaturalismo cristão clássico: o Direito não é mero arbítrio da vontade do rei ou da força militar. Uma lei estatal só é legítima se estiver em conformidade com a razão e com a lei moral natural.","<p>'A lei não é senão uma ordenação da razão para o bem comum, promulgada por quem tem o cuidado da comunidade. As leis humanas, para serem legítimas, devem ser justas. Se forem injustas, não são propriamente leis, mas atos de violência; pois a lei humana só tem razão de lei na medida em que deriva da lei natural. E se em algo discrepante da lei natural, já não será lei, mas corrupção da lei.' (TOMÁS DE AQUINO. <i>Suma Teológica</i>, I-II, q. 90-95 [adaptado]).</p>","De acordo com a filosofia jurídica e política de Tomás de Aquino, o critério que valida a legitimidade de uma lei civil positiva reside",["no capricho pessoal e inquestionável do monarca absolutista exercido através da força das armas.","na capacidade de enriquecer os comerciantes mais prósperos através da exploração predatória dos plebeus.","na sua conformidade com os princípios racionais da lei moral natural orientados para a promoção do bem comum.","na revogação periódica de todos os tribunais de julgamento para conceder impunidade aos nobres.","na submissão irrefletida das sentenças judiciais às superstições astrológicas da corte real."],2,"Resolução comentada:<br>• Correta: C. Para Tomás de Aquino, a lei positiva não é fruto do arbítrio do governante, mas uma ordenação da razão voltada ao bem comum da pólis. Se a autoridade promulgar decretos que firam a lei natural (como escravizar arbitrariamente ou ordenar atrocidades), tal mandamento perde sua natureza de lei legítima e converte-se em mera tirania, autorizando os cidadãos a resistirem moralmente a ela.<br>• Incorreta A: A vontade arbitrária e a força bruta sem razão constituem a tirania repudiada pelo tomismo.<br>• Incorreta B: O bem comum é coletivo e universal, opondo-se ao favorecimento corporativo egoísta de certas classes.<br>• Incorreta D: Tomás defende tribunais justos e a correta aplicação das sanções legais como dever da justiça distributiva.<br>• Incorreta E: O tomismo é uma filosofia de alto rigor racional e escolástico, refratária a superstições oraculares."],"Nicolau Maquiavel: Realismo, Virtù e Fortuna":["No tratado <i>Discursos sobre a Primeira Década de Tito Lívio</i> e em <i>O Príncipe</i>, Nicolau Maquiavel examina com profundidade a dinâmica das repúblicas e dos principados. Além de dissociar a política da moral religiosa privada, Maquiavel destaca que o conflito social é o motor da liberdade republicana: em toda cidade há dois humores antagônicos — o humor dos grandes (que desejam dominar e oprimir) e o humor do povo (que não quer ser dominado nem oprimido). Em uma boa república, como na Roma antiga, as leis e as instituições nascem justamente da canalização virtuosa desse conflito popular, e não de uma harmonia ingênua. O governante sagaz deve equilibrar a força feroz do leão e a astúcia ardilosa da raposa, agindo conforme as exigências da necessidade para preservar a república.",["Dois Humores da Cidade: o desejo dos nobres de oprimir versus o desejo do povo de viver livre de opressão","Conflito gerador da liberdade: as boas leis das repúblicas florescem da tensão cívica entre o povo e as elites","A metáfora do Leão e da Raposa: a força militar necessária e a astúcia inteligente de perceber as armadilhas políticas","Realismo secular: a política analisada a partir de motivações humanas empíricas (medo, interesse, ambição)","República vs Tirania: Maquiavel preferia a república cívica participativa de cidadãos armados à tirania opressora"],"Pegadinha do ENEM: Muitos acham que Maquiavel só apoiava tiranos cruéis por causa de 'O Príncipe'. Mas em 'Discursos sobre a Primeira Década de Tito Lívio', ele se revela um fervoroso defensor da República, da liberdade civil e da participação do povo contra a opressão dos poderosos!","<p>'Os homens têm menos escrúpulo em ofender a quem se faz amar do que a quem se faz temer; pois o amor é mantido por um vínculo de obrigação que, sendo os homens perversos, é rompido a cada oportunidade de conveniência própria; mas o temor é mantido pelo medo do castigo, o qual jamais te abandona. Não obstante, o príncipe deve fazer-se temer de modo que, se não puder conquistar o amor, pelo menos evite o ódio.' (MAQUIAVEL, N. <i>O Príncipe</i>, cap. XVII [adaptado]).</p>","A lição maquiaveliana sobre o uso estratégico do temor pelo governante orienta que a autoridade estatal deve",["confiscar os bens e estuprar a honra das famílias dos cidadãos para demonstrar força absoluta.","distribuir joias e coroas de ouro para todos os plebeus para conseguir ser idolatrado cegamente.","renunciar ao exército próprio e entregar a guarda da fronteira a forças mercenárias desarmadas.","manter a coesão e o respeito cívico pela aplicação firme da lei sem descambar para a tirania odiosa e cruel.","subordinar todos os decretos às sentenças proferidas pelo Papa e pelas ordens clericais."],3,"Resolução comentada:<br>• Correta: D. Maquiavel adverte que é ideal ser amado e temido simultaneamente, mas sendo difícil conciliar ambos, ser temido é mais seguro para a estabilidade da ordem pública. Contudo, o príncipe deve evitar com rigor o ódio dos cidadãos: não violar a propriedade nem a honra familiar do povo. O ódio atiça revoltas e conduz o príncipe à ruína certa.<br>• Incorreta A: Confiscar terras e violar famílias é exatamente o que gera o ódio letal que derruba governantes, segundo Maquiavel.<br>• Incorreta C: Maquiavel condena severamente as tropas mercenárias em 'O Príncipe', exigindo exércitos cívicos próprios patrióticos.<br>• Incorreta B: O esbanjamento de recursos (falsa generosidade) empobrece o príncipe e o força a tributar pesadamente o povo depois.<br>• Incorreta E: O pensamento maquiaveliano é pioneiro da laicização e autonomia total do Estado frente à Igreja."],"René Descartes: O Fundador do Racionalismo Moderno":["René Descartes (1596–1650) transformou a trajetória do pensamento ocidental ao propor um método universal para bem conduzir a razão e procurar a verdade nas ciências. Em suas <i>Regras para a Direção do Espírito</i> e no <i>Discurso do Método</i>, estabeleceu as quatro regras fundamentais do método racionalista: 1) Evidência (jamais acolher alguma coisa como verdadeira sem que ela se apresente à mente de modo tão claro e distinto que não haja margem para dúvida); 2) Análise (dividir cada problema complexo em tantas parcelas quantas forem necessárias para melhor resolvê-lo); 3) Síntese (conduzir ordenadamente os pensamentos, começando pelos objetos mais simples para subir aos mais compostos); e 4) Enumeração (fazer revisões completas e gerais para certificar-se de nada omitir). A clareza e distinção matemática tornaram-se o cânone do rigor moderno.",["Regra da Evidência: recusa do preconceito; aceitar apenas o claro e distinto","Regra da Análise: decompor a complexidade em elementos atômicos mais fáceis de resolver","Regra da Síntese: reconstruir o edifício do saber partindo do simples para o complexo","Regra da Enumeração: revisão metódica e verificação exaustiva de cada etapa","Mathesis Universalis: ideal de unificar todo o saber sob a certeza e dedução da ordem matemática e geométrica"],"No ENEM: o método de Descartes é cartesiano justamente pela precisão analítica: dividir para conquistar, ordenar as partes e verificar tudo. Essa metodologia moldou não só a filosofia, mas a física, a computação e a engenharia modernas.","<p>'O primeiro preceito era o de nunca acolher alguma coisa por verdadeira que eu não conhecesse evidentemente como tal; isto é, de evitar cuidadosamente a precipitação e a prevenção. O segundo, o de dividir cada uma das dificuldades que eu examinasse em tantas parcelas quantas fossem possíveis e requeridas para melhor as resolver. O terceiro, o de conduzir por ordem meus pensamentos, começando pelos objetos mais simples e fáceis de conhecer, para subir, pouco a pouco, até o conhecimento dos mais compostos. E o último, o de fazer em tudo enumerações tão completas e revisões tão gerais que eu tivesse a certeza de nada omitir.' (DESCARTES, R. <i>Discurso do Método</i>, Parte II, 1637 [adaptado]).</p>","O método racional preconizado por René Descartes propõe reformar a investigação científica por meio",["da aceitação incondicional das opiniões dos mestres antigos sem necessidade de exame pessoal.","da observação desordenada de curiosidades da natureza sem qualquer critério de sistematização.","do recurso exclusivo a revelações místicas e adivinhações do futuro obtidas em sonhos proféticos.","da rejeição peremptória da álgebra e da geometria nas pesquisas laboratoriais empíricas.","da aplicação disciplinada de regras lógicas de evidência, decomposição analítica, síntese e verificação exaustiva."],4,"Resolução comentada:<br>• Correta: E. As quatro regras do método cartesiano (evidência clara e distinta, análise fragmentadora, síntese construtiva e enumeração fiscalizadora) fundaram o rigor epistemológico moderno: visavam livrar o pensamento das confusões da tradição escolástica verbalista e instituir um caminho racional universal e seguro para as descobertas científicas.<br>• Incorreta A: A regra da evidência proíbe explicitamente a autoridade dogmática dos mestres antigos.<br>• Incorreta C: Descartes submeteu os sonhos à dúvida metódica hiperbólica, recusando misticismos.<br>• Incorreta D: Descartes foi o pai da geometria analítica e da matematização mecanicista da ciência física.<br>• Incorreta B: O método cartesiano é a negação cabal do caos: exige ordem rigorosa e planejamento deliberado das etapas."],"Thomas Hobbes: A Teoria da Soberania Indivisível":["Thomas Hobbes concebeu uma das teorias do poder mais coesas da modernidade. Para o filósofo inglês, o soberano instituído pelo contrato social possui autoridade absoluta, indivisível e irrevogável. Hobbes rejeitava veementemente qualquer separação de poderes (como dividir entre Parlamento e Rei, o que culminou na Guerra Civil Inglesa que ele testemunhou com horror). Se os poderes do Estado forem divididos, eles inevitablemente colidirão entre si, enfraquecendo a espada da justiça e devolvendo a comunidade ao caos sangrento da guerra civil no estado de natureza. Além disso, o governante soberano do Leviatã tem autoridade sobre as leis civis e sobre a Igreja pública (o Leviatã segura a espada militar na mão direita e o báculo pastoral religioso na esquerda), garantindo que nenhuma facção eclesiástica desafie a autoridade civil do Estado laico.",["Soberania indivisível: o poder soberano não pode ser fragmentado sem gerar guerra e desordem civil","Pacto de autorização: 'Eu autorizo e transfiro o meu direito de me governar a mim mesmo a este homem sob a condição de que tu transfiras a ele teu direito de igual modo'","Monopólio absoluto da violência legítima: apenas o Estado detém a espada para punir os infratores","Subordinação da religião à lei civil: paz social exige que o Estado controle as doutrinas públicas","Paz como valor supremo: a pior tirania estatal ainda é preferível ao horror absoluto da guerra de todos contra todos"],"Guarde para o ENEM: para Hobbes, liberdade é ausência de impedimentos físicos externos. Ao entrar no Estado, o cidadão troca a liberdade natural (violenta e insegura) pela liberdade civil tutelada pela lei, garantindo a sua sobrevivência física.","<p>'Pois como uma casa dividida contra si mesma não pode subsistir, assim também um reino dividido em si mesmo não pode permanecer. Uma soberania dividida entre reis e parlamentos, ou entre poder espiritual e poder temporal, anula a autoridade soberana e destrói a paz, pois onde há dois mestres com a espada haverá inevitavelmente a guerra civil.' (HOBBES, T. <i>Leviatã</i>, 1651 [adaptado]).</p>","A recusa hobbesiana à divisão dos poderes estatais fundamenta-se na premissa de que",["a soberania partilhada gera facções rivais em disputa armada e precipita a dissolução do Estado na guerra civil.","os monarcas necessitam de parlamentos fortes para limitar a cobrança de impostos militares.","a natureza humana é pacífica e espontaneamente colaborativa, dispensando qualquer controle coercitivo central.","os tribunais eclesiásticos da inquisição devem exercer a palavra final sobre todos os códigos de comércio civil.","o modelo político ideal é o anarquismo comunal sem polícia, exército ou magistraturas escritas."],0,"Resolução comentada:<br>• Correta: A. Hobbes argumenta que o poder soberano deve ser uno e indivisível: dividir o poder supremo entre órgãos rivais gera impasses insolúveis de soberania, que culminam na guerra de facções armadas (como ocorreu na Revolução Puritana inglesa). O monopólio inquestionável da força civil nas mãos do soberano é a única garantia de sobrevivência e ordem coletiva.<br>• Incorreta B: Hobbes combateu a partilha de soberania com o Parlamento por considerá-la a causa das rebeliões.<br>• Incorreta C: No estado de natureza hobbesiano, a natureza humana é desconfiada, egoísta e violenta, e não harmoniosa.<br>• Incorreta D: O autor submete as igrejas e tribunais clericais à autoridade civil do soberano soberano secular.<br>• Incorreta E: O anarquismo é o próprio estado de natureza caótico e temido do qual a humanidade busca fugir pelo pacto."],"John Locke: Propriedade, Trabalho e Tolerância":["John Locke (1632–1704) forneceu as bases filosóficas da Revolução Gloriosa (1688) e da democracia liberal. Para Locke, a propriedade privada não é uma concessão graciosa do rei, mas um direito natural sagrado e inalienável do ser humano. Originalmente, Deus deu a Terra em comum a todos os homens; contudo, sempre que o indivíduo retira algo do estado natural e a isso junta o esforço do seu próprio Corpo e o Trabalho de suas Mãos, ele anexa a esse objeto algo que é seu, tornando-o sua legítima propriedade privada. Em sua <i>Carta sobre a Tolerância</i> (1689), Locke defendeu com rigor a separação entre Estado e Igreja: a missão do magistrado civil é resguardar a vida, a liberdade e os bens materiais dos cidadãos pela força da lei; a salvação da alma, porém, pertence à consciência íntima de cada indivíduo e não pode ser imposta pela espada estatal.",["Trabalho como fundamento da propriedade: o labor pessoal legitima a apropriação dos frutos da terra","Limite da propriedade: apropriação legítima enquanto não houver desperdício e sobrar o bastante e de igual qualidade para os demais","Invenção do dinheiro: metal precioso que não se deteriora, permitindo a acumulação de riquezas sem desperdício de bens perecíveis","Carta sobre a Tolerância: a consciência religiosa não pode ser coagida por torturas ou leis do magistrado civil","Governo representativo e consentido: a autoridade política só governa legitimamente com o consentimento dos governados"],"No ENEM: a tolerância em Locke tem limites históricos de sua época (ele excluía ateus, pois não juravam sob Deus, e católicos leais a Roma). Mas sua distinção entre o foro íntimo da fé e a alçada civil do Estado fundou a laicidade moderna.","<p>'Ainda que a terra e todas as criaturas inferiores pertençam em comum a todos os homens, cada homem tem uma propriedade em sua própria pessoa; a esta ninguém tem qualquer direito senão ele mesmo. O trabalho de seu corpo e a obra de suas mãos, podemos dizer, são propriamente dele. Seja o que for que ele retire do estado que a natureza lhe forneceu, a isso misturou seu trabalho, tornando-o sua propriedade.' (LOCKE, J. <i>Segundo Tratado sobre o Governo Civil</i>, 1689 [adaptado]).</p>","Na teoria lockeana, a legitimação moral e jurídica da apropriação privada de bens da natureza decorre",["da outorga de títulos de nobreza hereditários distribuídos pelas cortes monárquicas absolutistas.","da aplicação do esforço do trabalho e da inventividade humana sobre a matéria natural comum.","da expropriação violenta de territórios vizinhos por exércitos profissionais mercenários.","da ausência total de leis escritas que regulem o comércio nas sociedades civis organizadas.","da proibição da posse individual de qualquer ferramenta de cultivo pelos agricultores rurais."],1,"Resolução comentada:<br>• Correta: B. Locke fundamenta a propriedade privada no trabalho: o ser humano é senhor exclusivo de seu próprio corpo e energias; ao misturar seu esforço e labor a um recurso natural comum (plantar um trigo, colher frutos, cercar uma terra improdutiva para cultivo), ele agrega valor à matéria e constitui um título de propriedade legítimo e inviolável perante o Estado.<br>• Incorreta A: A propriedade em Locke antecede o Estado e independe de privilégios feudais outorgados por reis.<br>• Incorreta C: A apropriação predatória por pilhagem bélica sem trabalho é condenada como violação da lei natural.<br>• Incorreta D: Locke defende a criação de leis escritas conhecidas e juízes imparciais exatamente para proteger a propriedade.<br>• Incorreta E: Locke defende com vigor a propriedade particular dos meios e ferramentas de trabalho de cada homem livre."],"Jean-Jacques Rousseau: A Soberania Popular e o Contrato":["Jean-Jacques Rousseau revolucionou o conceito de legitimidade política ao postular que a Soberania pertence exclusiva e inalienavelmente ao Povo reunido em corpo político soberano. Em <i>Do Contrato Social</i>, Rousseau rejeita veementemente o modelo inglês de democracia representativa parlamentar: 'O povo inglês pensa ser livre; está muito enganado: ele só o é durante a eleição dos membros do parlamento; assim que estes são eleitos, torna-se escravo, não é nada'. Os deputados não são nem podem ser representantes do povo, são apenas seus comissários; nenhuma lei tem validade se não tiver sido ratificada diretamente pelos cidadãos. A liberdade civil não é fazer o que dá na telha (licenciosidade), mas 'a obediência à lei que nós mesmos prescrevemos' orientada pela Vontade Geral.",["Soberania Inalienável e Indivisível: o poder soberano do povo não pode ser vendido, transferido ou representado","Crítica à representação parlamentar: delegar a soberania a deputados equivale a abdicar da própria liberdade política","Vontade Geral (Volonté Générale): horizonte ético coletivo focado no bem comum da comunidade republicana","Liberdade civil republicana: agir conforme as leis que o próprio cidadão votou e instituiu de forma democrática","Religião Civil: conjunto simples de sentimentos de sociabilidade cívica indispensáveis para manter a fraternidade patriótica"],"No ENEM: diferencie bem Locke de Rousseau: Locke defende uma democracia representativa com foco na propriedade privada e direitos individuais; Rousseau defende a soberania popular direta com foco na igualdade material e no bem comum coletivo.","<p>'A soberania não pode ser representada pela mesma razão por que não pode ser alienada; ela consiste essencialmente na vontade geral, e a vontade absolutamente não se representa: ou é ela mesma ou é outra; não há meio-termo. Os deputados do povo não são, pois, nem podem ser seus representantes; são apenas seus comissários; nada podem concluir definitivamente. Toda lei que o povo em pessoa não tenha ratificado é nula; não é uma lei.' (ROUSSEAU, J.-J. <i>Do Contrato Social</i>, Livro III, cap. XV, 1762 [adaptado]).</p>","A crítica de Rousseau à delegação do poder legislativo aos deputados representativos ancora-se no princípio de que",["os nobres da corte possuem sabedoria superior e devem deter o monopólio hereditário de todas as leis.","a sociedade civil deve abolir qualquer tipo de lei para viver em anarquia sem assembleias públicas.","a soberania popular é inalienável e a liberdade autêntica exige a participação direta dos cidadãos na deliberação das leis que os regem.","os generais das forças armadas devem assumir o controle dos tribunais e governar por meio de decretos secretos.","o direito ao voto deve ser concedido unicamente aos indivíduos que comprovarem grande acúmulo de ouro e terras."],2,"Resolução comentada:<br>• Correta: C. Rousseau sustenta que a soberania é a expressão viva da vontade geral do povo; portanto, ela não pode ser transferida ou delegada a uma casta de parlamentares profissionais. Ao entregar a soberania a deputados, o povo perde a sua autonomia e escraviza-se a interesses particulares corporativos. A verdadeira liberdade democrática reside na cidadania ativa de votar e decidir diretamente sobre as leis de sua república.<br>• Incorreta A: Rousseau combate veementemente a nobreza e defende a igualdade radical entre todos os cidadãos.<br>• Incorreta B: A liberdade para Rousseau só existe dentro do império da lei democrática legítima, e não na ausência anárquica de regras.<br>• Incorreta D: O controle militar é a essência do despotismo tirânico rechaçado pelo filósofo genebrino.<br>• Incorreta E: Rousseau era frontalmente contrário ao voto censitário fundado na riqueza monetária."],"Immanuel Kant: O Esclarecimento e o Dever Moral":["Immanuel Kant (1724–1804), um dos maiores pensadores de todos os tempos, sintetizou o projeto crítico da modernidade iluminista articulando a razão pura (epistemologia), a razão prática (ética do imperativo categórico) e o juízo teleológico (estética e história). Em seu opúsculo político <i>À Paz Perpétua</i> (1795), Kant desenhou o primeiro projeto filosófico contemporâneo de uma ordem internacional pacífica baseada no direito cosmopolita e em uma Liga das Nações (federação de repúblicas livres). Para Kant, a paz genuína não é a mera trégua temporária entre guerras, mas uma exigência moral incondicional da razão prática pura: a guerra destrói a dignidade dos seres humanos ao utilizá-los como instrumentos de abate e dominação. O progresso da história caminha para a constituição republicana mundial.",["Projeto da Paz Perpétua (1795): criação de uma federação cosmopolita de Estados republicanos livres (antecedente da ONU)","Direito Cosmopolita: princípio da hospitalidade universal (direito de um estrangeiro de não ser tratado como inimigo ao chegar)","Constituição Republicana: separação de poderes, liberdade legal, igualdade dos súditos e dependência das leis à vontade cívica","A dignidade como valor supremo: seres humanos têm dignidade (valor intrínseco sagrado), e coisas têm preço (valor de troca)","Ação moral por dever puro: o imperativo categórico como lei universal inviolável da razão prática autônoma"],"Guarde para o ENEM: a 'Paz Perpétua' de Kant é a mãe intelectual da Liga das Nações e da Organização das Nações Unidas (ONU). A paz universal não é utopia romântica para Kant, mas um dever jurídico e moral exigido pela razão.","<p>'A paz perpétua não é um estado de natureza; o estado de paz entre homens que vivem juntos precisa ser instaurado; pois a abstenção de hostilidades ainda não é uma garantia de paz. O primeiro artigo definitivo para a paz perpétua é: a constituição civil em cada Estado deve ser republicana, fundada na liberdade dos membros de uma sociedade, na dependência de todos a uma legislação comum e na igualdade de todos como cidadãos.' (KANT, I. <i>À Paz Perpétua</i>, 1795 [adaptado]).</p>","No projeto político kantiano para a instauração de uma paz duradoura entre as nações, a condição indispensável reside",["na submissão forçada de todas as nações do planeta ao governo tirânico de um único império militar absolutista.","na exigência de que todos os países adotem a mesma língua e religião oficial sob tutela do clero ocidental.","na aniquilação completa de tratados jurídicos internacionais em benefício de guerras de pilhagem perpétuas.","na adoção do republicanismo constitucional, na garantia dos direitos humanos e na união cosmopolita entre Estados soberanos livres.","na proibição do comércio e do intercâmbio cultural pacífico entre povos de continentes distintos."],3,"Resolução comentada:<br>• Correta: D. Kant propõe uma federação de repúblicas livres (Foedus Pacificum): para que a paz perpétua reine no mundo, é imperativo que os Estados adotem regimes republicanos constitucionais (onde os próprios cidadãos decidem sobre a guerra, evitando o arbítrio de reis déspotas) e celebrem um tratado cosmopolita de respeito mútuo, hospitalidade universal e resolução jurídica pacífica de litígios internacionais.<br>• Incorreta A: A monarquia universal imperialista foi explicitamente rejeitada por Kant por ser uma tirania sem alma.<br>• Incorreta C: A paz kantiana exige a institucionalização do Direito Internacional, e não a barbárie das invasões.<br>• Incorreta B: O projeto respeita a pluralidade cultural e religiosa dos povos sob o direito civil republicano.<br>• Incorreta E: O comércio internacional pacífico e o direito de hospitalidade cosmopolita são valorizados por Kant como vetores de aproximação entre as nações."],"G. W. F. Hegel: O Espírito Absoluto e a Dialética Histórica":["Georg Wilhelm Friedrich Hegel (1770–1831) foi o grande arquiteto do Idealismo Alemão. Para Hegel, a realidade não é um conjunto de substâncias estáticas ou finitas, mas um processo vivo e dinâmico de contínua evolução racional: o Espírito (<i>Geist</i>) manifestando-se na história. Sua lógica opera através da Dialética: Tese (afirmação originária), Antítese (negação e contradição interior) e Síntese (<i>Aufhebung</i> — superação que ao mesmo tempo nega, conserva e eleva a um patamar superior). A célebre sentença de Hegel: 'O que é racional é real; e o que é real é racional' expressa a convicção de que a história universal humana não é um amontoado caótico de acidentes sangrentos, mas o árduo e progressivo desdobramento da Consciência da Liberdade através das épocas.",["Idealismo Absoluto: a realidade é o desenvolvimento histórico e dialético da Razão ou Espírito (Geist)","Movimento Dialético: Tese (afirmação), Antítese (conflito e negação) e Síntese (Aufhebung: superação que preserva o essencial)","'Tudo o que é racional é real, e tudo o que é real é racional': a história como processo compreensível e ordenado pela razão","A Astúcia da Razão (List der Vernunft): a história usa as paixões e ambições individuais dos grandes heróis (como César ou Napoleão) para realizar seus fins universais","O Estado Ético: o ápice da liberdade objetiva na <i>Filosofia do Direito</i>, reconciliando o indivíduo e a coletividade"],"Guarde o conceito de Aufhebung para o ENEM: na dialética hegeliana, superar uma contradição NÃO significa destruir o passado, mas incorporar o que ele tinha de bom em um estágio mais maduro e livre da história humana.","<p>'A história universal é o progresso na consciência da liberdade — um progresso que devemos reconhecer em sua necessidade. Os povos orientais sabiam apenas que um só é livre (o déspota); o mundo greco-romano sabia que alguns são livres (os cidadãos livres versus os escravos); nós sabemos que todos os homens, enquanto homens, são em si e para si livres.' (HEGEL, G. W. F. <i>Lições sobre a Filosofia da História Universal</i>, 1837 [adaptado]).</p>","De acordo com a filosofia hegeliana da história, o sentido último das transformações históricas e das contradições civilizatórias é",["o retorno cíclico e cego a uma idade de ouro pagã primitiva onde a tecnologia inexistia.","a comprovação matemática de que as instituições sociais são incapazes de sofrer qualquer evolução ao longo do tempo.","a vitória perpétua da barbárie e a aniquilação definitiva da razão filosófica pelo caos cósmico aleatório.","a subordinação eterna de todos os povos do planeta a dinastias hereditárias com poderes despóticos.","o progresso contínuo e dialético da humanidade em direção à plena realização e consciência da liberdade universal."],4,"Resolução comentada:<br>• Correta: E. Hegel define a história universal como a epopeia dialética da liberdade: através dos conflitos, contradições e superações históricas, o Espírito da humanidade avança progressivamente de um estágio em que apenas um era livre (o déspota oriental), passando pelo estágio em que alguns eram livres (as democracias escravistas clássicas), até alcançar o reconhecimento universal moderno de que todo ser humano, por ser racional, é livre por direito inalienável.<br>• Incorreta A: A dialética hegeliana é teleológica e progressiva, recusando a teoria do eterno retorno cíclico arcaico.<br>• Incorreta C: A razão hegeliana triunfa sobre o caos através da astúcia da razão, dando sentido inteligível à história.<br>• Incorreta D: O despotismo é superado historicamente pelo Estado constitucional moderno.<br>• Incorreta B: Para Hegel, a sociedade e as instituições políticas transformam-se dialeticamente através das eras."],"Arthur Schopenhauer: O Mundo como Vontade e Representação":["Principal adversário do racionalismo otimista de Hegel, Arthur Schopenhauer (1788–1860) formulou uma das filosofias mais contundentes do século XIX em <i>O Mundo como Vontade e Representação</i> (1819). Para Schopenhauer, o mundo tem duas faces: como Representação, é o fenômeno ordenado pelo espaço, tempo e causalidade no intelecto humano; contudo, a essência íntima da coisa-em-si (que Kant julgava incognoscível) é a Vontade (<i>Wille</i>) — uma força cega, irracional, infinita, inconsciente e insaciável que se manifesta em todos os seres vivos como 'vontade de viver'. Como o desejo nasce da falta e da carência, o ser humano é condenado ao sofrimento: se deseja, sofre por não ter; se alcança o objeto desejado, cai imediatamente no tédio. A vida oscila como um pêndulo entre o sofrimento e o tédio. A libertação passageira ocorre na Contemplação Estética (arte e música); a emancipação duradoura ocorre na Compaixão moral e no Ascetismo.",["O Mundo como Representação: a realidade exterior como fenômeno cognitivo construído pelo intelecto do observador","O Mundo como Vontade: a força cega, cósmica, irracional e insaciável que move a natureza e todos os desejos humanos","O Pêndulo da Existência: a vida humana oscilando perpetuamente entre a dor da carência insatisfeita e o vazio do tédio","Redenção Estética: a contemplação desinteressada da arte e da música pura como suspensão temporária da Vontade","Ética da Compaixão (Mitleid): romper com o egoísmo ao reconhecer que o sofrimento do outro é o mesmo sofrimento que habita em mim"],"No ENEM: Schopenhauer é o mestre do pessimismo filosófico que inspirou Machado de Assis (em Memórias Póstumas de Brás Cubas) e Friedrich Nietzsche. A compaixão schopenhaueriana nasce da percepção de que todos os seres vivos sofrem sob a mesma Vontade cega.","<p>'Toda vontade brota de uma carência, de uma privação, portanto de um sofrimento. A satisfação põe fim ao sofrimento; todavia, para um desejo satisfeito, restam pelo menos dez insatisfeitos. O desejo satisfeito logo cede lugar a um novo desejo: a carência é duradoura, a satisfação é breve. A vida oscila, portanto, como um pêndulo, da direita para a esquerda, entre o sofrimento e o tédio.' (SCHOPENHAUER, A. <i>O Mundo como Vontade e Representação</i>, 1819 [adaptado]).</p>","Na visão metafísica e existencial de Arthur Schopenhauer, a raiz primordial do sofrimento humano reside",["na natureza insaciável e irracional da Vontade de viver, cujos desejos incessantes condenam o ser humano à dor e ao tédio.","na falta de investimentos das empresas privadas em linhas automatizadas de montagem automobilística.","na punição imposta por deuses olímpicos vingativos aos homens que comem carne de animais sagrados.","no excesso de contemplação poética e artística nas salas de aula das universidades modernas.","na obediência estrita dos cidadãos aos mandamentos dos reis absolutistas iluminados."],0,"Resolução comentada:<br>• Correta: A. Schopenhauer localiza a origem ontológica do sofrimento na Vontade cósmica irracional: desejar é experimentar a dor da carência; assim que o desejo é saciado, a satisfação desvanece e a alma cai no vazio sufocante do tédio até que um novo apetite a atormente. Esse ciclo ininterrupto transforma a existência em um pêndulo entre a aflição da falta e a apatia do tédio.<br>• Incorreta B: O avanço industrial material não redime o sofrimento metafísico da condição humana.<br>• Incorreta C: Schopenhauer é um pensador ateu e metafísico imanentista, sem apelo a mitologias olímpicas.<br>• Incorreta D: A contemplação estética da arte é considerada por Schopenhauer um dos raros momentos de alívio e redenção do tormento da Vontade.<br>• Incorreta E: O foco schopenhaueriano é existencial e ontológico, não uma disputa monárquica circunstancial."],"Karl Marx: Materialismo Histórico e Luta de Classes":["Karl Marx (1818–1883), junto com Friedrich Engels, revolucionou a teoria social ao formular o Materialismo Histórico e Dialético. Em <i>O Manifesto Comunista</i> (1848), lançou a tese basilar: 'A história de todas as sociedades até hoje existentes é a história das lutas de classes' (homens livres e escravos, patrícios e plebeus, barões e servos, burguesia e proletariado). Marx inverteu a dialética hegeliana: não são as ideias ou o Espírito que movem o mundo material, mas são as condições materiais e econômicas de produção (a Infraestrutura: forças produtivas e relações sociais de trabalho) que condicionam a Superestrutura jurídica, política, religiosa e ideológica da sociedade. No capitalismo, a extração da Mais-Valia (a parcela do trabalho não remunerada ao operário que é apropriada pelo capitalista) é o motor da exploração e da acumulação de capital.",["Materialismo Histórico: o modo de produção da vida material condiciona a evolução social, política e intelectual","Infraestrutura econômica (forças produtivas + relações de produção) e Superestrutura (Estado, leis, religião, ideologia)","Luta de Classes: o antagonismo inconciliável entre classes opressoras e oprimidas como motor das transformações históricas","Mais-Valia (Mehrwert): valor excedente produzido pela força de trabalho operária que não é pago no salário e fica com o patrão","Fetichismo e Reificação: a mercantilização das relações sociais em que pessoas são tratadas como coisas e coisas ganham vida mágica no mercado"],"Guarde o esquema marxiano para o ENEM: A base da sociedade é a economia (Infraestrutura). As leis, a política, as religiões e as ideias (Superestrutura) existem para legitimar e perpetuar o domínio da classe dona dos meios de produção.","<p>'Não é a consciência dos homens que determina o seu ser, mas, pelo contrário, o seu ser social que determina a sua consciência. Na produção social de sua existência, os homens entram em relações determinadas, necessárias, independentes de sua vontade, relações de produção que correspondem a um grau de desenvolvimento de suas forças produtivas materiais. A totalidade dessas relações constitui a estrutura econômica da sociedade, a base real sobre a qual se ergue uma superestrutura jurídica e política.' (MARX, K. <i>Prefácio à Contribuição à Crítica da Economia Política</i>, 1859 [adaptado]).</p>","A tese materialista histórica formulada por Karl Marx sustenta que a formação das ideias morais, jurídicas e políticas de uma época decorre",["de revelações divinas sobrenaturais concedidas diretamente pelas escrituras aos soberanos das nações.","das relações materiais de produção e das lutas de classe que constituem a infraestrutura econômica da sociedade concreta.","da inspiração desinteressada de poetas solitários que vivem em mosteiros medievais isolados.","da subordinação cega dos trabalhadores à vontade dos reis por força de instintos biológicos imutáveis.","do aperfeiçoamento pacífico das regras morais sem qualquer relação com a propriedade dos meios de produção."],1,"Resolução comentada:<br>• Correta: B. O cerne do materialismo histórico é a primazia da base material sobre as ideias: a moral, as leis, a filosofia e a política (superestrutura) não pairam no céu das abstrações puras, mas refletem e legitimam os interesses econômicos e a dominação das classes proprietárias dos meios de produção (infraestrutura). A consciência humana é conformada pelas relações sociais reais de trabalho em que ela vive e produz.<br>• Incorreta A: Marx é materialista e laico, combatendo explicações teológicas da sociedade.<br>• Incorreta C: A criação cultural é fruto de contextos históricos e materiais concretos de classe.<br>• Incorreta D: O marxismo rechaça o determinismo biológico imutável; as relações de submissão são construções sociais históricas que podem ser transformadas revolucionariamente.<br>• Incorreta E: As transformações sociais ocorrem por conflitos históricos e contradições de classe, e não por evolução moral pacífica abstrata."],"Friedrich Nietzsche: O Crítico da Moral Ocidental":["Friedrich Nietzsche construiu um método filosófico devastador conhecido como a Genealogia. Em <i>Para a Genealogia da Moral</i> (1887), investigou a história subterrânea e os impulsos psicológicos ocultos que forjaram os valores ocidentais. Nietzsche demonstrou que a moral tradicional hegemônica (judaico-cristã e platônica) é uma Moral de Escravos ou do Ressentimento: uma revolta psicológica dos fracos, doentes e medíocres contra a nobreza e a força afirmativa vital. Não podendo vencer os nobres na força corporal, os sacerdotes operaram uma inversão astuta de valores: transformaram a fraqueza em virtude ('mansidão', 'humildade', 'piedade'), o vigor físico e a paixão terrena em 'pecado' abominável, e a resignação covarde em promessa de recompensa celestial no além-túmulo. Contra essa decadência niilista que asfixia os instintos vitais, Nietzsche conclama à Transvaloração de todos os valores.",["Método Genealógico: investigação histórica e psicológica da origem dos conceitos de 'bom' e 'mau' versus 'bom' e 'ruim'","Moral dos Senhores (nobreza aristocrática): afirmação alegre da força, da saúde, do corpo, da grandeza e da coragem criadora","Moral dos Escravos (ressentimento): fruto da inveja e da fraqueza que santifica a renúncia, a culpa e a submissão humilde","Inversão dos valores: o triunfo histórico dos fracos que enfraqueceu os instintos vitais da civilização europeia","Transvaloração de todos os valores (Umwertung aller Werte): criação afirmativa de valores fiéis à terra e à vida corpórea presente"],"No ENEM: a crítica de Nietzsche à moral cristã é um dos tópicos mais frequentes. Ele não defende o mal ou a crueldade vulgar, mas ataca a santificação da fraqueza e o ódio ao corpo e à vida terrena presente.","<p>'A rebelião dos escravos na moral começa quando o próprio ressentimento se torna criador e gera valores: o ressentimento de seres aos quais a verdadeira reação, a do ato, é vedada e que só encontram compensação numa vingança imaginária. Enquanto toda moral nobre brota de um triunfante dizer-sim a si mesma, a moral dos escravos diz de saída 'não' a um 'fora', a um 'outro', a um 'não-eu': e este 'não' é o seu ato criador.' (NIETZSCHE, F. <i>Para a Genealogia da Moral</i>, Primeira Dissertação, 1887 [adaptado]).</p>","De acordo com a genealogia nietzschiana, a moral tradicional ocidental caracteriza-se",["pela afirmação triunfante das energias vitais, da saúde corporal e da alegria criadora dos fortes.","pela obediência matemática aos postulados de geometria analítica descobertos pelos cartesianos.","pelo ressentimento psicológico dos fracos que converteram a sua própria impotência e passividade em virtude moral venerada.","pela celebração irrestrita da guerra imperialista travada exclusivamente pelo lucro financeiro das indústrias bélicas.","pelo retorno à democracia da ágora grega governada pela autoridade incontestada dos reis filósofos."],2,"Resolução comentada:<br>• Correta: C. Nietzsche desmascara a moral de escravos: como os débeis e impotentes não tinham a força física dos nobres guerreiros para afirmar sua vida no mundo real, eles cultivaram o ressentimento (vingança psicológica íntima). Inverteram os valores: proclamaram que os fortes e felizes eram 'maus' e que os fracos, sofredores e submissos eram os 'bons' e 'eleitos de Deus', criando uma cultura da culpa que adoeceu a civilização ocidental.<br>• Incorreta A: A afirmação vigorosa do corpo e da vida é o atributo da moral dos senhores, e não da moral tradicional hegemônica criticada por Nietzsche.<br>• Incorreta B: A genealogia é histórica e fisiológico-psicológica, alheia à geometria cartesiana.<br>• Incorreta D: Nietzsche ataca o militarismo prussiano rasteiro e o nacionalismo tacanho de sua época.<br>• Incorreta E: O filósofo também critica Platão e Sócrates por terem iniciado o declínio da Grécia ao reprimirem a paixão dionisíaca."],"Jean-Paul Sartre: O Filósofo da Liberdade Absoluta":["Em <i>O Ser e o Nada</i> (1943), Jean-Paul Sartre constrói a ontologia fenomenológica do existencialismo francês. Sartre divide o real em duas modalidades ontológicas irredutíveis: o Em-si (<i>en-soi</i>: as coisas materiais opacas, fixas, densas, completas e sem consciência, como uma pedra) e o Para-si (<i>pour-soi</i>: a consciência humana, que é pura abertura, indeterminação, negação do dado e liberdade absoluta). Como o ser humano é uma consciência que 'nada é' de pré-determinado, ele se define continuamente pelos seus projetos futuros e atos concretos. Essa liberdade inescapável é fonte de Angústia. Quando o homem tenta justificar suas faltas alegando que 'não teve escolha', agindo como uma engrenagem automática (como o famoso exemplo sartreano do garçom de café que interpreta o papel mecânico de garçom), ele incorre em Má-Fé (<i>mauvaise foi</i>): mentir para si mesmo fingindo ser um objeto Em-si destituído de liberdade moral.",["Em-si (en-soi) vs Para-si (pour-soi): o mundo das coisas materiais inertes versus o mundo da consciência livre humana","A náusea existencial: a vertigem provocada pela descoberta da contingência pura e do absurdo gratuito das coisas materiais","Má-fé (mauvaise foi): atitude inautêntica de fingir não ser livre, abdicando da responsabilidade e culpando fatores externos","O Garçom de Café (exemplo célebre): indivíduo que mimetiza uma função mecânica para escapar da angústia da sua liberdade real","O olhar do Outro: 'O inferno são os outros' (a consciência que é julgada, objetificada e petrificada pelo olhar alheio)"],"Guarde para o ENEM: a Má-Fé em Sartre é mentir para si mesmo. Quem diz 'nasci assim, sou pavio curto e não posso mudar' ou 'eu só estava cumprindo ordens burocráticas' está em má-fé, pois nós sempre podemos escolher como reagir ao que fizeram de nós.","<p>'Examinemos este garçom de café. Seu gesto é vivo e firme, um tanto excessivo, um tanto rápido demais; ele se inclina com presteza exagerada, sua voz e seus olhos exprimem um interesse solícito demais pela ordem do cliente. Por que ele age assim? É que ele está brincando de ser garçom de café. O garçom de café brinca com sua condição para realizá-la. Ele tenta transformar sua liberdade em coisa, em objeto: eis a essência da má-fé.' (SARTRE, J.-P. <i>O Ser e o Nada</i>, 1943 [adaptado]).</p>","No exemplo sartreano do garçom de café, a atitude de 'má-fé' consiste na tentativa do indivíduo de",["rebelar-se violentamente contra a administração do estabelecimento para fechar as portas da cafeteria.","renunciar ao salário em dinheiro para receber pagamentos unicamente em alimentos perecíveis.","estudar ciências matemáticas exatas para se tornar um professor universitário respeitado.","fugir da angústia da sua liberdade real refugiando-se no papel mecânico de uma coisa e fingindo não ter escolhas.","adotar uma religião monástica contemplativa para jejuar no deserto por quarenta dias."],3,"Resolução comentada:<br>• Correta: D. A má-fé sartreana é a fuga inautêntica da liberdade: o indivíduo petrifica sua própria consciência (o Para-si) no molde rígido de um objeto fixo (o Em-si). Ao fingir que é 'apenas um garçom' ou 'apenas uma vítima do destino', o sujeito mente para si mesmo para escapar do peso da angústia e da imensa responsabilidade de tomar decisões autônomas sobre sua própria existência no mundo.<br>• Incorreta A: A atitude é de conformismo performático servil, e não de revolta política.<br>• Incorreta C: A busca profissional autêntica não caracteriza má-fé em si mesma.<br>• Incorreta B: A questão não diz respeito à forma de pagamento salarial, mas à postura ontológica existencial.<br>• Incorreta E: O monaquismo solitário não é o tema da análise sartreana da má-fé urbana."],"Simone de Beauvoir: A Filosofia da Emancipação Feminina":["Simone de Beauvoir (1908–1986), uma das mentes mais brilhantes do século XX, não apenas fundou o feminismo filosófico moderno com <i>O Segundo Sexo</i> (1949), mas também desenvolveu uma vigorosa teoria ética em <i>Por uma Moral da Ambiguidade</i> (1947). Beauvoir demonstra que a condição humana é fundamentalmente ambígua: somos ao mesmo tempo corpo finito sujeito às contingências materiais do mundo e consciência livre capaz de transcender a realidade por meio de nossos projetos. A autenticidade ética consiste em querer a própria liberdade e, de modo indissociável, querer a liberdade dos outros: 'Querer-se livre é também querer os outros livres'. Ao analisar a opressão das mulheres, Beauvoir expõe como a sociedade patriarcal aprisiona a mulher na imanência (rotinas corporais domésticas sem saída histórica), impedindo-a de alcançar a transcendência através da criação, do trabalho intelectual e da ação política soberana.",["Imanência vs Transcendência: confinamento da mulher à repetição biológica doméstica versus a conquista da liberdade por projetos criadores","A categoria do Outro: a mulher historicamente construída como alteridade secundária subordinada ao homem soberano","Por uma Moral da Ambiguidade: a liberdade humana só é autêntica quando luta pela emancipação de todas as liberdades oprimidas","Crítica ao casamento tradicional burguês: instituição que frequentemente reduzia a mulher a dependente financeira e dona de casa sem autonomia","Trabalho e independência econômica: condição material prévia indispensável para a mulher emancipar-se do jugo patriarcal"],"Guarde o par conceitual de Beauvoir para o ENEM: IMANÊNCIA (o confinamento da mulher às funções domésticas repetitivas e corporais) versus TRANSCENDÊNCIA (a liberdade de agir, criar, trabalhar e mudar a história na esfera pública).","<p>'O que define de maneira singular a situação da mulher é que, sendo, como todo ser humano, uma liberdade autônoma, ela se descobre e se escolhe num mundo onde os homens lhe impõem que se assuma como o Outro: pretendem fixá-la como objeto e devotá-la à imanência, uma vez que sua transcendência será perpetuamente transcendida por outra consciência essencial e soberana.' (BEAUVOIR, S. <i>O Segundo Sexo</i>, Introdução, 1949 [adaptado]).</p>","A análise formulada por Simone de Beauvoir sobre a condição histórica feminina denuncia que o patriarcado opera ao",["garantir que as mulheres assumam o comando exclusivo e hegemônico de todas as instituições jurídicas e estatais.","abolir a divisão sexual do trabalho em todas as corporações de ofício das cidades contemporâneas.","incentivar as jovens a abandonarem os deveres familiares para se dedicarem exclusivamente ao treinamento de guerras navais.","comprovar empiricamente que os cérebros masculino e feminino possuem capacidades intelectuais rigidamente desiguais.","confinar a mulher à condição passiva de objeto e à imanência doméstica, bloqueando o exercício de sua liberdade autônoma e transcendência."],4,"Resolução comentada:<br>• Correta: E. Simone de Beauvoir demonstra que a opressão patriarcal consiste em amputar a transcendência existencial da mulher: enquanto ao homem é reservado o papel de sujeito soberano que transforma o mundo, cria cultura e exerce a liberdade política na esfera pública, à mulher é imposto o papel passivo de 'o Outro', enclausurada na imanência das funções domésticas e reprodutivas. A emancipação exige que a mulher conquiste a sua transcendência através da autonomia econômica e cívica.<br>• Incorreta A: A dominação patriarcal concentrava o poder nas mãos dos homens, alijando as mulheres das magistraturas.<br>• Incorreta C: As mulheres eram tradicionalmente excluídas dos postos de comando militar.<br>• Incorreta D: Beauvoir refuta veementemente qualquer inferioridade biológica ou cognitiva feminina.<br>• Incorreta B: O patriarcado aprofunda e institucionaliza a divisão sexual do trabalho, e não a extingue."],"Hannah Arendt: A Defensora da Pluralidade e do Espaço Público":["Hannah Arendt resgatou o sentido autêntico da Política em obras monumentais como <i>A Condição Humana</i> (1958) e <i>Entre o Passado e o Futuro</i>. Para Arendt, 'a política baseia-se na pluralidade dos homens': homens, e não o Homem, vivem na Terra e habitam o mundo. Essa pluralidade tem o duplo caráter da igualdade (somos todos seres humanos capazes de nos compreender) e da distinção (cada indivíduo é absolutamente singular e irrepetível). A essência da política reside na Liberdade exercida na Esfera Pública através do discurso argumentativo e da deliberação pacífica entre iguais (o modelo da ágora grega). Arendt alerta contra a degeneração contemporânea que substituiu o debate da política autêntica pela mera 'administração econômica e burocrática dos recursos', reduzindo os cidadãos a meros consumidores passivos e solitários.",["Pluralidade: o pressuposto ontológico fundamental da vida política humana (igualdade de direitos e singularidade de vozes)","Esfera Pública: espaço iluminado e visível onde os cidadãos livres debatem o destino da comunidade pela palavra persuasiva","Natalidade (a capacidade de iniciar o novo): cada novo ser humano que nasce no mundo traz consigo o potencial de inaugurar começos inéditos","Poder vs Violência: o poder é fruto da ação em concerto de homens reunidos livremente; a violência é a imposição pela força bruta de armas","A perda do mundo comum: quando a esfera pública definha, os homens tornam-se massa isolada e atomizada, vulnerável ao autoritarismo"],"Guarde a distinção de ouro de Arendt para o ENEM: PODER ≠ VIOLÊNCIA. A violência usa porretes e armas e destrói a política; o PODER genuíno nasce quando cidadãos se reúnem na praça e agem em concerto através do debate democrático compartilhado.","<p>'A política baseia-se no fato da pluralidade dos homens. Deus criou o homem, mas os homens são um produto humano, terreno, o produto da própria política. A política trata da convivência e do convívio de diferentes, e a sua finalidade é a liberdade, que só se manifesta no espaço público compartilhado através da palavra e da ação conjunta.' (ARENDT, H. <i>O Que É Política?</i> [adaptado]).</p>","Na filosofia política de Hannah Arendt, o exercício autêntico da liberdade e da cidadania realiza-se",["na atuação e deliberação compartilhada entre sujeitos plurais e iguais na visibilidade da esfera pública.","na imposição violenta da censura prévia sobre qualquer pensamento divergente manifestado na sociedade.","no recolhimento solitário do indivíduo em seu quarto desinteressado das questões e leis da sua comunidade.","na subordinação inquestionável de todas as decisões legislativas a generais militares em estado de sítio.","na substituição das assembleias democráticas por softwares algorítmicos automatizados de gestão financeira."],0,"Resolução comentada:<br>• Correta: A. A política para Hannah Arendt só existe onde há pluralidade e visibilidade pública: ela não se confunde com o domínio violento ou a burocracia dos ministérios, mas floresce no espaço aberto onde cidadãos livres e diferentes encontram-se como iguais, trocam argumentos persuasivos e agem conjuntamente para moldar o destino de seu mundo compartilhado.<br>• Incorreta B: A violência e a censura sufocam e aniquilam o espaço da política autêntica.<br>• Incorreta C: O isolamento privado na solidão afasta o indivíduo da condição cívica e da liberdade política.<br>• Incorreta D: O governo de generais por decretos é a ditadura da violência, e não o poder político democrático concertado.<br>• Incorreta E: A política exige a sensibilidade, o discurso e o julgamento moral humano, irredutíveis a cálculos mecânicos de computadores."],"Michel Foucault: O Genealogista do Poder-Saber":["Michel Foucault (1926–1984) transformou a filosofia contemporânea ao analisar a relação indissociável entre Saber e Poder (o dispositivo do 'Poder-Saber'). Para Foucault, não existe verdade pura ou conhecimento científico desinteressado e neutro que pairaria acima dos conflitos históricos: todo regime de saber produz efeitos de poder, e todo exercício de poder suscita, organiza e legitima novos saberes e verdades institucionais (como a psiquiatria definindo a 'loucura', a criminologia definindo a 'periculosidade' e a medicina definindo a 'normalidade'). Em obras como <i>História da Loucura</i> (1961), <i>As Palavras e as Coisas</i> (1966) e <i>Vigiar e Punir</i> (1975), Foucault demonstrou como as instituições criam padrões normativos para excluir e enquadrar os corpos dissidentes. Contudo, Foucault ressalta com vigor: 'Onde há poder, há resistência'.",["Dispositivo do Poder-Saber: saber científico e relações de poder alimentam-se e reforçam-se mutuamente","Regimes de Verdade: as regras segundo as quais cada sociedade discrimina os enunciados que considera verdadeiros ou falsos","Construção da Loucura: a exclusão do 'louco' na modernidade como necessidade para fundar a razão burguesa produtiva","Normalização: mecanismo disciplinar que classifica os indivíduos em normais e anormais, corrigindo os desvios","Resistência permanente: o poder não é um bloco estático de ferro; onde ele opera, emergem focos de insubmissão e contracondutas"],"No ENEM: a frase 'Saber é poder' ganha em Foucault um sentido crítico: a ciência e os manuais médicos não são inocentes; foram historicamente usados pelo Estado para classificar, internar e vigiar quem não se encaixava na norma capitalista.","<p>'Não há relação de poder sem constituição correlata de um campo de saber, nem saber que não suponha e não constitua, ao mesmo tempo, relações de poder. O poder não se aplica aos indivíduos de cima para baixo como uma lei jurídica exterior; ele os atravessa, produz saberes e molda a própria subjetividade de quem se julga livre.' (FOUCAULT, M. <i>Vigiar e Punir</i>, 1975 [adaptado]).</p>","A tese foucaultiana sobre o entrelaçamento entre 'saber e poder' desconstrói a crença iluminista na neutralidade da ciência ao apontar que",["os conhecimentos científicos operam de forma desinteressada e sem nenhum impacto nas instituições disciplinares do Estado.","a produção de verdades científicas está historicamente articulada a mecanismos de controle, classificação e normatização dos indivíduos.","todas as pesquisas médicas foram desenvolvidas exclusivamente para satisfazer caprichos de deuses mitológicos pagãos.","as leis da física moderna provam que as relações sociais de trabalho são impossíveis de serem modificadas pelos homens.","os hospitais e prisões foram fundados por ordens anarquistas para abolir o Estado burguês."],1,"Resolução comentada:<br>• Correta: B. Foucault demonstra que o saber não é uma busca pura e desinteressada da verdade desvinculada do mundo real: os discursos científicos sobre o homem (psiquiatria, direito penal, pedagogia, medicina) nasceram atrelados a exigências históricas de controle social, servindo para vigiar, classificar, isolar e normalizar os corpos e condutas dos cidadãos para assegurar a ordem política e a produtividade econômica.<br>• Incorreta A: A ciência e as ciências humanas exerceram papel central na modelagem das prisões e hospitais.<br>• Incorreta C: Foucault analisa a modernidade secularizada e as instituições burguesas, sem conexão com mitos pagãos.<br>• Incorreta D: As relações de poder são históricas, contingentes e suscetíveis a resistências e transformações sociais.<br>• Incorreta E: As prisões e hospitais foram erguidos pelo próprio Estado moderno como instituições disciplinares de sequestro."],"Byung-Chul Han: O Diagnóstico do Cansaço Digital":["O filósofo contemporâneo Byung-Chul Han tem realizado diagnósticos implacáveis da vida no século XXI em ensaios como <i>No Enxame</i> (2013), <i>Psicopolítica</i> (2014) e <i>A Expulsão do Outro</i> (2016). Han analisa a transição do biopoder foucaultiano para a Psicopolítica Digital: o poder não precisa mais coagir os corpos físicos em celas; ele monitora as almas e emoções em tempo real através dos algoritmos, smartphones e do Big Data. O sujeito digital não é silenciado pela censura, mas estimulado a se expor e a comunicar compulsivamente ('hipercomunicação'). Han critica a transformação dos cidadãos em um 'Enxame Digital': indivíduos atomizados, conectados por telas, mas desprovidos de um 'Nós' coletivo e incapazes de ação política comum, dominados por 'ondas de indignação' efémeras nas redes sociais que se dissipam tão rápido quanto surgiram, sem alterar em nada as estruturas do poder econômico.",["Psicopolítica Digital: controle das mentes, afetos e desejos inconscientes através do rastreamento de dados em redes sociais","O Enxame Digital (No Enxame): indivíduos isolados que clicam e opinam diante de telas sem formar uma comunidade cívica coesa","Transparência compulsória: a exigência de postar, mostrar e expor a intimidade que elimina o mistério e a profundidade reflexiva","Crise da alteridade (A Expulsão do Outro): algoritmos que criam bolhas do idêntico, eliminando o confronto fecundo com a diferença","Hiperatenção vs Contemplação: a perda da capacidade de leitura profunda e de silêncio contemplativo engolida pela enxurrada de notificações"],"No ENEM contemporâneo: as teses de Byung-Chul Han são as mais cotadas para temas sobre saúde mental de jovens, redes sociais, bolhas algorítmicas e a ilusão de liberdade no ambiente digital.","<p>'O enxame digital não é uma massa porque não possui uma alma ou um espírito que o unifique. O enxame é composto de indivíduos isolados diante de suas telas luminosas. O homo digitalis manifesta-se frequentemente sob o anonimato e gera ondas de indignação barulhentas nas redes sociais; contudo, essas tempestades de indignação são incapazes de constituir um 'Nós' político duradouro que enfrente as estruturas de dominação da época.' (HAN, B.-C. <i>No Enxame: perspectivas do digital</i>, 2013 [adaptado]).</p>","De acordo com a reflexão de Byung-Chul Han sobre o 'enxame digital', o impacto das redes sociais na esfera pública caracteriza-se",["pela fundação de partidos políticos sólidos que erradicaram o individualismo e a desigualdade material.","pela extinção completa do uso de computadores e smartphones nas metrópoles industrializadas mundiais.","pela proliferação de protestos indignados voláteis e passageiros que não chegam a formar uma coesão coletiva duradoura para transformações estruturais.","pelo fortalecimento incondicional do silêncio contemplativo e da leitura profunda de clássicos gregos.","pelo retorno das assembleias presenciais da ágora como única via de deliberação legislativa democrática."],2,"Resolução comentada:<br>• Correta: C. Byung-Chul Han diagnostica a fragilidade política das redes sociais: embora a internet permita a explosão rápida de 'ondas de indignação' (shitstorms) e cancelamentos barulhentos, esse fenômeno não cria um povo ou um 'Nós' político sólido. Trata-se de um 'enxame' de indivíduos atomizados e hiperconectados que descarregam afetos passageiros sem construir projetos coletivos permanentes de transformação institucional.<br>• Incorreta A: O enxame digital acelera a fragmentação partidária e o isolamento individualista.<br>• Incorreta B: A sociedade atual é a mais hiperconectada tecnologicamente da história humana.<br>• Incorreta D: As notificações e o excesso de estímulos digitais destroem a concentração e o silêncio contemplativo.<br>• Incorreta E: O contato presencial comunitário e a ágora foram esvaziados pela mediação das telas dos smartphones."],"Baruch Spinoza: A Liberdade e a Geometria dos Afetos":["Baruch Spinoza (1632–1677) revolucionou a filosofia moderna ao redigir a <i>Ética</i> segundo o método geométrico (axiomas, proposições e demonstrações). Excomungado da sinagoga de Amsterdã por suas ideias heterodoxas, Spinoza sustentou que Deus não é um soberano transcendental que pune ou recompensa do alto do céu, mas a única e infinita Substância de tudo o que existe: <i>Deus sive Natura</i> (Deus ou a Natureza). O homem não é um império dentro de outro império com livre-arbítrio mágico; ele está sujeito às leis necessárias da natureza e é impulsionado pelo <i>conatus</i> (o esforço intrínseco de cada ser para perseverar em sua existência). A verdadeira liberdade não é o capricho irracional, mas a compreensão lúcida pela razão das causas que nos determinam, transformando paixões passivas tristes em afetos alegres ativos que aumentam nossa potência de agir.",["Deus sive Natura: a imanência ontológica de Deus identificada com a totalidade cósmica da Natureza","Conatus: o dinamismo intrínseco de autopreservação e expansão vital de cada indivíduo","Geometria dos afetos: estudo racional das emoções humanas (alegria, tristeza, medo, ódio) sem julgamento moralista","Potência de agir: a passagem da servidão passiva para a liberdade ativa por meio do conhecimento reflexivo","Pioneirismo democrático: defesa ardorosa da liberdade irrestrita de pensamento e de expressão civil"],"No ENEM, atente para a crítica spinozana às teologias do medo: governantes despóticos usam a superstição e o medo de punições divinas para transformar homens livres em escravos obedientes.","<p>'Os homens se enganam ao crerem que são livres; e essa opinião consiste apenas em que eles são conscientes de suas ações, mas ignorantes das causas pelas quais são determinados. O conceito que têm de liberdade é, pois, o de não conhecerem nenhuma causa para suas ações. Pois quando dizem que as ações humanas dependem da vontade, são palavras às quais não está ligada nenhuma ideia. [...] O conatus com o qual cada coisa se esforça para perseverar em seu ser nada mais é do que a essência atual da própria coisa.' (SPINOZA, Baruch. <i>Ética</i>, Parte II, Prop. 35 e Parte III, Prop. 7 [adaptado]).</p>","A concepção spinozana de liberdade contrapõe-se à noção de livre-arbítrio indeterminado ao definir o ato livre como aquele que",["resulta da obediência cega a mandamentos oraculares comunicados por profetas aos chefes de Estado.","depende da imposição militar compulsória de decretos que proíbam o exercício do pensamento independente.","fundamenta-se na busca impulsiva por prazeres efêmeros sem qualquer controle ou cálculo reflexivo dos danos futuros.","decorre da compreensão racional das causas determinantes e da expansão consciente da potência de agir do indivíduo.","expressa a total indiferença moral diante do sofrimento de membros vulneráveis da comunidade política."],3,"Resolução comentada:<br>• Correta: D. Para Spinoza, o homem só é verdadeiramente livre quando atinge o terceiro gênero de conhecimento: em vez de ser joguete de paixões cegas que diminuem sua potência (servidão humana), ele compreende racionalmente a ordem necessária da Natureza e age segundo as leis da sua própria razão luminosa.<br>• Incorreta A: A fé cega em profecias oraculares é classificada por Spinoza como superstição que alimenta o despotismo político.<br>• Incorreta C: A entrega desmedida a impulsos é a essência da fraqueza da alma (passividade perante os afetos externos).<br>• Incorreta B: O autor é um dos maiores defensores históricos da liberdade irrestrita de filosofar e pensar.<br>• Incorreta E: A ética de Spinoza valoriza a amizade racional, a generosidade e a cooperação mútua na pólis democrática."],"David Hume: O Hábito e os Limites da Razão Humana":["O filósofo escocês David Hume (1711–1776) conduziu o empirismo clássico ao seu ápice crítico em obras monumentais como o <i>Tratado da Natureza Humana</i> e as <i>Investigações sobre o Entendimento Humano</i>. Hume decompõe as percepções mentais em impressões (sensações vívidas e diretas dos sentidos) e ideias (cópias pálidas retidas na memória). Ao analisar o princípio da causalidade — alicerce de toda a ciência empírica e do raciocínio sobre fatos futuros —, Hume demonstra que jamais percebemos sensorialmente a 'conexão necessária' entre a causa e o efeito (como a primeira bola de bilhar atingindo a segunda). Nossa convicção inabalável de que o Sol nascerá amanhã ou de que o fogo queima não provém de uma demonstração lógica a priori da razão, mas do <i>hábito</i> ou <i>costume</i> psicológico gerado pela repetição constante de conjunções passadas.",["Impressões e Ideias: a primazia das sensações diretas corporais sobre as representações mentais derivadas","Crítica da Causalidade: a inexistência de percepção empírica de uma conexão causal necessária no mundo exterior","Hábito ou Costume: o mecanismo psicológico associativo que projeta regularidades passadas sobre o futuro incerto","Ceticismo mitigado: a razão humana não pode atingir certezas metafísicas absolutas sobre a substância do cosmos","Despertar kantiano: o ceticismo humeano provocou a formulação da Revolução Copernicana de Immanuel Kant"],"Hume no ENEM: sempre que o tema for método científico, causalidade ou crítica às certezas absolutas, o nome de Hume aparecerá! Lembre-se: 'hábito' é o grande guia da vida prática humana para Hume.","<p>'Quando olhamos para os objetos externos e con
