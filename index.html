e nas leis universais da lógica aristotélica clássica.","recorre à autoridade de cientistas premiados internacionalmente para fundamentar o julgamento da questão cívica."],1,"Resolução comentada:<br>• Correta: B. A falácia Ad Hominem (contra a pessoa) ocorre quando o debatedor desvia o foco do assunto substantivo (a proposta de coleta seletiva nas escolas) para agredir e desqualificar a figura moral, hábitos ou aparência pessoal do oponente. O fato de alguém ter multa de trânsito ou vestir-se de certo modo em nada anula a validade da tese ambiental.<br>• Incorreta A: Não houve apresentação de dados econômicos ou científicos, apenas difamação pessoal.<br>• Incorreta C: Não foram apresentadas estatísticas ou evidências empíricas sobre resíduos sólidos.<br>• Incorreta D: Trata-se de um sofisma informal desprovido de rigor lógico.<br>• Incorreta E: Não houve citação de cientistas; a alegação baseou-se em preconceito e ataque moral rasteiro."],"Ludwig Wittgenstein: Jogos de Linguagem e Limites":["O filósofo austríaco Ludwig Wittgenstein (1889–1951) foi a figura central da chamada 'Virada Linguística' (<i>Linguistic Turn</i>) da filosofia do século XX, dividindo seu pensamento em duas fases antagônicas e brilhantes. Na primeira fase, com o <i>Tractatus Logico-Philosophicus</i> (1921), defendeu a Teoria Pictórica da Linguagem: a proposição lógica é uma figuração ou espelho dos fatos do mundo; onde a linguagem não pode descrever fatos empíricos (como na ética, na metafísica e no místico), deve-se calar: 'Sobre aquilo de que não se pode falar, deve-se calar'. Na segunda fase, em <i>Investigações Filosóficas</i> (1953), Wittgenstein abandonou a rigidez lógica e formulou a noção de Jogos de Linguagem: o significado de uma palavra não é um objeto abstrato fixo, mas o seu Uso em contextos e 'Formas de Vida' compartilhadas pela comunidade. Os problemas filosóficos não passam de ilusões causadas quando 'a linguagem sai de férias'.",["Virada Linguística: o exame da linguagem como chave indispensável para resolver os enigmas da filosofia","Primeiro Wittgenstein (Tractatus): teoria pictórica (linguagem como espelho lógico do mundo dos fatos)","'Sobre o que não se pode falar, deve-se calar': demarcação entre a ciência dos fatos e os valores inefáveis","Segundo Wittgenstein (Investigações): Jogos de Linguagem (Sprachspiele) e Formas de Vida (Lebensformen)","Significado é uso: 'O significado de uma palavra é seu uso na linguagem'; superação da busca por essências metafísicas fixas"],"No ENEM: o Segundo Wittgenstein é o mais cobrado. Palavras não têm um significado sagrado congelado no dicionário cósmico: seu sentido depende das regras do 'jogo' em que são usadas (numa missa, numa quadra de basquete, numa conversa de amigos ou num laboratório).","<p>'O significado de uma palavra é o seu uso na linguagem. E chamar o falar de uma linguagem de parte de uma atividade ou de uma forma de vida: imagine a multiplicidade de jogos de linguagem por meio destes exemplos: dar ordens e obedecer-lhes; descrever um objeto segundo sua aparência; relatar um acontecimento; elaborar uma hipótese e testá-la; contar uma anedota; rezar. Os problemas filosóficos surgem quando a linguagem sai de férias.' (WITTGENSTEIN, L. <i>Investigações Filosóficas</i>, 1953 [adaptado]).</p>","A concepção de 'jogos de linguagem' formulada na maturidade filosófica de Wittgenstein sustenta que o sentido dos enunciados",["está congelado desde a criação divina em dicionários canônicos imunes a qualquer variação histórica.","deve ser purificado para que todas as línguas naturais sejam substituídas por códigos binários de computadores.","depende das regras pragmáticas e do uso compartilhado das palavras nas práticas concretas das formas de vida comunitárias.","é inteiramente privado e impossível de ser compreendido ou comunicado a qualquer outro ser humano.","limita-se a descrever os átomos e partículas materiais da física mecanicista newtoniana."],2,"Resolução comentada:<br>• Correta: C. Na segunda fase de Wittgenstein, o significado de uma palavra não decorre de uma essência metafísica secreta ou de uma correspondência unívoca com um objeto fixo, mas de sua aplicação prática dentro das regras de um 'jogo de linguagem' específico inserido em uma determinada 'forma de vida' sociocultural. As palavras ganham vida e função em contextos humanos plurais de ação compartilhada.<br>• Incorreta A: Wittgenstein rejeita a fixidez metafísica ou canônica dos dicionários estáticos.<br>• Incorreta D: Wittgenstein formula o célebre 'argumento contra a linguagem privada': a linguagem é necessariamente pública e social em suas regras.<br>• Incorreta B: O autor valoriza a riqueza das linguagens naturais cotidianas, recusando a obsessão por uma língua artificial pura.<br>• Incorreta E: Reduzir a linguagem à física dos fatos foi a tese de sua primeira fase (Tractatus), que ele próprio reformulou e superou nas <i>Investigações</i>."],"Princípios Fundamentais da Lógica: Identidade, Não-Contradição e Terceiro Excluído":["A lógica formal clássica, estruturada por Aristóteles no <i>Órganon</i> e na <i>Metafísica</i>, assenta-se sobre três axiomas supremos indispensáveis para qualquer pensamento coerente e inteligível: 1) Princípio da Identidade — toda coisa é idêntica a si mesma (A é A); 2) Princípio da Não-Contradição — uma proposição não pode ser simultaneamente verdadeira e falsa sob o mesmo aspecto e ao mesmo tempo [não é possível que (A é B) e (A não é B) ao mesmo tempo e sob a mesma relação]; 3) Princípio do Terceiro Excluído — toda proposição ou é verdadeira ou é falsa, não havendo uma terceira possibilidade intermediária (ou A é B ou A não é B). Sem esses três princípios, a linguagem humana desmorona no caos ininteligível, pois qualquer palavra poderia significar qualquer coisa ao mesmo tempo.",["Princípio da Identidade: A é A (garante a estabilidade semântica do conceito durante a dedução)","Princípio da Não-Contradição: o mais fundamental dos axiomas; veda afirmar e negar a mesma propriedade ao mesmo tempo","Princípio do Terceiro Excluído: bivalência lógica da proposição clássica (entre ser e não ser não há termo médio)","Axiomas autoevidentes: princípios que não precisam de demonstração porque toda tentativa de refutá-los já tem que usá-los","Condição da racionalidade: sem eles, o diálogo, a ciência e a justiça tornam-se impossíveis de serem formulados"],"No ENEM: o Princípio da Não-Contradição é o mais cobrado. Se alguém diz 'o réu estava no local do crime e não estava no local do crime no mesmo minuto', essa afirmação é logicamente impossível e nula pelo Princípio da Não-Contradição.","<p>'É impossível que a mesma coisa pertença e não pertença ao mesmo tempo à mesma coisa e sob o mesmo aspecto. Este é o mais firme de todos os princípios, em relação ao qual é impossível estar enganado. Pois é impossível para qualquer um crer que a mesma coisa seja e não seja ao mesmo tempo, como alguns pensam que Heráclito afirmava.' (ARISTÓTELES. <i>Metafísica</i>, Livro IV, 1005b [adaptado]).</p>","A observância do 'Princípio da Não-Contradição' formulado por Aristóteles é indispensável para a ciência e o debate público porque",["assegura a vitória obrigatória dos generais militares nos confrontos travados no campo de batalha.","demonstra que as leis da geometria dependem da temperatura medida nos termômetros da cidade.","obriga todas as nações a utilizarem a mesma moeda física nas transações comerciais internacionais.","constitui a garantia lógica basilar de que um mesmo enunciado não pode ser simultaneamente verdadeiro e falso sob as mesmas circunstâncias.","autoriza o uso de mentiras deliberadas em relatórios contábeis de empresas públicas."],3,"Resolução comentada:<br>• Correta: D. O Princípio da Não-Contradição é a pedra basilar de toda a lógica e epistemologia ocidentais: impede que um juízo afirme e negue simultaneamente o mesmo predicado de um sujeito sob o mesmo aspecto. Se admitíssemos que uma afirmação pode ser simultaneamente verdadeira e falsa ao mesmo tempo (como dizer que uma pessoa está viva e totalmente morta no mesmo instante e sentido), nenhuma frase teria sentido determinado e a ciência deixaria de ser possível.<br>• Incorreta A: A lógica formal rege a consistência do raciocínio discursivo, não o resultado de guerras de infantaria.<br>• Incorreta C: A moeda financeira é convenção econômica exterior às leis da dedução formal.<br>• Incorreta B: As verdades da geometria lógica independem de medições térmicas empíricas.<br>• Incorreta E: A mentira em relatórios é fraude ética e jurídica, frontalmente vedada pelo rigor lógico."],"Gottlob Frege: A Distinção entre Sentido e Referência":["O lógico e matemático alemão Gottlob Frege (1848–1925) inaugurou a Filosofia da Linguagem e a Lógica Simbólica moderna em seu célebre ensaio <i>Sobre o Sentido e a Referência</i> (1892). Frege deparou-se com o paradoxo da identidade: por que a frase 'a Estrela da Manhã é a Estrela da Manhã' é uma tautologia lógica vazia (A = A), mas a frase 'a Estrela da Manhã é a Estrela da Tarde' representa uma descoberta astronômica enriquecedora do saber empírico? A resposta está na separação entre Referência (<i>Bedeutung</i>) e Sentido (<i>Sinn</i>). A Referência é o objeto real factual do mundo ao qual a expressão se refere (o planeta Vênus); o Sentido é o 'modo de apresentação' (a maneira cognitiva e linguística como o objeto é dado à mente humana: brilhando de manhã ou de tarde). Duas expressões podem ter o mesmo referente material no mundo, mas sentidos completamente distintos.",["Referência (Bedeutung): o objeto real extramentais apontado pelo signo linguístico (o planeta Vênus concreto)","Sentido (Sinn): o modo pelo qual o objeto se apresenta à compreensão cognitiva e semântica humana","Estrela da Manhã e Estrela da Tarde: exemplo canônico de Frege demonstrando duas expressões com sentidos diferentes para o mesmo referente","O valor de verdade da frase: depende do sentido das partes e da correspondência do pensamento com o verdadeiro ou o falso","Fundação da Lógica Matemática moderna: Frege substituiu a relação sujeito-predicado pela relação função-argumento no cálculo proposicional"],"No ENEM: outro exemplo clássico de Frege: 'O autor de Dom Casmurro' e 'O fundador da Academia Brasileira de Letras' têm a mesma REFERÊNCIA (o homem de carne e osso Machado de Assis), mas têm SENTIDOS diferentes (um destaca sua obra de escritor, o outro sua ação institucional).","<p>'É evidente que 'a = a' e 'a = b' são proposições de valor cognitivo diverso: 'a = a' vale a priori e expressa mera identidade evidente; proposições da forma 'a = b', por sua vez, contêm amiúde as mais valiosas ampliações do nosso conhecimento histórico e astronômico. Se víssemos na identidade apenas uma relação entre os objetos referidos, 'a = b' não diria nada de novo. A diferença só pode residir na distinção entre o sentido da expressão e a sua referência.' (FREGE, G. <i>Sobre o Sentido e a Referência</i>, 1892 [adaptado]).</p>","A distinção lógica estabelecida por Gottlob Frege entre 'sentido' e 'referência' permite explicar",["a razão pela qual todos os idiomas do mundo possuem exatamente o mesmo vocabulário e a mesma gramática fonética.","a obrigação de que os dicionários contenham unicamente termos inventados pelos generais do império.","a impossibilidade definitiva da comunicação humana através de símbolos matemáticos ou geométricos.","o desaparecimento de todos os planetas do sistema solar durante os períodos de eclipse lunar.","como expressões linguísticas com modos cognitivos de apresentação distintos podem apontar para o mesmo objeto material no mundo real."],4,"Resolução comentada:<br>• Correta: E. A grande contribuição de Frege à semântica e à epistemologia foi desvencilhar o conteúdo conceitual do objeto empírico: uma coisa é o objeto exterior factual de que falamos (a Referência, como o planeta Vênus); outra coisa é a rota linguística e o modo de apresentação intelectual que usamos para pensar esse objeto (o Sentido, como 'a estrela da manhã' ou 'a estrela da tarde'). Essa distinção revolucionou a linguística e a inteligência artificial modernas.<br>• Incorreta A: Os idiomas possuem imensa diversidade sintática e semântica de sentidos.<br>• Incorreta C: Frege foi o pioneiro da moderna linguagem formal e da lógica matemática universal simbólica.<br>• Incorreta D: O exemplo astronômico é epistemológico e não altera a mecânica celeste dos planetas.<br>• Incorreta B: A linguística e a lógica analítica operam pela convenção e rigor público, alheias a imposições marciais."],"A Retórica e os Modos de Persuasão em Aristóteles (Ethos, Pathos e Logos)":["Em sua <i>Retórica</i>, Aristóteles resgatou a arte do discurso da condenação platônica que a considerava mera farsa sofística. Aristóteles definiu a Retórica como 'a faculdade de observar, em cada caso, os meios de persuasão disponíveis'. Para que um discurso político, jurídico ou cívico seja genuinamente eficaz e virtuoso perante a assembleia democrática, o orador deve articular de forma equilibrada as três Provas Técnicas fundamentais da persuasão: 1) <i>Ethos</i> — a credibilidade moral, a autoridade ética, a honestidade e a reputação do orador transmitidas em sua fala; 2) <i>Pathos</i> — a capacidade empática de suscitar paixões nobres, sentimentos de justiça e compaixão no auditório que escuta; 3) <i>Logos</i> — a solidez lógica dos argumentos, os fatos demonstrados, as evidências e os silogismos retóricos (entimemas).",["Ethos (autoridade moral): a virtude e o caráter inspirador demonstrados pelo orador através de sua postura e histórico","Pathos (comoção emocional): a afinação dos sentimentos e a conexão psicológica com a sensibilidade do auditório","Logos (rigor argumentativo): a verdade demonstrada por razões, dados factuais, coerência lógica e analogias sólidas","Entimema: o silogismo da retórica, que parte de premissas prováveis aceitas pelo público para gerar adesão racional","Ética do discurso: a boa retórica aristotélica busca a persuasão pelo bem comum da pólis, e não a demagogia mentirosa"],"No ENEM: a tríade aristotélica da persuasão é muito cobrada na prova de Linguagens e Ciências Humanas. Para um discurso convencer, não basta ter lógica (logos): é preciso que o orador passe confiança moral (ethos) e conecte-se com o coração do público (pathos).","<p>'Dos modos de persuasão fornecidos pelo próprio discurso, há três espécies: a primeira reside no caráter moral do orador (ethos); a segunda, na disposição em que se coloca o auditório ao escutar (pathos); a terceira, no próprio discurso, pelo que ele demonstra ou parece demonstrar por meio de argumentos verdadeiros e sólidos (logos).' (ARISTÓTELES. <i>Retórica</i>, Livro I, 1356a [adaptado]).</p>","Na teoria retórica de Aristóteles, a persuasão legítima em um debate democrático depende da articulação harmônica entre",["a autoridade moral e honestidade do orador (ethos), a conexão empática com as emoções do público (pathos) e o rigor lógico dos argumentos (logos).","a ameaça do uso de armas de fogo, a difamação de parentes do adversário e a falsificação de documentos judiciais.","a distribuição clandestina de moedas de ouro para subornar os votos dos magistrados antes do início da sessão.","o isolamento físico dos debatedores em celas escuras sem permissão para pronunciarem nenhuma palavra inteligível.","a proibição de que qualquer evidência empírica ou testemunho de fatos seja mencionado no tribunal."],0,"Resolução comentada:<br>• Correta: A. Aristóteles funda a oratória clássica democrática: a eficácia persuasiva de um discurso na pólis não se apoia na fraude ou na violência, mas na interação fecunda entre o caráter virtuoso e digno de confiança do orador (ethos), a sensibilidade para emocionar e conectar-se aos anseios da plateia (pathos) e a consistência factual e dedutiva dos argumentos apresentados (logos).<br>• Incorreta B: A violência, difamação e falsificação destroem o debate racional e configuram crimes contra a pólis.<br>• Incorreta C: O suborno mercantil é corrupção cívica abominada pela ética aristotélica.<br>• Incorreta D: A retórica é a arte da palavra falada em praça pública, e não o confinamento em masmorras mudas.<br>• Incorreta E: A apresentação de evidências materiais e provas testemunhais é parte basilar da oratória judiciária."],"Gottlob Frege e a Distinção entre Sentido e Referência":["Em seu célebre artigo de 1892, 'Sobre o Sentido e a Referência' (Über Sinn und Bedeutung), o matemático e filósofo alemão Gottlob Frege lançou as bases da moderna filosofia da linguagem e da lógica matemática. Frege enfrentou o enigma da identidade: por que a sentença 'a = a' (A Estrela da Manhã é a Estrela da Manhã) é uma verdade analítica trivial, enquanto 'a = b' (A Estrela da Manhã é a Estrela da Tarde) expressa um avanço empírico e astronômico real? Frege resolveu o problema distinguindo 'Referência' (Bedeutung — o objeto exterior do mundo ao qual o signo se refere, no caso, o planeta Vênus) de 'Sentido' (Sinn — o modo específico pelo qual esse objeto nos é dado ou apresentado na linguagem). Expressões com o mesmo referente podem ter sentidos radicalmente distintos.",["Referência (Bedeutung): o objeto concreto do mundo designado pela expressão linguística","Sentido (Sinn): o modo de apresentação cognitiva do objeto através do signo","Exemplo clássico: 'A Estrela da Manhã' e 'A Estrela da Tarde' têm o mesmo referente (o planeta Vênus), mas sentidos diferentes","Princípio da composicionalidade: o significado de uma sentença complexa depende do significado e sintaxe de suas partes"],"Essa distinção fregeana inaugura a virada linguística (Linguistic Turn) no Ocidente. No ENEM, ela aparece no cruzamento entre interpretação de textos, semântica filosófica e a desambiguação de enunciados.","\"É fácil compreender que a um signo (nome, combinação de palavras, letra) está ligado, além daquilo que ele designa, o qual pode ser chamado de a sua referência, aquilo que eu gostaria de chamar de o sentido do signo, no qual está contido o modo de apresentação do objeto. [...] A referência de 'Estrela da Manhã' e 'Estrela da Tarde' seria a mesma, a saber, o planeta Vênus, mas o sentido não seria o mesmo. A sentença 'a Estrela da Manhã é um corpo iluminado pelo Sol' tem um valor de conhecimento diferente da sentença 'a Estrela da Tarde é um corpo iluminado pelo Sol'.\" (FREGE, Gottlob. Sobre o Sentido e a Referência).","A diferenciação semântica estabelecida por Gottlob Frege soluciona o paradoxo das proposições de identidade ao demonstrar que duas expressões distintas que remetem a um mesmo objeto no mundo",["possuem significados absolutamente idênticos e intercambiáveis sem qualquer acréscimo de conteúdo cognitivo.","veiculam modos diversos de apreensão racional e apresentação mental desse objeto designado.","anulam mutuamente seu valor de verdade em virtude de contradições linguísticas irreconciliáveis.","constituem enunciados místicos incompreensíveis para a investigação científica e lógica formal.","devem ser banidas da escrita pública por violarem os princípios universais da gramática normativa."],1,"Resolução detalhada:\n• Correta: B. O 'sentido' (Sinn) é o caminho ou perspectiva cognitiva pela qual um objeto é apresentado à nossa mente: embora 'Estrela da Manhã' e 'Estrela da Tarde' refiram-se fisicamente ao mesmo planeta Vênus, elas trazem sentidos e modos de descoberta astronômica distintos, enriquecendo nosso conhecimento.\n• Incorreta A: Se fossem plenamente idênticas em sentido, a descoberta de sua equivalência não representaria novidade científica.\n• Incorreta C: Não há anulação de valor de verdade; a sentença de identidade é verdadeira e informativa.\n• Incorreta D: Frege é o pioneiro da lógica formal rigorosa e matemática, opondo-se ao misticismo obscuro.\n• Incorreta E: A linguagem natural e a científica dependem constitutivamente da riqueza dos sentidos semânticos."],"Falácias Informais da Relevância no Debate Público":["No campo da argumentação filosófica e da retórica, as falácias informais são raciocínios enganosos que parecem convincentes à primeira vista, mas que encerram erros de justificação ou desvios lógicos. Entre as mais frequentes no debate público contemporâneo e nas redes sociais destacam-se: 1) Argumentum ad Hominem (atacar o caráter, a origem ou o corpo da pessoa que argumenta em vez de refutar a validade de seus argumentos); 2) Falácia do Espantalho (distorcer, exagerar ou caricaturar a tese do adversário para torná-la ridícula e fácil de derrubar); 3) Argumentum ad Baculum (apelar para a ameaça de força e coerção para impor uma ideia); e 4) Apelo à Ignorância (ad ignorantiam — concluir que algo é verdadeiro simplesmente porque ainda não foi provado falso). O discernimento dessas armadilhas é imprescindível para o exercício da cidadania crítica.",["Ad Hominem: desqualificação do indivíduo interlocutor como subterfúgio para não debater a tese","Espantalho: deformação caricatural do argumento oponente para refutar uma versão falsa e fraca","Ad Ignorantiam: inferir verdade ou falsidade a partir da ausência temporária de provas científicas","Apelo à Autoridade (ad verecundiam) ilegítimo: citar celebridades ou especialistas fora de sua área de competência"],"O reconhecimento de falácias argumentativas é uma das habilidades mais exigidas na prova de Ciências Humanas e Linguagens do ENEM (Competência de Área 1 e Habilidades H1 a H4). Fique muito atento aos debates simulados nos textos da prova!","\"Em uma mesa-redonda sobre políticas de mobilidade urbana sustentável, o pesquisador apresentou dados estatísticos comprovando que a expansão de ciclovias integradas ao transporte coletivo reduz em 23% os congestionamentos e as emissões de carbono nos grandes centros urbanos. Em resposta, um opositor levantou-se e bradou: 'Vocês estão vendo? Esse debatedor quer proibir imediatamente todos os automóveis da nossa cidade, confiscar os carros das famílias trabalhadoras e obrigar médicos e idosos a andarem na chuva de bicicleta até o hospital!'\" (SIMULAÇÃO DE DEBATE PÚBLICO).","A intervenção do opositor apresentada na situação-problema configura um vício argumentativo clássico denominado falácia do espantalho porque o orador",["demonstra empiricamente a impossibilidade física de fabricação de bicicletas em larga escala industrial.","recorre a axiomas matemáticos incontestáveis da mecânica clássica para provar a inviabilidade da circulação urbana.","distorce e hiperboliza a proposta do debatedor com o intuito de combater uma versão caricata e facilmente refutável.","aceita plenamente as premissas ecológicas do interlocutor e busca aprofundar consensualmente as metas de sustentabilidade.","apresenta documentos comprobatórios de fraude contábil praticada pelo pesquisador responsável pelo estudo."],2,"Resolução detalhada:\n• Correta: C. A falácia do espantalho consiste precisamente em desfigurar a tese moderada do outro (que sugeriu ampliar ciclovias integradas) transformando-a em uma caricatura absurda e extremista (querer proibir todos os carros e confiscar bens) para facilitar o ataque retórico perante a plateia.\n• Incorreta A: O opositor não forneceu dados industriais reais sobre produção de bicicletas.\n• Incorreta B: Não houve emprego de axiomas físicos; houve retórica apelativa e distorção.\n• Incorreta D: O opositor adotou postura beligerante e falaciosa, recusando o consenso cooperativo.\n• Incorreta E: Não foram trazidos documentos jurídicos; o ataque baseou-se inteiramente em distorção conceitual deliberada."],"John Austin e a Teoria dos Atos de Fala":["Em seu livro de 1962, 'Como Fazer Coisas com Palavras' (How to Do Things with Words), o filósofo britânico John Langshaw Austin superou a visão tradicional da linguística que considerava a linguagem apenas como instrumento para descrever o mundo de forma verdadeira ou falsa (enunciados constativos). Austin descobriu que muitas de nossas falas não descrevem nada, mas realizam uma ação no próprio ato de serem pronunciadas: são os Enunciados Performativos (como 'eu vos declaro marido e mulher', 'eu prometo', 'batizo este navio'). Austin decompõe a fala em três atos simultâneos: 1) Ato Locucionário (a produção física dos sons e palavras com sentido gramatical); 2) Ato Ilocucionário (a força pragmática e intenção do ato: prometer, ordenar, jurar, advertir); e 3) Ato Perlocucionário (os efeitos psicológicos e comportamentais gerados no ouvinte: convencer, assustar, confortar).",["Enunciado Constativo: descreve fatos e está sujeito aos critérios de verdade ou falsidade (ex.: 'a porta está aberta')","Enunciado Performativo: não descreve, mas executa uma ação real sujeita a condições de sucesso/felicidade (ex.: 'eu aceito')","Ato Locucionário: o ato de dizer algo dotado de fonética, gramática e significado literal","Ato Ilocucionário e Perlocucionário: o que se faz ao dizer (força/intenção) versus os efeitos gerados sobre o ouvinte"],"A teoria pragmática de John Austin é famosíssima no ENEM! Lembre-se: dizer é fazer. A linguagem humana não é um espelho passivo da realidade, mas uma força de intervenção e transformação concreta das relações sociais.","\"Durante muito tempo, os filósofos presumiram que o único papel da linguagem era 'afirmar fatos', e que toda sentença deveria ser verdadeira ou falsa. Mas há um sem-número de sentenças que não são nem absurdas nem falsas, e que não se destinam a descrever nada. Quando digo diante do juiz 'sim, aceito' no casamento, ou quando digo 'aposto dez reais que vai chover', não estou relatando um fato prévio que existe fora de mim; ao pronunciar essas palavras em circunstâncias apropriadas, estou realizando o próprio casamento ou a própria aposta. Nesses casos, dizer é fazer algo.\" (AUSTIN, John L. Como Fazer Coisas com Palavras).","Ao identificar os enunciados performativos na vida social, a reflexão de John Austin subverte a epistemologia clássica da linguagem ao demonstrar que o ato de falar",["reduz-se à transmissão mecânica e neutra de ondas sonoras desprovidas de qualquer compromisso social.","deve ser submetido unicamente ao crivo da mentira ou verdade física demonstrável em laboratório químico.","inviabiliza qualquer tentativa de comunicação quando não expressa termos estritamente matemáticos e lógicos.","possui força pragmática capaz de criar obrigações institucionais e transformar a realidade das relações humanas.","serve com exclusividade para camuflar sentimentos biológicos e instintos de caça primordiais da espécie."],3,"Resolução detalhada:\n• Correta: D. Austin demonstra que falar não é apenas descrever passivamente coisas já existentes; a fala possui dimensão ilocucionária e performativa: ao prometer, jurar, perdoar ou decretar, criamos compromissos, laços jurídicos e fatos novos no mundo social.\n• Incorreta A: A teoria austiniana enfatiza o denso compromisso moral e institucional que acompanha as palavras.\n• Incorreta C: Austin debruça-se sobre a linguagem ordinária do cotidiano, rica e polifônica, e não fórmulas matemáticas fechadas.\n• Incorreta B: Os performativos não são nem verdadeiros nem falsos; são afortunados (bem-sucedidos) ou infelizes (quando falham).\n• Incorreta E: A linguagem humana funda a civilização, o direito e a ética, superando instintos biológicos brutos."],"Paul Grice e as Máximas do Princípio da Cooperação":["O filósofo da linguagem Paul Grice formulou em 1975 a influente Teoria da Implicatura Conversacional, apoiada no 'Princípio da Cooperação': 'Faça sua contribuição conversacional tal como é requerida pelo objetivo comum partilhado do diálogo'. Grice demonstrou que a comunicação humana funciona eficazmente porque os falantes pressupõem quatro grandes máximas conversacionais: 1) Máxima de Quantidade (forneça a quantidade adequada de informação: nem mais, nem menos do que o necessário); 2) Máxima de Qualidade (seja sincero: não afirme o que você acredita ser falso ou do qual não tem provas adequadas); 3) Máxima de Relação/Relevância (diga coisas pertinentes ao assunto em pauta); e 4) Máxima de Modo (seja claro, evite ambiguidades e ordene seu discurso com concisão). Quando alguém viola deliberadamente uma máxima à vista de todos, gera uma 'implicatura' (como a ironia, a metáfora ou a insinuação cortês).",["Princípio da Cooperação: o compromisso tácito de colaboração mútua que viabiliza a conversação humana","Quatro Máximas de Grice: Quantidade (dosagem), Qualidade (veracidade), Relação (pertinência) e Modo (clareza)","Implicatura conversacional: o significado implícito comunicado além daquilo que foi dito literalmente","Quebra aparente de máximas: o recurso estético e expressivo da ironia, do subentendido e do sarcasmo refinado"],"O ENEM utiliza o Princípio da Cooperação de Grice para explicar ironias, charges jornalísticas, tirinhas e mensagens em propagandas publicitárias onde o que não é dito explicitamente é o que realmente importa.","\"Em uma conversa cotidiana entre dois amigos, um pergunta: 'Onde está o Carlos? Não o vejo há dias'. O outro responde imediatamente: 'Há um carro amarelo estacionado em frente à casa da Maria'. À primeira vista, a resposta quebra a máxima da pertinência (relação direta). Contudo, pressupondo que o interlocutor é cooperativo, o ouvinte infere instantaneamente aquilo que não foi dito literalmente: Carlos tem um carro amarelo e, portanto, é provável que ele esteja na casa da Maria. Esse significado implícito, reconstruído pela cooperação dos participantes, é o que chamamos de implicatura conversacional.\" (GRICE, Paul. Lógica e Conversação).","A análise da pragmática linguística elaborada por Paul Grice evidencia que o sucesso do diálogo intersubjetivo depende da capacidade dos interlocutores de",["ignorar totalmente o contexto da conversa e apegar-se exclusivamente ao sentido rígido do dicionário formal.","acusar formalmente de perjúrio legal qualquer pessoa que cometa equívocos de concordância verbal ao falar.","reprimir a produção de qualquer metáfora, trocadilho ou figura de linguagem nas interações do dia a dia.","fornecer relatórios detalhados com centenas de páginas para responder a perguntas rotineiras simples.","reconhecer pressupostos cooperativos partilhados e inferir sentidos implícitos subjacentes às falas."],4,"Resolução detalhada:\n• Correta: E. Grice explica que a comunicação humana vai muito além da decodificação literal; os seres humanos são cooperativos e usam o contexto para deduzir implicaturas, permitindo que a fala seja concisa, sutil e rica em subentendidos inteligentes.\n• Incorreta A: O literalismo rígido e cego ao contexto arruinaria a maioria das conversas humanas reais.\n• Incorreta C: Metáforas e ironias são explicadas com precisão pelo modelo de quebra voluntária de máximas de Grice.\n• Incorreta D: Falar centenas de páginas em uma conversa simples viola a Máxima da Quantidade e de Modo.\n• Incorreta B: A cooperação pragmática tolera variações linguísticas e lapsos coloquiais sem formalismos policiais."],"Fundamentos da Bioética e Vulnerabilidade Humana":["A Bioética emergiu na década de 1970 (cunhada pelo oncologista Van Rensselaer Potter e sistematizada no Relatório Belmont e por Beauchamp e Childress) como uma 'ponte' necessária entre as ciências biológicas/médicas e a ética humanista. Seu surgimento decorreu dos abusos hediondos cometidos em experimentos humanos no século XX (como nos campos nazistas e no Estudo Tuskegee de sífilis nos EUA). A bioética principialista clássica apoia-se em quatro pilares fundamentais: Autonomia (respeito às decisões do paciente informado através do Consentimento Livre e Esclarecido); Beneficência (agir sempre visando ao bem e à saúde do paciente); Não Maleficência (o princípio hipocrático <i>primum non nocere</i>: antes de tudo, não causar dano intencional); e Justiça (distribuição equitativa e justa dos tratamentos e recursos escassos de saúde).",["Bioética: reflexão interdisciplinar sobre os limites éticos das intervenções nas ciências da vida e na saúde","Autonomia: dever de respeitar a autodeterminação, a dignidade e as escolhas morais do paciente","Consentimento Livre e Esclarecido: instrumento jurídico e ético inalienável prévio a qualquer intervenção médica","Beneficência e Não Maleficência: agir em prol do bem-estar do doente e abster-se terminantemente de causar-lhe dano deliberado","Justiça distributiva: equidade no acesso aos avanços médicos, protegendo grupos histórica e clinicamente vulneráveis"],"No ENEM: temas como doação de órgãos, pesquisas com células-tronco, testamento vital e manipulação genética são tratados pelo ângulo dos 4 princípios da bioética, com destaque para a autonomia e a não maleficência.","<p>'O princípio do respeito à autonomia exige que as escolhas autônomas de uma pessoa não sejam submetidas a forças que as controlem. Em medicina, isso se traduz no dever profissional de obter o consentimento livre e plenamente esclarecido do paciente antes de qualquer procedimento diagnóstico ou terapêutico, reconhecendo sua dignidade intrínseca de sujeito e não de mero objeto de pesquisa.' (BEAUCHAMP, T.; CHILDRESS, J. <i>Princípios de Ética Biomédica</i> [adaptado]).</p>","Na prática médica contemporânea orientada pela bioética principialista, a exigência do consentimento livre e esclarecido expressa",["a garantia da autonomia individual do paciente na tomada de decisões que afetam sua própria integridade física e valores morais.","a exclusão dos familiares e do próprio doente dos relatórios clínicos periódicos da equipe de enfermagem.","a autorização para que o Estado execute procedimentos invasivos obrigatórios com a finalidade de baratear custos.","o abandono de qualquer preocupação com a eficácia terapêutica dos fármacos aplicados.","o direito inquestionável do corpo hospitalar de realizar intervenções experimentais sem comunicar o enfermo."],0,"Resolução comentada:<br>• Correta: A. O Consentimento Livre e Esclarecido é a materialização do princípio da Autonomia em bioética: assegura que o indivíduo seja plenamente informado sobre riscos, benefícios e alternativas de um tratamento para que possa, com liberdade e lucidez, consentir ou recusar a intervenção, superando o antigo modelo paternalista autoritário da medicina.<br>• Incorreta E: A bioética proíbe categoricamente experimentos secretos sem o consentimento voluntário prévio do sujeito.<br>• Incorreta C: O Estado e as instituições não podem atropelar a dignidade física do indivíduo por motivos puramente orçamentários.<br>• Incorreta D: A busca da eficácia clínica (beneficência) permanece indispensável, caminhando junta com o consentimento ético.<br>• Incorreta B: O paciente e seus representantes têm direito ético e legal de acesso transparente a todas as informações de seu prontuário."],"Hans Jonas e o Princípio da Responsabilidade":["O filósofo alemão Hans Jonas (1903–1993) publicou em 1979 uma das mais proféticas obras da ética contemporânea: <i>O Princípio da Responsabilidade: ensaio de uma ética para a civilização tecnológica</i>. Jonas demonstra que todas as éticas tradicionais do passado (como as de Aristóteles e Kant) eram éticas da proximidade e do presente: regulavam as ações entre homens contemporâneos no aqui e agora. Contudo, a técnica moderna (energia nuclear, engenharia genética, biotecnologia, aquecimento global) adquiriu um poder de destruição cumulativo e irreversível em escala planetária, capaz de aniquilar as próprias condições da vida futura. Diante dessa ameaça existencial sem precedentes, Jonas reformula o imperativo kantiano para uma ética do futuro: 'Age de tal modo que os efeitos de tua ação sejam compatíveis com a permanência de uma vida autenticamente humana sobre a Terra'. Jonas introduz a 'heurística do temor': quando há risco de catástrofe global irreversível, deve-se dar primazia ao prognóstico desfavorável (princípio da precaução).",["Ética para a civilização tecnológica: superação das éticas tradicionais que ignoravam os impactos ecológicos a longo prazo","Novo Imperativo Ético: agir de modo a salvaguardar a existência e a dignidade das futuras gerações e da biosfera","Heurística do temor: cautela prudencial e imaginação das piores catástrofes para guiar decisões sobre tecnologias arriscadas","Princípio da Precaução: a ausência de certeza científica absoluta não deve ser desculpa para postergar medidas que impeçam danos irreversíveis","Dever ontológico para com a posteridade: a humanidade de hoje é a guardiã fiduciária da vida das gerações que ainda nem nasceram"],"Guarde para o ENEM: Hans Jonas é o autor do 'Princípio da Responsabilidade' e o filósofo das 'FUTURAS GERAÇÕES'. Toda questão que trata de pegada ecológica, sustentabilidade a longo prazo e limites éticos das novas tecnologias dialoga com o pensamento de Jonas.","<p>'Age de tal modo que os efeitos de tua ação sejam compatíveis com a permanência de uma autêntica vida humana sobre a Terra; ou, expresso negativamente: age de tal modo que os efeitos de tua ação não sejam destruidores da possibilidade futura de uma tal vida. Não ponhas em perigo a continuidade da humanidade na tua escolha presente.' (JONAS, H. <i>O Princípio da Responsabilidade</i>, 1979 [adaptado]).</p>","O imperativo ético formulado por Hans Jonas inaugura uma nova dimensão para a responsabilidade moral ao exigir que a humanidade",["priorize o lucro industrial imediato das mineradoras independentemente da poluição dos mananciais hídricos.","considere as consequências ecológicas globais de suas tecnologias para resguardar a sobrevivência digna das gerações futuras.","abandone imediatamente todas as vacinas e tratamentos médicos desenvolvidos pela ciência nos últimos dois séculos.","limite suas obrigações morais aos amigos e parentes mais próximos que vivem no tempo presente.","transfira o controle das decisões de política ambiental para robôs autônomos de inteligência artificial desprovidos de empatia."],1,"Resolução comentada:<br>• Correta: B. A grande virada de Hans Jonas é a ética intergeracional e ecológica: perante o poder destrutivo da técnica sobre o planeta, o dever ético contemporâneo não se esgota nas obrigações presentes entre nós, mas estende-se como compromisso vital com a biosfera e com as futuras gerações humanas, exigindo prudência, sustentabilidade e respeito à integridade da vida terrena.<br>• Incorreta A: A subordinação predatória do futuro ao lucro imediato é exatamente a irresponsabilidade denunciada por Jonas.<br>• Incorreta C: Jonas não prega o ludismo selvagem nem a destruição da medicina, mas a regulação ética humanista da técnica.<br>• Incorreta D: Essa era a limitação das éticas antigas superada por Jonas, que exige responsabilidade planetária temporal de longo alcance.<br>• Incorreta E: A responsabilidade é um atributo intransferível da consciência ética dos seres humanos, não de máquinas."],"Dilemas da Inteligência Artificial e Algoritmos":["O avanço vertiginoso da Inteligência Artificial (IA), do aprendizado de máquina (machine learning) e da tomada de decisão automatizada colocou a ética algorítmica no coração da filosofia contemporânea. Três problemas éticos fundamentais desafiam a sociedade digital: 1) O viés algorítmico e a discriminação automatizada — como os algoritmos são treinados com grandes volumes de dados históricos reais (big data), eles frequentemente reproduzem, amplificam e institucionalizam preconceitos raciais, de gênero e de classe preexistentes (como softwares de triagem de crédito ou reconhecimento facial falhos na identificação de pessoas negras); 2) O problema da 'caixa-preta' (<i>black box</i>) e da explicabilidade — a complexidade das redes neurais profundas muitas vezes impede que até os programadores expliquem a lógica exata que levou àquela decisão que afetou a vida de um cidadão; 3) A transferência da responsabilidade moral de decisões vitais (como carros autônomos ou armamentos letais) para sistemas desprovidos de consciência e empatia.",["Viés algorítmico: discriminações históricas humanas que são assimiladas, mascaradas e multiplicadas pelo treinamento de dados","Opacidade algorítmica (black box): falta de transparência e explicabilidade pública dos critérios que fundamentam decisões automatizadas","Vigilância de dados e privacidade: extração massiva e monetização das pegadas digitais dos usuários (capitalismo de vigilância)","Dilemas de programação moral: o dilema do bonde aplicado a veículos autônomos em situações de acidentes inevitáveis","Auditoria ética e regulação: exigência democrática de supervisão humana e responsabilização jurídica sobre sistemas inteligentes"],"No ENEM: a tecnologia e os algoritmos NÃO são 'neutros'! Eles foram codificados por seres humanos e treinados em sociedades reais desiguais. Exigir transparência algorítmica e combate ao racismo algorítmico são exigências dos direitos humanos na era digital.","<p>'Sistemas algorítmicos alimentados por big data são frequentemente apresentados pelo mercado como ferramentas neutras e objetivas de tomada de decisão. Contudo, como esses modelos são treinados com base em históricos humanos reais marcados por desigualdades estruturais, eles tendem a codificar, naturalizar e amplificar preconceitos sob uma falsa aura de precisão matemática imparcial.' (Adaptado de debates contemporâneos sobre Ética e Inteligência Artificial).</p>","A exigência de supervisão ética e de transparência na implementação de softwares de Inteligência Artificial justifica-se porque",["os sistemas algorítmicos operam com total neutralidade moral imune a influências da sociedade em que foram criados.","a inteligência computacional atingiu uma consciência espiritual plena com direitos civis superiores aos da população humana.","as decisões automatizadas podem reproduzir e aprofundar discriminações sociais preexistentes mascaradas sob uma falsa imparcialidade técnica.","todos os códigos de inteligência artificial foram concebidos exclusivamente para sabotar a economia agrícola dos países em desenvolvimento.","o uso de computadores na medicina moderna provou-se totalmente ineficaz para o diagnóstico de enfermidades."],2,"Resolução comentada:<br>• Correta: C. A filosofia da tecnologia desconstrói o mito da neutralidade matemática da IA: os dados de treinamento refletem as assimetrias históricas da sociedade (como o racismo institucional e o machismo). Se não houver regulação pública, auditoria algorítmica e vigilância ética humana, as máquinas automatizam e multiplicam a injustiça sob o manto ilusório da objetividade tecnológica.<br>• Incorreta A: Os sistemas não são neutros; espelham as escolhas de design e as bases de dados humanas com que foram alimentados.<br>• Incorreta B: A IA atual consiste em modelos probabilísticos e estatísticos de processamento, sem consciência moral ou espiritual.<br>• Incorreta D: As ferramentas possuem múltiplas aplicações civis e produtivas legítimas, não uma conspiração simplista contra a agricultura.<br>• Incorreta E: A IA apresenta avanços diagnósticos notáveis na medicina, demandando regulação bioética e não rejeição cega."],"Ética Ambiental e Crítica ao Antropocentrismo":["A crise climática global impôs a revisão profunda da visão antropocêntrica tradicional que regeu a modernidade ocidental desde Descartes e Francis Bacon. No Antropocentrismo radical, a natureza é concebida como um mero almoxarifado de recursos inertes, desprovidos de valor moral em si mesmos, cuja única razão de existir seria servir aos caprichos e lucros da espécie humana. Em contraposição, correntes contemporâneas da Ética Ambiental — como a Ecologia Profunda (Arne Naess), o Biocentrismo e o Ecocentrismo — defendem que todos os seres vivos e os ecossistemas da biosfera possuem Valor Intrínseco, independentemente de sua utilidade econômica para o homem. A Terra deixa de ser um objeto de exploração predatória para ser reconhecida como uma comunidade biótica integrada de interdependência sagrada.",["Antropocentrismo: o ser humano colocado no ápice do universo, encarando a natureza como mero meio ou recurso a ser explorado","Biocentrismo: a vida como valor moral supremo; todos os seres vivos merecem respeito e consideração ética","Ecocentrismo / Ecologia Profunda: a biosfera e os ecossistemas integrados possuem valor intrínseco sagrado (interdependência ecológica)","Justiça Climática: as populações mais vulneráveis e periféricas são as que menos poluem e as primeiras a sofrer as catástrofes do aquecimento global","Direitos da Natureza: reconhecimento jurídico de rios, florestas e animais como sujeitos de direitos constitucionais (como nas constituições equatoriana e boliviana)"],"No ENEM: a crítica ao antropocentrismo predatório aparece com frequência articulada a temas como aquecimento global, queimadas na Amazônia e saberes indígenas que enxergam a floresta como mãe e não como mercadoria descartável.","<p>'A ecologia profunda supera o antropocentrismo estrito ao reconhecer que todas as formas de vida na Terra têm valor intrínseco, independentemente de sua utilidade para fins estritamente humanos. A riqueza e a diversidade das formas vivas contribuem para a realização desses valores e são, elas mesmas, valores que demandam reverência e proteção ética de toda a comunidade planetária.' (NAESS, A. <i>Ecologia, Comunidade e Estilo de Vida</i> [adaptado]).</p>","A perspectiva da Ecologia Profunda confronta o paradigma antropocêntrico clássico ao sustentar que",["os recursos naturais devem ser explorados em ritmo acelerado para garantir o enriquecimento imediato de corporações poluidoras.","a conservação das florestas tropicais é um capricho estético sem qualquer relevância para o equilíbrio atmosférico da biosfera.","os ecossistemas planetários funcionam perfeitamente sem necessidade de água doce ou de camadas protetoras de gases.","a natureza e a pluralidade de seres vivos possuem dignidade e valor moral inerentes que transcendem o mero interesse utilitário da espécie humana.","a poluição atmosférica é um fenômeno fictício forjado por cientistas para desestabilizar as finanças dos países desenvolvidos."],3,"Resolução comentada:<br>• Correta: D. A Ecologia Profunda opera uma revolução ontológica e ética na relação entre humanidade e natureza: rompe com a soberba antropocêntrica cartesiana que reduzia a natureza a um reservatório inerte de matérias-primas e reconhece que os ecossistemas, rios, plantas e animais possuem valor intrínseco em si mesmos, impondo limites morais inegociáveis à expansão predatória humana.<br>• Incorreta A: Essa postura mercantil predatória é exatamente a causa da crise climática combatida pela ética ambiental.<br>• Incorreta B: A conservação dos biomas é vital para a regulação climática, regimes de chuvas e sustentação da vida na Terra.<br>• Incorreta C: Os ciclos biogeoquímicos e a água doce são a base insubstituível da biosfera.<br>• Incorreta E: O aquecimento global antrópico é um fato científico amplamente documentado pelo consenso climatológico mundial."],"Transumanismo, Biotecnologia e os Limites do Aperfeiçoamento Humano":["O Transumanismo (H+) e os avanços da engenharia genética (técnicas como CRISPR-Cas9, implantes neurais e inteligência artificial biológica) suscitaram um dos mais candentes debates da bioética contemporânea. O transumanismo defende o uso deliberado das tecnologias para superar as limitações biológicas da espécie humana: erradicar doenças genéticas, retardar o envelhecimento, potencializar capacidades cognitivas e alcançar a longevidade radical ou o pós-humano. Em contrapartida, filósofos como Jürgen Habermas (<i>O Futuro da Natureza Humana</i>) e Michael Sandel (<i>Contra a Perfeição</i>) alertam para graves riscos éticos: a transformação da gestação em 'design eugenista' de bebês sob encomenda; a destruição da igualdade moral entre gerações (os filhos programados geneticamente não serão livres em relação aos desejos dos pais); e o aprofundamento abissal das desigualdades de classe entre uma elite geneticamente aprimorada e massas biológicas vulneráveis.",["Transumanismo (H+): projeto de aprimoramento tecnológico das capacidades físicas, mentais e longevidade humanas","Terapia genética (curar doenças graves) vs Aperfeiçoamento eugênico (melhorar traços estéticos e cognitivos normais)","Habermas (<i>O Futuro da Natureza Humana</i>): a indisponibilidade da dotação genética como garantia da igualdade entre sujeitos livres","Michael Sandel: o risco da soberba e da perda da humildade diante do caráter de 'dádiva' da vida humana","Distopia eugenista: o perigo da criação de castas biológicas geneticamente segregadas e inacessíveis aos mais pobres"],"No ENEM: distinga bem TERAPIA (usar a genética para curar uma enfermidade dolorosa, aprovada pela bioética) de APERFEIÇOAMENTO EUGÊNICO (fabricar bebês sob encomenda com cor de olho e QI para quem puder pagar, gerando eugenia de mercado).","<p>'No momento em que a dotação genética de uma criança é programada pelas preferências e desejos de seus pais, que encomendam certos talentos em clínicas biotecnológicas privadas, a relação fundamental de igualdade simétrica entre as gerações é destruída. O indivíduo aprimorado deixa de ser o autor espontâneo de sua própria biografia moral para se tornar o produto planejado da vontade de outros.' (HABERMAS, J. <i>O Futuro da Natureza Humana</i>, 2001 [adaptado]).</p>","A crítica formulada por Jürgen Habermas ao projeto do aperfeiçoamento eugenista da engenharia genética fundamenta-se",["na defesa de que as doenças congênitas jamais devem ser tratadas por remédios fabricados em laboratórios modernos.","na comprovação científica de que o DNA humano não tem nenhuma influência na constituição física do organismo.","na proibição estrita de que cientistas utilizem microscópios e computadores nas pesquisas celulares.","na exigência de que todos os cidadãos sejam submetidos à castração química compulsória pelo Estado laico.","no alerta ético de que a programação genética deliberada de bebês destrói a igualdade originária entre as gerações e ameaça a autonomia moral do futuro indivíduo."],4,"Resolução comentada:<br>• Correta: E. Habermas demarca um limite ético crucial na biotecnologia: uma coisa é a terapia genética para curar doenças letais (intervenção com a qual o paciente presumivelmente concordaria); outra coisa é o melhoramento eugênico de design, onde os pais programam talentos e traços dos filhos. Isso quebra a igualdade entre as gerações: a criança nasce condicionada pelos caprichos de outrem, ameaçando o solo de autonomia moral indispensável à dignidade humana.<br>• Incorreta A: A terapia curativa de doenças é valorizada e incentivada pela bioética.<br>• Incorreta C: A pesquisa científica rigorosa é necessária, exigindo apenas regulação ética protetiva.<br>• Incorreta D: Habermas combate qualquer tipo de eugenia ou violência biológica estatal.<br>• Incorreta B: O DNA é comprovadamente a matriz genética fundamental dos seres vivos."],"Peter Singer e a Libertação Animal contra o Especismo":["Em 1975, o filósofo utilitarista australiano Peter Singer publicou a obra revolucionária <i>Libertação Animal</i>, considerada a certidão de nascimento da ética animal contemporânea. Singer cunhou o conceito de Especismo: a discriminação preconceituosa e imoral que favorece os interesses de membros da própria espécie (a humana) em detrimento dos interesses fundamentais de membros de outras espécies (os animais não humanos), operando com a mesma lógica injustificável do racismo e do machismo. Singer demonstra que o critério moral para ter direito à consideração ética não é a capacidade de falar grego, formular silogismos ou resolver integrais matemáticas (se fosse a inteligência, recém-nascidos e pessoas em coma não teriam direitos!), mas a Senciência — a capacidade de sentir dor física, medo e sofrimento. Condena a pecuária industrial intensiva e a crueldade dos testes laboratoriais de cosméticos.",["Especismo: preconceito que discrimina os animais apenas por pertencerem a outra espécie biológica","Senciência (sentience): capacidade biológica e neurológica de vivenciar sensações subjetivas de dor, agonia e prazer","Princípio da Igual Consideração de Interesses: a dor de um bezerro ou porco na granja industrial pesa moralmente tanto quanto a dor de um humano","Crítica à exploração animal: denúncia da tortura na indústria da carne, vivissecação de cosméticos e entretenimento cruel (touradas, rodeios)","Utilitarismo estendido: maximizar o bem-estar e minimizar a dor de todos os seres sencientes que compartilham o planeta"],"No ENEM: a célebre frase de Jeremy Bentham citada por Singer resolve qualquer questão: 'A questão não é: eles podem falar? ou eles podem raciocinar? Mas sim: ELES PODEM SOFRER?'. A capacidade de sofrer é o passaporte para a proteção ética.","<p>'Se um ser sofre, não pode haver justificativa moral para nos recusarmos a levar em consideração esse sofrimento. Não importa qual seja a natureza do ser, o princípio da igualdade exige que o sofrimento seja levado em conta em pé de igualdade com o sofrimento equivalente de qualquer outro ser. O racista viola esse princípio ao dar maior peso aos interesses de sua própria raça; o especista permite que os interesses de sua própria espécie prevaleçam sobre os interesses maiores de membros de outras espécies.' (SINGER, P. <i>Libertação Animal</i>, 1975 [adaptado]).</p>","A fundamentação ética proposta por Peter Singer para a concessão de consideração moral aos animais não humanos ancora-se",["na senciência dos animais, isto é, na capacidade biológica comprovada de sentirem dor física, medo e sofrimento.","na capacidade dos animais de escreverem textos constitucionais em código binário para computadores.","na utilidade financeira exclusiva que os rebanhos de gado oferecem aos grandes frigoríficos de exportação.","na adoração religiosa que civilizações do Egito antigo dedicavam a estátuas de felinos dourados.","na necessidade de extinguir todas as espécies carnívoras de animais da face da Terra para manter a paz das florestas."],0,"Resolução comentada:<br>• Correta: A. Peter Singer fundamenta o dever moral para com os animais na senciência: animais possuem sistema nervoso e experimentam dor, estresse e agonia de forma comprovada pela biologia. Discriminar um ser vivo e impor-lhe sofrimentos intoleráveis nas granjas industriais apenas porque ele não tem feições humanas é cometer a violência moral do especismo. A consideração moral exige minimizar o sofrimento de todos os sencientes do planeta.<br>• Incorreta B: A capacidade da linguagem verbal abstrata não é o pré-requisito da consideração moral segundo Singer.<br>• Incorreta C: Singer combate exatamente a redução dos animais a meras mercadorias lucrativas de abate.<br>• Incorreta D: O utilitarismo de Singer é uma ética laica baseada na senciência empírica, não em mitos egípcios.<br>• Incorreta E: Singer não prega a aniquilação de predadores, mas o fim da exploração e tortura institucionalizada promovida pelo ser humano."],"O Princípio Poluidor-Pagador e a Justiça Ambiental Global":["A Ética e o Direito Ambiental contemporâneos consolidaram o Princípio Poluidor-Pagador (PPP) e a agenda da Justiça Climática como respostas à crise de sustentabilidade da biosfera. O princípio estabelece que os custos financeiros e ecológicos da prevenção, mitigação e reparação dos danos ambientais devem ser suportados diretamente pelo agente (empresa ou Estado) que causou a degradação, proibindo a 'socialização dos prejuízos' (quando a corporação lucra com a atividade poluidora e deixa a contaminação dos rios e o tratamento das doenças respiratórias para o povo pagar com impostos públicos). Em escala global, isso se traduz no princípio das Responsabilidades Comuns, Porém Diferenciadas: os países ricos do Norte global (que poluem a atmosfera com gases de efeito estufa desde a Revolução Industrial) devem arcar com a maior parcela dos custos da transição ecológica para apoiar os países em desenvolvimento.",["Princípio Poluidor-Pagador (PPP): internalização dos custos socioambientais na cadeia econômica do agente poluidor","Justiça Ambiental: combate ao racismo ambiental e à destinação desproporcional de lixões e poluentes para bairros pobres e periferias","Responsabilidades Comuns, Porém Diferenciadas: reconhecimento da dívida ecológica histórica dos países desenvolvidos no aquecimento global","Internalização de externalidades negativas: o preço da mercadoria deve refletir o impacto real de sua produção no meio ambiente","Tragédia dos Comuns: a exaustão predatória dos recursos coletivos (ar, oceanos, florestas) quando agentes individuais buscam lucro egoísta sem limites éticos"],"No ENEM: Racismo Ambiental ocorre quando os lixões, indústrias químicas e áreas de inundação atingem majoritariamente bairros de negros, indígenas e pessoas pobres, enquanto os bairros nobres desfrutam de áreas verdes e ar puro.","<p>'O princípio poluidor-pagador visa evitar que o custo social da poluição seja transferido para a coletividade. Quem desenvolve uma atividade econômica que gera riscos ou danos aos ecossistemas tem o dever moral e jurídico de internalizar esses custos, investindo em tecnologias limpas e restaurando as áreas degradadas, garantindo que o direito fundamental ao meio ambiente ecologicamente equilibrado seja preservado para o conjunto da sociedade.' (Adaptado de comentários sobre o Direito Ambiental Brasileiro e o Princípio 16 da Declaração do Rio sobre Meio Ambiente).</p>","A aplicação do 'princípio poluidor-pagador' na gestão de políticas ambientais públicas visa",["autorizar corporações industriais a devastarem florestas nativas mediante o pagamento de propinas secretas a fiscais.","responsabilizar economicamente os agentes causadores de degradação ecológica pela recuperação dos danos, impedindo a socialização dos prejuízos ambientais.","isentar os grandes latifundiários e mineradoras de qualquer sanção em casos de rompimento de barragens de rejeitos.","fechar todas as empresas farmacêuticas do mundo para interromper a produção de medicamentos essenciais.","atribuir exclusivamente aos moradores de vilas ribeirinhas a responsabilidade pelo pagamento da dívida externa das nações."],1,"Resolução comentada:<br>• Correta: B. O Princípio Poluidor-Pagador é um instrumento central de justiça ambiental: obriga as empresas e corporações a arcarem com os custos da prevenção e da reparação ecológica das suas atividades lucrativas. Se uma mineradora contamina uma bacia hidrográfica ou uma fábrica emite fumaça tóxica, ela não pode repassar esse custo de saúde e limpeza para o Estado e os cidadãos; deve internalizar o impacto, indenizar as vítimas e recompor o bioma.<br>• Incorreta A: O princípio não é uma licença para poluir mediante suborno, mas um mecanismo de dissuasão e responsabilidade.<br>• Incorreta C: A responsabilidade ambiental no Brasil é objetiva e integral, vedando a isenção de mineradoras causadoras de desastres.<br>• Incorreta D: O objetivo é a transição para uma economia sustentável e limpa, e não o colapso da medicina.<br>• Incorreta E: As populações vulneráveis são vítimas e não poluidoras, exigindo proteção da justiça ambiental."],"Arne Næss e a Ecologia Profunda (Deep Ecology)":["Em 1973, o filósofo e alpinista norueguês Arne Næss cunhou a distinção seminal entre a 'Ecologia Rasa' (Shallow Ecology) e a 'Ecologia Profunda' (Deep Ecology). A ecologia rasa é antropocêntrica e utilitarista: busca combater a poluição e a exaustão de recursos naturais apenas na medida em que isso preserva a saúde, o conforto material e os padrões de crescimento econômico das populações humanas ricas. Por outro lado, a Ecologia Profunda é biocêntrica e ecocêntrica: sustenta que todos os seres vivos, rios, florestas e ecossistemas da biosfera possuem 'valor intrínseco e inerente' em si mesmos, independentemente de sua utilidade mercadológica para as vontades humanas. Næss defende a autorrealização de todas as formas de vida e uma redução radical do impacto predatório da civilização sobre a Terra.",["Ecologia Rasa: abordagem antropocêntrica que vê a natureza como estoque de recursos a ser administrado","Ecologia Profunda: abordagem biocêntrica e ecocêntrica que reconhece o valor moral intrínseco de todos os seres vivos","Igualitarismo biosférico: o ser humano é apenas uma espécie em meio à teia da vida, sem licença para tirania cósmica","Simplicidade voluntária: substituição do consumismo infinito pela busca de uma vida rica em propósitos e leve em pegada ambiental"],"A Ecologia Profunda cai muito no ENEM em questões que contrapõem o desenvolvimento sustentável tecnocrático (antropocêntrico) à preservação ecológica radical fundamentada na ética da terra e no respeito à biosfera.","\"O bem-estar e o florescimento da vida humana e não humana na Terra têm valor em si mesmos (sinônimos: valor intrínseco, valor inerente). Esses valores são independentes da utilidade do mundo não humano para os propósitos humanos. O florescimento da vida e das culturas humanas é compatível com uma diminuição substancial da população humana. O florescimento da vida não humana exige essa diminuição. Os humanos não têm o direito de reduzir a riqueza e a diversidade biológica, exceto para atender a necessidades vitais indispensáveis.\" (NÆSS, Arne; SESSIONS, George. Plataforma da Ecologia Profunda).","Ao fundamentar as teses da Ecologia Profunda em oposição à ecologia antropocêntrica convencional, Arne Næss propõe uma guinada paradigmática que se assenta no(a)",["estímulo à mineração irrestrita em áreas de preservação florestal para gerar divisas cambiais imediatas.","transformação dos oceanos e aquíferos em depósitos privados de lixo industrial e resíduos atômicos perigosos.","reconhecimento do valor moral intrínseco de todas as formas de vida na biosfera independentemente de sua utilidade humana.","concessão de licenças de caça esportiva de animais em extinção para atrair turistas de alta renda ao país.","erradicação de todas as populações tradicionais ribeirinhas que praticam pesca de subsistência secular."],2,"Resolução detalhada:\n• Correta: C. O núcleo filosófico da Ecologia Profunda é o biocentrismo: os seres vivos e a biosfera não existem meramente para satisfazer o apetite econômico da espécie humana; possuem dignidade e valor moral inerente próprio que devem ser respeitados.\n• Incorreta A: A devastação e a mineração predatória são a antítese radical do pensamento de Arne Næss.\n• Incorreta B: A proteção das águas e dos ecossistemas vitais é dever ético inegociável na ecologia profunda.\n• Incorreta D: A caça esportiva é um exemplo clássico de crueldade antropocêntrica rechaçada pela bioética ecocêntrica.\n• Incorreta E: Næss valoriza imensamente a sabedoria e a harmonia das comunidades tradicionais com seus biomas."],"Peter Singer e a Libertação Animal":["Com a publicação de 'Libertação Animal' (1975), o filósofo australiano Peter Singer revolucionou a ética contemporânea ao estender a consideração moral aos animais não humanos. Apoiando-se no utilitarismo clássico de Jeremy Bentham, Singer argumenta que o critério moral fundamental para um ser ter seus interesses respeitados não é a posse de razão discursiva, alma imortal ou linguagem verbal articulada, mas sim a 'senciência' — a capacidade biológica de sentir prazer e sofrimento físico e dor. Excluir os animais da consideração ética simplesmente por não pertencerem à espécie Homo sapiens constitui 'especismo' — uma forma injustificável de discriminação análoga ao racismo ou sexismo. Singer defende o vegetarianismo/veganismo ético e o fim do sofrimento infligido pela pecuária intensiva e testes industriais cruéis.",["Senciência: faculdade de experienciar sofrimento, estresse, dor e bem-estar como critério moral chave","Especismo: preconceito ou atitude de favorecimento dos interesses dos membros de uma espécie em detrimento de outras","Princípio da igual consideração de interesses: sofrimentos semelhantes devem ter o mesmo peso moral, seja de humano ou animal","Crítica à pecuária industrial: denúncia dos maus-tratos sistêmicos na criação confinada e no abate em larga escala"],"Peter Singer e a questão animal caem com muita regularidade no ENEM. A palavra-chave que você jamais pode esquecer é SENCIÊNCIA (capacidade de sentir dor). Lembre-se também da definição precisa de especismo!","\"A questão sobre como devemos tratar os animais não é: 'Eles pensam?' ou 'Eles falam?', mas sim: 'Eles sofrem?'. A capacidade de sofrer e de desfrutar das coisas é uma condição prévia para se ter quaisquer interesses, uma condição que tem de ser satisfeita antes de podermos sequer começar a falar de direitos ou respeito. Um cavalo ou um porco têm um interesse manifesto em não ser chicoteados ou confinados em gaiolas onde mal podem virar o corpo. O especista permite que os interesses de sua própria espécie prevaleçam sobre interesses maiores dos membros de outras espécies.\" (SINGER, Peter. Libertação Animal).","Ao combater o especismo institucionalizado na civilização moderna, Peter Singer adota um modelo bioético fundamentado no utilitarismo cuja premissa central é a",["obrigatoriedade de conceder título de eleitor e direito ao voto secreto a todas as aves migratórias do hemisfério.","defesa do confinamento industrial intensivo como metodologia exemplar de aprimoramento genético zootécnico.","afirmação da supremacia ontológica absoluta do homem sobre qualquer outro ser vivo do reino animal.","inclusão moral de todos os seres sencientes com base na capacidade compartilhada de experienciar dor e sofrimento.","subordinação das diretrizes de proteção à fauna aos lucros imediatos dos conglomerados de frigoríficos multinacionais."],3,"Resolução detalhada:\n• Correta: D. Para Peter Singer, a senciência (a capacidade de sofrer e sentir dor) é a linha demarcatória da consideração moral: se um ser sofre, não há nenhuma justificativa moral válida para ignorar o seu sofrimento por causa de sua espécie biológica.\n• Incorreta A: Singer fala de consideração moral de interesses (não sofrer), e não de direitos cívicos institucionais humanos como votar.\n• Incorreta C: A supremacia humana incondicional é precisamente o preconceito especista que a obra de Singer busca desconstruir.\n• Incorreta B: As fazendas industriais de confinamento intensivo são os alvos mais virulentos da crítica de Singer.\n• Incorreta E: O autor propõe o fim da submissão dos animais à exploração lucrativa impiedosa da indústria da carne."],"Transumanismo e o Debate Ético sobre Melhoramento Genético":["O avanço exponencial da biotecnologia, da engenharia genética (técnica CRISPR-Cas9) e dos implantes cibernéticos deu origem ao 'Transumanismo' — movimento filosófico que defende o uso proativo da ciência para transcender os limites biológicos humanos (eliminar doenças, estender a longevidade e aprimorar faculdades cognitivas). Contudo, pensadores contemporâneos como Michael Sandel ('Contra a Perfeição') e Jürgen Habermas ('O Futuro da Natureza Humana') soam o alarme ético contra o 'aprimoramento eugênico liberal'. Sandel adverte que o desejo desmedido de controle sobre a herança genética dos filhos destrói a atitude de acolhimento da vida como 'dádiva' (giftedness) e impõe expectativas asfixiantes. Além disso, a mercantilização do genoma ameaça aprofundar abismos sociais insuperáveis entre uma elite biologicamente 'aprimorada' e uma massa geneticamente desfavorecida.",["Transumanismo: proposta de superação biotecnológica das fragilidades e do envelhecimento da espécie humana","Michael Sandel: crítica à 'ética do domínio' e defesa da compreensão dos talentos humanos como dom/dádiva","Jürgen Habermas: o risco de comprometer a autonomia e a autocompreensão igualitária da pessoa geneticamente programada","Risco de Eugênia Liberal: aprofundamento das desigualdades econômicas convertidas em clivagens biológicas hereditárias"],"O debate entre terapia genética (curar doenças) versus melhoramento genético (fabricar 'super-humanos' ou escolher traços fenotípicos) é um dos temas de bioética mais quentes do ENEM contemporâneo.","\"Para apreciar as crianças como dádivas é preciso aceitá-las como elas vêm, não como objetos do nosso desenho ou como produtos da nossa vontade. O problema do melhoramento genético não é apenas que ele confere poder aos pais sobre o genoma dos filhos, mas a atitude mental de domínio arrogante sobre a natureza humana que ele expressa. Quando a procriação se converte em fabricação comercial de bebês sob medida, o amor incondicional dos pais é substituído pela cobrança de desempenho sobre uma mercadoria desenhada.\" (SANDEL, Michael. Contra a Perfeição: ética na era da engenharia genética).","A reflexão ética de Michael Sandel sobre as promessas da engenharia genética reprodutiva problematiza o transumanismo ao advertir que a busca desenfreada pela perfeição biológica",["assegura a extinção definitiva de qualquer sentimento de soberba ou arrogância nos lares familiares.","elimina qualquer possibilidade de discriminação econômica nos sistemas educacionais de ensino básico.","inviabiliza o tratamento hospitalar convencional de infecções bacterianas com penicilina e vacinas.","promove a distribuição gratuita e universal de alimentos enriquecidos a todas as crianças em estado de desnutrição.","ameaça transformar a relação afetiva de acolhimento incondicional em uma relação mercantil de domínio e fabricação técnica."],4,"Resolução detalhada:\n• Correta: E. Sandel argumenta que tratar a vida humana como projeto biotecnológico sob encomenda descaracteriza a paternidade e a ética da dádiva, transformando os filhos em produtos de consumo customizados e intensificando o controle tirânico sobre as gerações futuras.\n• Incorreta A: A obsessão pelo aperfeiçoamento alimenta a soberba e a pretensão de domínio absoluto.\n• Incorreta C: Sandel apoia plenamente o uso da genética para fins terapêuticos (curar patologias), contestando apenas o melhoramento eugênico.\n• Incorreta D: A biotecnologia reprodutiva corporativa não se confunde com políticas públicas de combate à fome.\n• Incorreta B: O melhoramento genético privado agravaria terrivelmente as desigualdades sociais e econômicas vigentes."],"Justiça Ambiental e a Crítica ao Racismo Ambiental":["Formulada inicialmente pelo sociólogo afro-americano Robert Bullard na década de 1980 e amplamente incorporada ao debate contemporâneo brasileiro, a teoria da 'Justiça Ambiental' denuncia que os ônus e desastres ecológicos não se distribuem de maneira homogênea ou neutra pela sociedade. O 'Racismo Ambiental' designa a imposição desproporcional de custos e danos ambientais (instalação de lixões químicos, aterros de rejeitos tóxicos de mineração, poluição industrial de águas, deslizamentos de encostas e enchentes) sobre comunidades historicamente vulnerabilizadas — populações negras, indígenas, quilombolas e moradores de favelas periféricas. A justiça ambiental exige que nenhum grupo social suporte sozinho a degradação gerada pelo modelo econômico predatório e reivindica participação decisória paritária na gestão dos territórios.",["Justiça Ambiental: princípio ético de distribuição equitativa dos riscos, custos e benefícios ecológicos","Racismo Ambiental: alocação sistemática e institucional de contaminação e riscos sanitários sobre populações negras e indígenas","Robert Bullard: 'pai da justiça ambiental', pioneiro na correlação entre segregação racial e poluição tóxica","Exemplos no Brasil: desastres de barragens de mineração (Mariana e Brumadinho), contaminação de rios indígenas e favelas em encostas"],"O conceito de 'Racismo Ambiental' caiu recentemente no ENEM e nos principais vestibulares do país. É um conceito fundamental na intersecção entre Ética, Direitos Humanos, Sociologia e Geografia Urbana.","\"O racismo ambiental não é um acidente geográfico; é o resultado sistemático de decisões políticas e econômicas institucionais que direcionam indústrias poluentes, depósitos de rejeitos perigosos e a ausência de saneamento básico para os bairros habitados por minorias raciais e populações de baixa renda. Enquanto as elites desfrutam de áreas verdes preservadas e serviços higiênicos de ponta, as comunidades periféricas arcam com a contaminação do ar, das águas e com o risco iminente de desastres climáticos, sendo excluídas das mesas de decisão onde se formulam as leis ambientais.\" (BULLARD, Robert. Dumping in Dixie: Race, Class, and Environmental Quality).","A perspectiva teórica da Justiça Ambiental rompe com os discursos ecológicos convencionais ao demonstrar que a crise climática e a degradação dos ecossistemas urbanos",["articulam-se intimamente às desigualdades de raça, classe e poder político na distribuição dos impactos nocivos da poluição.","afetam de maneira perfeitamente igualitária e neutra todas as classes sociais e etnias do planeta.","decorrem exclusivamente do aquecimento solar natural sem qualquer interferência de atividades industriais humanas.","são solucionadas de modo espontâneo pelo encerramento de todas as agências de regulação e fiscalização ambiental do país.","atingem unicamente os proprietários de iates e mansões de veraneio situadas em condomínios de luxo litorâneos."],0,"Resolução detalhada:\n• Correta: A. A Justiça Ambiental explicita o viés sociopolítico e racial da degradação ecológica: os grupos historicamente marginalizados (negros, indígenas, periféricos) são os que mais sofrem com a falta de saneamento, contaminações e tragédias climáticas, enquanto as elites colhem os lucros do modelo predatório.\n• Incorreta B: A crise ambiental é profundamente desigual; afirmar neutralidade é ocultar a injustiça ecológica.\n• Incorreta C: A ciência do IPCC comprova o caráter antropogênico e industrial do aquecimento global.\n• Incorreta D: Sem fiscalização estatal e participação popular, os poluidores aumentam a degradação sem freios.\n• Incorreta E: Pelo contrário, as elites econômicas possuem recursos para se proteger ou mudar de área, ao passo que os mais pobres ficam expostos ao perigo direto."],"Filosofia Africana e a Cosmovisão Ubuntu":["A crítica ao eurocentrismo filosófico resgata as tradições intelectuais e ontológicas africanas milenares, cujo eixo ético mais célebre é o princípio do Ubuntu (da família linguística banto, sintetizado no aforismo zulu: <i>'Umuntu ngumuntu ngabantu'</i> — 'Uma pessoa é uma pessoa através de outras pessoas'). Em oposição direta ao individualismo atomizado do <i>cogito</i> cartesiano ocidental ('penso, logo existo'), o Ubuntu proclama uma ontologia relacional e comunitária: 'eu sou porque nós somos'. A humanidade de um indivíduo não reside em uma substância racional isolada, mas na teia viva de solidariedade, cuidado mútuo, hospitalidade, ancestralidade e respeito comunitário. O crime ou a ofensa a um membro não demanda mera vingança punitivista, mas restauração da harmonia e reconciliação social.",["Ubuntu: ética e cosmovisão africana baseada na interdependência, hospitalidade e dignidade comunitária","'Eu sou porque nós somos': crítica radical ao individualismo solipsista cartesiano e liberal ocidental","Ontologia relacional: o ser humano só se constitui plenamente em comunhão e diálogo com o outro","Justiça restaurativa: resolução de conflitos focada na reintegração social e na cura dos laços comunitários","Ancestralidade: respeito à continuidade histórica entre os antepassados, os vivos e as gerações que virão"],"No ENEM: o Ubuntu contesta o modelo egoísta do 'homem econômico' ocidental. A solidariedade e a responsabilidade comunitária não são favores caridosos, mas a própria condição de existência de qualquer ser humano.","<p>'Uma pessoa que vive sob o espírito do Ubuntu é aberta e disponível para os outros, afirma os outros e não se sente ameaçada pelo fato de outros serem capazes e bons; pois ela tem a certeza de pertencer a uma totalidade maior, que se apequena e se fere quando outros são diminuídos ou humilhados, quando outros são torturados ou oprimidos.' (TUTU, D. <i>Não Há Futuro sem Perdão</i>, 1999 [adaptado]).</p>","A cosmovisão do Ubuntu desafia o paradigma individualista ocidental ao conceber a realização da condição humana como",["uma competição darwinista predatória na qual apenas os indivíduos mais ricos devem ter direito à subsistência.","um processo intrinsecamente comunitário e relacional de cuidado mútuo, empatia e corresponsabilidade com o bem-estar dos outros.","o acúmulo solitário de riquezas materiais em cofres blindados inacessíveis à sociedade civil.","a submissão passiva a governantes estrangeiros que impõem leis militares sem qualquer debate com a comunidade.","a negação dos vínculos familiares e o desprezo pela memória dos antepassados históricos de seu povo."],1,"Resolução comentada:<br>• Correta: B. A filosofia africana do Ubuntu funda uma antropologia relacional profunda: o indivíduo não se autorrealiza no isolamento egoísta do consumo ou da competição, mas descobre e expande sua própria humanidade na medida em que cuida, acolhe e fortalece a dignidade de seus semelhantes na comunidade ('eu sou porque nós somos'). A dor do outro é a dor de todos.<br>• Incorreta A: O Ubuntu é a antítese do darwinismo social predatório e da indiferença pelos fracos.<br>• Incorreta C: A avareza e o acúmulo egoísta contradizem frontalmente o valor da partilha comunitária do Ubuntu.<br>• Incorreta D: A tradição comunitária africana valoriza a deliberação coletiva sob a árvore comunal (a palavra compartilhada), e não a subserviência colonial.<br>• Incorreta E: A veneração da ancestralidade e da memória viva é um dos alicerces mais profundos das culturas africanas."],"Pensamento Indígena Brasileiro e o Bem Viver":["O pensamento indígena brasileiro — personificado na contemporaneidade por lideranças e intelectuais como Ailton Krenak (<i>Ideias para Adiar o Fim do Mundo</i>) e Davi Kopenawa (<i>A Queda do Céu</i>) — constitui uma das mais vigorosas reflexões ético-filosóficas do planeta. Os povos originários denunciam a ilusão ocidental de que o ser humano seria uma entidade separada da natureza, legitimada para explorá-la como mercadoria até o esgotamento. Krenak argumenta que a civilização capitalista transformou o planeta em um shopping center e a vida em uma mercadoria vazia. Para as cosmologias indígenas, os rios, as montanhas, as árvores e os animais são parentes sagrados dotados de alma e dignidade. A filosofia do Bem Viver (<i>Sumak Kawsay</i> / <i>Teko Porã</i>) propõe uma harmonia ativa e espiritual entre comunidade humana e a teia viva da Terra.",["Parentesco com a Terra: o rio, a montanha e a mata não são recursos ou matérias-primas, mas ancestrais vivos e parentes","Ailton Krenak: crítica à 'humanidade zumbi' que se alienou da terra e consome o mundo como se não houvesse amanhã","Davi Kopenawa: a ecologia dos xapiri (espíritos da floresta) e o alerta xamânico sobre a 'queda do céu' provocada pelo garimpo","Bem Viver (Teko Porã): bem-estar comunitário fundado na cooperação, frugalidade, respeito aos ciclos ecológicos e espiritualidade","Descolonização do pensamento: reconhecimento da filosofia e dos saberes dos povos originários com o mesmo rigor das academias"],"Guarde a mensagem de Krenak para o ENEM: 'O rio Doce não é uma fonte de recursos para mineradoras; ele é nosso avô (Watu)'. A floresta não é estoque de madeira: é um organismo cósmico vivo que sustenta o céu sobre nossas cabeças.","<p>'Fomos, durante muito tempo, embalados com a história de que somos a humanidade. E nos alienamos desse organismo de que somos parte, a Terra, e passamos a pensar que ele é uma coisa e nós, outra: a Terra e a humanidade. Não percebo onde tem alguma coisa que não seja natureza. Tudo é natureza. O cosmos é natureza. Tudo em que eu consigo pensar é natureza.' (KRENAK, A. <i>Ideias para Adiar o Fim do Mundo</i>, 2019 [adaptado]).</p>","A crítica formulada por Ailton Krenak desconstrói a racionalidade moderna ocidental ao apontar que a raiz da devastação ecológica reside",["no excesso de áreas de preservação ambiental demarcadas em terras indígenas cont
