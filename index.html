ndo uma catástrofe civilizatória: o colapso dos fundamentos metafísicos absolutos que sustentavam os valores morais e o sentido da vida no Ocidente. Com a queda desses pilares transcendentais, a humanidade mergulha no Niilismo: a ausência de sentido, onde os valores supremos se desvalorizam. Diante desse abismo, Nietzsche rejeita tanto o niilismo passivo (o desespero e o conformismo cínico do 'último homem') quanto conclama ao niilismo ativo: a transvaloração de todos os valores e a afirmação criadora da vida terrena.",["'Deus está morto': diagnóstico histórico do esvaziamento dos absolutos transcendentais e da metafísica","Niilismo: crise profunda de sentido provocada pela perda das garantias metafísicas e religiosas","O 'Último Homem': figura medíocre que busca apenas conforto mediano, entretenimento vazio e segurança sem riscos","Niilismo ativo: destruição dos valores decadentes para abrir espaço à criação autônoma de novos sentidos vitais","Genealogia da moral: investigação histórica que revela as origens psicológicas e sociais das noções de 'bem' e 'mal'"],"Pegadinha clássica do ENEM: Nietzsche NÃO celebra a morte de Deus com festa ateia! Ele alerta com pavor para o risco do niilismo passivo (a perda do sentido da vida). A morte de Deus é um desafio histórico para que o ser humano crie seus próprios valores com coragem.","<p>'O louco pulou para o meio deles e trespassou-os com o olhar. 'Para onde foi Deus?', gritou ele. 'Eu lhes direi! Nós o matamos — vocês e eu! Somos todos os seus assassinos! Mas como fizemos isso? Como conseguimos esvaziar o mar? O que fizemos quando desatrelamos esta terra do seu sol? Para onde se move ela agora? Não estamos caindo continuamente? Para trás, para os lados, para a frente, em todas as direções?' (NIETZSCHE, F. <i>A Gaia Ciência</i>, aforismo 125, 1882 [adaptado]).</p>","No célebre aforismo da 'morte de Deus', Nietzsche formula um diagnóstico filosófico caracterizado",["pela vitória militar definitiva de impérios politeístas pagãos sobre as nações do Ocidente cristão.","pela defesa da volta à teologia escolástica medieval para restaurar a inquisição clerical na Europa.","pela comprovação físico-química de que a alma humana é imortal e habita planetas distantes.","pelo colapso dos referenciais metafísicos e morais absolutos que conferiam sentido e ordem à civilização ocidental.","pela exaltação do conformismo medíocre como o estado ideal de evolução para a sociedade contemporânea."],3,"Resolução comentada:<br>• Correta: D. A 'morte de Deus' em Nietzsche é a constatação cultural e filosófica de que as verdades absolutas, a metafísica platônico-cristã e os valores transcendentais perderam sua força ordenadora no mundo moderno. Esse diagnóstico inaugura a crise do niilismo e exige a criação autônoma de novos valores afirmadores da existência.<br>• Incorreta A: A metáfora não tem relação com guerras entre impérios politeístas.<br>• Incorreta C: Nietzsche recusa categoricamente a metafísica da alma imortal extraterrena.<br>• Incorreta B: O filósofo é o mais radical crítico da moral cristã e da escolástica medieval.<br>• Incorreta E: Nietzsche combate impiedosamente o conformismo medíocre, personificado pejorativamente no 'último homem'."],"Friedrich Nietzsche: Vontade de Poder e Eterno Retorno":["Para superar o niilismo e a moral de rebanho (que glorifica a fraqueza, a culpa e a resignação ressentida), Nietzsche desenvolve as ideias de Vontade de Poder (ou de Potência), Eterno Retorno do Mesmo e o Além-do-Homem (Übermensch). A Vontade de Poder não é a ambição vulgar de tiranizar os outros, mas o ímpeto afirmativo vital de autocriação, superação e expansão das próprias forças criativas. O Eterno Retorno atua como o supremo teste ético e existencial da vida: imagine que um demônio dissesse que você terá de viver cada instante desta sua vida, com todas as dores e alegrias, infinitas vezes exatamente da mesma forma; você se desesperaria ou diria 'sim' com entusiasmo? Essa postura de abraçar a existência com júbilo incondicional é o <i>amor fati</i> (amor ao destino).",["Vontade de Poder (Wille zur Macht): impulso cósmico e psicológico de autoafirmação criadora e superação de limites","Übermensch (Além-do-Homem): o indivíduo que supera os valores de rebanho e cria seus próprios sentidos para a terra","Eterno Retorno: experimento mental do supremo teste ético de fidelidade à vida terrena presente","Amor fati: aceitação jubilosa de toda a realidade concreta, com suas dores e belezas, sem refúgio em paraísos imaginários","Apolíneo e Dionisíaco: tensão criativa fundamental entre a ordem, medida e forma (Apolo) e o êxtase, paixão e fluxo da vida (Dioniso)"],"Cuidado com distorções históricas: o Übermensch nietzschiano NÃO é superioridade racial ou nazista! A irmã de Nietzsche manipulou seus escritos; para o filósofo, Übermensch é uma superação ética e espiritual individual contra a mediocridade do rebanho.","<p>'E se um dia ou uma noite um demônio se esgueirasse na tua mais solitária solidão e te dissesse: 'Esta vida, tal como a vives agora e a viveste, terás de vivê-la mais uma vez e inumeráveis vezes mais; e nada haverá nela de novo, mas cada dor e cada prazer e cada pensamento e suspiro terão de regressar a ti, na mesma sucessão e sequência'. Se esse pensamento ganhasse poder sobre ti, ele te transformaria ou talvez te esmagaria.' (NIETZSCHE, F. <i>A Gaia Ciência</i>, aforismo 341, 1882 [adaptado]).</p>","O experimento hipotético do 'Eterno Retorno' tem a função ética primordial de",["apresentar uma descrição astronômica literal dos ciclos de rotação das galáxias no cosmos.","promover o sentimento de culpa e de autoflagelação física como única virtude moral genuína.","convencer o leitor a abdicar de suas escolhas presentes para orar pelo perdão dos pecados em outra vida.","demonstrar que o ser humano não tem responsabilidade sobre seus atos em razão da repetição mecânica do tempo.","servir como critério supremo de avaliação e compromisso radical com a intensidade e a plenitude de cada instante vivido."],4,"Resolução comentada:<br>• Correta: E. O eterno retorno funciona como um crivo existencial supremo (o peso mais pesado): agir de tal modo que você desejaria que essa mesma ação se repetisse eternamente. É a afirmação máxima da vida presente (amor fati), superando o ressentimento, a culpa e a ilusão de promessas de compensação ultraterrena.<br>• Incorreta A: Trata-se de uma tese ética e filosófica de valorização existencial, não de um tratado de astrofísica factual.<br>• Incorreta C: Nietzsche ataca frontalmente a ideia cristã de recompensa celestial ou pecado.<br>• Incorreta D: O eterno retorno intensifica ao máximo o peso da responsabilidade e da escolha no instante presente.<br>• Incorreta B: A autoflagelação é a essência do ressentimento da moral de escravos, ferozmente combatida por Nietzsche."],"Jean-Paul Sartre: A Existência Precede a Essência":["Principal expoente do existencialismo francês do século XX, Jean-Paul Sartre resumiu sua filosofia na tese central de <i>O Existencialismo é um Humanismo</i> (1946): 'No homem, e somente no homem, a existência precede a essência'. Ao contrário de um objeto fabricado (como um cortador de papel, cuja essência e função foram concebidas na mente do artesão antes de ele ser produzido), o ser humano primeiro existe, surge no mundo, depara-se consigo mesmo e somente depois, por meio de suas ações e escolhas concretas, define o que é. O ser humano não é nada além do projeto que realiza. Essa liberdade sem garantias acarreta a Angústia do desamparo (não há Deus nem leis pré-moldadas na natureza) e exige a responsabilidade total de cada um por si e por todos.",["A existência precede a essência: o ser humano constrói sua identidade pelas ações, sem modelo prévio fixo","Em-si (en-soi) vs Para-si (pour-soi): as coisas materiais são fixas em-si; a consciência humana é aberta, inacabada e livre para-si","Angústia existencial: percepção da total indeterminação e do peso das escolhas livres","Desamparo: ausência de instâncias externas (Deus, destino) para justificar ou redimir nossas decisões","O engajamento social: a liberdade individual só se realiza plenamente na luta pela liberdade de todos"],"Guarde o contraste do ENEM: Cortador de papel = a essência precede a existência (foi planejado antes). Homem = a existência precede a essência (nasce sem manual de instruções e se faz escolhendo).","<p>'Se Deus não existe, há pelo menos um ser no qual a existência precede a essência, um ser que existe antes de poder ser definido por qualquer conceito: esse ser é o homem. O homem não é mais do que aquilo que ele faz de si mesmo. Tal é o primeiro princípio do existencialismo.' (SARTRE, J.-P. <i>O Existencialismo é um Humanismo</i>, 1946 [adaptado]).</p>","A afirmação sartreana de que 'a existência precede a essência' descontrói qualquer determinismo biológico ou social ao sustentar que",["o ser humano não possui uma destinação ou modelo prévio e é o único autor e responsável pelo que se torna através de seus atos.","a natureza humana é biologicamente imutável e condiciona as escolhas morais de todas as civilizações.","as escrituras religiosas já contêm a descrição acabada da trajetória que cada indivíduo deve cumprir no mundo.","o livre-arbítrio é uma ilusão burguesa e os indivíduos agem como marionetes cegas das forças produtivas.","a moralidade verdadeira consiste em imitar passivamente as atitudes e tradições dos antepassados."],0,"Resolução comentada:<br>• Correta: A. A essência humana não é dada por natureza, nem pela biologia, nem por Deus: o indivíduo é lançado no mundo como uma consciência aberta (para-si) e constrói livremente sua identidade, seus valores e seu projeto existencial por meio de suas escolhas e atos práticos.<br>• Incorreta B: Sartre rejeita terminantemente qualquer essência biológica ou determinismo fixo da espécie.<br>• Incorreta C: Sartre é ateu e defende que o desamparo humano decorre justamente de não haver decretos divinos prévios.<br>• Incorreta D: Essa assertiva expressa um determinismo econômico vulgar, que Sartre refutava ao valorizar a liberdade ontológica irredutível.<br>• Incorreta E: Imitar tradições sem reflexão é abdicar da autenticidade e cair na armadilha da má-fé."],"Simone de Beauvoir: A Construção do Segundo Sexo":["Filósofa existencialista e teórica feminista de impacto planetário, Simone de Beauvoir publicou em 1949 a obra clássica <i>O Segundo Sexo</i>, cuja célebre fórmula ecoa nos debates contemporâneos: 'Ninguém nasce mulher: torna-se mulher'. Aplicando o princípio existencialista da inexistência de uma essência pré-fixada, Beauvoir demonstra que o conceito tradicional de 'feminilidade' (passiva, dócil, emocional, confinada à esfera doméstica) não é uma decorrência biológica ou genética da anatomia feminina, mas sim uma sofisticada construção histórica, cultural e patriarcal. Ao longo dos séculos, o homem constituiu a si mesmo como o Sujeito Universal e colocou a mulher na condição subordinada de 'o Outro'. A emancipação feminina exige desconstruir esses mitos e assegurar autonomia política, existencial e econômica.",["'Não se nasce mulher, torna-se mulher': a feminilidade como construção cultural e histórica contínua","A categoria do Outro: o homem se autodefine como a norma universal humana; a mulher é definida de modo dependente","Crítica ao determinismo biológico: anatomia, psicologia ou biologia não predeterminam o destino existencial","Mitos patriarcais: narrativas culturais que naturalizam a submissão e o confinamento da mulher ao lar","Autonomia e transcendência: conquista da liberdade através do trabalho, da independência material e do engajamento político"],"No ENEM de 2015, essa frase caiu e gerou repercussão nacional: 'Ninguém nasce mulher: torna-se mulher'. A prova cobra a distinção entre sexo biológico (anatomia) e gênero (papel sociocultural construído historicamente).","<p>'Nenhum destino biológico, psíquico, econômico define a forma que o ser humano fêmea assume no seio da sociedade; é o conjunto da civilização que elabora esse produto intermediário entre o macho e o castrado que qualificam de feminino. Somente a mediação de outrem pode constituir um indivíduo como um Outro.' (BEAUVOIR, S. <i>O Segundo Sexo</i>, 1949 [adaptado]).</p>","A tese de Simone de Beauvoir revolucionou a reflexão filosófica sobre as relações de gênero ao demonstrar que",["a anatomia e os hormônios ditam inevitavelmente as funções profissionais e intelectuais que mulheres podem exercer.","os papéis e expectativas associados ao gênero feminino são construções culturais e históricas que naturalizam assimetrias de poder.","a subordinação feminina é uma imposição divina eterna que não admite qualquer tipo de contestação jurídica.","o confinamento das mulheres ao espaço doméstico decorre de uma preferência psicológica inata comprovada pela ciência.","a igualdade política entre homens e mulheres já foi plenamente assegurada desde as democracias da Antiguidade clássica."],1,"Resolução comentada:<br>• Correta: B. Simone de Beauvoir pioneiramente desnaturalizou a condição feminina: demonstrou que a passividade e a submissão imputadas às mulheres não são propriedades biológicas congênitas, mas produtos de processos de socialização e opressão cultural que forjaram a mulher como 'o Outro' do homem. A identidade de gênero é uma construção social e histórica.<br>• Incorreta A: Beauvoir refuta categoricamente o determinismo biológico dos hormônios ou da anatomia.<br>• Incorreta C: A autora recusa explicações teológicas patriarcais e propõe a emancipação emancipatória da mulher.<br>• Incorreta D: O confinamento ao lar é resultado de coerções materiais e simbólicas patriarcais, não de escolha inata.<br>• Incorreta E: Na Antiguidade grega e romana, as mulheres não tinham cidadania nem direitos políticos."],"Albert Camus e a Filosofia do Absurdo":["Albert Camus (1913–1960), escritor e pensador franco-argelino, formulou a filosofia do Absurdo em ensaios como <i>O Mito de Sísifo</i> (1942). Para Camus, o Absurdo não está exclusivamente no homem nem exclusivamente no mundo: ele nasce do confronto trágico entre o apelo humano desesperado por sentido, clareza e razão, e o silêncio irracional e indiferente do universo. Diante do absurdo, Camus indaga: 'Existe apenas um problema filosófico verdadeiramente sério: é o suicídio. Julgar se a vida vale ou não a pena ser vivida é responder à pergunta fundamental da filosofia'. Ele recusa tanto o suicídio físico quanto o suicídio filosófico (o refúgio em religiões ou esperanças transcendentais). A postura heroica autêntica é a Revolta lúcida: abraçar a vida absurda com paixão e liberdade, tal como Sísifo empurrando sua pedra montanha acima eternamente.",["O Absurdo: o choque doloroso entre a sede humana de sentido e o silêncio mudo e caótico do universo","O problema do suicídio: confronto supremo com a legitimidade ou não de encerrar a própria vida","Recusa do suicídio filosófico: não se refugiar em esperanças metafísicas ou deuses para dourar a pílula da realidade","A tríade camusiana: Revolta (insurgir-se lucidamente), Liberdade (agir sem ilusões cósmicas) e Paixão (viver intensamente)","O Mito de Sísifo: condenado pelos deuses a empurrar a rocha sem fim; 'é preciso imaginar Sísifo feliz' em sua revolta constante"],"Sísifo é o herói do absurdo: sua vitória sobre os deuses não é fazer a pedra ficar no topo da montanha, mas descer a encosta com plena lucidez de sua condição e continuar empurrando sem se curvar nem se iludir.","<p>'Os deuses tinham condenado Sísifo a rolar incessantemente uma rocha até o cume de uma montanha, de onde a pedra caía de novo por seu próprio peso. Eles tinham pensado, com certo fundamento, que não há punição mais terrível do que o trabalho inútil e sem esperança. Todo o silêncio alegre de Sísifo está contido nisso: seu destino pertence-lhe; sua rocha é sua coisa. Deixo Sísifo no sopé da montanha. É preciso imaginar Sísifo feliz.' (CAMUS, A. <i>O Mito de Sísifo</i>, 1942 [adaptado]).</p>","Na filosofia do absurdo elaborada por Albert Camus, a atitude de Sísifo diante de sua punição cósmica simboliza",["o desespero e a capitulação que conduzem fatalmente ao suicídio físico dos homens justos.","a vitória do devoto que roga orações aos céus e é recompensado com a imortalidade beatífica.","a revolta consciente e corajosa do ser humano que afirma a grandeza da vida mesmo diante da falta de sentido último do universo.","a demonstração de que a tecnologia moderna extinguirá todo e qualquer esforço corporal e intelectual humano.","a renúncia aos direitos políticos em benefício da aceitação cega de tiranos temporais benevolentes."],2,"Resolução comentada:<br>• Correta: C. Sísifo personifica o herói do absurdo: consciente de que seu fardo não tem recompensa sobrenatural nem finalidade cósmica prévia, ele não se rende ao desespero nem recorre a ilusões metafísicas. Ao assumir conscientemente sua rocha e continuar caminhando, ele se revolta contra o nada e afirma a soberania de sua existência vivida com paixão lúcida.<br>• Incorreta A: Camus rejeita expressamente o suicídio físico, considerando-o uma fuga covarde da condição absurda.<br>• Incorreta B: Sísifo zombou dos deuses e foi castigado por eles; sua atitude é o oposto da oração mística.<br>• Incorreta D: O mito é uma metáfora existencial da condição humana, não um prognóstico sobre automação técnica.<br>• Incorreta E: A revolta camusiana é rebelde e autônoma, incompatível com a submissão servil a tiranos."],"Martin Heidegger: O Dasein e a Angústia do Ser-para-a-Morte":["Em sua obra fundamental <i>Ser e Tempo</i> (1927), o filósofo alemão Martin Heidegger reabriu a questão do Ser (<i>Seinsfrage</i>), esquecida pela tradição ocidental que confundiu o Ser com os entes materiais. Para interrogar o sentido do Ser, Heidegger analisa o único ente capaz de fazer perguntas: o <i>Dasein</i> (o 'Ser-aí' ou a existência humana concreta). O Dasein é 'Ser-no-mundo' (<i>In-der-Welt-sein</i>), lançado em uma teia de significados e relações práticas de cuidado (<i>Sorge</i>). Na rotina alienada do dia a dia, o Dasein vive na inautenticidade do falatório anônimo do 'a-gente' (<i>das Man</i>). Contudo, a experiência existencial da Angústia rompe essa ilusão e desvela a condição primordial do homem: o Dasein é um 'Ser-para-a-morte' (<i>Sein-zum-Tode</i>). Reconhecer lucidamente a própria finitude intransferível é a chave para a existência autêntica.",["Dasein (Ser-aí): a existência humana aberta ao sentido do ser e situada historicamente no mundo","Ser-no-mundo: indissociabilidade entre o sujeito humano e o mundo vivido concreto","Inautenticidade (das Man): a perda de si na mediania, na curiosidade vazia e nas fofocas do senso comum coletivo","Ser-para-a-morte: a morte não como evento futuro que encerra a vida, mas como possibilidade mais própria e incontornável da existência","A questão da Técnica (Gestell): a tecnociência moderna que reduz a natureza e o próprio homem a um 'fundo de reserva' descartável"],"No ENEM: Ser-para-a-morte em Heidegger NÃO é pessimismo ou morbidez! É o reconhecimento de que nosso tempo é finito e precioso. Ter consciência da morte é o que nos liberta do comodismo das opiniões alheias para vivermos nossa vida autêntica.","<p>'A morte é a possibilidade mais própria, irrelacionada e insuperável do Dasein. Com a morte, o Dasein está na iminência de si mesmo em sua possibilidade mais própria. Quando a angústia diante da morte abre o Dasein para essa possibilidade, ele se desvencilha da mediocridade do impessoal (o 'a-gente') e assume resolutamente a sua existência autêntica.' (HEIDEGGER, M. <i>Ser e Tempo</i>, 1927 [adaptado]).</p>","Na ontologia existencial heideggeriana, a consciência lúcida do 'ser-para-a-morte' cumpre o papel de",["estimular a busca frenética por entretenimentos superficiais para esquecer a passagem do tempo.","comprovar que os avanços da farmacologia médica eliminarão a mortalidade física de todos os mamíferos.","levar os indivíduos à paralisia psicológica permanente e à recusa de qualquer relacionamento comunitário.","despertar o sujeito da alienação conformista do cotidiano impessoal para que assuma com resolução sua existência autêntica.","subordinar os cidadãos às sentenças oraculares de deuses gregos sobre o além-túmulo."],3,"Resolução comentada:<br>• Correta: D. Para Heidegger, na maior parte do tempo nós fugimos de nós mesmos vivendo na inautenticidade do 'eles dizem' ou 'a-gente faz assim'. A angústia diante da morte revela que ninguém pode morrer em nosso lugar: a finitude é intransferível e singular. Assumir o fato de ser um 'ser-para-a-morte' arranca o Dasein do rebanho anônimo e o convoca a viver com liberdade resoluta e autenticidade sua própria trajetória.<br>• Incorreta A: A fuga para entretenimentos fúteis é o sintoma da inautenticidade e da decadência no impessoal.<br>• Incorreta C: A resolução autêntica não é paralisia; é abertura engajada para a ação com sentido no mundo.<br>• Incorreta B: A mortalidade é a estrutura ontológica incontornável da condição humana finita.<br>• Incorreta E: A análise heideggeriana é ontológica existencial e secular, independente de oráculos mitológicos."],"Maurice Merleau-Ponty: A Fenomenologia da Percepção e o Corpo Próprio":["Em <i>Fenomenologia da Percepção</i> (1945), Maurice Merleau-Ponty operou uma das mais fecundas críticas ao intelectualismo e ao racionalismo cartesiano. Contra Descartes, que dividia o ser humano em alma pensante e corpo-máquina exterior, Merleau-Ponty sustenta: 'Eu não tenho um corpo; eu SOU meu corpo'. O ser humano é o seu 'Corpo Próprio' (<i>corps propre</i>), e é através do corpo sensível, motriz e afetivo que estamos enraizados no mundo. Toda percepção intelectual abstrata apoia-se no solo originário da experiência corporal. O corpo não é um objeto passivo ao lado de outros objetos, mas o nosso ponto de vista irrevogável sobre a realidade, o veículo do nosso ser-no-mundo que conecta a sensibilidade, a arte e a expressividade linguística.",["Corpo Próprio (corps propre): superação do dualismo cartesiano; o corpo como sujeito da percepção e da experiência viva","Primazia da percepção: o conhecimento conceitual nasce ancorado na experiência corporal sensível do mundo","Quiasma e entrelaçamento: a reversibilidade entre o corpo que toca e o corpo que é tocado (o homem é tecido do mundo)","Espacialidade do corpo: o espaço não é uma grade geométrica cartesiana abstrata, mas a extensão do alcance de nossos gestos e ações","Expressividade e Arte: a pintura de Cézanne como exemplo de revelação do nascimento da percepção viva sobre a tela"],"No ENEM: Merleau-Ponty destrói a ideia cartesiana de que somos um 'fantasminha pensante dentro de um robô de carne'. Somos nosso corpo: sentimos o mundo com ele e nossa mente pensa a partir dos nossos passos, olhos e gestos no espaço.","<p>'O corpo próprio está no mundo como o coração está no organismo: ele mantém o espetáculo visível continuamente vivo, anima-o e alimenta-o interiormente, forma com ele um sistema. Eu não estou diante de meu corpo, estou em meu corpo, ou melhor, sou meu corpo. É através dele que tenho acesso à totalidade das coisas e ao horizonte do mundo.' (MERLEAU-PONTY, M. <i>Fenomenologia da Percepção</i>, 1945 [adaptado]).</p>","A tese fenomenológica de Merleau-Ponty sobre o 'corpo próprio' desconstrói o dualismo mente-corpo ao afirmar que",["o organismo humano funciona como um mecanismo hidráulico desprovido de qualquer sensibilidade estética.","as emoções e sentimentos humanos são criações puramente linguísticas sem respaldo na fisiologia do organismo.","a mente habita uma dimensão paralela extraterrena imune às dores e sensações do mundo fenomênico.","a observação dos fenômenos visuais dispensa os órgãos da visão e o sistema nervoso biológico.","o corpo não é um mero instrumento mecânico exterior da mente, mas o sujeito integrado da percepção e da existência no mundo."],4,"Resolução comentada:<br>• Correta: E. Merleau-Ponty supera a clássica cisão cartesiana entre a res cogitans (mente) e a res extensa (corpo-objeto): o ser humano é encarnado (embodied). O corpo próprio é a nossa âncora no mundo, a matriz primordial da percepção, do desejo e do pensamento. Não pensamos 'apesar' do corpo, mas 'através' de nossa corporeidade viva em constante intercâmbio com a realidade circundante.<br>• Incorreta A: A metáfora do corpo-mecanismo hidráulico é a física cartesiana combatida por Merleau-Ponty.<br>• Incorreta C: A fenomenologia recusa o dualismo platônico ou místico que separa a mente do mundo material.<br>• Incorreta D: A corporeidade sensorial é a condição indispensável e direta de toda visão e percepção.<br>• Incorreta B: Os afetos e a expressividade gestual são indissociáveis da dinâmica física do corpo próprio."],"Jean-Paul Sartre: A Náusea e a Contingência Gratuita do Mundo":["Em seu romance filosófico <i>A Náusea</i> (1938), Jean-Paul Sartre antecipou o cerne ontológico de seu existencialismo através da experiência perturbadora do personagem Antoine Roquentin. Ao sentar-se diante da raiz de uma velha árvore em um parque público, Roquentin depara-se com a Contingência radical da existência: os objetos materiais do mundo simplesmente 'estão aí', sem razão de ser, sem propósito divino, sem necessidade lógica e sem justificativa prévia — são gratuitos e 'a mais' (<i>de trop</i>). Ao perceber que a existência física precede qualquer explicação racional e que o mundo é um absurdo informe e viscoso, Roquentin é tomado por uma vertigem avassaladora: a Náusea. Essa experiência existencial desmascara a farsa burguesa das pessoas de bem que acreditavam que sua posição social ou suas rotinas eram 'necessárias' por lei da natureza.",["Contingência radical: o fato de as coisas existirem sem razão necessária, sem causa final e sem explicação suficiente prévia","A Náusea: a sensação física e existencial de asco provocada pela descoberta da gratuidade nua da matéria","O 'De trop' (estar a mais): a constatação de que nenhum ser vivo ou objeto no universo é indispensável","Crítica à hipocrisia burguesa: a denúncia dos 'salafrários' (salauds) que acreditam ter nascido com o direito nato de mandar nos outros","Liberdade e desamparo: como não há um plano prévio traçado para o mundo, cabe ao homem inventar seu próprio sentido através da arte e da ação"],"No ENEM: a Náusea sartreana não é enjoo estomacal de quem comeu comida estragada! É o choque filosófico ao descobrir que o mundo não tem manual de instruções nem garantia divina, e que nossa existência é pura contingência livre.","<p>'A raiz do castanheiro mergulhava na terra, logo abaixo do meu banco. Eu não me lembrava mais de que era uma raiz. As palavras tinham sumido e, com elas, a significação das coisas, o modo de uso delas, as marcas que os homens tinham traçado na sua superfície. A raiz estava ali, pesada, imóvel, monstruosa, numa existência desprovida de qualquer razão necessária. O mundo das explicações e das razões desmoronou. Aquela raiz existia de graça, a mais (de trop): era a náusea.' (SARTRE, J.-P. <i>A Náusea</i>, 1938 [adaptado]).</p>","No trecho de <i>A Náusea</i>, a experiência que deflagra o sentimento existencial de náusea no protagonista é a descoberta da",["contingência absoluta e gratuita da existência do mundo, que existe sem uma necessidade lógica ou razão prévia justificadora.","certeza matemática absoluta de que Deus desenhou um plano cósmico detalhado para a felicidade burguesa.","vitória militar definitiva da França sobre todos os impérios vizinhos no século XVIII.","necessidade incondicional de preservar as monarquias hereditárias para manter o equilíbrio ecológico dos parques.","identidade perfeita entre as palavras do dicionário e a constituição química das raízes das plantas."],0,"Resolução comentada:<br>• Correta: A. A 'náusea' sartreana é a experiência ontológica do confronto direto com o absurdo da existência nua e crua: as coisas materiais e o próprio homem estão aí sem necessidade prévia, sem justificativa metafísica ou finalidade dada de antemão. O mundo é pura contingência gratuita (de trop), desmoronando a ilusão confortável de que a realidade foi feita sob medida para satisfazer a razão humana.<br>• Incorreta B: Sartre é ateu e a náusea nasce exatamente do colapso da ilusão de uma ordem providencial prévia.<br>• Incorreta C: O romance aborda a angústia ontológica individual, não vitórias bélicas imperiais.<br>• Incorreta D: A obra satiriza os retratos de nobres e burgueses nas galerias municipais que fingiam ter direito natural de mandar.<br>• Incorreta E: O trecho mostra que as palavras e rótulos humanos evaporam diante da opacidade muda da raiz."],"Arthur Schopenhauer e o Mundo como Vontade":["Em sua obra magna 'O Mundo como Vontade e Representação' (1819), Arthur Schopenhauer realiza uma radical releitura do criticismo kantiano e do pensamento oriental (Upanishads). O mundo que nos cerca é, por um lado, Representação (o mundo fenomênico ordenado pelas coordenadas de espaço, tempo e causalidade na mente do sujeito); por outro lado, a coisa-em-si que fundamenta toda a realidade é a Vontade (Wille) — um impulso cego, insaciável, irracional e sem finalidade que perpassa a natureza e culmina na consciência humana. Por ser desejo contínuo, a vida oscila como um pêndulo entre a dor (quando o desejo não é satisfeito) e o tédio (quando ele é momentaneamente saciado). As únicas vias de alívio e superação desse sofrimento existencial são a contemplação estética da arte, a compaixão moral desinteressada e a ascese.",["Vontade (Wille): essência metafísica cega, irracional e cósmica que subjaz a todos os fenômenos","O pêndulo da existência: a condição humana tensionada perpetuamente entre o sofrimento e o tédio","O véu de Maia: a ilusão da individualidade e separação entre os seres provocada pela representação","Vias de redenção: a contemplação desinteressada da arte pura (especialmente a música) e a ética da compaixão"],"Schopenhauer é o grande pioneiro da suspeita filosófica contra o otimismo racionalista de Hegel. O ENEM costuma cobrar seu pessimismo metafísico e o papel libertador da arte e da compaixão diante da dor da existência.","\"A vida oscila como um pêndulo, para trás e para a frente, entre o sofrimento e o tédio, dois elementos de que, na realidade, ela é composta. Depois de o homem ter transformado todos os seus sofrimentos e tormentos na concepção de um inferno, não sobrou para o céu senão o tédio. A Vontade quer sempre; é um anseio infinito, uma sede insaciável; mas cada saciação traz consigo o cansaço e a vacuidade, até que um novo desejo desperte. Dessa forma, enquanto a nossa consciência estiver repleta de nossa própria vontade, jamais alcançaremos paz nem repouso duradouros.\" (SCHOPENHAUER, Arthur. O Mundo como Vontade e Representação).","A reflexão schopenhaueriana apresentada no texto diagnostica a condição existencial do ser humano a partir de um princípio metafísico que concebe o sofrimento como decorrência da",["ausência de progresso técnico e produtivo nos parques industriais das capitais modernas.","natureza insaciável do desejo que transforma a existência em perpétua carência e inquietação.","obediência devota aos dogmas consuetudinários preservados pelas instituições eclesiásticas.","repressão estatal de condutas impulsivas em prol do império das leis civis republicanas.","incapacidade individual de acumular patrimônio financeiro suficiente para o ócio vitalício."],1,"Resolução detalhada:\n• Correta: B. Para Schopenhauer, o sofrimento é intrínseco à própria estrutura da Vontade: o desejo nasce da falta; enquanto não é satisfeito, causa dor; quando saciado, produz o tédio, gerando um ciclo interminável de carência.\n• Incorreta A: Para Schopenhauer, o avanço tecnológico fabril não atenua a dor cósmica da existência; o sofrimento é metafísico e não meramente econômico.\n• Incorreta C: A religião é vista como consolação mítica popular, não a causa originária da Vontade cega.\n• Incorreta D: O Estado civil protege os corpos, mas não cura o anseio insaciável da Vontade metafísica interior.\n• Incorreta E: O acúmulo de bens materiais e dinheiro acelera o tédio, não constituindo remédio filosófico genuíno."],"Edmund Husserl e a Fenomenologia da Consciência":["O filósofo alemão Edmund Husserl (1859–1938) fundou a Fenomenologia com o célebre apelo: 'retornar às próprias coisas' (zu den Sachen selbst). Husserl rejeitou tanto o naturalismo positivista (que reduzia a consciência a meros impulsos biológicos cerebrais) quanto o idealismo metafísico abstrato. Seu método exige a prática da 'epoché fenomenológica' — colocar a atitude natural e o mundo exterior 'entre parênteses' (sem negar nem afirmar sua existência empírica) para descrever com rigor como os fenômenos se doam originariamente à percepção. O traço essencial e definidor da consciência humana é a 'intencionalidade': a consciência não é uma caixa vazia fechada, mas pura abertura e relação; 'toda consciência é sempre consciência de alguma coisa'.",["Às coisas mesmas: lema metodológico que propõe descrever os fenômenos tais como aparecem sem preconceitos teóricos","Epoché fenomenológica: suspensão voluntária dos juízos ingênuos da atitude natural sobre a realidade exterior","Intencionalidade: propriedade primordial da consciência de estar sempre direcionada a um objeto que não é ela mesma","Influência capital: base para o existencialismo de Heidegger e Sartre e para a fenomenologia da percepção de Merleau-Ponty"],"Husserl é o pai do método fenomenológico no ENEM! Lembre-se: 'intencionalidade' significa que a mente não existe isolada; o pensar está sempre amarrado àquilo que é pensado (objeto intencional).","\"A palavra intencionalidade não significa outra coisa senão a peculiaridade fundamental e geral da consciência de ser consciência de algo; de carregar em si mesma, como cogito, o seu cogitatum. O ato de ver é ver algo, o ato de lembrar é lembrar de algo, o ato de julgar é julgar sobre um estado de coisas. Colocar o mundo entre parênteses através da epoché não significa duvidar ceticamente da existência do mundo, mas abster-se de emitir qualquer juízo dogmático ingênuo para podermos descrever a estrutura pura da vivência intencional tal como ela se doa à consciência.\" (HUSSERL, Edmund. Meditações Cartesianas).","A investigação fenomenológica desenvolvida por Edmund Husserl redefine a relação entre o sujeito cognoscente e a realidade ao estabelecer que a consciência",["opera como um recipiente hermético e passivo que armazena impressões mecânicas sem relação com o mundo.","subordina as leis universais da lógica às reações químicas e fisiológicas do sistema nervoso central.","constitui uma atividade direcionada intencionalmente para os objetos manifestos na experiência vivida.","inviabiliza qualquer apreensão compreensiva de fenômenos por negar a existência da percepção sensível.","depende da revelação mística transmitida por dogmas sagrados preservados por corporações clericais."],2,"Resolução detalhada:\n• Correta: C. Husserl demonstra que a consciência é intencionalidade pura: ela não é uma substância fechada em si mesma, mas uma abertura constitutiva orientada para o mundo e para os objetos da experiência vivida.\n• Incorreta A: O modelo do recipiente passivo é o empirismo mecanicista superado pela fenomenologia intencional.\n• Incorreta B: Husserl combateu ferozmente o psicologismo e o biologicismo, defendendo a autonomia das essências eidéticas.\n• Incorreta D: A fenomenologia é exatamente a ciência descritiva rigorosa dos fenômenos tal como aparecem à percepção.\n• Incorreta E: Husserl atua no campo da filosofia rigorosa e laica, recusando revelações sobrenaturais dogmáticas."],"Martin Heidegger: O Dasein e o Ser-para-a-Morte":["Em sua obra 'Ser e Tempo' (1927), Martin Heidegger revoluciona a ontologia contemporânea ao desviar o foco da metafísica tradicional (que investigava o ser dos entes como coisas prontas) para o próprio sentido do Ser. Heidegger analisa o homem como Dasein ('Ser-aí'): um ente que não é uma substância fechada, mas uma abertura primordial jogada no mundo (Geworfenheit), cuja essência consiste em sua própria existência e cuidado (Sorge). Em sua vida cotidiana imersa nas preocupações práticas, o Dasein tende a cair na 'inautenticidade' (a tagarelice, a curiosidade frívola e o domínio do impessoal — das Man: 'faz-se assim', 'diz-se aquilo'). A existência só conquista a autenticidade (Eigentlichkeit) quando assume com lucidez e angústia sua condição irrevogável de 'Ser-para-a-morte' (Sein-zum-Tode), compreendendo que a finitude radical é o que confere gravidade e responsabilidade a cada escolha.",["Dasein (Ser-aí): a existência humana como abertura dinâmica, projeto e ser-no-mundo","Inautenticidade e o impessoal (das Man): a fuga do sujeito na rotina fútil do senso comum anônimo","Angústia (Angst): a experiência ontológica que desfamiliariza o mundo e revela o Nada primordial","Ser-para-a-morte: a tomada de consciência da finitude inalienável como chave para a existência autêntica"],"O conceito de 'Ser-para-a-morte' e a crítica à vida inautêntica são centrais para a compreensão do existencialismo contemporâneo no ENEM. A finitude não é encarada como pessimismo, mas como fundamento ético de valorização do tempo vivido.","\"A morte é a possibilidade mais própria, irremissível e insuperável do Dasein. Como ser-para-a-morte, o Dasein relaciona-se consigo mesmo enquanto poder-ser autêntico. A cotidianidade impessoal esconde essa possibilidade, dizendo: 'a morte chega com certeza, mas por enquanto ainda não'. Com esse 'não ainda', o impessoal encobre a certeza e a indeterminação constante da morte, despojando o Dasein de sua angústia originária e tranquilizando-o na dispersão mundana. Apenas na resolução antecipatória da morte o Dasein liberta-se da ditadura do 'se diz' e torna-se livre para assumir suas próprias possibilidades de existência.\" (HEIDEGGER, Martin. Ser e Tempo).","A reflexão ontológica heideggeriana presente no texto atribui à consciência da própria finitude uma função decisiva na medida em que ela permite ao ser humano",["antecipar o término biológico da vida por meio de rituais de consagração e sacrifício cósmico.","recuperar o controle absoluto sobre o tempo cósmico para eliminar a decadência física do corpo.","negar qualquer valor à história coletiva em proveito da acumulação de bens materiais duradouros.","romper com a alienação das rotinas anônimas e assumir a responsabilidade singular por sua existência.","obedecer passivamente aos cânones de conduta estipulados pela opinião pública convencional."],3,"Resolução detalhada:\n• Correta: D. Ao confrontar corajosamente a morte como sua possibilidade mais própria e intransferível, o indivíduo desvencilha-se das futilidades do senso comum impessoal (das Man) e passa a viver de modo autêntico e responsável.\n• Incorreta A: Heidegger analisa a estrutura ontológica da existência humana, não rituais religiosos de sacrifício.\n• Incorreta C: A assunção do Dasein não significa desprezo pelo mundo, mas agir com lucidez no próprio horizonte histórico compartilhado.\n• Incorreta B: A finitude é insuperável; o ser humano não domina o tempo cósmico de forma onipotente.\n• Incorreta E: A obediência à opinião convencional anônima é a própria definição de existência 'inautêntica' que o filósofo critica."],"Gilles Deleuze e o Conceito de Rizoma":["Em 'Mil Platôs' (1980), escrito em colaboração com Félix Guattari, o filósofo francês Gilles Deleuze propõe a imagem do 'rizoma' como alternativa epistemológica e política ao pensamento clássico ocidental, dominado pelo 'modelo arborescente'. O modelo da árvore é hierárquico, binário, centralizado, possui raízes fixas e desdobra-se em galhos unívocos que partem de um tronco de autoridade soberano. Em contrapartida, o rizoma (inspirado na botânica de raízes como a da grama, gengibre ou batata) conecta qualquer ponto a qualquer outro, opera por redes descentralizadas, desprovidas de centro ou hierarquia rígida, funciona por multiplicidade e propaga-se por brotamentos horizontais e linhas de fuga. A epistemologia rizomática celebra o devir, a experimentação e a desterritorialização contra as camisas de força do saber dogmático e das instituições de controle.",["Modelo arbóreo: pensamento vertical, linear, binário, centrado em origens imutáveis e hierarquias","Modelo rizomático: organização em rede, horizontalidade, multiplicidade aberta e conexões heterogêneas","Desterritorialização e linhas de fuga: capacidade de desmanchar identidades fixas e criar novas formas de vida","Platô e multiplicidade: a recusa de reduzir a pluralidade do real a uma unidade redutora transcendente"],"O conceito de rizoma é moderníssimo e tem aparecido em questões interdisciplinares do ENEM conectando Filosofia Contemporânea, sociologia das redes digitais (internet) e crítica aos saberes hegemônicos tradicionais.","\"Diferente das árvores ou de suas raízes, o rizoma conecta um ponto qualquer com outro ponto qualquer, e cada um de seus traços não remete necessariamente a traços de mesma natureza; ele põe em jogo regimes de signos muito diferentes e inclusive estados de não-signos. O rizoma não se deixa reconduzir nem ao Uno nem ao Múltiplo. Ele não é feito de unidades, mas de dimensões, ou antes de direções cambiantes. Não tem começo nem fim, mas sempre um meio (milieu) pelo qual ele cresce e transborda. Ao contrário da árvore, que impõe o verbo 'ser', o rizoma tem por tecido a conjunção 'e... e... e...'\" (DELEUZE, Gilles; GUATTARI, Félix. Mil Platôs: Capitalismo e Esquizofrenia).","Ao contrastar a lógica da árvore com a estrutura do rizoma, Gilles Deleuze e Félix Guattari contestam a tradição epistemológica ocidental ao valorizarem um modelo de pensamento caracterizado pela",["imposição de hierarquias cognitivas inflexíveis tuteladas por autoridades acadêmicas permanentes.","reprodução mecânica de comandos burocráticos subordinados a chefias administrativas verticais.","fixação de cânones dogmáticos universais pautados na busca da raiz identitária original única.","supressão das diferenças individuais em proveito de um sistema homogêneo de crenças consuetudinárias.","conectividade descentralizada, abertura à multiplicidade e experimentação de percursos não lineares."],4,"Resolução detalhada:\n• Correta: E. O rizoma funciona como uma rede de conexões horizontais ilimitadas onde nenhum centro dita as ordens aos outros; ele valoriza o devir, os cruzamentos inesperados e a pluralidade fluida da vida.\n• Incorreta A: A hierarquia estrita é precisamente o modelo da 'árvore-raiz' que a obra visa desconstruir.\n• Incorreta C: O rizoma não busca 'raízes' ou 'essências identitárias' fundadoras imutáveis; ele cresce pelos lados (no meio).\n• Incorreta D: O rizoma celebra a heterogeneidade e a proliferação das diferenças, combatendo a homogeneização.\n• Incorreta B: O modelo de comandos verticais corresponde às instituições estatais e corporativas disciplinares, antagônicas à dinâmica rizomática."],"Escola de Frankfurt e a Razão Instrumental":["Fundada na década de 1920 junto ao Instituto de Pesquisas Sociais da Alemanha, a Escola de Frankfurt articulou marxismo, psicanálise freudiana e filosofia weberiana para desenvolver a Teoria Crítica. Em <i>Dialética do Esclarecimento</i> (1947), Theodor Adorno e Max Horkheimer investigam o enigma dramático da modernidade: 'por que a humanidade, em vez de entrar em um estado verdadeiramente humano, está se afundando em uma nova espécie de barbárie?' (marcada pelo Holocausto e pelas guerras mundiais). A resposta reside na degeneração da Razão: a razão iluminista emancipatória transformou-se em Razão Instrumental (ou subjetiva) — uma racionalidade puramente técnica, pragmática e utilitária, preocupada apenas com a eficácia dos meios para dominar a natureza e controlar os homens, abandonando a reflexão ética sobre a justiça dos fins.",["Teoria Crítica vs Teoria Tradicional: a teoria crítica visa à emancipação humana e à transformação das estruturas de opressão","Razão Crítica/Objetiva: reflexão filosófica sobre os fins éticos, a justiça, a liberdade e o sentido da vida coletiva","Razão Instrumental/Subjetiva: cálculo puramente pragmático de meios, eficiência, controle e maximização técnica de resultados","Dialética do Esclarecimento: o Iluminismo, ao buscar desencantar o mundo para dominá-lo, converteu-se em novo mito e barbárie","Dominação da natureza e do homem: a dominação técnica do meio ambiente desdobrou-se na administração totalitária dos seres humanos"],"No ENEM: a razão instrumental é a inteligência técnica dos meios sem coração ético. Um campo de extermínio nazista ou a poluição desenfreada em busca de lucro usam ciência de ponta com eficiência máxima, mas são desprovidos de razão ética crítica.","<p>'O Iluminismo comportou-se com as coisas como o ditador se comporta com os homens: ele as conhece na medida em que as pode manipular. O homem de ciência conhece as coisas na medida em que as pode fazer. Nisso, o seu em-si torna-se para-ele. Na metamorfose, a essência das coisas revela-se sempre como a mesma: como substrato de dominação.' (HORKHEIMER, M.; ADORNO, T. W. <i>Dialética do Esclarecimento</i>, 1947 [adaptado]).</p>","De acordo com a crítica frankfurtiana da razão instrumental, a crise civilizatória manifestada nos regimes autoritários do século XX decorre",["da redução da racionalidade a um instrumento puramente técnico de cálculo, dominação e eficiência sem reflexão ética sobre os fins.","da ausência total de leis científicas nas indústrias farmacêuticas e metalúrgicas ocidentais.","do retorno à teologia cristã medieval como critério absoluto de organização da vida acadêmica e pública.","da falta de investimentos estatais no aprimoramento bélico e armamentista das potências industriais.","do predomínio da contemplação artística e poética desinteressada sobre as decisões governamentais modernas."],0,"Resolução comentada:<br>• Correta: A. Adorno e Horkheimer denunciam que o Iluminismo perverteu a promessa de libertação ao hipertrofiar a razão instrumental (cálculo mecanicista, utilidade pragmática e controle técnico) em detrimento da razão ética substantiva. Quando a técnica se desvincula de valores morais e humanistas, ela se transforma em ferramenta de barbárie e massacre em massa.<br>• Incorreta D: A proliferação bélica acelerada é sintoma da própria barbárie técnica, não solução.<br>• Incorreta C: A crítica atinge o racionalismo moderno laico que se tornou cego, e não a teologia medieval.<br>• Incorreta B: Havia excesso de rigor científico-técnico mecanicista a serviço da aniquilação humana.<br>• Incorreta E: A arte contemplativa foi eclipsada pela lógica utilitária da eficiência produtiva."],"Adorno e Horkheimer: Conceito de Indústria Cultural":["Adorno e Horkheimer cunharam o conceito fundamental de Indústria Cultural (<i>Kulturindustrie</i>) para substituir intencionalmente a expressão 'cultura de massa'. Esta última sugeria erroneamente que as produções culturais contemporâneas brotavam espontaneamente dos anseios do próprio povo. Na realidade, a Indústria Cultural é um sistema mercantilizado, padronizado e verticalizado, comandado pelas grandes corporações de mídia (rádio, cinema, TV, música comercial). Os bens culturais são transformados em meras mercadorias feitas em série para serem consumidas passivamente. Sua função ideológica é anestesiar a consciência crítica dos trabalhadores, promovendo o conformismo, a ilusão de individualidade e a integração submissa ao sistema capitalista sob o pretexto de entretenimento fácil.",["Indústria Cultural (Kulturindustrie): produção mercantilizada em série de bens simbólicos","Substituição de 'cultura de massa': não é arte feita pelo povo, mas arte produzida de cima para baixo para alienar as massas","Padronização e repetição: fórmulas artísticas prontas e previsíveis que exigem mínimo esforço reflexivo","Pseudo-individualidade: pequenas diferenças cosméticas no produto apenas para simular variedade e liberdade de escolha","Função ideológica: entretenimento que anestesia o sofrimento, pacifica conflitos sociais e perpetua o status quo"],"Atenção à distinção para o ENEM: cultura erudita (complexa, reflexiva, exige esforço); cultura popular autêntica (folclore, raízes do povo); e indústria cultural (mercadoria padronizada feita por conglomerados para faturar e anestesiar o senso crítico).","<p>'A indústria cultural fraudou continuamente os consumidores daquilo que lhes prometia. O cheque sobre o prazer emitido pelo enredo dos filmes e pelas músicas da moda é prolongado indefinidamente; a promessa à qual o espetáculo na verdade se reduz significa maliciosamente que não se chega jamais ao que foi prometido, e o cliente deve contentar-se com o cardápio.' (ADORNO, T. W.; HORKHEIMER, M. <i>Dialética do Esclarecimento</i>, 1947 [adaptado]).</p>","Na análise frankfurtiana, o papel social primordial exercido pelos produtos da Indústria Cultural consiste em",["estimular a autonomia reflexiva e a rebelião política imediata das classes trabalhadoras exploradas.","promover o conformismo social e a passividade acrítica mediante o consumo padronizado de entretenimento fácil.","preservar as manifestações folclóricas rurais imunes à comercialização e à lógica do lucro capitalista.","financiar projetos comunitários independentes geridos exclusivamente por artistas de rua periféricos.","garantir a democratização do conhecimento erudito com o mesmo rigor conceitual das academias de filosofia."],1,"Resolução comentada:<br>• Correta: B. A Indústria Cultural converte a arte em mercadoria de consumo rápido: padroniza ritmos, narrativas e imagens para capturar a atenção sem provocar esforço reflexivo. Ao vender escapismo e diversão alienante, amortece a indignação moral dos sujeitos e reproduz a submissão ideológica às estruturas hegemônicas.<br>• Incorreta A: A indústria cultural gera conformismo e despolitização, e não espírito revolucionário crítico.<br>• Incorreta C: Ela esteriliza a cultura popular autêntica ao transformá-la em produtos comercializáveis e pasteurizados.<br>• Incorreta D: O controle financeiro pertence aos conglomerados de comunicação e publicidade, não a cooperativas comunitárias.<br>• Incorreta E: Ela empobrece a densidade da arte e da filosofia para criar produtos superficiais de assimilação instantânea."],"Walter Benjamin: A Perda da Aura e Reprodutibilidade":["No célebre ensaio <i>A Obra de Arte na Época de sua Reprodutibilidade Técnica</i> (1936), Walter Benjamin adota uma visão mais dialética e matizada das novas mídias em relação a Adorno. Benjamin analisa como técnicas modernas como a litografia, a fotografia e o cinema permitiram a reprodução em massa das obras de arte. Com a reprodutibilidade técnica, a obra perde a sua 'Aura': o 'aqui e agora' (<i>hic et nunc</i>) do original, a sua autenticidade irrepetível e o seu enraizamento originário no valor de culto mágico ou religioso. Embora lamente a dissolução da distância estética contemplativa da aura, Benjamin vislumbra um potencial democratizante e revolucionário: a arte desce do pedestal sagrado das elites para o alcance das multidões urbanas, passando do valor de culto ao 'valor de exposição' e abrindo caminho para a politização da arte contra a estetização da política promovida pelo fascismo.",["Aura da obra de arte: o caráter singular, único, autêntico e irrepetível do objeto artístico original","Hic et nunc (aqui e agora): a presença material única no espaço e no tempo que ancora a tradição da obra","Valor de culto: arte ligada ao sagrado, ao ritual religioso e aos privilégios aristocráticos inacessíveis","Valor de exposição: arte reproduzida que circula na esfera pública para o consumo das massas urbanas","Politização da arte: resposta emancipatória e antifascista à estetização da política e da guerra"],"Guarde o contraponto Benjamin x Adorno: Adorno via os meios de massa quase só como alienação e regressão; Benjamin, embora reconheça a perda da aura, vê no cinema e na foto uma possibilidade inédita de democratizar a percepção e politizar a arte.","<p>'O que fenece na época da reprodutibilidade técnica da obra de arte é a sua aura. O processo é sintomático; sua significação vai muito além do domínio da arte. A técnica da reprodução destaca o objeto reproduzido do domínio da tradição. Ao multiplicar os exemplares da obra, substitui a sua existência única por uma existência em série.' (BENJAMIN, W. <i>A Obra de Arte na Época de sua Reprodutibilidade Técnica</i>, 1936 [adaptado]).</p>","De acordo com Walter Benjamin, a substituição da experiência da 'aura' pelo advento da fotografia e do cinema provocou",["o encarecimento proibitivo de qualquer manifestação artística, tornando-a restrita à alta burguesia.","a destruição definitiva da criatividade humana e a extinção irremediável de qualquer forma de poética.","o deslocamento da arte de seu fundamento mágico e ritualístico para um horizonte secular de ampla exposição pública e potencial político.","o fortalecimento dos dogmas monárquicos e o retorno das catedrais góticas como único centro de cultura urbana.","a proibição governamental de veicular imagens e sons em espaços públicos e salas de exibição."],2,"Resolução comentada:<br>• Correta: C. Com a reprodução técnica das imagens (fotografia e cinema), a obra de arte desprende-se de seu valor de culto aristocrático ou sagrado (perda da aura) e ganha valor de exposição: torna-se acessível às massas trabalhadoras em qualquer lugar e tempo, permitindo que a arte assuma uma função social crítica e politizadora contra o autoritarismo.<br>• Incorreta A: A reprodução barateou e popularizou o acesso às imagens, em vez de restringi-lo.<br>• Incorreta B: Benjamin não decreta o fim da criatividade, mas aponta a reconfiguração da sensibilidade e da percepção moderna.<br>• Incorreta D: As novas mídias aceleram o processo de secularização laica, e não o retorno ao misticismo medieval.<br>• Incorreta E: Pelo contrário, as salas de cinema tornaram-se o espaço por excelência de reunião e experiência coletiva moderna."],"Herbert Marcuse e a Crítica à Unidimensionalidade":["Em <i>O Homem Unidimensional</i> (1964), Herbert Marcuse faz um diagnóstico fulminante das sociedades industriais avançadas do capitalismo do pós-guerra. A sociedade afluente de consumo, longe de libertar os cidadãos, desenvolveu uma forma de dominação totalitária e sutil através do conforto material e da satisfação de 'falsas necessidades' fabricadas pela publicidade (carros do ano, eletrodomésticos, moda descartável). O indivíduo torna-se unidimensional: perde a capacidade de pensamento crítico, de negação e de imaginação de alternativas ao sistema, pois identifica a sua própria felicidade com os produtos que consome ('as pessoas se reconhecem em suas mercadorias; encontram sua alma em seu automóvel, em seu aparelho de som'). A tolerância institucionalizada opera como 'tolerância repressiva', neutralizando dissidências.",["Homem Unidimensional: indivíduo esvaziado de pensamento crítico, integrado passivamente à ordem estabelecida","Falsas necessidades: desejos artificiais criados pelo marketing para manter o ciclo ininterrupto de produção e consumo","Necessidades verdadeiras: saúde, habitação digna, liberdade autêntica, desenvolvimento intelectual e afeto","Dessublimação repressiva: liberação superficial e comercializada da sexualidade que canaliza a energia de revolta para o consumo","O 'Grande Recusa' (The Great Refusal): insurreição política e existencial dos marginalizados contra o conformismo tecnocrático"],"No ENEM: Marcuse mostra como o capitalismo moderno não precisa mais da censura brutal da polícia para controlar a população: basta inundar as pessoas com mercadorias e entretenimento fútil para fazê-las amar a própria servidão.","<p>'Um modelo de pensamento e de comportamento unidimensional vem sendo disseminado pelos meios de comunicação, que inculcam e prescrevem atitudes e reações, aprisionando os indivíduos a um modo de vida predeterminado. A produtividade e o potencial destruidor dessa civilização crescem juntos. Os indivíduos se identificam com a existência que lhes é imposta e nela encontram sua própria realização.' (MARCUSE, H. <i>O Homem Unidimensional</i>, 1964 [adaptado]).</p>","A crítica formulada por Marcuse à sociedade industrial de consumo denuncia a criação de mecanismos que",["incentivam a reflexão filosófica profunda e o questionamento constante da exploração do trabalho.","proíbem categoricamente a veiculação de anúncios publicitários em canais televisivos e jornais impressos.","abolem a produção fabril mecanizada e resgatam as corporações de ofício da Idade Média europeia.","moldam falsas necessidades de consumo que anestesiam o inconformismo e integram os indivíduos de forma acrítica à ordem vigente.","garantem que a renda e as decisões políticas sejam repartidas de forma rigorosamente horizontal entre os cidadãos."],3,"Resolução comentada:<br>• Correta: D. Marcuse demonstra que a sociedade tecnocrática avançada amortece o potencial de rebelião fabricando necessidades artificiais: ao perseguir incessantemente novos bens de consumo descartáveis, as pessoas sentem-se satisfeitas e perdem a dimensão crítica (a 'segunda dimensão' da negação), tornando-se homens unidimensionais conformados com a dominação invisível.<br>• Incorreta A: A sociedade unidimensional bloqueia a reflexão profunda e o pensamento dialético negativo.<br>• Incorreta C: Marcuse analisa o capitalismo industrial avançado altamente automatizado, não o artesanato feudal.<br>• Incorreta B: A publicidade é o coração e o principal dispositivo ideológico criticado pelo filósofo.<br>• Incorreta E: O poder nas sociedades industriais é altamente concentrado e burocrático, longe de qualquer horizontalidade."],"Guy Debord e a Sociedade do Espetáculo":["Líder da Internacional Situacionista, Guy Debord publicou em 1967 a obra premonitória <i>A Sociedade do Espetáculo</i>. Debord afirma na tese 1: 'Toda a vida das sociedades nas quais reinam as condições modernas de produção se anuncia como uma imensa acumulação de espetáculos. Tudo o que era diretamente vivido distanciou-se numa representação'. O espetáculo não é um mero conjunto de imagens na tela, mas uma relação social entre pessoas mediatizada por imagens. Na história econômica, a mercadoria operou uma dupla degradação do ser humano: primeiro, a passagem do 'ser' para o 'ter' (a valorização da posse material denunciada por Marx); e, na fase espetacular, a passagem do 'ter' para o 'parecer' — a imagem aparente e o prestígio visual tornam-se mais importantes que a posse concreta do objeto.",["Sociedade do Espetáculo: relação social alienada entre sujeitos mediada pela proliferação incessante de imagens","Aparência mercantil: passagem histórica do 'ser' (existência) para o 'ter' (posse de coisas) e do 'ter' para o 'parecer' (visibilidade espetacular)","Passividade do espectador: 'quanto mais ele contempla, menos ele é; quanto mais aceita reconhecer-se nas imagens dominantes, menos compreende a própria existência'","Espetáculo concentrado (totalitarismo fascista/estalinista) vs Espetáculo difuso (capitalismo de consumo contemporâneo)","Situações construídas: tática situacionista de criar momentos lúdicos de vida autêntica que quebrem a ilusão da rotina espetacular"],"Debord antecipou a era das redes sociais e do Instagram com décadas de antecedência: hoje o que importa não é apenas viver ou ter uma experiência, mas fotografá-la e 'parecer' para os outros na vitrine digital do espetáculo.","<p>'O espetáculo não é um conjunto de imagens, mas uma relação social entre pessoas mediada por imagens. O espectador não se sente em casa em parte alguma, porque o espetáculo está em toda parte. Na sociedade espetacular, o real transforma-se em imagens e as imagens transformam-se em real: o parecer sobrepõe-se definitivamente ao ser.' (DEBORD, G. <i>A Sociedade do Espetáculo</i>, 1967 [adaptado]).</p>","Na teoria debordiana, a dinâmica da 'sociedade do espetáculo' reconfigura a existência humana ao consagrar",["a vitória do artesanato manual sobre as linhas de montagem industriais automatizadas.","a eliminação completa de qualquer suporte midiático visual em prol da transmissão oral de mitos rurais.","a restauração do modelo clássico da ágora grega como espaço de deliberação política imune a ilusões retóricas.","a emancipação imediata dos trabalhadores através da recusa voluntária do uso da moeda física.","a primazia das aparências, das narrativas de imagem e da visibilidade pública sobre a autenticidade da vida concreta vivida."],4,"Resolução comentada:<br>• Correta: E. Guy Debord diagnostica que a sociedade moderna alienou a vida real ao substituí-la por um fluxo ininterrupto de representações visuais: a existência reduz-se ao 'parecer', onde a validação dos indivíduos depende de sua conformidade e visibilidade nas vitrines e imagens produzidas pelo mercado do entretenimento e da publicidade.<br>• Incorreta A: A sociedade do espetáculo é o ápice da mercantilização industrial moderna, oposta ao artesanato arcaico.<br>• Incorreta B: As mídias visuais se expandiram hiperbolicamente, tornando-se o mediador onipresente das relações sociais.<br>• Incorreta D: Debord aponta a alienação do espectador passivo, e não a emancipação fácil pela recusa da moeda.<br>• Incorreta C: A esfera pública transformou-se em espetáculo publicitário de candidatos e celebridades, degradando o debate democrático autêntico."],"Max Horkheimer: Teoria Tradicional versus Teoria Crítica":["No manifesto seminal <i>Teoria Tradicional e Teoria Crítica</i> (1937), Max Horkheimer estabeleceu a certidão de nascimento conceitual da Escola de Frankfurt. A Teoria Tradicional (herdeira do positivismo e de Descartes) concebe a ciência como uma atividade supostamente 'neutra', técnica e desinteressada, cuja tarefa seria apenas descrever, mensurar e classificar os fatos dados da realidade para formular leis preditivas a serviço do mercado. Horkheimer denuncia que essa neutralidade é uma ilusão ideológica que serve para legitimar e reproduzir a ordem social capitalista vigente. Em contraposição, a Teoria Crítica é conscientemente situada no processo histórico: sua finalidade não é adaptar os homens à sociedade de dominação, mas criticar as contradições do presente e apontar para a Emancipação humana, abolindo a injustiça e a exploração social.",["Teoria Tradicional: ciência que se finge neutra, compartimentada e voltada para a eficácia técnica e o controle","Teoria Crítica: reflexão filosófico-sociológica engajada na emancipação e na transformação das estruturas de opressão","Crítica ao Positivismo: a ciência nunca é neutra; está sempre imersa nos interesses materiais e contradições de sua época","Interdisciplinaridade: articulação dialética entre filosofia, economia política marxista e psicanálise freudiana","Emancipação humana: a meta suprema de uma sociedade livre e racional onde os homens governem suas próprias vidas"],"No ENEM: a Teoria Tradicional pergunta 'COMO funciona a máquina social para que ela opere com o máximo lucro?'. A Teoria Crítica pergunta 'A QUEM SERVE esse sistema e como podemos transformá-lo para libertar os oprimidos?'.","<p>'A teoria crítica da sociedade recusa o conformismo da teoria tradicional, que aceita os fatos estabelecidos como se fossem leis naturais eternas. A teoria crítica tem por objeto os próprios homens como produtores de sua história. Seu objetivo supremo não é o mero aprimoramento da maquinaria econômica, mas a emancipação dos seres humanos de todas as formas de escravização e servidão que os alienam.' (HORKHEIMER, M. <i>Teoria Tradicional e Teoria Crítica</i>, 1937 [adaptado]).</p>","A distinção estabelecida por Max Horkheimer entre a teoria tradicional e a teoria crítica reside no fato de que esta última",["abandona a pretensa neutralidade positivista para desmascarar as contradições sociais e atuar em prol da emancipação humana.","restringe suas investigações ao cálculo matemático de probabilidades financeiras para investidores da bolsa de valores.","defende a restauração das corporações de ofício medievais sob a tutela do clero feudal.","exige a expulsão de todos os operários das indústrias para substituí-los por animais de carga sem salário.","afirma que a sociedade capitalista atingiu a perfeição moral absoluta e jamais necessitará de qualquer reforma."],0,"Resolução comentada:<br>• Correta: A. Horkheimer fundamenta a Teoria Crítica como um saber transformador: ela não se contenta em descrever passivamente os dados da realidade social (como faz a teoria tradicional a serviço da eficiência do capital), mas investiga as raízes históricas do sofrimento humano, desnaturaliza a dominação e compromete-se com a superação da opressão e a construção de uma sociedade livre e emancipada.<br>• Incorreta B: A redução do saber a cálculos utilitários mercantis é o traço da própria teoria tradicional criticada.<br>• Incorreta C: Os frankfurtianos usavam o materialismo dialético e não o tradicionalismo reacionário feudal.<br>• Incorreta D: A teoria crítica visa à libertação da classe trabalhadora, não à sua destruição.<br>• Incorreta E: Ela demonstra que o capitalismo é repleto de crises e barbáries que demandam superação radical."],"Theodor Adorno: Educação Contra a Barbárie após Auschwitz":["Em sua célebre conferência radiofônica <i>Educação após Auschwitz</i> (1966), Theodor W. Adorno pronunciou uma das exigências morais e pedagógicas mais imperativas da história contemporânea: 'A exigência que Auschwitz não se repita é a primeira de todas para a educação'. Adorno adverte que o Holocausto nazista não foi um acidente monstruoso isolado do passado, mas a expressão máxima da barbárie latente que continua viva dentro da civilização industrial moderna, alimentada pela técnica desprovida de reflexão, pela frieza burguesa e pela conformação autoritária de personalidades cegas à empatia. A verdadeira educação emancipatória não pode ser adestramento técnico para o mercado de trabalho ou transmissão passiva de dados; ela deve ser Educação para a Autorreflexão Crítica (<i>Mündigkeit</i>), capacitando o indivíduo a resistir ao rebanho e a recusar a obediência cega a ordens desumanas.",["Educação após Auschwitz: o imperativo categórico pedagógico supremo de que a barbárie do genocídio não volte a acontecer","Personalidade autoritária: estudo pioneiro de Adorno sobre os traços psicológicos que facilitam a adesão cega ao fascismo","Frieza burguesa: a indiferença moral diante do sofrimento alheio como condição prévia que permitiu o Holocausto","Crítica ao adestramento técnico: a técnica sofisticada a serviço do massacre em massa desprovida de coração ético","Mündigkeit (Maioridade emancipatória): formação da autonomia reflexiva para que o cidadão diga NÃO a ordens imorais"],"No ENEM: essa tese é frequente em temas sobre educação e direitos humanos. Para Adorno, de nada adianta uma escola ensinar matemática avançada e robótica se ela formar sujeitos frios e insensíveis capazes de tolerar novos massacres e preconceitos.","<p>'Qualquer debate sobre metas educacionais carece de sentido diante desta exigência fundamental: que Auschwitz não se repita. Se foi possível acontecer, a possibilidade de repetição continua presente na sociedade contemporânea. A educação só é verdadeira se for uma educação para a autorreflexão crítica, arrancando os homens da frieza social que permite que a barbárie se instale sob o manto da civilização técnica.' (ADORNO, T. W. <i>Educação e Emancipação</i>, 1966 [adaptado]).</p>","Na reflexão pedagógica e filosófica de Theodor Adorno, o compromisso prioritário da educação nas sociedades contemporâneas deve ser",["treinar habilidades técnicas corporais para acelerar o ritmo de empacotamento nas linhas fabris de montagem.","formar consciências autônomas e reflexivas dotadas de empatia e capacidade crítica para impedir a repetição de genocídios e barbáries.","impor o silêncio aos alunos em sala de aula através da aplicação de punições físicas e castigos corporais diários.","ensinar aos jovens a arte de justificar crimes de guerra cometidos pelas autoridades militares estatais.","restringir o acesso aos livros de sociologia e história nas bibliotecas escolares públicas."],1,"Resolução comentada:<br>• Correta: B. Para Adorno, a educação não tem como finalidade primordial a mera capacitação mercadológica ou disciplinar, mas a formação moral e crítica de sujeitos autônomos (Mündigkeit). Auschwitz expôs o perigo mortal de uma sociedade hipertecnológica e fria, onde homens comuns cumpriram ordens de massacre em massa. A escola deve cultivar a autorreflexão e a sensibilidade ética para vacinar a humanidade contra o fascismo e a barbárie.<br>• Incorreta A: A redução da educação a adestramento fabril instrumental desumaniza os estudantes.<br>• Incorreta C: A violência e a opressão na infância forjam a 'personalidade autoritária' denunciada por Adorno.<br>• Incorreta D: O objetivo supremo da pedagogia crítica é exatamente deslegitimar a obediência cega a ordens criminosas.<br>• Incorreta E: A leitura crítica da história e das humanidades é a ferramenta indispensável da emancipação."],"Jürgen Habermas: A Mudança Estrutural da Esfera Pública":["Em sua tese clássica <i>A Mudança Estrutural da Esfera Pública</i> (1962), Jürgen Habermas reconstitui a história da opinião pública na Europa moderna. Nos séculos XVIII e XIX, nos cafés da Inglaterra e salões da França iluminista, burgueses letrados reuniam-se para debater literatura e política através do uso público da razão contra o segredo dos gabinetes reais (a 'Esfera Pública Burguesa'). Esse espaço era regido pelo princípio do melhor argumento e da publicidade aberta. Contudo, com o avanço do capitalismo monopolista e da Indústria Cultural no século XX, operou-se uma degeneração estrutural: a esfera pública foi 'refeudalizada'. O debate crítico e racional de cidadãos foi colonizado pela propaganda corporativa, pelas relações públicas publicitárias e pelo consumo passivo de espetáculos midiáticos, degradando os cidadãos em meros consumidores de imagens políticas prontas.",["Esfera Pública Burguesa (Öffentlichkeit): nascimento do espaço cívico de debate racional laico nos cafés e jornais iluministas","Princípio da Publicidade: o dever de que as ações e leis do governo sejam públicas, transparentes e debatidas abertamente","Refeudalização da esfera pública: a transformação do debate cívico em encenação publicitária de candidatos e marcas comerciais","Cidadão vs Consumidor: a perda da ação deliberativa em benefício do consumo acrítico de narrativas de entretenimento político","Colonização do Mundo da Vida: a invasão da comunicação humana autêntica pelas lógicas instrumentais do Dinheiro e do Poder burocrático"],"No ENEM: a tese de Habermas explica perfeitamente a política contemporânea de marketing eleitoral e redes sociais: em vez de debate sério com argumentos e propostas (deliberação), temos propaganda emocional, jingles e guerra de marqueteiros (refeudalização).","<p>'Na esfera pública burguesa originária, as pessoas privadas reuniam-se em público para compelir a autoridade estatal a legitimar-se perante o fórum do uso público da razão. Contudo, com a transformação das mídias em conglomerados comerciais e a invasão das relações públicas publicitárias, o público de cidadãos que raciocina criticamente sobre política foi gradativamente substituído por um público de consumidores que apenas aplaude espetáculos previamente encenados.' (HABERMAS, J. <i>Mudança Estrutural da Esfera Pública</i>, 1962 [adaptado]).</p>","O diagnóstico habermasiano sobre a 'mudança estrutural da esfera pública' denuncia o processo histórico no qual",["os cidadãos passaram a debater todas as decisões de governo nas praças públicas com absoluta imparcialidade científica.","todas as empresas de rádio e jornal do mundo foram estatizadas por governos comunistas radicais.","a deliberação racional e crítica da opinião pública foi esvaziada e substituída por técnicas de propaganda comercial e consumo passivo de espetáculos midiáticos.","a leitura de jornais impressos foi totalmente proibida nos países membros da União Europeia.","as monarquias absolutistas feudais recuperaram o controle militar de todas as capitais mundiais."],2,"Resolução comentada:<br>• Correta: C. Habermas demonstra a decadência da esfera pública: o espaço que nascera no Iluminismo para ser a arena crítica do livre debate racional de argumentos e fiscalização do Estado foi colonizado pelo marketing, pela publicidade e pela indústria cultural de massa. A política transformou-se em espetáculo encenado para capturar votos de cidadãos passivos, corrompendo o ideal emancipatório da democracia deliberativa.<br>• Incorreta A: Esse era o ideal originário iluminista que, segundo Habermas, foi degradado na contemporaneidade.<br>• Incorreta B: A mídia concentrou-se em oligopólios capitalistas privados de comunicação e entretenimento.<br>• Incorreta D: As mídias expandiram-se hiperbolicamente em volume, mas perderam em profundidade crítica.<br>• Incorreta E: A 'refeudalização' em Habermas é uma metáfora para a encenação de prestígio e imagem, não a volta de castelos feudais com espadas."],"Herbert Marcuse e o Homem Unidimensional":["Integrante da primeira geração da Escola de Frankfurt, o filósofo Herbert Marcuse publicou em 1964 a obra clássica 'O Homem Unidimensional' (A Ideologia da Sociedade Industrial Avançada). Marcuse argumenta que o capitalismo tecnológico contemporâneo desenvolveu formas inéditas e sutis de controle totalitário que não precisam recorrer à força física bruta. Por meio da indução massiva de 'falsas necessidades' materiais pelo consumo e pela indústria cultural, o sistema integra e anestesia as classes trabalhadoras, liquidando o pensamento crítico e a capacidade de negação dialética. A sociedade torna-se 'unidimensional' porque todas as contradições, alternativas políticas e rebeldias são cooptadas e transformadas em mercadorias vendáveis, esterilizando a capacidade humana de sonhar com outra ordem social.",["Homem Unidimensional: perda da dimensão crítica e negativa do pensamento, achatado pelo consumo","Falsas necessidades: desejos manufaturados pelo mercado publicitário para garantir a reprodução econômica","Tolerância repressiva: o sistema tolera manifestações superficiais de protesto desde que não ameacem a ordem","O Grande Recuso: a necessidade moral e existencial de rejeitar a racionalidade tecnológica opressiva"],"Marcuse é muito cobrado no ENEM nas interfaces entre Teoria Crítica e movimentos socioculturais. O ponto fulcral de sua análise é como a abundância aparente de produtos gera servidão psicológica em vez de emancipação.","\"Uma confortável, suave, razoável e democrática não liberdade prevalece na civilização industrial avançada, como sinal de progresso técnico. A perda de liberdade não decorre da opressão exercida por um tirano clássico, mas do próprio mecanismo que satisfaz as necessidades geradas pelo aparato produtivo. O indivíduo identifica-se espontaneamente com a existência que lhe é imposta e nela encontra satisfação e realização. As pessoas reconhecem-se em suas mercadorias; encontram a sua alma em seu automóvel, em seu aparelho de som, em sua casa de dois pisos, em seu equipamento de cozinha.\" (MARCUSE, Herbert. O Homem Unidimensional).","O diagnóstico de Herbert Marcuse sobre o funcionamento ideológico do capitalismo industrial avançado evidencia que a dominação social contemporânea se consolida primordialmente pela",["eliminação do comércio de bens manufaturados para retornar a economias agrárias feudais.","adoção compulsória de práticas místicas de contemplação ascética que esvaziam os shopping centers.","proibição militarizada de qualquer inovação científica ou modernização dos equipamentos eletrônicos.","canalização dos anseios de liberdade para o consumo contínuo de mercadorias que reproduzem o sistema.","erradicação integral de desigualdades salariais entre gerentes fabris e trabalhadores manuais."],3,"Resolução detalhada:\n• Correta: D. Marcuse demonstra que a sociedade industrial avançada anestesia a pulsão contestatória ao prometer bem-estar material imediato através do consumo; as pessoas confundem liberdade de escolha no mercado com verdadeira emancipação humana.\n• Incorreta A: A sociedade contemporânea estimula a aceleração do consumo de massas, e não o retorno à agricultura feudal.\n• Incorreta C: O sistema promove intensamente a ciência e a técnica, usando a tecnologia como instrumento legitimador da conformidade.\n• Incorreta B: O consumo de mercadorias é a regra hegemônica da sociedade descrita por Marcuse, e não o ascetismo.\n• Incorreta E: A exploração e as desigualdades persistem de forma aguda, embora disfarçadas sob o fetiche da abundância de quinquilharias."],"Theodor Adorno e a Teoria da Semiformação (Halbbildung)":["Em seu ensaio clássico de 1959, 'Teoria da Semiformação' (Theorie der Halbbildung), Theodor W. Adorno analisa a degradação do ideal iluminista da emancipação cultural humana (a <i>Bildung</i>). A semiformação não é simplesmente o analfabetismo ingênuo ou a ausência de acesso à escola; é algo muito mais perigoso: é a apropriação fragmentada, apressada e superficial de conteúdos culturais desprovidos de reflexão histórica, transformados em clichês de consumo e frases de efeito. A Indústria Cultural converte o saber em fetiche e exibição de erudição rápida. O indivíduo semiformado acredita piamente que sabe de tudo porque memorizou resumos rasos e manchetes sensacionalistas, tornando-se impermeável à autocrítica e presa extremamente fértil para preconceitos, fake news e discursos autoritários.",["Bildung versus Halbbildung: o ideal emancipador da formação humana integral rebaixado à semiformação alienante","A ilusão do saber: o semiformado não tem consciência de sua ignorância; ele confunde clichês com conhecimento profundo","Fragmentação cultural: consumo de pedaços desconexos de informação sem síntese dialética crítica","Propensão ao autoritarismo: a mente semiformada adere com facilidade a explicações simplistas e bodes expiatórios"],"A teoria da Semiformação de Adorno é uma das chaves mais poderosas para o ENEM contemporâneo! Ela explica com perfeição os perigos da superficialidade nas redes sociais, o terraplanismo e a pós-verdade.","\"A semiformação não é um estágio preliminar da formação humana, um meio-caminho que poderia ser completado pela simples adição de mais anos de instrução. Ela é a sua inimiga mortal: é a formação convertida em mercadoria cultural adaptada à psicologia de massas. O semiformado é aquele que se apossou dos bens culturais como quem coleciona símbolos de prestígio, assimilando o saber em forma de fórmulas prontas e jargões desprovidos de vida. Por haver absorvido tantas informações sem jamais tê-las digerido reflexivamente, sua consciência adquire uma blindagem rígida contra qualquer experiência autêntica, acolhendo o preconceito fanático com a arrogância da falsa certeza.\" (ADORNO, Theodor W. Teoria da Semiformação).","Ao conceituar a semiformação no contexto da sociedade contemporânea, Theodor Adorno desvela um fenômeno cognitivo e político caracterizado pelo(a)",["ausência total de qualquer suporte de comunicação impressa ou eletrônica nas capitais industriais.","subordinação incondicional das decisões de consumo estético aos votos emitidos por camponeses analfabetos.","conquista definitiva da emancipação racional universal por meio da memorização mecânica de enciclopédias escolares.","retorno espontâneo aos ritos iniciáticos sagrados das tribos pastoris da Idade do Bronze.","apropriação fragmentária e acrítica de saberes que gera a ilusão de conhecimento e fomenta a intolerância dogmática."],4,"Resolução detalhada:\n• Correta: E. Adorno denuncia que a semiformação produz um sujeito perigoso: munido de frag
