ta da união indissociável de duas fontes: a Sensibilidade (que recebe as impressões ordenadas nas formas puras a priori do Espaço e do Tempo) e o Entendimento (que organiza essas intuições através de Categorias puras a priori, como a causalidade e a substância). Conhecemos apenas os fenômenos (o mundo como nos aparece), jamais a 'coisa-em-si' (númeno).",["Revolução Copernicana: o sujeito epistêmico ativo organiza a realidade, e não o inverso","Sensibilidade: faculdade de receber intuições ordenadas a priori pelo Espaço e pelo Tempo","Entendimento: faculdade de sintetizar os dados sensíveis através de conceitos e Categorias puras (causa, substância)","Fenômeno vs Númeno: conhecemos os fenômenos (a realidade filtrada pela nossa cognição), mas a coisa-em-si (númeno) é incognoscível","Síntese a priori: 'Pensamentos sem conteúdo são vazios; intuições sem conceitos são cegas'"],"Guarde a frase de ouro de Kant: 'Pensamentos sem conteúdo são vazios (razão sem sentidos); intuições sem conceitos são cegas (sentidos sem razão)'. Kant uniu racionalismo e empirismo superando os dois.","<p>'Até agora se supunha que todo o nosso conhecimento tinha de se regular pelos objetos; porém, todas as tentativas de estabelecer algo a priori sobre eles por meio de conceitos fracassaram sob essa hipótese. Experimentemos, pois, uma vez, se não obteremos melhor êxito admitindo que os objetos têm de se regular pelo nosso conhecimento.' (KANT, I. <i>Crítica da Razão Pura</i>, Prefácio à 2ª edição, 1787 [adaptado]).</p>","A denominada 'Revolução Copernicana' proposta por Kant na teoria do conhecimento estabelece que",["a mente humana possui estruturas cognitivas a priori que organizam e conformam ativamente a experiência do mundo fenomênico.","o ser humano é capaz de conhecer a essência metafísica de Deus e a coisa-em-si com exatidão matemática.","os animais e as plantas possuem as mesmas categorias racionais e formas da sensibilidade que os homens.","a ciência deve descartar a geometria e a física newtoniana por serem meras construções subjetivas arbitrárias.","o sujeito cognoscente é uma tábua rasa totalmente passiva diante das impressões mecânicas externas."],0,"Resolução comentada:<br>• Correta: A. A revolução copernicana de Kant transfere o centro da epistemologia do objeto para o sujeito: o conhecimento só é possível porque a mente humana possui formas a priori da sensibilidade (espaço e tempo) e categorias do entendimento (como a causalidade) que moldam e estruturam ativamente os dados empíricos recebidos, constituindo a experiência fenomênica.<br>• Incorreta E: A tábua rasa passiva é a tese de Locke; para Kant, o sujeito é ativo e organizador.<br>• Incorreta B: Kant afirma categoricamente que a 'coisa-em-si' (númeno) e Deus não podem ser conhecidos teoricamente pela ciência, pois ultrapassam a experiência possível.<br>• Incorreta D: O objetivo supremo de Kant era justamente justificar racionalmente a física de Newton e a geometria.<br>• Incorreta C: A análise kantiana refere-se especificamente à razão e cognição dos seres humanos racionais."],"Senso Comum versus Conhecimento Filosófico":["No cotidiano, a sobrevivência humana depende do senso comum: um corpo de saberes espontâneos, práticos, imediatos e assistemáticos, herdados da tradição familiar e da experiência imediata (como saber que o fogo queima ou que o sal tempera). Contudo, o senso comum costuma ser acrítico, fragmentário, permeado por preconceitos e ilusões subjetivas. Em contrapartida, o conhecimento filosófico caracteriza-se pelo rigor metodológico, pela sistematicidade, pela busca dos fundamentos últimos e pela recusa de aceitar como óbvio o que é fruto de convenção social. A filosofia começa precisamente pelo espanto (thaûma) e pelo estranhamento diante daquilo que todos consideram 'natural'.",["Senso Comum: saber prático, espontâneo, subjetivo, herdado e assistemático","Conhecimento Filosófico: saber crítico, conceitual, metódico, fundamentado e problematizador","Espanto filosófico (thaûma): estranhamento que rompe com a familiaridade cega do cotidiano","Desnaturalização: questionar práticas e preconceitos tratados como naturais pela cultura","Complementaridade: a filosofia não busca destruir a vida prática, mas iluminá-la com lucidez crítica"],"No ENEM, 'desnaturalizar' é a palavra-chave. O senso comum tende a naturalizar a realidade ('as coisas sempre foram assim e não podem mudar'); a filosofia mostra que valores e estruturas são construções históricas modificáveis.","<p>'O papel da filosofia é tornar o familiar estranho. Enquanto o senso comum acomoda-se às respostas prontas dadas pela rotina e pela tradição, o pensamento filosófico suspende as certezas fáceis e pergunta pelas razões do que parecia óbvio, desvelando os pressupostos ocultos de nossas crenças mais arraigadas.' (Adaptado de CHAUÍ, M. <i>Convite à Filosofia</i>).</p>","A atitude filosófica de estranhamento diante da realidade diferencia-se do senso comum porque",["promove a aceitação cega e incondicional das hierarquias e costumes vigentes na pólis.","submete os preconceitos e as evidências imediatas da vida cotidiana à investigação crítica e metódica.","reitera as explicações míticas e oraculares para tranquilizar as angústias da população.","restringe-se à memorização mecânica de dados técnicos sem questionar seus impactos éticos.","defende que a ignorância consciente é a condição ideal para a felicidade material dos indivíduos."],1,"Resolução comentada:<br>• Correta: B. O saber filosófico opera pelo questionamento radical daquilo que o senso comum considera óbvio ou natural: desnaturaliza as relações de poder, desconstrói preconceitos e exige fundamentação racional coerente para crenças que eram aceitas passivamente por costume.<br>• Incorreta C: A filosofia rompe com mitos oraculares e crenças infundadas.<br>• Incorreta A: A crítica filosófica desafia dogmas e tiranias, opondo-se ao conformismo passivo.<br>• Incorreta D: A memorização técnica é o oposto do exame reflexivo e conceitual da filosofia.<br>• Incorreta E: Para a tradição socrático-filosófica, a vida não examinada na ignorância não vale a pena ser vivida."],"Verdade, Ideologia e Pós-Verdade":["A questão da verdade atravessa a história do pensamento, desde a concepção grega de alétheia (desvelamento da realidade) e a teoria da correspondência de Tomás de Aquino (adequação do intelecto à coisa), até as análises contemporâneas de Karl Marx sobre a ideologia como falsa consciência — um sistema de representações ilusórias que oculta as contradições de classe para naturalizar a dominação. No século XXI, o debate ganha contornos urgentes com a noção de pós-verdade: um cenário no qual os fatos objetivos e as evidências científicas têm menos influência na formação da opinião pública do que os apelos emocionais e as crenças identitárias individuais, alimentados por bolhas algorítmicas de desinformação.",["Alétheia (Grécia Antiga): verdade como desvelamento, saída da obscuridade da ilusão","Correspondência clássica: a verdade como concordância entre o enunciado linguístico e o fato empírico real","Ideologia (Marx): inversão da realidade e naturalização de relações históricas de exploração","Regimes de verdade (Foucault): cada sociedade possui seus dispositivos institucionais que definem o que é aceito como verdade","Pós-verdade: primazia da adesão afetiva e da crença prévia sobre a comprovação factual verificável"],"No ENEM contemporâneo, questões sobre fake news e pós-verdade cobram a distinção entre fatos cientificamente comprovados e a manipulação ideológica de sentimentos de grupo em redes sociais.","<p>'O termo pós-verdade designa circunstâncias em que fatos objetivos e comprováveis têm menor poder de persuasão na moldagem da opinião pública do que apelos a emoções e a preconceitos pessoais arraigados. Nesse ambiente, a verdade factual é tratada como mera narrativa concorrente, perdendo seu papel de árbitro compartilhado da vida democrática.' (Adaptado de relatórios contemporâneos sobre Comunicação, Filosofia e Democracia).</p>","O fenômeno da pós-verdade e a proliferação deliberada de desinformação representam um risco para as sociedades democráticas porque",["estimulam a produção rigorosa e o respeito universal pelo conhecimento científico verificado.","fortalecem o consenso racional na esfera pública mediante o diálogo respeitoso entre diferentes posições.","erodem os parâmetros objetivos e factuais necessários para o debate público e a fiscalização dos poderes políticos.","promovem a extinção completa de quaisquer ferramentas digitais de comunicação instantânea.","restauram os rituais pagãos arcaicos como único critério jurídico para o julgamento de litígios civis."],2,"Resolução comentada:<br>• Correta: C. O perigo crucial da pós-verdade na vida republicana é a destruição do solo factual compartilhado: se qualquer mentira conveniente for equiparada à verdade científica verificada com base em paixões cegas, o debate democrático perde seu critério de racionalidade e a sociedade fica vulnerável à manipulação demagógica e a tiranias autoritárias.<br>• Incorreta A: A pós-verdade enfraquece o respeito pela ciência e pelo método investigativo.<br>• Incorreta B: Ela fragmenta o espaço público em bolhas polarizadas e hostis, inviabilizando o diálogo racional.<br>• Incorreta D: As ferramentas digitais não são extintas; pelo contrário, são os canais hipervelozes de disseminação do fenômeno.<br>• Incorreta E: A questão diz respeito à manipulação política da informação contemporânea, sem qualquer vínculo com rituais pagãos arcaicos."],"Gottfried Leibniz: Verdades de Razão e Verdades de Fato":["O polímata alemão Gottfried Wilhelm Leibniz (1646–1716) operou uma das mais refinadas sínteses racionalistas em sua <i>Monadologia</i> e nos <i>Novos Ensaios sobre o Entendimento Humano</i>. Para Leibniz, o conhecimento divide-se em dois tipos de proposições: 1) Verdades de Razão (necessárias e a priori, cujo oposto é logicamente impossível e gera contradição, como 'o triângulo tem três lados' ou as verdades matemáticas, regidas pelo Princípio de Não-Contradição); 2) Verdades de Fato (contingentes e a posteriori, cujo oposto é concebível sem contradição, como 'César cruzou o Rubicão' ou 'o sol nascerá amanhã', regidas pelo Princípio de Razão Suficiente — nada acontece sem que haja uma razão para ser assim e não de outro modo).",["Verdades de Razão: necessárias, imutáveis, fundadas na lógica pura e a priori","Verdades de Fato: contingentes, empíricas, fundadas no Princípio de Razão Suficiente e a posteriori","Princípio de Razão Suficiente: 'nenhum fato pode ser verdadeiro sem que haja uma razão suficiente por que seja assim e não de outro modo'","Crítica à tábula rasa de Locke: a mente tem ideias inatas em potência, como os veios no bloco de mármore","Mônadas: substâncias espirituais simples, vivas e indivisíveis que constituem a harmonia pré-estabelecida por Deus"],"No ENEM: a resposta de Leibniz a Locke é genial: 'Nada está no intelecto sem ter passado pelos sentidos — a não ser o próprio intelecto!' A mente não é uma folha lisa e passiva; traz estruturas inatas prontas para pensar.","<p>'Há duas espécies de verdades: as de razão e as de fato. As verdades de razão são necessárias e seu oposto é impossível; as verdades de fato são contingentes e seu oposto é possível. Quando uma verdade é necessária, pode-se encontrar sua razão por meio da análise lógica, decompondo-a em ideias e verdades mais simples, até chegar aos axiomas primitivos.' (LEIBNIZ, G. W. <i>Monadologia</i>, 1714 [adaptado]).</p>","Na epistemologia de Leibniz, a distinção entre verdades de razão e verdades de fato estabelece que",["as proposições lógicas e matemáticas podem ser derrogadas a qualquer instante por mudanças nas marés marinhas.","a mente humana é incapaz de alcançar qualquer certeza científica sem recorrer à astrologia dos caldeus.","todos os fatos históricos humanos estavam gravados com exatidão matemática nas pedras das pirâmides egípcias.","as verdades de razão são universais e necessárias pela lógica pura, enquanto as verdades de fato dependem da contingência do mundo histórico empírico.","as duas categorias de verdades são idênticas e podem ser verificadas exclusivamente pelo toque dos dedos."],3,"Resolução comentada:<br>• Correta: D. Leibniz demarca com clareza as duas dimensões do saber: as verdades de razão (lógica, geometria) valem em todos os mundos possíveis porque sua negação acarreta contradição lógica insustentável; já as verdades de fato (fatos históricos, físicas empíricas) descrevem contingências do mundo real cuja negação é logicamente concebível, exigindo investigação factual e a justificativa da razão suficiente.<br>• Incorreta A: As verdades de razão são imutáveis e eternas, imunes a variações físicas.<br>• Incorreta C: Fatos históricos não são axiomas astronômicos gravados em pirâmides.<br>• Incorreta B: Leibniz fundou o cálculo diferencial com Newton e a lógica moderna, repudiando superstições.<br>• Incorreta E: As verdades de razão são deduzidas pelo intelecto a priori, não pelo toque sensorial."],"A Fenomenologia de Edmund Husserl: Às Coisas Mesmas":["No início do século XX, Edmund Husserl fundou o método da Fenomenologia com o célebre lema: 'Voltemos às coisas mesmas!'. Husserl rejeitou tanto o psicologismo ingênuo quanto o positivismo cego que reduzia a realidade a objetos materiais exteriores. A Fenomenologia é o estudo dos fenômenos: a realidade tal como se manifesta diretamente à consciência. O princípio central é a Intencionalidade da Consciência: 'toda consciência é consciência de alguma coisa' — a mente nunca é uma caixa vazia isolada, mas está sempre direcionada para um objeto (ao perceber, percebe algo; ao amar, ama algo; ao duvidar, duvida de algo). Para alcançar as essências puras dos fenômenos, Husserl propõe a Époché Fenomenológica: suspender ou 'colocar entre parênteses' as certezas prévias e os preconceitos do senso comum.",["Fenomenologia: descrição rigorosa do mundo tal como ele aparece vivenciado na consciência (Lebenswelt)","Intencionalidade: propriedade fundamental da consciência de estar sempre orientada para um objeto intencional","Époché (redução fenomenológica): suspensão de julgamentos dogmáticos sobre a existência material externa para captar o sentido puro do fenômeno","Variação Eidética: método de imaginação livre para identificar a essência invariável (eidos) de um conceito ou vivência","Mundo da Vida (Lebenswelt): o solo originário da experiência humana concreta e pré-científica esquecido pela tecnociência"],"No ENEM: Fenomenologia = Intencionalidade (a mente sempre visa algo) + Époché (colocar o mundo entre parênteses para olhar sem preconceitos). Esse método influenciou Sartre, Heidegger e Merleau-Ponty.","<p>'Toda consciência é consciência de algo. Seja uma percepção sensível, uma recordação, uma fantasia ou um ato de amor, o ato da consciência traz em si mesmo o objeto intencional ao qual visa. Voltar às coisas mesmas significa superar as teorias abstratas e descrever a experiência vivida tal como ela se doa originariamente à intuição.' (HUSSERL, E. <i>Ideias para uma Fenomenologia Pura</i>, 1913 [adaptado]).</p>","A tese fenomenológica husserliana da 'intencionalidade da consciência' significa que",["a mente humana é um cofre hermeticamente fechado sem nenhuma abertura para o mundo exterior.","o conhecimento humano decorre da transmissão telepática de ideias entre governantes e súditos.","todas as pessoas do planeta possuem exatamente as mesmas intenções políticas e econômicas secretas.","os objetos do mundo material continuam pensando mesmo quando não há nenhum ser vivo consciente para contemplá-los.","a consciência humana é essencialmente relacional e ativa, constituindo-se sempre como abertura dirigida a um objeto intencional."],4,"Resolução comentada:<br>• Correta: E. A intencionalidade é a descoberta capital da fenomenologia: a consciência não é uma substância passiva estática (como a tábula rasa) nem um espírito solipsista fechado em si mesmo, mas um movimento dinâmico e relacional. Ser consciente é projetar-se para o mundo, atribuindo significado e doação de sentido aos objetos e vivências intencionais que se apresentam à experiência.<br>• Incorreta A: A consciência não é fechada; é pura abertura intencional ao objeto.<br>• Incorreta C: 'Intencionalidade' em fenomenologia não significa plano moral secreto de uma pessoa, mas a direção cognitiva da mente.<br>• Incorreta D: Os objetos materiais não têm consciência em-si na fenomenologia husserliana.<br>• Incorreta B: Husserl elaborou um método filosófico rigoroso e descritivo, alheio a telepatia ou esoterismo."],"O Círculo Hermenêutico e a Interpretação do Sentido":["A Hermenêutica Filosófica — desenvolvida principalmente por Hans-Georg Gadamer em <i>Verdade e Método</i> (1960) e Paul Ricoeur — transformou a arte da interpretação de textos em uma ontologia da compreensão humana. Gadamer demonstrou que o intérprete nunca se aproxima de uma obra de arte, de um texto filosófico ou de um fato histórico como uma tábula rasa neutra: ele sempre carrega uma 'Pré-Compreensão' forjada pela sua própria tradição, linguagem e época histórica. Compreender é operar a Fusão de Horizontes: o encontro dialogal entre o horizonte do texto e o horizonte do intérprete. O Círculo Hermenêutico expressa o movimento circular e infinito do entendimento: para compreender a parte é preciso compreender o todo, e para compreender o todo é preciso compreender as partes.",["Hermenêutica: teoria e filosofia da interpretação e da compreensão do sentido humano","Círculo Hermenêutico: relação recíproca entre a compreensão da parte e a totalidade do contexto","Fusão de Horizontes (Horizontverschmelzung): encontro transformador entre a tradição histórica do texto e a do leitor","Reabilitação dos Pré-Juízos: nossos preconceitos legítimos não são apenas erros, mas o ponto de partida de toda compreensão","Linguagem como horizonte ontológico: 'O ser que pode ser compreendido é linguagem'"],"No ENEM: a hermenêutica mostra que ninguém é 100% neutro ao ler um texto histórico ou filosófico. Todos nós lemos o passado a partir dos problemas e da linguagem do nosso presente (fusão de horizontes).","<p>'Compreender um texto do passado não é reproduzir mecanicamente a mente do autor, mas participar de um diálogo vivo com a tradição. O leitor traz consigo suas próprias perguntas e horizontes históricos; no encontro com o texto, opera-se uma fusão de horizontes na qual tanto o leitor quanto o texto saem transformados pelo sentido revelado.' (GADAMER, H.-G. <i>Verdade e Método</i>, 1960 [adaptado]).</p>","De acordo com a hermenêutica filosófica de Gadamer, a interpretação crítica de uma obra exige",["o reconhecimento dos horizontes e pré-compreensões do leitor, articulados no diálogo construtivo com a tradição do texto.","o isolamento ascético do leitor que renuncia ao idioma materno para esquecer sua própria época histórica.","a memorização mecânica de palavras sem buscar o sentido contextual dos argumentos originais.","a proibição de que jovens estudantes leiam obras de autores falecidos há mais de cinquenta anos.","a afirmação de que cada texto possui um único significado imutável que jamais pode ser reinterpretado."],0,"Resolução comentada:<br>• Correta: A. A hermenêutica gadameriana supera a ilusão positivista da neutralidade absoluta: o intérprete pertence a uma história e a uma linguagem específicas. Ao ler um clássico, ele não apaga sua própria época, mas estabelece uma fusão de horizontes — um diálogo fecundo no qual suas perguntas contemporâneas iluminam o texto e o texto desafia seus próprios preconceitos, gerando novo sentido ético e cultural.<br>• Incorreta B: Gadamer afirma que é impossível e indesejável anular a própria condição histórica do leitor.<br>• Incorreta C: A memorização mecânica é o oposto da compreensão hermenêutica viva.<br>• Incorreta D: O diálogo fecundo com a tradição dos clássicos é o coração da hermenêutica.<br>• Incorreta E: O sentido de um grande texto não é estático ou congelado; ele desvela novos horizontes a cada geração que o lê."],"O Idealismo Transcendental de Kant":["Com sua Crítica da Razão Pura (1781), Immanuel Kant realiza a 'Revolução Copernicana' na epistemologia: em vez de a mente conformar-se passivamente aos objetos exteriores, são os objetos que devem regular-se pelas estruturas cognitivas a priori do sujeito cognoscente. O Idealismo Transcendental sustenta que não podemos conhecer as 'coisas em si mesmas' (númeno), mas tão somente como elas nos aparecem estruturadas por nossa mente (fenômeno). Para haver conhecimento científico, é necessária a síntese entre a Sensibilidade (que recebe os dados sensoriais organizados pelas formas a priori do espaço e do tempo) e o Entendimento (que pensa e unifica esses dados por meio de categorias puras a priori, como causalidade, substância e quantidade).",["Revolução Copernicana: o objeto de conhecimento gravita em torno das faculdades do sujeito","Distinção Fenômeno versus Númeno: conhecemos o que aparece à nossa percepção moldada a priori, não a coisa-em-si","Formas a priori da sensibilidade: espaço e tempo como molduras universais prévias da percepção","Categorias do entendimento: conceitos puros a priori (causalidade, substância) que unificam os dados empíricos"],"A Revolução Copernicana de Kant é tema cativo no ENEM. Lembre-se: 'pensamentos sem conteúdo são vazios; intuições sem conceitos são cegas'. Kant unifica racionalismo e empirismo!","\"Até agora se supôs que todo o nosso conhecimento tinha que se regular pelos objetos; porém, todas as tentativas de estabelecer sobre eles algo a priori mediante conceitos, com o que nosso conhecimento seria ampliado, fracassaram sob essa suposição. Que se tente, portanto, uma vez, ver se não teríamos maior sucesso nos problemas da metafísica supondo que os objetos devem regular-se pelo nosso conhecimento. Trata-se aqui de uma situação semelhante à do primeiro pensamento de Copérnico que, vendo que não conseguia explicar os movimentos celestes caso admitisse que todo o exército de estrelas girava em torno do espectador, experimentou se não seria mais bem-sucedido fazendo girar o espectador e deixando os astros em repouso.\" (KANT, Immanuel. Crítica da Razão Pura, Prefácio à 2ª edição).","A metáfora copernicana empregada por Kant fundamenta sua virada epistemológica ao estabelecer que a universalidade e a certeza do conhecimento científico provêm do(a)",["revelação direta dos mistérios ontológicos gravada na consciência pela providência divina.","papel ativo do sujeito cognitivo, cujas estruturas a priori ordenam a experiência dos fenômenos.","registro mecânico e passivo de impressões sensoriais que chegam à mente como folha em branco.","consenso estatístico temporário estabelecido entre corporações acadêmicas em periódicos privados.","reprodução idêntica e sem mediações conceituais da essência intrínseca da coisa-em-si absoluta."],1,"Resolução detalhada:\n• Correta: B. A virada kantiana demonstra que o sujeito não é um espelho passivo; ele possui formas e categorias prévias que organizam ativamente a matéria bruta da sensibilidade para produzir a ciência fenomênica.\n• Incorreta A: Kant exclui explicações místicas ou teológicas da teoria pura do conhecimento científico.\n• Incorreta C: A mente passiva é a tábula rasa de Locke, que Kant supera demonstrando a necessidade de estruturas a priori.\n• Incorreta D: Kant busca a universalidade e necessidade objetiva da física newtoniana, e não mero relativismo convencional.\n• Incorreta E: A 'coisa-em-si' (númeno) é inacessível ao conhecimento teórico humano; só conhecemos o 'fenômeno'."],"Teoria da Reminiscência no Diálogo Menon de Platão":["No diálogo socrático Menon, Platão aborda o paradoxo do conhecimento: como alguém pode procurar aquilo que não conhece (já que não saberá o que procura), e como procurará aquilo que já conhece (já que não há necessidade de procurar o que já se tem)? Para responder a esse dilema, Platão formula a Teoria da Reminiscência (anámnesis), vinculada à imortalidade e metempsicose da alma. Antes de encarnar no corpo físico material, a alma contemplou as Formas perfeitas e puras no Mundo das Ideias. Ao nascer, o choque da materialidade faz a alma esquecer essas verdades. Assim, aprender não consiste em introduzir novos saberes de fora para dentro, mas em 'recordar' as essências inteligíveis eternas que jazem adormecidas no íntimo do ser humano.",["Paradoxo de Menon: a impossibilidade aparente de buscar tanto o que se ignora quanto o que se sabe","Anámnesis (reminiscência): aprender é despertar lembranças de verdades contempladas pela alma imortal","Experimento do escravo e da geometria: demonstração de que a razão descobre axiomas sem instrução prévia","Inatismo platônico: o conhecimento das essências perfeitas já está contido na alma antes da experiência"],"O inatismo de Platão (reminiscência) é o antecedente direto do inatismo cartesiano e contrapõe-se radicalmente ao empirismo de Locke. O exemplo do escravo que deduz o Teorema de Pitágoras no 'Menon' é muito citado em provas.","\"SÓCRATES: Dize-me, rapaz: sabes que este espaço quadrangular mede quatro pés? Observa agora: se duplicarmos o comprimento de cada lado, de que tamanho será o quadrado resultante? [...] Vês, Menon, que nada ensino a este jovem escravo, e que apenas lhe faço perguntas? E agora ele pensa que sabe qual é o comprimento da linha a partir da qual se formará o quadrado de oito pés. Portanto, a alma, sendo imortal e tendo nascido muitas vezes, tendo visto tanto as coisas daqui quanto as do Além, nada há que não tenha aprendido; de modo que não é de admirar que ela seja capaz de recordar o que anteriormente conhecia sobre a virtude e sobre o resto.\" (PLATÃO. Menon).","A passagem dramatiza a investigação socrática a fim de demonstrar a tese platônica de que a aquisição do verdadeiro conhecimento das essências universais opera como um(a)",["acúmulo passivo de dados empíricos oriundos da observação dos acidentes corporais da matéria.","adestramento comportamental fundado na memorização mecânica de dogmas consuetudinários.","processo de rememoração racional de verdades inteligíveis previamente contempladas pela alma.","invenção arbitrária de fórmulas convenientes para vencer debates jurídicos nas assembleias.","dom de nascença concedido unicamente aos membros hereditários das famílias reais da pólis."],2,"Resolução detalhada:\n• Correta: C. Na teoria platônica da reminiscência, a verdade matemática e moral já está impressa na alma; o método socrático apenas auxilia a 'dar à luz' e recordar o que foi esquecido no nascimento.\n• Incorreta B: Platão recusa o ensino mecânico; aprender exige reflexão e discernimento filosófico interior.\n• Incorreta A: O mundo sensível fornece apenas opiniões instáveis (dóxa), não a verdade pura inata da episteme.\n• Incorreta D: Essa visão relativista e utilitária é a dos sofistas, combatida por Sócrates e Platão.\n• Incorreta E: O fato de Sócrates interrogar um escravo demonstra exatamente que a faculdade de recordar o inteligível pertence à alma de qualquer ser humano."],"Dogmatismo versus Ceticismo na Epistemologia Clássica":["A história da teoria do conhecimento é perpassada pela polaridade entre o dogmatismo e o ceticismo. O dogmatismo caracteriza-se pela confiança plena e frequentemente ingênua na capacidade da razão ou da fé para alcançar a verdade indiscutível sobre as coisas, aceitando princípios fundamentais sem exigir demonstrações críticas ou duvidar da fidedignidade dos instrumentos cognitivos. Em contrapartida, o ceticismo ergue a dúvida sobre as certezas adquiridas: o ceticismo radical nega peremptoriamente que o conhecimento seja possível, enquanto o ceticismo metódico (como o cartesiano) utiliza a dúvida voluntária como ferramenta preliminar de depuração para desmoronar preconceitos e encontrar um fundamento inabalável.",["Dogmatismo ingênuo: crença cega na apreensão direta e transparente do real pela mente","Dogmatismo racionalista: convicção de que a metafísica pura alcança a essência das coisas sem crítica prévia","Ceticismo radical: rejeição de qualquer pretensão humana à posse de uma verdade indubitável","Ceticismo metódico: uso instrumental e construtivo da dúvida para expurgar erros e fundar a certeza"],"O filósofo Immanuel Kant costumava dizer que o ceticismo de David Hume o 'despertou do sono dogmático'. Compreender essa transição ajuda a responder a diversas questões de Filosofia Moderna no ENEM.","\"O dogmatismo é o procedimento dogmático da razão pura sem crítica prévia de sua própria capacidade. O cético, por sua vez, é o gnomo dos pesquisadores dogmáticos: onde quer que estes construam um edifício teórico sobre alicerces não verificados, o cético escava o solo por baixo deles até que toda a construção desmorone sob o peso de suas próprias contradições internas. Contudo, o ceticismo não é um lugar de repouso definitivo para a razão humana; é antes uma disciplina de transição para que a razão examine seus limites legítimos.\" (KANT, Immanuel. Crítica da Razão Pura).","Ao contrastar o dogmatismo acrítico com a postura dos céticos, a análise filosófica destaca que o ceticismo cumpre um papel pedagógico e metodológico fundamental ao",["estimular a adesão conformista e cega aos preceitos religiosos dominantes da sociedade civil.","interromper definitivamente qualquer esforço humano de investigação científica e pesquisa médica.","legitimar a censura inquisitorial de publicações acadêmicas que contrariem interesses estatais.","denunciar a fragilidade epistemológica de premissas teóricas tomadas levianamente como verdades absolutas.","substituir os métodos de dedução lógica pelo recurso a sortilégios e profecias astrológicas."],3,"Resolução detalhada:\n• Correta: D. A grande função do ceticismo na história da filosofia é abalar a arrogância intelectual do dogmatismo, forçando a razão a rever seus fundamentos e examinar rigorosamente a validade de suas teses.\n• Incorreta A: O dogmatismo estimula a adesão cega, enquanto o ceticismo desafia e desfaz conformismos.\n• Incorreta C: O ceticismo combate o autoritarismo epistêmico e a censura clerical inquisitorial.\n• Incorreta B: O ceticismo moderado ou metódico refina o método científico, impulsionando o rigor investigativo.\n• Incorreta E: O ceticismo desmonta superstições e astrologia, exigindo evidências que esses saberes não possuem."],"Pragmatismo e o Conceito de Verdade Operacional":["O pragmatismo, vertente filosófica norte-americana fundada no final do século XIX por Charles Sanders Peirce, William James e John Dewey, reorienta a discussão sobre a verdade: em vez de defini-la como espelhamento passivo ou correspondência estática com uma essência transcendental prévia, o pragmatismo vincula a verdade aos seus efeitos práticos e operacionais na experiência humana. Para William James, uma ideia é verdadeira quando ela 'funciona', isto é, quando nos guia eficazmente em meio às contingências do mundo, resolve problemas concretos e integra-se harmoniosamente ao conjunto de nossas vivências. A verdade não é uma propriedade parada no tempo, mas um processo de verificação dinâmico e contínuo.",["Charles S. Peirce: a máxima pragmática e a clarificação dos significados conceituais pelas suas consequências","William James: a verdade como valor de troca (cash-value) e eficácia vital das ideias na conduta","John Dewey: instrumentalismo cognitivo e a educação democrática como resolução reflexiva de problemas","Verdade como processo dinâmico: as ideias 'tornam-se' verdadeiras à medida que demonstram fecundidade prática"],"O pragmatismo é muito valorizado pelo ENEM contemporâneo quando aborda a metodologia científica, políticas públicas educacionais e a resolução colaborativa de impasses coletivos.","\"As ideias verdadeiras são aquelas que podemos assimilar, validar, corroborar e verificar. As ideias falsas são aquelas com as quais não podemos fazer isso. Essa é a diferença prática que significa para nós termos ideias verdadeiras. A posse da verdade, longe de ser um fim estático em si mesmo, é apenas um meio preliminar para outras satisfações vitais. Se você me perguntar qual é o valor em dinheiro vivo (cash-value) da verdade em termos de experiência empírica, a resposta é: ela nos coloca em uma relação operante e satisfatória com a realidade circundante.\" (JAMES, William. Pragmatismo).","Ao conceituar a verdade sob a ótica pragmatista, William James afasta-se das metafísicas idealistas clássicas porque localiza o critério de validação do conhecimento no(a)",["reprodução idêntica de arquétipos celestes intangíveis inacessíveis aos sentidos humanos.","subordinação irrestrita do pensamento humano a axiomas matemáticos puros e descontextualizados.","imposição dogmática de autoridades políticas amparadas pelo uso contínuo da coerção bélica.","desprezo sistemático pelas consequências concretas produzidas pela aplicação dos saberes.","impacto prático e funcional das teorias na orientação bem-sucedida das ações no mundo empírico."],4,"Resolução detalhada:\n• Correta: E. Para os pragmatistas, a verdade não é uma cópia cósmica inerte; ela é avaliada pela fecundidade, operabilidade e sucesso prático das proposições na resolução de problemas humanos reais.\n• Incorreta A: Os arquétipos celestes são do platonismo transcendental, rejeitado pelo empirismo pragmatista.\n• Incorreta C: O pragmatismo baseia-se na verificação experimental aberta, não no autoritarismo governamental bélico.\n• Incorreta D: O foco do pragmatismo é precisamente atentar às consequências práticas de nossas crenças.\n• Incorreta B: O pragmatismo contesta o formalismo puro que ignora o contexto da vida e da história."],"René Descartes: O Cogito e o Dualismo":["Além de fundar o método racionalista com o cogito, Descartes estabeleceu a ontologia do Dualismo Cartesiano (ou psicofísico), dividindo a realidade em duas substâncias finitas fundamentalmente distintas e independentes: a <i>res cogitans</i> (substância pensante — a alma, o intelecto, imaterial, livre e inextensa) e a <i>res extensa</i> (substância extensa — a matéria física, o corpo, espacial, divisível e governada pelas leis mecânicas da física). O corpo humano é compreendido por Descartes como uma máquina biológica sofisticada, regida por impulsos hidráulicos e alavancas mecânicas. A comunicação entre alma e corpo ocorreria, na sua hipótese fisiológica, através da glândula pineal no cérebro.",["Res cogitans: substância pensante (mente, alma, livre-arbítrio, imaterialidade)","Res extensa: substância extensa e material (espaço, massa, movimento mecânico determinista)","Mecanicismo cartesiano: o mundo físico e os corpos vivos funcionam como relógios mecânicos previsíveis","Dualismo mente-corpo: separação ontológica radical entre a consciência e o organismo físico","Substância infinita: Deus (garantidor supremo de que as ideias claras e distintas correspondem ao mundo exterior)"],"No mecanicismo cartesiano, os animais não possuem alma (res cogitans); para Descartes, são autômatos mecânicos complexos. A mente humana é a única exceção corpórea dotada de consciência e liberdade moral.","<p>'Examinando atentamente o que eu era, e vendo que podia supor que não tinha corpo algum e que não havia nenhum mundo nem lugar algum onde eu existisse, mas que nem por isso podia supor que não existia; e que, pelo contrário, do próprio fato de eu pensar em duvidar da verdade das outras coisas decorria muito evidentemente que eu existia; compreendi por aí que eu era uma substância cuja essência consiste apenas em pensar, e que, para existir, não necessita de nenhum lugar nem depende de coisa material alguma.' (DESCARTES, R. <i>Discurso do Método</i>, 1637 [adaptado]).</p>","A separação cartesiana entre <i>res cogitans</i> (mente) e <i>res extensa</i> (corpo/matéria) teve como desdobramento decisivo para a ciência moderna",["a concepção da natureza material como um mecanismo objetivo desprovido de alma e passível de medição e controle matemático.","a proibição de dissecações anatômicas e pesquisas médicas empíricas sobre o corpo humano.","a subordinação da física e da astronomia aos dogmas astrológicos das ordens monásticas.","a rejeição da geometria euclidiana e da álgebra na modelagem dos movimentos planetários.","a afirmação de que a mente humana é um mero produto químico dos fluidos corporais sem liberdade moral."],0,"Resolução comentada:<br>• Correta: A. Ao separar a mente da matéria e definir o mundo físico como pura extensão quantitativa regida por leis mecânicas (res extensa), Descartes desencantou a natureza: retirou dela as 'almas' animistas ou teleológicas da Idade Média, permitindo que a física, a mecânica e a medicina estudassem a matéria e o corpo humano como mecanismos mensuráveis e manipuláveis.<br>• Incorreta C: Descartes libertou a física da tutela teológica medieval.<br>• Incorreta B: O próprio Descartes realizava dissecações e defendia o avanço da medicina mecanicista.<br>• Incorreta D: Descartes foi o criador da geometria analítica, base da matematização da ciência moderna.<br>• Incorreta E: Reduzir a mente a matéria é materialismo reducionista; Descartes era dualista convicto da imaterialidade da res cogitans."],"Francis Bacon e a Crítica aos Ídolos":["Francis Bacon, filósofo inglês do início do século XVII, formulou as bases do método indutivo experimental em <i>Novum Organum</i> (1620), sintetizado no célebre aforismo: 'Saber é poder' — o conhecimento científico da natureza visa dominar suas leis para transformar a vida humana e aliviar a penúria material. Para inaugurar essa nova ciência empírica, Bacon afirmava ser indispensável purificar a mente dos 'Ídolos': falsas noções, vícios mentais e preconceitos que bloqueiam a percepção límpida da realidade. Ele classificou quatro espécies de ídolos: Ídolos da Tribo (inerentes à própria espécie humana e aos sentidos imperfeitos); Ídolos da Caverna (decorrentes da formação individual, educação e temperamento pessoal); Ídolos do Foro ou do Mercado (gerados pelas ambiguidades da linguagem e da comunicação pública); e Ídolos do Teatro (provenientes de sistemas dogmáticos de filosofias e doutrinas do passado).",["'Saber é poder' (Scientia potestas est): a ciência tem a missão pragmática de dominar e transformar a natureza","Método indutivo rigoroso: ascensão metódica do particular observado para os axiomas gerais da ciência","Ídolos da Tribo: limitações cognitivas universais da espécie humana (antropomorfismo e ilusões sensoriais)","Ídolos da Caverna: preconceitos subjetivos particulares de cada indivíduo forjados pelo meio social e hábitos","Ídolos do Foro/Mercado: ambiguidades, distorções semânticas e armadilhas da linguagem falada no comércio social","Ídolos do Teatro: dogmas herdados de escolas filosóficas antigas e teorias espetaculares aceitas sem crítica"],"Guarde os 4 ídolos de Bacon: Tribo = espécie humana; Caverna = indivíduo isolado; Foro = palavras/linguagem; Teatro = doutrinas e filosofias do passado. Saber essa classificação resolve questões em segundos no ENEM.","<p>'Quatro são os gêneros de ídolos que assediam os espíritos humanos. Para melhor distingui-los, demos-lhes nomes: o primeiro gênero é o dos ídolos da tribo; o segundo, o dos ídolos da caverna; o terceiro, o dos ídolos do foro; e o quarto, o dos ídolos do teatro. Todos esses ídolos devem ser repudiados e renegados com firme e solene resolução, e o intelecto deles inteiramente liberto e purificado.' (BACON, F. <i>Novum Organum</i>, 1620 [adaptado]).</p>","De acordo com a teoria baconiana, a superação dos 'ídolos do foro (ou do mercado)' exige dos investigadores",["o abandono de qualquer experimento empírico em laboratório em favor de silogismos aristotélicos puros.","a vigilância crítica contra as imprecisões e ambiguidades da linguagem comum que distorcem o raciocínio rigoroso.","a aceitação cega das terminologias mágicas divulgadas pelos alquimistas medievais.","a submissão incondicional aos textos teológicos das autoridades religiosas tradicionais.","o isolamento físico absoluto de todos os cientistas em mosteiros inacessíveis à sociedade civil."],1,"Resolução comentada:<br>• Correta: B. Os ídolos do foro (mercado) nascem do intercâmbio social através da palavra falada: as palavras do senso comum são frequentemente mal definidas, ambíguas ou vazias, aprisionando o intelecto em controvérsias estéreis. Superá-los requer definições conceituais exatas e rigor semântico na comunicação científica.<br>• Incorreta A: Bacon ataca frontalmente o silogismo aristotélico tradicional por considerá-lo estéril e verbalista.<br>• Incorreta C: Bacon critica a alquimia mística e as pseudociências sem método rigoroso.<br>• Incorreta D: Seu método empírico combate a autoridade dogmática dos livros sagrados na investigação da natureza.<br>• Incorreta E: Bacon prega uma ciência cooperativa e institucional (como na sua utopia Nova Atlântida), não isolamento estéril."],"Iluminismo e Esclarecimento (Aufklärung)":["O Iluminismo (século XVIII), ou Século das Luzes, foi um movimento intelectual e cultural que defendeu a centralidade da Razão, a ciência laica, a liberdade individual, o progresso humano e o combate ferrenho ao obscurantismo, à superstição e ao absolutismo monárquico. Em seu ensaio <i>Resposta à Pergunta: O que é o Esclarecimento?</i> (1784), Immanuel Kant define o Aufklärung como 'a saída do ser humano de sua menoridade, da qual ele próprio é culpado'. A menoridade é a incapacidade de pensar por si mesmo sem a condução de outrem (igreja, governantes, tutores). O lema do Iluminismo é <i>Sapere aude!</i> ('Ousa saber!' ou 'Tenha coragem de fazer uso do teu próprio entendimento!'). A autonomia do pensamento é a pré-condição indispensável da emancipação cívica e política.",["Aufklärung (Esclarecimento): superação da tutela intelectual e alcance da maioridade racional","Menoridade culpada: comodismo, preguiça e covardia que levam as pessoas a aceitar tutores de pensamento","Sapere aude: 'Ousa saber! Ousa pensar por ti mesmo!' (lema supremo do Iluminismo kantiano)","Uso público da razão: liberdade total de expressar argumentos críticos como cidadão instruído perante o público leitor","Uso privado da razão: cumprimento responsável das funções funcionais de um cargo ou dever cívico atribuído"],"No ENEM, atente para o conceito de 'menoridade' em Kant: ela não é falta de inteligência, mas falta de coragem e decisão para pensar sem que alguém diga o que você deve fazer ou crer.","<p>'O esclarecimento é a saída do homem de sua menoridade, da qual ele próprio é culpado. A menoridade é a incapacidade de fazer uso de seu entendimento sem a direção de outro indivíduo. O homem é o próprio culpado dessa menoridade se a sua causa não reside na falta de entendimento, mas na falta de decisão e de coragem de servir-se de si mesmo sem a direção de outrem. <i>Sapere aude!</i> Tem coragem de fazer uso de teu próprio entendimento, tal é o lema do esclarecimento.' (KANT, I. <i>Resposta à pergunta: O que é o esclarecimento?</i>, 1784 [adaptado]).</p>","Sob a perspectiva kantiana, o alcance da maioridade intelectual e da autonomia crítica pelo ser humano depende primordialmente",["da assimilação passiva de verdades indiscutíveis transmitidas pelos guias espirituais.","da obediência irrefletida aos decretos autoritários de monarcas absolutistas ilustrados.","da coragem e determinação pessoal para emancipar o próprio juízo do jugo de tutores e dogmas externos.","do acúmulo de bens materiais e títulos nobiliárquicos hereditários na sociedade de corte.","da renúncia ao uso da razão e da adesão exclusiva a paixões e instintos primitivos irracionais."],2,"Resolução comentada:<br>• Correta: C. Para Kant, a menoridade intelectual é uma condição autoimposta por comodismo e covardia. O Iluminismo exige a ousadia de pensar com autonomia (Sapere aude!), libertando o indivíduo da tutela de autoridades eclesiásticas, políticas ou familiares para que ele se torne um cidadão reflexivo e livre.<br>• Incorreta A: A tutela passiva de sacerdotes ou mestres é a própria definição da menoridade criticada por Kant.<br>• Incorreta B: Obedecer cegamente sem pensar reproduz a servidão intelectual.<br>• Incorreta D: Riquezas ou títulos aristocráticos não garantem maturidade reflexiva nem autonomia da razão.<br>• Incorreta E: O Iluminismo consagra a Razão crítica contra o obscurantismo e os instintos irracionais."],"Voltaire e a Defesa da Tolerância":["Voltaire (François-Marie Arouet, 1694–1778) foi a voz mais combativa do Iluminismo francês contra o fanatismo religioso, a intolerância civil e os privilégios anacrônicos do clero e da nobreza. Em obras como o <i>Tratado sobre a Tolerância</i> (1763) e o <i>Dicionário Filosófico</i>, Voltaire defendeu vigorosamente a liberdade de expressão, a laicidade do Estado e o respeito à pluralidade de credos e opiniões. Embora a célebre frase 'Posso não concordar com uma só palavra do que dizeis, mas defenderei até a morte o vosso direito de dizê-lo' seja uma paráfrase criada por sua biógrafa Evelyn Beatrice Hall, ela sintetiza com precisão o compromisso voltairiano com a tolerância recíproca como condição basilar da civilização e da convivência pacífica entre diferentes povos.",["Tolerância civil e religiosa: repúdio ao fanatismo, à perseguição inquisitorial e ao ódio sectário","Liberdade de expressão: direito inalienável de expressar ideias divergentes na esfera pública","Crítica ao clero fanático: 'Écrasez l'infâme' ('Esmagai a infame' superstição dogmática)","Deísmo voltairiano: crença racional em um Criador supremo (o 'Grande Arquiteto do Universo'), sem religião revelada oficial","Igualdade jurídica perante a lei: ataque aos privilégios feudais e à tortura judicial inquisitorial"],"Voltaire não era ateu: ele era deísta (acreditava na razão criadora, mas rejeitava dogmas religiosos e a Bíblia como ciência). Lembre-se: no ENEM, Voltaire é sinônimo de combate ao fanatismo e defesa da liberdade de expressão.","<p>'Não é aos homens que me dirijo; é a ti, Deus de todos os seres, de todos os mundos e de todos os tempos. Que as pequenas diferenças entre as vestimentas que cobrem nossos débeis corpos, entre todas as nossas línguas imperfeitas, entre todos os nossos costumes ridículos e todas as nossas leis imperfeitas, que todas essas pequenas nuances não sejam motivos de ódio e perseguição!' (VOLTAIRE. <i>Tratado sobre a Tolerância</i>, 1763 [adaptado]).</p>","A crítica voltairiana ao fanatismo religioso articula-se em defesa de uma sociedade fundamentada",["na proibição estrita de qualquer manifestação de crença ou fé no âmbito da vida privada.","na imposição forçada de uma religião de Estado sobre todas as minorias étnicas.","no fechamento de todos os tribunais civis em benefício do poder inquisitorial clerical.","na tolerância mútua e no respeito inalienável à liberdade de consciência e de expressão.","na supremacia bélica das nações ocidentais com a finalidade de erradicar culturas estrangeiras."],3,"Resolução comentada:<br>• Correta: D. Voltaire argumenta que a pluralidade de visões e a tolerância são os verdadeiros pilares da paz social: o fanatismo e as guerras religiosas decorrem da pretensão doentia de impor uma única crença a todos. A civilização floresce onde a liberdade de pensamento e de culto é protegida pela lei laica.<br>• Incorreta B: A imposição de uma fé oficial é o próprio despotismo combatido por Voltaire.<br>• Incorreta C: Voltaire lutou contra a Inquisição e exigiu a reforma humanitária do sistema penal (como no Caso Calas).<br>• Incorreta A: O autor defende a liberdade de culto e de consciência íntima, não sua proibição.<br>• Incorreta E: O cosmopolitismo voltairiano ironizou o etnocentrismo europeu em obras como <i>Cândido</i>."],"Rousseau: Crítica à Desigualdade e ao Progresso":["Enquanto a maioria dos filósofos iluministas celebrava o desenvolvimento das artes, das ciências e da técnica como vetores automáticos de aperfeiçoamento moral da humanidade, Jean-Jacques Rousseau adotou uma postura dissidente e contundente. Em seu <i>Discurso sobre as Ciências e as Artes</i> (1750), defendeu que o refinamento intelectual e técnico civilizatório não tornou os homens mais virtuosos, mas apenas multiplicou vícios, vaidades e hipocrisias cortesãs, substituindo a virtude cívica pela futilidade do luxo. No <i>Discurso sobre a Desigualdade</i>, aprofunda essa crítica mostrando como a propriedade privada consolidou a opressão dos ricos sobre os pobres. Para Rousseau, a verdadeira liberdade exige igualdade material substantiva e o resgate da integridade moral através da educação natural e da soberania popular.",["Crítica ao otimismo iluminista: o progresso técnico e científico não gerou progresso moral automático","Multiplicação dos vícios: o luxo, o refinamento e as aparências corromperam a honestidade primitiva","Amor de si (sadio) vs Amor-próprio (vaidade e comparação egoísta decorrentes da sociedade civil)","Educação natural (<i>Emílio</i>): preservação da bondade originária e formação do julgamento moral autônomo","Igualdade como condição da liberdade: 'nenhum cidadão seja tão opulento que possa comprar outro, e nenhum tão pobre que precise se vender'"],"Rousseau é o 'iluminista rebelde'. Cuidado no ENEM: enquanto Voltaire e os enciclopedistas idolatravam o luxo e o progresso técnico burguês, Rousseau advertia que sem igualdade e justiça moral, a técnica só aumenta a servidão.","<p>'Nossas almas se corromperam à medida que nossas ciências e nossas artes avançaram em direção à perfeição. O homem moderno vive em constante representação: não é aquilo que aparenta ser. As aparências polidas e a cortesia hipócrita da corte substituíram a genuína virtude, e o luxo corrompeu a austeridade dos costumes republicanos.' (ROUSSEAU, J.-J. <i>Discurso sobre as Ciências e as Artes</i>, 1750 [adaptado]).</p>","A dissidência de Rousseau em relação ao otimismo triunfante do Iluminismo clássico consistiu em",["afirmar que a técnica e as ciências são incapazes de gerar qualquer invenção prática útil à sobrevivência.","reivindicar que a posse de terras e riquezas seja outorgada exclusivamente pela linhagem divina dos reis.","defender o retorno imediato da humanidade a uma condição pré-histórica animal sem convívio social.","exigir a destruição das universidades e a entrega de todo o ensino a ordens teológicas inquisitoriais.","apontar que o progresso material e intelectual das artes e ciências veio acompanhado da degeneração moral e da ampliação das desigualdades."],4,"Resolução comentada:<br>• Correta: E. Rousseau polemizou com seus contemporâneos iluministas ao alertar que o avanço técnico e das artes não foi acompanhado de um progresso ético equivalente: as sociedades polidas tornaram-se mais desiguais, vaidosas e hipócritas, distanciando o homem de sua integridade moral e da virtude cívica comunitária.<br>• Incorreta A: Rousseau não negava a eficácia técnica das ciências, questionava seu valor moral substantivo.<br>• Incorreta C: É uma caricatura (feita até por Voltaire na época) dizer que Rousseau queria que os homens 'voltassem a andar de quatro nas florestas'; seu projeto era reformar a sociedade civil pela educação e pela democracia legítima.<br>• Incorreta D: Ele não propôs a tutela inquisitorial, mas uma educação laica emancipatória (como em <i>Emílio</i>).<br>• Incorreta B: O filósofo é radicalmente republicano e antiabsolutista."],"Baruch Spinoza: Monismo e a Substância Única (Deus sive Natura)":["Baruch Spinoza (1632–1677) operou uma das mais radicais revoluções ontológicas da modernidade em sua <i>Ética demonstrada à maneira dos geômetras</i> (1677). Rompendo com o dualismo cartesiano de alma e corpo, Spinoza defende o Monismo Panteísta: existe apenas uma única Substância infinita e eterna no universo — 'Deus sive Natura' ('Deus ou a Natureza'). Deus não é um rei coroado no céu com vontades e paixões humanas que julga com raiva ou perdoa com favoritismo; Deus é a própria totalidade cósmica viva e imanente e as leis necessárias da natureza. Pensamento e extensão (mente e corpo) são apenas dois atributos paralelos dessa mesma substância única. A liberdade humana consiste em compreender racionalmente essa necessidade e agir guiado pela alegria e pela potência de existir (<i>conatus</i>).",["Deus sive Natura: identificação radical entre Deus e a totalidade infinita da Natureza (Panteísmo Imanente)","Monismo de substância: recusa do dualismo; mente e corpo são duas expressões simultâneas da mesma realidade","Conatus: o esforço inerente e contínuo que cada ser possui de perseverar no seu próprio ser e expandir sua potência","Afetos: Alegria (aumento da potência de agir) versus Tristeza (diminuição da potência de agir)","Amor Dei Intellectualis: o amor intelectual a Deus como a contemplação racional serena da ordem cósmica necessária"],"No ENEM: Spinoza foi excomungado na época por dizer que Deus e a Natureza são a mesma coisa. Para Spinoza, não existem milagres mágicos que quebrem as leis da física; tudo obedece à necessidade lógica da substância divina.","<p>'Por Deus compreendo o ser absolutamente infinito, isto é, uma substância que consta de infinitos atributos, cada um dos quais exprime uma essência eterna e infinita. Desta definição se segue que não pode existir nem ser concebida nenhuma outra substância além de Deus; tudo o que é, é em Deus, e nada pode ser nem ser concebido sem Deus.' (SPINOZA, B. <i>Ética</i>, Parte I, 1677 [adaptado]).</p>","A filosofia monista de Baruch Spinoza confrontou a teologia tradicional e o dualismo cartesiano ao sustentar que",["Deus e a Natureza constituem a mesma substância cósmica infinita, da qual todos os corpos e pensamentos são modos de expressão.","o universo foi criado a partir do nada por um demiurgo imperfeito que errou nos cálculos matemáticos.","a mente humana é uma criação satânica que deve ser destruída pela mortificação ascética do corpo.","os fenômenos físicos da matéria são ilusões sem qualquer consistência ontológica na realidade empírica.","o soberano absolutista da corte real é a personificação corpórea visível do criador do universo."],0,"Resolução comentada:<br>• Correta: A. A tese central de Spinoza é a imanência radical (Deus sive Natura): não há um Deus transcendente separado do mundo como um oleiro diante do barro. Deus é a própria substância infinita cósmica, e a natureza é o conjunto de suas manifestações necessárias. Corpo e mente não são substâncias inimigas, mas faces paralelas do mesmo ser vivo cósmico.<br>• Incorreta B: Spinoza nega a criação ex nihilo e afirma a perfeição e necessidade absoluta de Deus.<br>• Incorreta C: Spinoza valoriza o corpo e a alegria, condenando o ascetismo triste e a autoflagelação.<br>• Incorreta D: A extensão material (res extensa) é um dos atributos infinitos de Deus, plena de realidade.<br>• Incorreta E: Spinoza foi pioneiro da democracia republicana laica (em seu Tratado Teológico-Político), recusando a idolatria a reis."],"Diderot, D'Alembert e o Projeto da Enciclopédia Iluminista":["A grande aventura editorial e pedagógica do Iluminismo foi a <i>Enciclopédia, ou Dicionário Razoado das Ciências, das Artes e dos Ofícios</i> (1751–1772), dirigida pelo filósofo Denis Diderot e pelo matemático Jean d'Alembert, com textos de Voltaire, Rousseau e Montesquieu. O objetivo da obra era colossal: reunir e sistematizar todo o conhecimento acumulado pela humanidade para libertar as mentes dos preconceitos religiosos, divulgar os saberes técnicos e científicos e promover o progresso social laico. Pela primeira vez na história da filosofia, os ofícios mecânicos manuais (marcenaria, tecelagem, metalurgia, agricultura) receberam verbetes detalhados e ilustrações minuciosas com a mesma dignidade conferida à teologia e à metafísica. A <i>Enciclopédia</i> foi o verdadeiro motor intelectual da Revolução Francesa de 1789.",["Enciclopedismo: movimento de democratização, compilação e difusão pública de todos os saberes científicos e técnicos","Valorização das Artes Mecânicas: reconhecimento do trabalho manual e da técnica dos artífices como saberes nobres","Combate à censura: desafio constante às proibições judiciais da Igreja e da monarquia absolutista francesa","Materialismo de Diderot: visão laica e naturalista da matéria em evolução contínua","Educação emancipatória: a convicção de que um povo esclarecido e instruído não aceita a servidão voluntária da tirania"],"No ENEM: a Enciclopédia simboliza a vitória da Razão sobre o Obscurantismo. Ela colocou o saber científico e as oficinas dos artesãos no centro da cultura ocidental, desafiando a censura monárquica.","<p>'O objetivo de uma Enciclopédia é reunir os conhecimentos dispersos sobre a superfície da terra; expor-lhes o sistema geral aos homens com quem vivemos e transmiti-lo aos homens que virão depois de nós; a fim de que os trabalhos dos séculos passados não tenham sido inúteis para os séculos que hão de vir; que os nossos descendentes, tornando-se mais instruídos, tornem-se ao mesmo tempo mais virtuosos e mais felizes.' (DIDEROT, D. Verbete <i>Enciclopédia</i>, 1755 [adaptado]).</p>","O impacto revolucionário do projeto enciclopedista no século XVIII decorreu primordialmente",["da defesa intransigente do retorno ao feudalismo agrário e da submissão aos privilégios do clero.","da difusão pública e laica dos avanços das ciências, da técnica e da filosofia para combater o obscurantismo e emancipar o cidadão.","da proibição expressa de qualquer ilustração que retratasse ferramentas de trabalho manual ou oficinas urbanas.","da exigência de que todos os artigos fossem aprovados antecipadamente pelos tribunais do Santo Ofício inquisitorial.","da defesa da censura prévia governamental como garantia do silêncio cívico dos camponeses."],1,"Resolução comentada:<br>• Correta: B. A Enciclopédia de Diderot e d'Alembert foi o grande manifesto do Iluminismo: secularizou o conhecimento, valorizou a técnica dos trabalhadores manuais e disseminou o pensamento crítico nascente, fornecendo as ferramentas conceituais que inspiraram a contestação do Antigo Regime e a defesa dos direitos dos cidadãos.<br>• Incorreta A: A Enciclopédia foi a principal arma ideológica contra o feudalismo e a monarquia absolutista.<br>• Incorreta C: Uma das maiores glórias da Enciclopédia foram exatamente as magníficas pranchas ilustradas detalhando as oficinas de artesanato.<br>• Incorreta D: A obra foi perseguida e condenada pela Inquisição e pelo Parlamento francês, sendo impressa clandestinamente em vários momentos.<br>• Incorreta E: Os enciclopedistas lutavam intransigentemente pela liberdade de imprensa contra a censura real."],"Thomas Paine e os Direitos do Homem":["O filósofo anglo-americano Thomas Paine (1737–1809) foi a voz mais popular e contundente das revoluções atlânticas do século XVIII. Em seu panfleto <i>Senso Comum</i> (1776), conclamou os colonos americanos à Independência imediata dos Estados Unidos, ridicularizando a instituição da monarquia hereditária e do 'direito divino dos reis' como absurdos incompatíveis com a dignidade da razão humana. Em <i>Os Direitos do Homem</i> (1791), defendeu com ardor a Revolução Francesa contra os ataques conservadores de Edmund Burke, sustentando que cada geração tem o direito sagrado e inalienável de escolher o seu próprio governo e reformar suas instituições. Em <i>Justiça Agrária</i> (1797), Paine propôs pioneiramente a criação de um imposto sobre a terra para financiar uma renda básica universal cidadã para jovens e idosos.",["Senso Comum (Common Sense): panfleto revolucionário que galvanizou a luta pela Independência dos Estados Unidos","Repúdio à monarquia hereditária: 'um homem honesto vale mais para a sociedade do que todos os patifes coroados que já viveram'","Soberania das gerações presentes: os mortos não devem governar sobre os vivos; cada época tem o direito de recriar suas leis","Justiça Agrária: pioneirismo na formulação de mecanismos de seguridade social e renda básica universal de cidadania","Cosmopolitismo radical: 'O mundo é a minha pátria, e a minha religião é fazer o bem'"],"No ENEM: Thomas Paine encarna o Iluminismo popular revolucionário: ele não escrevia em latim difícil para elites cortesãs, mas em linguagem direta e acessível para que os trabalhadores compreendessem que nasceram livres e iguais.","<p>'A monarquia e a sucessão hereditária cobriram o mundo de sangue e cinzas. Dizer que os reis derivam seu direito da sucessão de uma dinastia é dizer que o arbítrio de um usurpador do passado pode aprisionar a liberdade de todas as gerações futuras. Não! Cada geração é e deve ser soberana sobre si mesma. Os homens nascem e permanecem iguais em direitos.' (PAINE, T. <i>Os Direitos do Homem</i>, 1791 [adaptado]).</p>","A crítica de Thomas Paine à monarquia hereditária articula-se em defesa do princípio revolucionário de que",["as colônias americanas deveriam jurar fidelidade perpétua ao parlamento da metrópole britânica.","os descendentes biológicos de generais vitoriosos devem herdar o trono governamental perpetuamente.","o poder soberano emana exclusivamente do consentimento dos cidadãos vivos e da igualdade universal de direitos civis.","a terra deve ser doada integralmente às congregações religiosas para que rezem pelas almas dos nobres.","a população rural não possui discernimento moral para participar de assembleias legislativas democráticas."],2,"Resolução comentada:<br>• Correta: C. Thomas Paine ataca a monarquia hereditária como uma tirania ilegítima: o nascimento nobre é um acidente biológico sem mérito moral. A verdadeira soberania emana da vontade viva e consciente dos cidadãos que compõem o corpo social democrático, e nenhuma geração passada tem o direito de acorrentar a liberdade da posteridade a instituições caducas.<br>• Incorreta B: Essa é exatamente a tese da monarquia hereditária repudiada por Paine.<br>• Incorreta A: Paine foi o principal propagandista da ruptura e independência total dos Estados Unidos em relação à Coroa britânica.<br>• Incorreta D: O autor propunha a justiça agrária e tributação para amparar os idosos e jovens, não doações teocráticas feudais.<br>• Incorreta E: Paine acreditava na inteligência política do homem comum e escreveu para alfabetizar civicamente as multidões."],"Baruch Spinoza: Monismo e Deus sive Natura":["O filósofo holandês Baruch Spinoza desenvolveu um dos sistemas metafísicos mais audaciosos e coerentes da modernidade, rompendo radicalmente com o dualismo cartesiano (res cogitans e res extensa) e com o teísmo judaico-cristão tradicional. Spinoza defende o monismo substancial: existe apenas uma única Substância absolutamente infinita, eterna e necessária, que é 'Deus sive Natura' (Deus ou a Natureza). Tudo o que existe no universo não é uma criação exterior de Deus, mas um modo ou modificação de Seus infinitos atributos (dos quais conhecemos o pensamento e a extensão). Deus não opera por milagres ou caprichos antropomórficos, mas pela necessidade imutável de Sua própria essência; a liberdade humana consiste em compreender essa necessidade e governar os afetos pela razão.",["Deus sive Natura: panteísmo e imanência absoluta; Deus e o cosmos são a mesmíssima realidade","Monismo de substância: superação da separação estrita entre matéria física e pensamento mental","Conatus: esforço intrínseco de cada ser vivo para perseverar na própria existência","Liberdade como consciência da necessidade: superar as paixões tristes pelo entendimento racional dos afetos"],"Spinoza é frequentemente associado pelo ENEM à liberdade de expressão, tolerância religiosa e à crítica da superstição e do medo utilizados por tiranos políticos para subjugar as massas.","\"Deus não é uma causa transitiva exterior das coisas, mas a causa imanente de todas elas. Todas as coisas que existem estão em Deus e devem ser concebidas por meio de Deus; e, por conseguinte, Deus é a causa das coisas que estão n'Ele. Fora de Deus não pode haver nenhuma substância, isto é, nenhuma coisa que exista em si e por si seja concebida. Se os homens compreendessem claramente a ordem causal necessária da Natureza, não inventariam divindades enfurecidas para aplacar com ritos supersticiosos, nem creditariam ao acaso os fatos do mundo.\" (SPINOZA, Baruch. Ética Demonstrada à Maneira dos Geômetras).","A ontologia imanentista de Spinoza sintetizada na expressão 'Deus sive Natura' rompe com a teologia tradicional medieval e moderna ao postular que a divindade",["intervém arbitrariamente na história humana por meio de prodígios milagrosos que violam as leis físicas.","habita um plano transcendental suprassensível totalmente desconectado do mundo da matéria corporal.","revela-se com exclusividade aos soberanos absolutistas para fundamentar o direito divino dos reis.","identifica-se ontologicamente com a totalidade infinita das leis necessárias da própria natureza cósmica.","exige a autoflagelação penitencial dos fiéis para perdoar pecados cometidos contra ordens clericais."],3,"Resolução detalhada:\n• Correta: D. O monismo de Spinoza iguala Deus à Natureza: Ele não é um legislador pessoal externo com vontades e cóleras humanas, mas a totalidade infinita das causas necessárias da realidade.\n• Incorreta A: Spinoza refuta a ideia de milagre; para ele, milagre é apenas ignorância das verdadeiras causas naturais.\n• Incorreta C: Spinoza foi um dos pioneiros defensores da democracia e da laicidade, recusando o direito divino monárquico.\n• Incorreta B: Essa transcendência é o modelo tradicional teológico que Spinoza combateu frontalmente com sua tese da imanência.\n• Incorreta E: Para Spinoza, a tristeza, o ódio e a penitência rebaixam a potência de agir do ser humano; a virtude é a alegria lúcida."],"Montesquieu e a Separação dos Três Poderes":["Em sua obra-prima 'O Espírito das Leis' (1748), o pensador iluminista francês Charles-Louis de Secondat, o Barão de Montesquieu, formula a teoria da moderação do poder político e da tripartição funcional do Estado moderno. Ciente de que 'todo homem que detém poder tende a abusar dele até onde encontra limites', Montesquieu assevera que, para que a liberdade política exista, 'é preciso que o poder freie o poder' (mecanismo de freios e contrapesos — checks and balances). As três funções fundamentais da autoridade civil — formular as leis (Poder Legislativo), aplicar as políticas públicas e executar os atos estatais (Poder Executivo) e dirimir litígios e punir infrações (Poder Judiciário) — não podem concentrar-se na mesma pessoa ou corporação, sob pena de inevitável tirania.",["Tripartição dos Poderes: autonomia funcional e independência orgânica entre Legislativo, Executivo e Judiciário","Freios e Contrapesos (checks and balances): equilíbrio mútuo para impedir a tirania e a autocracia","Definição da liberdade política: o direito de fazer tudo o que as leis justas permitem","A lei como expressão das relações necessárias: o espírito das leis varia com o contexto histórico, clima e costumes"],"Montesquieu é base da Constituição de 1988 e da cidadania no Brasil. O ENEM explora com regularidade crises institucionais, interferência indevida entre poderes e a garantia das liberdades individuais sob o império da lei.","\"Quando na mesma pessoa ou no mesmo corpo de magistratura o poder legislativo está reunido ao poder executivo, não há liberdade, porque se pode temer que o mesmo monarca ou o mesmo senado façam leis tirânicas para executá-las tiranicamente. Tampouco há liberdade se o poder de julgar não estiver separado do poder legislativo e do executivo. Se ele estivesse unido ao poder legislativo, o poder sobre a vida e a liberdade dos cidadãos seria arbitrário, pois o juiz seria legislador. Se estivesse unido ao poder executivo, o juiz poderia ter a força de um opressor. Tudo estaria perdido se o mesmo homem exercesse esses três poderes.\" (MONTESQUIEU. O Espírito das Leis, Livro XI).","A doutrina da separação dos poderes enunciada por Montesquieu tem como finalidade primordial proteger os cidadãos da opressão política ao",["concentrar a totalidade das decisões governamentais nas mãos de chefias militares vitalícias.","abolir a existência de normas jurídicas escritas em proveito do direito consuetudinário oral tribal.","suprimir o direito a recursos processuais nos julgamentos de réus acusados de insubordinação civil.","destituir os parlamentos eleitos para outorgar todo o controle orçamentário à iniciativa corporativa privada.","assegurar que cada magistratura estatal fiscalize e limite as prerrogativas das demais de forma equilibrada."],4,"Resolução detalhada:\n• Correta: E. O sistema de freios e contrapesos garante a liberdade política justamente ao impedir que uma esfera do poder usurpe as atribuições da outra ou aja com tirania autocrática sem controle institucional.\n• Incorreta A: A concentração em um líder ou órgão único é o despotismo que Montesquieu se propõe a anular.\n• Incorreta C: Montesquieu valoriza as garantias fundamentais e o devido processo legal do Poder Judiciário independente.\n• Incorreta D: O Poder Legislativo (parlamento) é peça-chave e indispensável na representação da soberania da nação.\n• Incorreta B: A codificação das leis claras e estáveis é indispensável para que o cidadão conheça seus direitos e limites."],"A Enciclopédia Iluminista e a Difusão do Saber":["A monumental 'Encyclopédie, ou Dictionnaire raisonné des sciences, des arts et des métiers', coordenada pelo filósofo Denis Diderot e pelo matemático Jean d'Alembert entre 1751 e 1772, corporificou o auge do projeto iluminista europeu. Composta por dezenas de volumes e gravuras detalhadas, a obra reuniu os maiores pensadores da época (Voltaire, Rousseau, Montesquieu, Holbach) com o objetivo explícito de mapear a totalidade dos saberes humanos, secularizar o conhecimento, valorizar o trabalho manual das artes mecânicas e desmistificar os preconceitos teológicos do Antigo Regime. A Enciclopédia encarnava a convicção pedagógica e política de que a difusão da luz racional e da ciência liberta o gênero humano da servidão política e da ignorância obscurantista.",["Denis Diderot e Jean d'Alembert: organizadores da maior síntese bibliográfica do Século das Luzes","Secularização do pensamento: emancipação da filosofia e das ciências da tutela dogmática da Igreja","Valorização das artes mecânicas: prestígio concedido à técnica produtiva, à agricultura e às manufaturas","Luta contra a censura: circulação clandestina e resistência contra os decretos reais e bulas papais"],"O projeto enciclopedista costuma cair no ENEM em diálogo com História Geral (crise do Antigo Regime, Revolução Francesa) e com o direito humano contemporâneo ao acesso livre à informação e ao conhecimento científico.","\"O objetivo de uma Enciclopédia é reunir os conhecimentos dispersos pela superfície da Terra; expor o sistema geral desses saberes aos homens de nossa época e transmiti-lo aos que virão depois de nós, a fim de que os trabalhos dos séculos passados não tenham sido inúteis para os séculos que hão de vir; que os nossos descendentes, tornando-se mais instruídos, tornem-se ao mesmo tempo mais virtuosos e mais felizes, e que não morramos sem ter merecido bem da humanidade.\" (DIDEROT, Denis. Artigo 'Enciclopédia').","Ao conceber o audacioso plano editorial da Enciclopédia, os iluministas franceses estavam movidos pelo pressuposto emancipatório de que o progresso intelectual e científico",["constituía a alavanca indispensável para erradicar o obscurantismo e promover a liberdade moral e social.","reforçava a necessidade incontornável de tutela inquisitorial sobre os estratos leigos iletrados.","subordinava a utilidade das técnicas mecânicas e fabris à contemplação mística da providência celestial.","justificava a restrição elitista do domínio do alfabeto e da imprensa aos filhos da nobreza de espada.","inviabilizava a autonomia individual dos cidadãos em favor da submissão a impérios absolutistas perenes."],0,"Resolução detalhada:\n• Correta: A. Para os iluministas, a luz da razão e o acesso à instrução científica são os instrumentos capitais para desmantelar as trevas da superstição, da tirania e do obscurantismo social.\n• Incorreta B: A Enciclopédia combateu veementemente a tutela da Inquisição e o dogmatismo clerical.\n• Incorreta C: Um dos maiores méritos da obra foi exatamente elevar as artes mecânicas e o trabalho produtivo ao mesmo patamar das belas-artes.\n• Incorreta D: A Enciclopédia almejava a difusão e a popularização do saber, e não o monopólio da nobreza feudal.\n• Incorreta E: O objetivo era despertar a maioridade e a autonomia humana (Aufklärung), destruindo o absolutismo monárquico."],"John Locke e a Teoria da Propriedade Natural":["Em seu 'Segundo Tratado sobre o Governo Civil' (1689), o filósofo inglês John Locke desenvolve uma das mais influentes teorias liberais sobre a origem da propriedade privada. No estado de natureza, Deus concedeu a terra e seus recursos naturais em comum a toda a humanidade para sua sobrevivência e conforto. Contudo, cada indivíduo é proprietário exclusivo de sua própria pessoa e do trabalho de suas mãos. Portanto, sempre que um homem retira algo do estado em que a natureza o deixou e nele 'mistura o seu próprio trabalho' (cultivando o solo, colhendo o fruto, caçando a caça), ele anexa a essa matéria algo que é legitimamente seu, convertendo-a em propriedade privada inalienável, desde que reste o bastante para o sustento dos demais.",["Direito natural à propriedade: vida, liberdade e bens materiais como direitos inalienáveis anteriores ao Estado","Teoria do trabalho como título fundante: a mistura do esforço produtivo com a matéria bruta legitima a posse","Limites da apropriação no estado de natureza: a proibição do desperdício e a garantia de bens suficientes para os outros","Função tutelar do Estado liberal: o poder político é instituído unicamente para assegurar e proteger esses direitos civis"],"O ENEM cobra com frequência o conceito de propriedade em John Locke em comparação com Jean-Jacques Rousseau (que via na cerca que instituiu a propriedade o início das desigualdades e misérias humanas). Tenha essa comparação bem nítida!","\"Ainda que a terra e todas as criaturas inferiores pertençam em comum a todos os homens, cada um tem uma propriedade em sua própria pessoa; a esta ninguém tem qualquer direito senão ele mesmo. O trabalho de seu corpo e a obra de suas mãos, podemos dizer, são propriamente dele. Seja o que for que ele retire do estado que a natureza lhe forneceu e no qual a deixou, fica-lhe misturado o seu próprio trabalho, juntando-se-lhe algo que lhe é próprio, e com isso a torna sua propriedade.\" (LOCKE, John. Segundo Tratado sobre o Governo Civil).","A tese jusnaturalista de John Locke sobre a propriedade privada serviu de alicerce ao liberalismo moderno ao defender que a apropriação individual da terra",["decorre exclusivamente de uma doação discricionária e revogável outorgada pela corte real.","constitui um direito natural pré-estatal legitimado pelo investimento direto da força de trabalho humana.","representa uma infração criminosa contra a paz que deve ser reprimida pelo tribunal soberano da cidade.","depende do consentimento unânime prévio de todas as pessoas vivas sobre a face do planeta Terra.","surgiu na história como fonte originária de todos os males e conflitos violentos da humanidade."],1,"Resolução detalhada:\n• Correta: B. Para Locke, a propriedade é um direito natural prévio ao Estado: o indivíduo que aplica seu trabalho na transformação da natureza ganha título moral e jurídico legítimo sobre o bem gerado.\n• Incorreta A: Locke combate a monarquia absolutista que se julgava dona originária de todas as terras de seus súditos.\n• Incorreta C: Longe de ser infração, a propriedade é para Locke um dos três direitos inalienáveis fundamentais (vida, liberdade e bens).\n• Incorreta D: O próprio Locke diz que se fosse necessário o consentimento universal de toda a humanidade, o homem morreria de fome antes de colher uma maçã.\n• Incorreta E: Essa visão crítica da propriedade como origem das desgraças sociais é de Rousseau no 'Discurso sobre a Origem da Desigualdade', e não de Locke."],"Søren Kierkegaard: Angústia e Fé":["O dinamarquês Søren Kierkegaard (1813–1855) é considerado o pai do existencialismo moderno e o grande crítico do racionalismo hegeliano. Para Kierkegaard, a existência humana individual não cabe em nenhum sistema abstrato de lógica: existir é vivenciar a subjetividade singular, a finitude, a dúvida e a angústia diante da possibilidade e da liberdade de escolha ('a angústia é a vertigem da liberdade'). Kierkegaard descreveu três estágios fundamentais na trajetória existencial: o Estágio Estético (busca superficial de sensações prazerosas e imediatas, fadado ao tédio e ao desespero); o Estágio Ético (compromisso moral com o dever social, o trabalho e a família); e o Estágio Religioso (o salto da fé apaixonado e absurdo em direção a Deus, exemplificado no dilema de Abraão).",["Existência singular: o indivíduo concreto é irredutível a conceitos abstratos ou sistemas universais","Angústia (angest): a vertigem diante da multiplicidade de possibilidades e da liberdade inescapável de escolher","Estágio Estético: vida sensorial, hedonismo imediato, condenação ao tédio existencial","Estágio Ético: submissão voluntária às leis morais, deveres cívicos e responsabilidade perante a comunidade","Estágio Religioso: o salto da fé (amor fati a Deus além dos cálculos humanos da razão lógica)"],"No ENEM, lembre-se: a angústia em Kierkegaard NÃO é medo de um objeto específico (como medo de aranha ou de prova), mas o sentimento difuso e vertiginoso diante da própria liberdade de poder escolher o rumo da sua vida.","<p>'A angústia pode ser comparada à vertigem. Aquele cujos olhos olham para o abismo sente uma vertigem. Mas qual é a causa? Ela está tanto nos seus olhos quanto no próprio abismo: pois ele teria podido não olhar. Assim, a angústia é a vertigem da liberdade, que surge quando o espírito quer colocar a síntese e a liberdade contempla a sua própria possibilidade.' (KIERKEGAARD, S. <i>O Conceito de Angústia</i>, 1844 [adaptado]).</p>","De acordo com a reflexão existencial de Kierkegaard, a experiência da angústia constitui uma manifestação",["de patologias neurológicas degenerativas que anulam a capacidade intelectual do ser humano.","do medo instintivo diante de animais selvagens perigosos que ameaçam a sobrevivência física.","da consciência aguda e vertiginosa da liberdade diante da infinidade de escolhas e possibilidades da existência.","da submissão cega do sujeito a regras burocráticas impostas pelo Estado laico absolutista.","da certeza matemática de que todas as ações humanas estão rigidamente predeterminadas pelo destino cósmico."],2,"Resolução comentada:<br>• Correta: C. Kierkegaard define a angústia como 'a vertigem da liberdade': diferentemente do medo de algo concreto, a angústia nasce do confronto do indivíduo com o vazio de garantias e a imensa responsabilidade de decidir livremente sobre a própria existência em meio a infinitas possibilidades.<br>• Incorreta A: A angústia para Kierkegaard é ontológica e espiritual, não uma doença cerebral.<br>• Incorreta B: O medo de perigos externos objetivos é medo vulgar, não angústia existencial.<br>• Incorreta D: As regras do Estado enquadram-se no estágio ético, enquanto a angústia é uma experiência íntima da liberdade subjetiva.<br>• Incorreta E: O determinismo é o oposto da filosofia kierkegaardiana, fundada na contingência e na liberdade radical da escolha."],"Friedrich Nietzsche: A Morte de Deus e Niilismo":["Friedrich Nietzsche (1844–1900) realizou uma demolição filosófica da tradição metafísica e moral ocidental. Em <i>A Gaia Ciência</i> e <i>Assim Falou Zaratustra</i>, proclamou o aforismo dramático: 'Deus está morto! Deus continua morto! E nós o matamos!'. Nietzsche não está celebrando um triunfo ateu ingênuo, mas diagnostica
